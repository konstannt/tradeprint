    /* ============================================================
       15. PNG EXPORT
       Renders the ad element at its native size with modern-screenshot
       (the browser's own layout engine, drawn through SVG), at 1x or 2x.
       Fonts are embedded from the same files the preview uses.
       ============================================================ */
    let exportLibPromise = null;

    function loadScript({ src, integrity }) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src;
        if (integrity) { el.integrity = integrity; el.crossOrigin = 'anonymous'; }
        el.onload = () => resolve();
        el.onerror = () => { el.remove(); reject(new Error('Could not load ' + src)); };
        document.head.appendChild(el);
      });
    }

    function loadExportLib() {
      if (window.modernScreenshot) return Promise.resolve(window.modernScreenshot);
      if (!exportLibPromise) {
        exportLibPromise = (async () => {
          for (const source of EXPORT_LIB_SOURCES) {
            try {
              await loadScript(source);
              if (window.modernScreenshot && window.modernScreenshot.domToCanvas) return window.modernScreenshot;
            } catch (err) {}
          }
          throw new Error('The export library could not be loaded. Check your connection.');
        })().catch(err => { exportLibPromise = null; throw err; });
      }
      return exportLibPromise;
    }

    async function waitForImages(root) {
      const imgs = Array.from(root.querySelectorAll('img'));
      await Promise.all(imgs.map(img => (img.complete && img.naturalWidth)
        ? (img.decode ? img.decode().catch(() => {}) : null)
        : new Promise(r => { img.onload = img.onerror = r; })));
    }

    // A render where nearly every pixel is the background color means the
    // browser drew an empty frame. That happens now and then in Safari.
    function looksBlank(canvas) {
      try {
        const probe = document.createElement('canvas');
        probe.width = 54;
        probe.height = Math.round(54 * canvas.height / canvas.width);
        const ctx = probe.getContext('2d');
        ctx.drawImage(canvas, 0, 0, probe.width, probe.height);
        const data = ctx.getImageData(0, 0, probe.width, probe.height).data;
        let distinct = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (Math.abs(data[i] - 12) + Math.abs(data[i + 1] - 14) + Math.abs(data[i + 2] - 20) > 30) distinct++;
        }
        return distinct < 12;
      } catch (err) {
        return false;
      }
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG encoding failed.')), 'image/png');
      });
    }

    function exportFileName() {
      const tpl = getTemplate(state.templateId);
      const s = tplState();
      const fmt = currentFormat();
      const k = currentScale();
      const d = new Date();
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return `tradeprint-${tpl.id}-${s.layout}-${fmt.id}-${fmt.w * k}x${fmt.h * k}-${date}.png`;
    }

    async function renderPng() {
      await fontReady;
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const lib = await loadExportLib();
      fitAd();
      await waitForImages(adEl);
      await nextFrame();

      const fmt = currentFormat();
      const k = currentScale();
      const options = {
        width: fmt.w,
        height: fmt.h,
        scale: k,
        backgroundColor: '#0c0e14',
        font: fontEmbedCss ? { cssText: fontEmbedCss } : false,
        timeout: 30000
      };

      // Safari sometimes needs one warm-up draw before images and fonts show.
      if (IS_SAFARI) { try { await lib.domToCanvas(adEl, options); } catch (err) {} }

      let canvas = await lib.domToCanvas(adEl, options);
      if (looksBlank(canvas)) canvas = await lib.domToCanvas(adEl, options);
      if (looksBlank(canvas)) throw new Error('The browser returned an empty image.');
      if (canvas.width !== fmt.w * k || canvas.height !== fmt.h * k) {
        throw new Error(`Expected ${fmt.w * k} × ${fmt.h * k}, got ${canvas.width} × ${canvas.height}.`);
      }
      return canvasToBlob(canvas);
    }

    const sheet = $('#exportSheet');
    const sheetBody = $('#exportBody');
    let exportUrl = '';
    let exporting = false;

    function openSheet(html) {
      sheetBody.innerHTML = html;
      sheet.hidden = false;
    }

    function closeExportSheet() {
      sheet.hidden = true;
      sheetBody.innerHTML = '';
      if (exportUrl) { URL.revokeObjectURL(exportUrl); exportUrl = ''; }
    }

    function triggerDownload(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function runExport() {
      if (exporting) return;
      exporting = true;
      const fmt = currentFormat();
      const k = currentScale();
      const name = exportFileName();
      $('#exportBtn').disabled = true;

      openSheet(`<div class="spinner"></div><div class="sheet-copy" style="text-align:center">Rendering ${fmt.name} ${fmt.w * k} × ${fmt.h * k} PNG...</div>`);

      try {
        const blob = await renderPng();
        if (exportUrl) URL.revokeObjectURL(exportUrl);
        exportUrl = URL.createObjectURL(blob);
        const file = new File([blob], name, { type: 'image/png' });
        const canShare = IS_TOUCH && navigator.canShare && navigator.canShare({ files: [file] });
        const kb = Math.round(blob.size / 1024);

        openSheet(`
          <div class="sheet-preview"><img src="${exportUrl}" alt="Exported ad" /></div>
          <div class="sheet-copy">${fmt.name} ${fmt.label} · ${fmt.w * k} × ${fmt.h * k} PNG · ${kb.toLocaleString()} KB${IS_TOUCH ? '<br>On iPhone you can also press and hold the image and choose Save to Photos.' : ''}</div>
          <div class="sheet-actions">
            ${canShare ? '<button class="btn btn-primary" type="button" id="shareBtn">Save or share</button>' : ''}
            <button class="btn ${canShare ? '' : 'btn-primary'}" type="button" id="downloadBtn">Download PNG</button>
          </div>`);

        $('#downloadBtn').addEventListener('click', () => triggerDownload(exportUrl, name));
        const shareBtn = $('#shareBtn');
        if (shareBtn) shareBtn.addEventListener('click', () => navigator.share({ files: [file] }).catch(() => {}));
        if (!IS_TOUCH) triggerDownload(exportUrl, name);
      } catch (err) {
        console.error('[Studio] Export failed:', err);
        openSheet(`
          <div class="sheet-copy error">Export didn't work in this browser: ${esc(err.message || err)}</div>
          <div class="sheet-copy">Use Screenshot mode instead. It shows only the ad, scaled to your screen, so you can screenshot it and crop to the ad.</div>
          <div class="sheet-actions">
            <button class="btn btn-primary" type="button" id="fallbackShot">Open screenshot mode</button>
            <button class="btn" type="button" id="retryExport">Try again</button>
          </div>`);
        $('#fallbackShot').addEventListener('click', () => { closeExportSheet(); enterShotMode(); });
        $('#retryExport').addEventListener('click', () => { exporting = false; runExport(); });
      } finally {
        exporting = false;
        $('#exportBtn').disabled = false;
      }
    }

    $('#exportBtn').addEventListener('click', runExport);
    $('#exportClose').addEventListener('click', closeExportSheet);
    sheet.addEventListener('click', (e) => { if (e.target === sheet) closeExportSheet(); });

    // Warm the export library once the page is idle.
    const warmExport = () => loadExportLib().catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(warmExport, { timeout: 4000 });
    else setTimeout(warmExport, 1500);

    /* ============================================================
       16. START
       ============================================================ */
    loadState();
    renderControls();
    layoutPreview();
    renderAd();

    Promise.all([fontReady, detectLogoAsset()]).then(() => {

    window.__studio = {

        { name: 'Mark hero', v: { layout: 'hero', bgColor: '#0C0E14', bgStyle: 'solid', showCta: true } },
        { name: 'Split', v: { layout: 'split', bgColor: '#0C0E14', bgStyle: 'dots', bgIntensity: 55, showCta: true } },
        { name: 'Light', v: { bgColor: '#FFFFFF', bgStyle: 'grid', bgIntensity: 50, tradeColor: '#0C0E14', taglineColor: '#171A24', subColor: '#6D7388' } }
      ]
    };

    // What a preset leaves alone: export size and banner wording stay as they are.
    const BR_KEEP = {
      profile: ['size'], logo: ['size'], lockup: ['height'],
      banner: ['format', 'scale', 'tagline', 'sub', 'cta', 'textSize']
    };

    const brand = {
      type: 'profile', backdrop: 'checker', guides: true,
      profile: { ...BR_DEFAULTS.profile }, logo: { ...BR_DEFAULTS.logo },
      lockup: { ...BR_DEFAULTS.lockup }, banner: { ...BR_DEFAULTS.banner },
      preset: {}
    };
    const brOpen = new Set(['Presets', 'Shape', 'Background', 'Logo', 'Layout', 'Text', 'Colors', 'Export', 'Format']);

    /* ---------- state ---------- */
    function loadBrand() {
      try {
        const saved = JSON.parse(localStorage.getItem(BRAND_KEY) || 'null');
        if (!saved || typeof saved !== 'object') return;
        if (BR_TYPES.some(t => t.id === saved.type)) brand.type = saved.type;
        if (['checker', 'dark', 'light'].includes(saved.backdrop)) brand.backdrop = saved.backdrop;
        if (typeof saved.guides === 'boolean') brand.guides = saved.guides;
        for (const t of Object.keys(BR_DEFAULTS)) {
          const src = saved[t] || {};
          for (const [k, def] of Object.entries(BR_DEFAULTS[t])) {
            if (src[k] !== undefined && typeof src[k] === typeof def) brand[t][k] = src[k];
          }
        }
        if (!BR_BANNERS[brand.banner.format]) brand.banner.format = 'x';
      } catch (err) {}
    }

    function saveBrand() {
      try {
        const { preset, ...rest } = brand;
        localStorage.setItem(BRAND_KEY, JSON.stringify(rest));
      } catch (err) {}
    }

    /* ---------- color helpers ---------- */
    function normHex(value, fallback) {
      const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(value || '').trim());
      if (!m) return fallback;
      let h = m[1];
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      return '#' + h.toUpperCase();
    }

    function hexRgb(hex) {
      const n = parseInt(normHex(hex, '#000000').slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function luminance(hex) {
      const [r, g, b] = hexRgb(hex).map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    const isDarkColor = hex => luminance(hex) < 0.3;
    const rgbaOf = (hex, a) => { const [r, g, b] = hexRgb(hex); return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, a))})`; };
    const inkFor = bg => isDarkColor(bg) ? '#FFFFFF' : '#0C0E14';
    const isIndigoish = hex => { const [r, g, b] = hexRgb(hex); return b > 170 && b - r > 55 && b - g > 50; };

    /* ---------- drawing primitives ---------- */
    function roundRectPath(ctx, x, y, w, h, r) {
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function shapePath(ctx, shape, x, y, w, h, r) {
      ctx.beginPath();
      if (shape === 'circle') ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
      else if (shape === 'rounded') roundRectPath(ctx, x, y, w, h, r);
      else if (shape === 'pill') roundRectPath(ctx, x, y, w, h, Math.min(w, h) / 2);
      else ctx.rect(x, y, w, h);
    }

    function drawMark(ctx, cx, cy, h, color, alpha = 1) {
      const s = h / MARK.h;
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.translate(cx - (MARK.w * s) / 2, cy - h / 2);
      ctx.scale(s, s);
      ctx.fillStyle = color;
      ctx.fill(markPath);
      ctx.restore();
    }

    function equityValues() {
      let acc = 0;
      return [0, ...EQUITY_SHAPE.map(v => (acc += v))];
    }

    function drawEquityLine(ctx, x, y, w, h, bg, k, unit) {
      const vals = equityValues();
      const min = Math.min(...vals), max = Math.max(...vals);
      const top = y + h * 0.3, bottom = y + h * 0.86;
      const pts = vals.map((v, i) => [x - w * 0.02 + (w * 1.04 * i) / (vals.length - 1), bottom - ((v - min) / (max - min)) * (bottom - top)]);
      const col = isIndigoish(bg) ? '#FFFFFF' : '#6366F1';
      const line = new Path2D();
      line.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        line.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
      }
      line.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      const area = new Path2D(line);
      area.lineTo(x + w * 1.02, y + h);
      area.lineTo(x - w * 0.02, y + h);
      area.closePath();
      const g = ctx.createLinearGradient(0, top, 0, y + h);
      g.addColorStop(0, rgbaOf(col, 0.18 * k));
      g.addColorStop(1, rgbaOf(col, 0));
      ctx.fillStyle = g;
      ctx.fill(area);
      ctx.strokeStyle = rgbaOf(col, 0.22 + 0.55 * k);
      ctx.lineWidth = Math.max(1, unit * 0.0065);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke(line);
    }

    // Solid color plus an optional texture. unit = the length textures scale with.
    function paintBackground(ctx, x, y, w, h, bg, style, intensity, unit) {
      const k = clamp(Number(intensity) || 0, 0, 100) / 100;
      ctx.fillStyle = bg;
      ctx.fillRect(x, y, w, h);
      if (style === 'solid' || k === 0) return;
      const ink = inkFor(bg);
      const dark = isDarkColor(bg);

      if (style === 'spotlight') {
        const cx = x + w * 0.5, cy = y - h * 0.18, r = Math.hypot(w, h) * 0.9;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, rgbaOf(ink, (dark ? 0.22 : 0.09) * k));
        g.addColorStop(1, rgbaOf(ink, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
        return;
      }

      if (style === 'grid' || style === 'dots') {
        const W = Math.max(1, Math.ceil(w)), H = Math.max(1, Math.ceil(h));
        const off = document.createElement('canvas');
        off.width = W; off.height = H;
        const o = off.getContext('2d');
        const step = unit / (style === 'grid' ? 7 : 11);
        const base = style === 'grid' ? (dark ? 0.075 : 0.07) : (dark ? 0.17 : 0.15);
        o.fillStyle = rgbaOf(ink, base * (0.3 + 1.4 * k));
        if (style === 'grid') {
          const lw = Math.max(1, unit * 0.0022);
          for (let gx = (W / 2) % step; gx < W; gx += step) o.fillRect(gx - lw / 2, 0, lw, H);
          for (let gy = (H / 2) % step; gy < H; gy += step) o.fillRect(0, gy - lw / 2, W, lw);
        } else {
          const r = Math.max(0.7, unit * 0.0048);
          for (let gx = (W / 2) % step; gx < W + r; gx += step) {
            for (let gy = (H / 2) % step; gy < H + r; gy += step) { o.beginPath(); o.arc(gx, gy, r, 0, Math.PI * 2); o.fill(); }
          }
        }
        o.globalCompositeOperation = 'destination-in';
        const g = o.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.hypot(W, H) * 0.56);
        g.addColorStop(0, 'rgba(0,0,0,1)');
        g.addColorStop(1, 'rgba(0,0,0,0.14)');
        o.fillStyle = g;
        o.fillRect(0, 0, W, H);
        ctx.drawImage(off, x, y, w, h);
        return;
      }

      if (style === 'equity') drawEquityLine(ctx, x, y, w, h, bg, k, unit);
    }

    /* ---------- type ---------- */
    const setFont = (ctx, weight, size) => { ctx.font = `${weight} ${size}px ${BR_FONT}`; };

    // Letter positions with the wordmark's -0.03em tracking (kerning kept).
    function spacedRun(ctx, text, tracking) {
      const xs = [];
      for (let i = 0; i < text.length; i++) xs.push(ctx.measureText(text.slice(0, i)).width + i * tracking);
      return { text, xs, width: ctx.measureText(text).width + Math.max(0, text.length - 1) * tracking };
    }

    // Geometry of the mark + "tradeprint" lockup at font size F.
    function lockupGeom(ctx, F, o) {
      const weight = o.weight || 700;
      setFont(ctx, weight, F);
      const showWord = o.layout !== 'markonly' && o.showWord !== false;
      const showMark = o.showMark !== false && o.layout !== 'wordmark';
      const run = showWord ? spacedRun(ctx, 'tradeprint', -0.03 * F) : { text: '', xs: [], width: 0 };
      const asc = ctx.measureText('d').actualBoundingBoxAscent || F * 0.72;
      const desc = ctx.measureText('p').actualBoundingBoxDescent || F * 0.21;
      const ms = (o.markScale || 100) / 100, gs = (o.gap || 100) / 100;

      if (o.layout === 'stacked') {
        const mh = showMark ? F * 1.7 * ms : 0, mw = mh * MARK.w / MARK.h;
        const gap = showMark && showWord ? F * 0.42 * gs : 0;
        const w = Math.max(mw, run.width);
        const baseline = mh + gap + (showWord ? asc : 0);
        return { w, h: showWord ? baseline + desc : mh, baseline, markX: (w - mw) / 2, markY: 0, mh, mw, textX: (w - run.width) / 2, run, F, weight };
      }

      const mh = showMark ? F * 1.08 * ms : 0, mw = mh * MARK.w / MARK.h;
      const gap = showMark && showWord ? F * 0.42 * gs : 0;
      const markCy = -0.36 * F;
      const top = Math.min(showWord ? -asc : Infinity, showMark ? markCy - mh / 2 : Infinity);
      const bottom = Math.max(showWord ? desc : -Infinity, showMark ? markCy + mh / 2 : -Infinity);
      return { w: mw + gap + run.width, h: bottom - top, baseline: -top, markX: 0, markY: markCy - mh / 2 - top, mh, mw, textX: mw + gap, run, F, weight };
    }

    function drawLockup(ctx, x, y, g, colors) {
      if (g.mh) drawMark(ctx, x + g.markX + g.mw / 2, y + g.markY + g.mh / 2, g.mh, colors.mark);
      if (!g.run.width) return;
      setFont(ctx, g.weight, g.F);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      for (let i = 0; i < g.run.text.length; i++) {
        ctx.fillStyle = i < 5 ? colors.trade : colors.print;
        ctx.fillText(g.run.text[i], x + g.textX + g.run.xs[i], y + g.baseline);
      }
    }

    function wrapLines(ctx, text, maxW) {
      const words = String(text || '').trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxW || !line) line = test;
        else { lines.push(line); line = word; }
      }
      if (line) lines.push(line);
      return lines;
    }

    const measureCtx = document.createElement('canvas').getContext('2d');

    /* ---------- asset renderers ---------- */
    function renderProfile(ctx, W, H, s) {
      const S = Math.min(W, H);
      ctx.clearRect(0, 0, W, H);
      const hasShape = s.shape !== 'none';
      const r = (s.radius / 100) * S;
      if (hasShape && s.shape !== 'square' && !s.outsideTransparent) {
        ctx.fillStyle = s.outsideColor;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.save();
      if (hasShape) {
        shapePath(ctx, s.shape, 0, 0, S, S, r);
        ctx.clip();
        if (s.fill) paintBackground(ctx, 0, 0, S, S, s.bgColor, s.bgStyle, s.bgIntensity, S);
      }
      drawMark(ctx, S / 2 + (s.offsetX / 100) * S, S / 2 + (s.offsetY / 100) * S, (S * s.logoSize) / 100, s.logoColor);
      ctx.restore();
      if (hasShape && s.ringWidth > 0) {
        const lw = (S * s.ringWidth) / 100;
        ctx.save();
        shapePath(ctx, s.shape, lw / 2, lw / 2, S - lw, S - lw, Math.max(0, r - lw / 2));
        ctx.lineWidth = lw;
        ctx.strokeStyle = s.ringColor;
        ctx.stroke();
        ctx.restore();
      }
    }

    function logoDims(s, size = s.size) {
      if (s.frame === 'tight') {
        const p = s.padding / 100;
        const mh = size / (1 + 2 * p);
        return { w: Math.max(1, Math.round(mh * MARK.w / MARK.h + 2 * p * mh)), h: size };
      }
      return { w: size, h: size };
    }

    function renderLogo(ctx, W, H, s) {
      ctx.clearRect(0, 0, W, H);
      if (!s.transparent) { ctx.fillStyle = s.bgColor; ctx.fillRect(0, 0, W, H); }
      const p = s.padding / 100;
      const mh = s.frame === 'tight' ? H / (1 + 2 * p) : Math.min(H, W * MARK.h / MARK.w) * (1 - 2 * p);
      drawMark(ctx, W / 2, H / 2, mh, s.logoColor);
    }

    function lockupDims(s, height = s.height) {
      const g = lockupGeom(measureCtx, 100, s);
      const p = s.padding / 100;
      const k = height / (g.h * (1 + 2 * p));
      const extra = !s.transparent && s.bgShape === 'pill' ? g.h * 0.35 : 0;
      return { w: Math.max(1, Math.round((g.w + 2 * p * g.h + 2 * extra) * k)), h: height, F: 100 * k };
    }

    function renderLockup(ctx, W, H, s) {
      ctx.clearRect(0, 0, W, H);
      const g = lockupGeom(ctx, lockupDims(s, H).F, s);
      if (!s.transparent) {
        shapePath(ctx, s.bgShape, 0, 0, W, H, H * 0.22);
        ctx.fillStyle = s.bgColor;
        ctx.fill();
      }
      drawLockup(ctx, (W - g.w) / 2, (H - g.h) / 2, g, { mark: s.markColor, trade: s.tradeColor, print: s.printColor });
    }

    function bannerBox(s, W, H) {
      const f = BR_BANNERS[s.format] || BR_BANNERS.x;
      // On X the profile photo covers the bottom left, so left-side layouts sit higher.
      if (s.format === 'x' && ['left', 'hero', 'split'].includes(s.layout)) return { x: 0, y: 0, w: W, h: H * 0.7 };
      if (!f.safe) return { x: 0, y: 0, w: W, h: H };
      const k = W / f.w;
      return { x: (W - f.safe.w * k) / 2, y: (H - f.safe.h * k) / 2, w: f.safe.w * k, h: f.safe.h * k };
    }

    function renderBanner(ctx, W, H, s) {
      const f = BR_BANNERS[s.format] || BR_BANNERS.x;
      const box = bannerBox(s, W, H);
      // Type scales with the visible area (the safe area on YouTube), not the layout box
      const k = W / f.w;
      const safe = f.safe ? { x: (W - f.safe.w * k) / 2, y: (H - f.safe.h * k) / 2, w: f.safe.w * k, h: f.safe.h * k } : { x: 0, y: 0, w: W, h: H };
      const unit = f.safe ? safe.h * 1.6 : H;
      ctx.clearRect(0, 0, W, H);
      paintBackground(ctx, 0, 0, W, H, s.bgColor, s.bgStyle, s.bgIntensity, unit);

      const F0 = safe.h * (f.safe ? 1.25 : 1) * ({ s: 0.13, m: 0.16, l: 0.195 }[s.textSize] || 0.16);
      const padX = box.w * 0.07;
      const colors = { mark: s.markColor, trade: s.tradeColor, print: s.printColor };
      const lockOpts = { layout: 'horizontal', showMark: s.showMark, showWord: s.showWordmark, weight: 700 };
      const lockOn = s.showMark || s.showWordmark;
      const tagOn = s.showTagline && String(s.tagline).trim();
      const subOn = s.showSub && String(s.sub).trim();
      const ctaOn = s.showCta && String(s.cta).trim();

      if (s.layout === 'hero') {
        const mh = safe.h * 1.3;
        drawMark(ctx, safe.x + safe.w - mh * MARK.w / MARK.h * 0.22, safe.y + safe.h * 0.56, mh, s.markColor, isDarkColor(s.bgColor) ? 0.16 : 0.14);
      }

      // Stack of blocks: lockup, tagline, then website + CTA on one row.
      function stack(F, maxW, opts) {
        const blocks = [];
        if (opts.lockup && lockOn) {
          let g = lockupGeom(ctx, F, lockOpts);
          if (g.w > maxW) g = lockupGeom(ctx, F * maxW / g.w, lockOpts);
          blocks.push({ h: g.h, gap: F * 0.42, draw: (ax, y) => drawLockup(ctx, ax(g.w), y, g, colors) });
        }
        if (opts.text && tagOn) {
          let ts = F * 0.4;
          setFont(ctx, 500, ts);
          let lines = wrapLines(ctx, s.tagline, maxW);
          while (lines.length > 2 && ts > F * 0.24) { ts *= 0.92; setFont(ctx, 500, ts); lines = wrapLines(ctx, s.tagline, maxW); }
          const lh = ts * 1.28;
          const size = ts;
          blocks.push({
            h: lh * lines.length, gap: F * 0.36,
            draw: (ax, y) => {
              setFont(ctx, 500, size);
              ctx.fillStyle = s.taglineColor;
              ctx.textBaseline = 'alphabetic';
              ctx.textAlign = 'left';
              lines.forEach((ln, i) => ctx.fillText(ln, ax(ctx.measureText(ln).width), y + i * lh + size * 1.02));
            }
          });
        }
        if (opts.text && (subOn || ctaOn)) {
          const ss = F * 0.27, cs = F * 0.26;
          const pillH = ctaOn ? cs * 2.35 : 0, pillPad = cs * 1.15;
          setFont(ctx, 500, ss);
          const subW = subOn ? ctx.measureText(s.sub).width : 0;
          setFont(ctx, 600, cs);
          const ctaW = ctaOn ? ctx.measureText(s.cta).width + pillPad * 2 : 0;
          const gapX = subOn && ctaOn ? F * 0.4 : 0;
          const rowW = subW + gapX + ctaW, rowH = Math.max(subOn ? ss * 1.35 : 0, pillH);
          blocks.push({
            h: rowH, gap: 0,
            draw: (ax, y) => {
              let x = ax(rowW);
              if (ctaOn && opts.ctaFirst) {
                drawCta(x, y); x += ctaW + gapX;
                drawSub(x, y);
              } else {
                drawSub(x, y); x += subW + gapX;
                if (ctaOn) drawCta(x, y);
              }
              function drawSub(px, py) {
                if (!subOn) return;
                setFont(ctx, 500, ss);
                ctx.fillStyle = s.subColor;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.sub, px, py + rowH / 2 + ss * 0.04);
              }
              function drawCta(px, py) {
                const top = py + (rowH - pillH) / 2;
                shapePath(ctx, 'pill', px, top, ctaW, pillH);
                ctx.fillStyle = s.ctaColor;
                ctx.fill();
                setFont(ctx, 600, cs);
                ctx.fillStyle = s.ctaTextColor;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(s.cta, px + pillPad, top + pillH / 2 + cs * 0.04);
              }
            }
          });
        }
        const total = blocks.reduce((sum, b, i) => sum + b.h + (i < blocks.length - 1 ? b.gap : 0), 0);
        return { blocks, total };
      }

      function place(st, anchor, align, top) {
        const ax = align === 'center' ? (w) => anchor - w / 2 : align === 'right' ? (w) => anchor - w : () => anchor;
        let y = top;
        st.blocks.forEach((b, i) => { b.draw(ax, y); y += b.h + (i < st.blocks.length - 1 ? b.gap : 0); });
      }

      if (s.layout === 'split') {
        const divX = box.x + box.w * 0.5;
        const left = stack(F0, divX - box.x - padX - F0 * 0.6, { lockup: true });
        const rightX = divX + F0 * 0.6;
        const right = stack(F0, box.x + box.w - padX - rightX, { text: true });
        if (left.blocks.length) place(left, box.x + padX, 'left', box.y + (box.h - left.total) / 2);
        if (right.blocks.length) {
          place(right, rightX, 'left', box.y + (box.h - right.total) / 2);
          if (left.blocks.length) {
            ctx.fillStyle = rgbaOf(inkFor(s.bgColor), 0.16);
            const dh = Math.max(left.total, right.total) * 1.15;
            ctx.fillRect(divX - Math.max(1, F0 * 0.012) / 2, box.y + (box.h - dh) / 2, Math.max(1, F0 * 0.012), dh);
          }
        }
        return;
      }

      const align = s.layout === 'center' ? 'center' : s.layout === 'right' ? 'right' : 'left';
      const maxW = align === 'center' ? box.w * 0.82 : box.w * (s.layout === 'hero' ? 0.56 : 0.62);
      const st = stack(F0, maxW, { lockup: true, text: true });
      const anchor = align === 'center' ? box.x + box.w / 2 : align === 'right' ? box.x + box.w - padX : box.x + padX;
      place(st, anchor, align, box.y + (box.h - st.total) / 2);
    }

    const BR_RENDER = { profile: renderProfile, logo: renderLogo, lockup: renderLockup, banner: renderBanner };

    function assetDims(type, s = brand[type], sizeOverride) {
      if (type === 'profile') { const n = sizeOverride || s.size; return { w: n, h: n }; }
      if (type === 'logo') return logoDims(s, sizeOverride || s.size);
      if (type === 'lockup') { const d = lockupDims(s, sizeOverride || s.height); return { w: d.w, h: d.h }; }
      const f = BR_BANNERS[s.format] || BR_BANNERS.x;
      return { w: f.w * s.scale, h: f.h * s.scale };
    }

    function drawAsset(canvas, type, s, w, h) {
      canvas.width = Math.max(1, Math.round(w));
      canvas.height = Math.max(1, Math.round(h));
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      BR_RENDER[type](ctx, canvas.width, canvas.height, s);
      return canvas;
    }

    // Does the exported PNG have transparent pixels?
    function hasTransparency(type, s) {
      if (type === 'profile') return s.shape === 'none' || !s.fill || (s.shape !== 'square' && s.outsideTransparent);
      if (type === 'logo' || type === 'lockup') return s.transparent || (type === 'lockup' && s.bgShape !== 'square');
      return false;
    }

    /* ---------- fonts ---------- */
    let brandFontOk = true;
    const brandFontsReady = fontReady
      .then(() => Promise.all([500, 600, 700].map(w => document.fonts.load(`${w} 64px 'TP Plex'`))))
      .catch(() => {})
      .then(() => {
        try { brandFontOk = document.fonts.check("700 64px 'TP Plex'") || document.fonts.check("700 64px 'IBM Plex Sans'"); } catch (err) {}
      });

    /* ---------- controls ---------- */
    const brControls = $('#brandControls');
    const brCanvas = $('#brandCanvas');
    const brGuides = $('#brandGuides');
    const brStage = $('#brandStage');
    const brViewport = $('#brandViewport');

    const bGroup = (title, body, small = '') =>
      `<details class="ctl-group" data-group="${esc(title)}" ${brOpen.has(title) ? 'open' : ''}><summary>${esc(title)}${small ? `<small>${small}</small>` : ''}</summary><div class="ctl-body">${body}</div></details>`;

    const bSeg = (key, options, value) =>
      `<div class="seg" role="group" data-bseg="${key}">${options.map(([v, label]) =>
        `<button type="button" data-value="${esc(v)}" aria-pressed="${String(v) === String(value)}">${esc(label)}</button>`).join('')}</div>`;

    const bField = (label, inner, hint = '') =>
      `<div class="field">${label ? `<span class="field-label">${label}</span>` : ''}${inner}${hint ? `<div class="field-hint">${hint}</div>` : ''}</div>`;

    const bRange = (key, label, value, min, max, step = 1, unit = '%') =>
      bField(label, `<div class="range-row"><input type="range" data-brange="${key}" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${esc(label)}"><output data-bout="${key}">${value}${unit}</output></div>`);

    const bSwitch = (key, label, checked, hint = '') =>
      `<label class="toggle-row"><span>${label}${hint ? `<small>${hint}</small>` : ''}</span><span class="switch"><input type="checkbox" data-bcheck="${key}" ${checked ? 'checked' : ''} aria-label="${esc(label)}"><span></span></span></label>`;

    function bColor(key, label, value) {
      const hex = normHex(value, '#6366F1');
      return `<div class="field color-ctl" data-colorfield="${key}">
        <span class="field-label">${label}<span class="field-count" data-bhexlabel="${key}">${hex}</span></span>
        <div class="swatches">${BR_SWATCHES.map(([c, name]) =>
          `<button type="button" class="swatch" data-bswatch="${key}" data-value="${c}" style="background:${c}" title="${name} ${c}" aria-label="${name}" aria-pressed="${c === hex}"></button>`).join('')}</div>
        <div class="color-input-row"><input type="color" data-bcolor="${key}" value="${hex.toLowerCase()}" aria-label="${esc(label)} picker"><input type="text" data-bhex="${key}" value="${hex}" maxlength="7" spellcheck="false" autocomplete="off" aria-label="${esc(label)} hex code"></div>
      </div>`;
    }

    const bText = (key, label, value, max) =>
      `<div class="field"><label for="b-${key}">${label}<span class="field-count" data-bcount="${key}">${String(value).length}/${max}</span></label><input type="text" id="b-${key}" data-btext="${key}" value="${esc(value)}" maxlength="${max}" autocomplete="off"></div>`;

    function presetGroup(type) {
      const wide = type === 'banner' || type === 'lockup';
      const tiles = BR_PRESETS[type].map((p, i) =>
        `<button type="button" class="preset-tile" data-bpreset="${i}" aria-pressed="${brand.preset[type] === i}" title="${esc(p.name)}"><span class="preset-thumb" data-thumb="${i}"></span><span class="preset-name">${esc(p.name)}</span></button>`).join('');
      return bGroup('Presets', `<div class="preset-grid${wide ? ' wide' : ''}">${tiles}</div>`, 'Click to apply');
    }

    function sizeChips(key, list, value, title) {
      return `<div class="field"><span class="field-label">${title}</span><div class="size-chips" role="group">${list.map(([v, label, note]) =>
        `<button type="button" data-bsize="${key}" data-value="${v}" aria-pressed="${Number(v) === Number(value)}">${label}${note ? `<small>${note}</small>` : ''}</button>`).join('')}</div></div>`;
    }

    function exportGroup(type) {
      const s = brand[type];
      const d = assetDims(type);
      const transparent = hasTransparency(type, s);
      let sizes = '';
      if (type === 'profile') sizes = sizeChips('size', BR_SIZES.profile, s.size, 'Size (px)') + sizeChips('size', BR_SIZES.icons, s.size, 'Icon and favicon sizes');
      if (type === 'logo') sizes = sizeChips('size', BR_SIZES.logo, s.size, s.frame === 'tight' ? 'Height (px)' : 'Size (px)');
      if (type === 'lockup') sizes = sizeChips('height', BR_SIZES.lockup, s.height, 'Height (px)');
      if (type === 'banner') sizes = bField('Resolution', bSeg('scale', [[1, '1×'], [2, '2×']], s.scale));
      return bGroup('Export', `
        ${sizes}
        <div class="br-export-info"><b>${d.w} × ${d.h}</b> PNG · ${transparent ? 'transparent background' : 'solid background'}<br><span class="field-hint">${esc(brandFileName(type))}</span></div>
        <div class="br-actions">
          <button class="btn btn-primary" type="button" id="brDownload"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Download PNG</button>
          <button class="btn" type="button" id="brCopy" title="Copy the PNG to the clipboard">Copy</button>
          ${type === 'profile' && !IS_TOUCH ? `<button class="btn btn-wide" type="button" id="brIconSet" title="${ICON_SET.join(', ')} px">Download icon set (${ICON_SET.length} sizes)</button>` : ''}
        </div>
        <div class="br-status" id="brStatus" role="status" aria-live="polite"></div>
      `);
    }

    const BG_STYLES = [['solid', 'Solid'], ['spotlight', 'Spotlight'], ['grid', 'Grid'], ['dots', 'Dots'], ['equity', 'Equity line']];

    function renderBrandControls() {
      const type = brand.type;
      const s = brand[type];
      let html = presetGroup(type);

      if (type === 'profile') {
        html += bGroup('Shape', `
          ${bField('Frame', bSeg('shape', [['square', 'Square'], ['rounded', 'Rounded'], ['circle', 'Circle'], ['none', 'None']], s.shape),
            s.shape === 'none' ? 'Just the mark on a transparent square.' : s.shape === 'square' ? 'A full square. X and Instagram crop it to a circle.' : 'Outside the shape is transparent in the PNG unless you turn that off below.')}
          ${s.shape === 'rounded' ? bRange('radius', 'Corner radius', s.radius, 4, 50) : ''}
          ${s.shape !== 'none' ? bRange('ringWidth', 'Ring width', s.ringWidth, 0, 12, 0.5) : ''}
          ${s.shape !== 'none' && s.ringWidth > 0 ? bColor('ringColor', 'Ring color', s.ringColor) : ''}
          ${s.shape === 'circle' || s.shape === 'rounded' ? bSwitch('outsideTransparent', 'Transparent outside the shape', s.outsideTransparent, 'Off fills the corners with a color') : ''}
          ${(s.shape === 'circle' || s.shape === 'rounded') && !s.outsideTransparent ? bColor('outsideColor', 'Corner color', s.outsideColor) : ''}
        `);
        if (s.shape !== 'none') {
          html += bGroup('Background', `
            ${bSwitch('fill', 'Fill the shape', s.fill, s.fill ? 'Solid color inside the shape' : 'Transparent inside the shape')}
            ${s.fill ? bColor('bgColor', 'Background color', s.bgColor) : ''}
            ${s.fill ? bField('Style', bSeg('bgStyle', BG_STYLES.slice(0, 4), s.bgStyle)) : ''}
            ${s.fill && s.bgStyle !== 'solid' ? bRange('bgIntensity', 'Texture strength', s.bgIntensity, 0, 100) : ''}
          `);
        }
        html += bGroup('Logo', `
          ${bColor('logoColor', 'Logo color', s.logoColor)}
          ${bRange('logoSize', 'Logo size', s.logoSize, 20, 90)}
          <div class="field-row">${bRange('offsetX', 'Move left / right', s.offsetX, -20, 20, 0.5)}${bRange('offsetY', 'Move up / down', s.offsetY, -20, 20, 0.5)}</div>
        `);
      }

      if (type === 'logo') {
        html += bGroup('Shape', `
          ${bField('Canvas', bSeg('frame', [['square', 'Square'], ['tight', 'Tight crop']], s.frame), s.frame === 'tight' ? 'The canvas hugs the mark. Good for websites and documents.' : 'A square canvas with the mark centered.')}
          ${bRange('padding', 'Padding', s.padding, 0, 30)}
        `);
        html += bGroup('Background', `
          ${bSwitch('transparent', 'Transparent background', s.transparent)}
          ${!s.transparent ? bColor('bgColor', 'Background color', s.bgColor) : ''}
        `);
        html += bGroup('Logo', bColor('logoColor', 'Logo color', s.logoColor));
      }

      if (type === 'lockup') {
        html += bGroup('Layout', `
          ${bField('Arrangement', bSeg('layout', [['horizontal', 'Horizontal'], ['stacked', 'Stacked'], ['wordmark', 'Wordmark']], s.layout))}
          ${bField('Weight', bSeg('weight', [[700, 'Bold'], [600, 'Semibold']], s.weight))}
          ${s.layout !== 'wordmark' ? bRange('markScale', 'Mark size', s.markScale, 60, 160) : ''}
          ${s.layout !== 'wordmark' ? bRange('gap', 'Space between', s.gap, 40, 200) : ''}
          ${bRange('padding', 'Padding', s.padding, 0, 80)}
        `);
        html += bGroup('Colors', `
          ${s.layout !== 'wordmark' ? bColor('markColor', 'Mark', s.markColor) : ''}
          ${bColor('tradeColor', '"trade"', s.tradeColor)}
          ${bColor('printColor', '"print"', s.printColor)}
        `);
        html += bGroup('Background', `
          ${bSwitch('transparent', 'Transparent background', s.transparent)}
          ${!s.transparent ? bField('Shape', bSeg('bgShape', [['square', 'Rectangle'], ['rounded', 'Rounded'], ['pill', 'Pill']], s.bgShape)) : ''}
          ${!s.transparent ? bColor('bgColor', 'Background color', s.bgColor) : ''}
        `);
      }

      if (type === 'banner') {
        const f = BR_BANNERS[s.format];
        html += bGroup('Format', `
          <div class="tpl-grid">${Object.entries(BR_BANNERS).map(([id, b]) =>
            `<button type="button" class="tpl-tile" data-bformat="${id}" aria-pressed="${id === s.format}"><span class="tpl-tile-name">${esc(b.short)}<br><small style="color:var(--text3);font-weight:500">${b.w} × ${b.h}</small></span></button>`).join('')}</div>
          ${f.safe ? '<div class="field-hint">YouTube crops the banner on phones and desktop. The text stays inside the safe area that shows everywhere.</div>' : ''}
          ${s.format === 'x' ? '<div class="field-hint">Your X profile photo covers part of the bottom left, so left-side layouts sit higher. Guides show roughly where the photo goes, using your current Profile design.</div>' : ''}
          ${s.format === 'linkedin' ? '<div class="field-hint">LinkedIn also puts your profile photo over the bottom left. Centered or right layouts keep clear of it.</div>' : ''}
        `);
        html += bGroup('Layout', `
          ${bField('Composition', bSeg('layout', [['left', 'Left'], ['center', 'Center'], ['right', 'Right']], s.layout))}
          ${bField('', bSeg('layout', [['split', 'Split'], ['hero', 'Mark hero']], s.layout))}
          ${bField('Text size', bSeg('textSize', [['s', 'Small'], ['m', 'Medium'], ['l', 'Large']], s.textSize))}
        `);
        html += bGroup('Text', `
          <div class="toggle-list">
            ${bSwitch('showMark', 'Logo mark', s.showMark)}
            ${bSwitch('showWordmark', '"tradeprint" wordmark', s.showWordmark)}
            ${bSwitch('showTagline', 'Tagline', s.showTagline)}
            ${bSwitch('showSub', 'Website / subline', s.showSub)}
            ${bSwitch('showCta', 'Button', s.showCta)}
          </div>
          ${s.showTagline ? bText('tagline', 'Tagline', s.tagline, 70) : ''}
          ${s.showSub ? bText('sub', 'Website / subline', s.sub, 40) : ''}
          ${s.showCta ? bText('cta', 'Button text', s.cta, 26) : ''}
        `);
        html += bGroup('Background', `
          ${bColor('bgColor', 'Background color', s.bgColor)}
          ${bField('Style', bSeg('bgStyle', BG_STYLES.slice(0, 3), s.bgStyle))}
          ${bField('', bSeg('bgStyle', BG_STYLES.slice(3), s.bgStyle))}
          ${s.bgStyle !== 'solid' ? bRange('bgIntensity', 'Texture strength', s.bgIntensity, 0, 100) : ''}
        `);
        html += bGroup('Colors', `
          ${s.showMark ? bColor('markColor', 'Logo mark', s.markColor) : ''}
          ${s.showWordmark ? bColor('tradeColor', '"trade"', s.tradeColor) + bColor('printColor', '"print"', s.printColor) : ''}
          ${s.showTagline ? bColor('taglineColor', 'Tagline', s.taglineColor) : ''}
          ${s.showSub ? bColor('subColor', 'Website / subline', s.subColor) : ''}
          ${s.showCta ? bColor('ctaColor', 'Button', s.ctaColor) + bColor('ctaTextColor', 'Button text', s.ctaTextColor) : ''}
        `);
      }

      html += exportGroup(type);
      if (!brandFontOk && (type === 'lockup' || type === 'banner')) {
        html += `<div class="br-font-warn">IBM Plex Sans could not load, so text uses a fallback font. Check your connection and reload.</div>`;
      }
      html += `<div class="ctl-footer"><button class="btn" type="button" id="brReset">Restore ${esc(BR_TYPES.find(t => t.id === type).short)} defaults</button></div>`;
      brControls.innerHTML = html;
      drawPresetThumbs();
    }

    function presetState(type, i) {
      const keep = {};
      BR_KEEP[type].forEach(k => { keep[k] = brand[type][k]; });
      return { ...BR_DEFAULTS[type], ...BR_PRESETS[type][i].v, ...keep };
    }

    function drawPresetThumbs() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      brControls.querySelectorAll('[data-thumb]').forEach(el => {
        const i = Number(el.dataset.thumb);
        const type = brand.type;
        const s = presetState(type, i);
        const d = assetDims(type, s, type === 'profile' || type === 'logo' ? 96 : type === 'lockup' ? 60 : undefined);
        const cssW = el.clientWidth || 100;
        let cssH = cssW * d.h / d.w;
        if (type === 'lockup') cssH = Math.min(cssH, cssW * 0.5);
        el.style.height = Math.round(cssH) + 'px';
        const c = document.createElement('canvas');
        if (type === 'lockup') {
          // fit the lockup inside a fixed 2:1 tile
          c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
          const inner = drawAsset(document.createElement('canvas'), type, s, d.w * (cssH * dpr * 0.7 / d.h), cssH * dpr * 0.7);
          const scale = Math.min(1, (c.width * 0.88) / inner.width);
          const ctx = c.getContext('2d');
          ctx.drawImage(inner, (c.width - inner.width * scale) / 2, (c.height - inner.height * scale) / 2, inner.width * scale, inner.height * scale);
        } else {
          drawAsset(c, type, s, cssW * dpr, cssH * dpr);
        }
        el.innerHTML = '';
        el.appendChild(c);
      });
    }

    function brandFileName(type = brand.type, sizeOverride) {
      const s = brand[type];
      const hex = (v) => normHex(v, '#000000').slice(1).toLowerCase();
      const d = assetDims(type, s, sizeOverride);
      if (type === 'profile') {
        const shape = s.shape === 'none' ? 'mark' : s.shape;
        const bg = s.shape === 'none' || !s.fill ? 'transparent' : hex(s.bgColor);
        return `tradeprint-profile-${shape}-${bg}-${hex(s.logoColor)}-${d.w}.png`;
      }
      if (type === 'logo') return `tradeprint-logo-${hex(s.logoColor)}-${s.transparent ? 'transparent' : 'on-' + hex(s.bgColor)}-${d.w}x${d.h}.png`;
      if (type === 'lockup') return `tradeprint-lockup-${s.layout}-${s.transparent ? 'transparent' : hex(s.bgColor)}-${d.w}x${d.h}.png`;
      return `tradeprint-banner-${s.format}-${s.layout}-${d.w}x${d.h}.png`;
    }

    /* ---------- preview ---------- */
    let brRaf = 0;
    function queueBrand() {
      cancelAnimationFrame(brRaf);
      brRaf = requestAnimationFrame(() => { layoutBrand(); renderBrandContext(); });
    }

    function layoutBrand() {
      if ($('#brandView').hidden) return;
      const type = brand.type;
      const s = brand[type];
      const d = assetDims(type);
      const cs = getComputedStyle(brViewport);
      const narrow = window.matchMedia('(max-width: 900px)').matches;
      const availW = brViewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      let availH = brViewport.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (narrow) availH = Math.min(window.innerHeight * 0.55, availW * d.h / d.w);
      const cap = type === 'banner' ? Infinity : type === 'lockup' ? 900 : 560;
      const sc = Math.min(availW / d.w, availH / d.h, cap / Math.max(d.w, d.h));
      const cssW = Math.max(1, Math.round(d.w * sc)), cssH = Math.max(1, Math.round(d.h * sc));
      brStage.style.width = cssW + 'px';
      brStage.style.height = cssH + 'px';
      brStage.className = `br-stage bd-${brand.backdrop}`;
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      drawAsset(brCanvas, type, s, cssW * dpr, cssH * dpr);
      drawBrandGuides(cssW * dpr, cssH * dpr, dpr);
      const f = type === 'banner' ? BR_BANNERS[s.format] : null;
      $('#brandSize').textContent = `${f ? f.short + ' · ' : ''}${d.w} × ${d.h} PNG${hasTransparency(type, s) ? ' · transparent' : ''}`;
    }

    function guideLabel(ctx, text, x, y, dpr, align = 'center') {
      ctx.save();
      ctx.font = `600 ${11 * dpr}px ${BR_FONT}`;
      const w = ctx.measureText(text).width + 12 * dpr, h = 20 * dpr;
      const left = align === 'center' ? x - w / 2 : x;
      ctx.fillStyle = 'rgba(12,14,20,0.85)';
      shapePath(ctx, 'pill', left, y - h / 2, w, h);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, left + 6 * dpr, y + 0.5 * dpr);
      ctx.restore();
    }

    function drawBrandGuides(W, H, dpr) {
      brGuides.width = Math.round(W);
      brGuides.height = Math.round(H);
      const ctx = brGuides.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      $('#brandGuidesBtn').setAttribute('aria-pressed', String(brand.guides));
      if (!brand.guides) return;
      const type = brand.type;
      const s = brand[type];
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
      ctx.lineWidth = 1.5 * dpr;
      ctx.setLineDash([6 * dpr, 5 * dpr]);

      if (type === 'profile' && (s.shape === 'square' || s.shape === 'rounded')) {
        ctx.beginPath();
        ctx.arc(W / 2, H / 2, W / 2 - ctx.lineWidth, 0, Math.PI * 2);
        ctx.stroke();
        guideLabel(ctx, 'Circle crop', W / 2, 16 * dpr, dpr);
      }

      if (type === 'banner') {
        const f = BR_BANNERS[s.format];
        if (f.safe) {
          const b = bannerBox(s, W, H);
          ctx.strokeRect(b.x, b.y, b.w, b.h);
          guideLabel(ctx, 'Safe area (shows on every device)', b.x + b.w / 2, b.y - 14 * dpr, dpr);
        }
        if (s.format === 'x') {
          // X shows the profile photo over the bottom left (approximate position).
          const r = H * 0.334, cx = W * 0.138, cy = H;
          ctx.save();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.arc(cx, cy, r + r * 0.05, 0, Math.PI * 2);
          ctx.fillStyle = '#000000';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.clip();
          const av = drawAsset(document.createElement('canvas'), 'profile', { ...brand.profile, shape: 'circle', outsideTransparent: true }, r * 2, r * 2);
          ctx.drawImage(av, cx - r, cy - r, r * 2, r * 2);
          ctx.restore();
          ctx.beginPath();
          ctx.arc(cx, cy, r + r * 0.05, Math.PI, Math.PI * 2);
          ctx.stroke();
          guideLabel(ctx, 'Profile photo (approx.)', cx + r * 1.15, H - 16 * dpr, dpr, 'left');
        }
      }
    }

    function renderBrandContext() {
      const box = $('#brandContext');
      const type = brand.type;
      const s = brand[type];
      if (type === 'banner') { box.hidden = true; return; }
      box.hidden = false;
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      const chips = type === 'profile'
        ? [['on-dark', [96, 48, 28]], ['on-light', [96, 48, 28]]]
        : type === 'logo'
          ? [['on-dark', [64, 32, 16]], ['on-light', [64, 32, 16]], ...(isIndigoish(s.logoColor) ? [] : [['on-indigo', [64, 32, 16]]])]
          : [['on-dark', [44, 26]], ['on-light', [44, 26]]];
      box.innerHTML = `<span class="br-context-label">Size check</span>` + chips.map(([cls, sizes]) =>
        `<div class="br-ctx ${cls}">${sizes.map(n => `<canvas data-ctx="${n}"></canvas>`).join('')}<small>${type === 'lockup' ? sizes.join(' / ') + 'px tall' : sizes.join(' / ') + 'px'}</small></div>`).join('');
      box.querySelectorAll('canvas[data-ctx]').forEach(c => {
        const n = Number(c.dataset.ctx);
        let d = type === 'lockup' ? assetDims('lockup', s, n) : type === 'logo' ? logoDims(s, n) : { w: n, h: n };
        c.style.width = d.w + 'px';
        c.style.height = d.h + 'px';
        drawAsset(c, type, s, d.w * dpr, d.h * dpr);
      });
    }

    function renderBrandTypes() {
      $('#brandTypes').innerHTML = BR_TYPES.map(t =>
        `<button type="button" data-btype="${t.id}" aria-pressed="${t.id === brand.type}" title="${esc(t.name)}" aria-label="${esc(t.name)}"><svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg><span>${esc(t.short)}</span></button>`).join('');
      $('#brandBackdrop').innerHTML = [['checker', 'Transparency grid'], ['dark', 'Dark background'], ['light', 'Light background']].map(([id, label]) =>
        `<button type="button" data-bbackdrop="${id}" aria-pressed="${id === brand.backdrop}" title="Preview on: ${label}" aria-label="Preview on ${label}"><i class="bd-${id}"></i></button>`).join('');
    }

    function renderBrandAll() {
      renderBrandTypes();
      renderBrandControls();
      layoutBrand();
      renderBrandContext();
    }

    /* ---------- control events ---------- */
    function brandChanged({ controls = false } = {}) {
      brand.preset[brand.type] = undefined;
      saveBrand();
      if (controls) renderBrandControls();
      else refreshExportInfo();
      queueBrand();
    }

    function refreshExportInfo() {
      const info = brControls.querySelector('.br-export-info');
      if (!info) return;
      const type = brand.type, s = brand[type], d = assetDims(type);
      info.innerHTML = `<b>${d.w} × ${d.h}</b> PNG · ${hasTransparency(type, s) ? 'transparent background' : 'solid background'}<br><span class="field-hint">${esc(brandFileName(type))}</span>`;
    }

    function setBrandColor(key, value, from) {
      const s = brand[brand.type];
      const hex = normHex(value, null);
      if (!hex) return false;
      s[key] = hex;
      const field = brControls.querySelector(`[data-colorfield="${key}"]`);
      if (field) {
        field.querySelectorAll('[data-bswatch]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === hex)));
        const label = field.querySelector('[data-bhexlabel]');
        if (label) label.textContent = hex;
        if (from !== 'picker') { const pick = field.querySelector('[data-bcolor]'); if (pick) pick.value = hex.toLowerCase(); }
        if (from !== 'hex') { const txt = field.querySelector('[data-bhex]'); if (txt) txt.value = hex; }
      }
      return true;
    }

    brControls.addEventListener('click', (e) => {
      const s = brand[brand.type];
      const segBtn = e.target.closest('[data-bseg] button');
      if (segBtn) {
        const key = segBtn.parentElement.dataset.bseg;
        const raw = segBtn.dataset.value;
        const prev = s[key];
        s[key] = typeof BR_DEFAULTS[brand.type][key] === 'number' ? Number(raw) : raw;
        // Leaving "None" brings the fill back; choosing it turns the fill off
        if (key === 'shape' && raw === 'none') s.fill = false;
        else if (key === 'shape' && prev === 'none') s.fill = true;
        return brandChanged({ controls: true });
      }
      const sw = e.target.closest('[data-bswatch]');
      if (sw) { setBrandColor(sw.dataset.bswatch, sw.dataset.value); return brandChanged(); }
      const size = e.target.closest('[data-bsize]');
      if (size) { s[size.dataset.bsize] = Number(size.dataset.value); return brandChanged({ controls: true }); }
      const fmt = e.target.closest('[data-bformat]');
      if (fmt) { s.format = fmt.dataset.bformat; return brandChanged({ controls: true }); }
      const preset = e.target.closest('[data-bpreset]');
      if (preset) {
        const i = Number(preset.dataset.bpreset);
        brand[brand.type] = presetState(brand.type, i);
        saveBrand();
        brand.preset[brand.type] = i;
        renderBrandControls();
        queueBrand();
        return;
      }
      if (e.target.closest('#brDownload')) return brandDownload();
      if (e.target.closest('#brCopy')) return brandCopy();
      if (e.target.closest('#brIconSet')) return brandIconSet();
      if (e.target.closest('#brReset')) {
        brand[brand.type] = { ...BR_DEFAULTS[brand.type] };
        brand.preset[brand.type] = undefined;
        saveBrand();
        renderBrandControls();
        queueBrand();
      }
    });

    brControls.addEventListener('input', (e) => {
      const s = brand[brand.type];
      const t = e.target;
      if (t.dataset.brange) {
        s[t.dataset.brange] = Number(t.value);
        const out = brControls.querySelector(`[data-bout="${t.dataset.brange}"]`);
        if (out) out.textContent = t.value + '%';
        // The ring color field appears once the ring has a width
        const needsControls = t.dataset.brange === 'ringWidth' && (Number(t.value) > 0) !== !!brControls.querySelector('[data-colorfield="ringColor"]');
        return brandChanged({ controls: needsControls });
      }
      if (t.dataset.bcolor) { setBrandColor(t.dataset.bcolor, t.value, 'picker'); return brandChanged(); }
      if (t.dataset.bhex) { if (setBrandColor(t.dataset.bhex, t.value, 'hex')) brandChanged(); return; }
      if (t.dataset.btext) {
        s[t.dataset.btext] = t.value;
        const count = brControls.querySelector(`[data-bcount="${t.dataset.btext}"]`);
        if (count) count.textContent = `${t.value.length}/${t.maxLength}`;
        return brandChanged();
      }
    });

    brControls.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.bcheck) {
        brand[brand.type][t.dataset.bcheck] = t.checked;
        return brandChanged({ controls: true });
      }
      if (t.dataset.bhex) {
        const s = brand[brand.type];
        t.value = s[t.dataset.bhex];
      }
    });

    brControls.addEventListener('toggle', (e) => {
      const g = e.target.closest && e.target.closest('details[data-group]');
      if (!g) return;
      if (g.open) brOpen.add(g.dataset.group); else brOpen.delete(g.dataset.group);
      if (g.open && g.dataset.group === 'Presets') drawPresetThumbs();
    }, true);

    $('#brandTypes').addEventListener('click', (e) => {
      const b = e.target.closest('[data-btype]');
      if (!b || b.dataset.btype === brand.type) return;
      brand.type = b.dataset.btype;
      saveBrand();
      renderBrandAll();
    });

    $('#brandBackdrop').addEventListener('click', (e) => {
      const b = e.target.closest('[data-bbackdrop]');
      if (!b) return;
      brand.backdrop = b.dataset.bbackdrop;
      saveBrand();
      renderBrandTypes();
      layoutBrand();
    });

    $('#brandGuidesBtn').addEventListener('click', () => {
      brand.guides = !brand.guides;
      saveBrand();
      layoutBrand();
    });

    /* ---------- export ---------- */
    let brandUrl = '';

    async function brandBlob(type = brand.type, sizeOverride) {
      await brandFontsReady;
      const s = brand[type];
      const d = assetDims(type, s, sizeOverride);
      const canvas = drawAsset(document.createElement('canvas'), type, s, d.w, d.h);
      const blob = await canvasToBlob(canvas);
      return { blob, d, name: brandFileName(type, sizeOverride) };
    }

    function brandStatus(text, cls = '') {
      const el = $('#brStatus');
      if (el) { el.textContent = text; el.className = 'br-status' + (cls ? ' ' + cls : ''); }
    }

    async function brandDownload() {
      try {
        const { blob, d, name } = await brandBlob();
        if (brandUrl) URL.revokeObjectURL(brandUrl);
        brandUrl = URL.createObjectURL(blob);
        const file = new File([blob], name, { type: 'image/png' });
        const canShare = IS_TOUCH && navigator.canShare && navigator.canShare({ files: [file] });
        const kb = Math.max(1, Math.round(blob.size / 1024));
        const transparent = hasTransparency(brand.type, brand[brand.type]);
        openSheet(`
          <div class="sheet-preview" style="${transparent ? 'background:repeating-conic-gradient(#2b3043 0% 25%, #1e2232 0% 50%) 50% / 16px 16px' : ''}"><img src="${brandUrl}" alt="Exported asset" /></div>
          <div class="sheet-copy">${esc(name)}<br>${d.w} × ${d.h} PNG · ${kb.toLocaleString()} KB${transparent ? ' · transparent' : ''}${IS_TOUCH ? '<br>On iPhone you can also press and hold the image and choose Save to Photos.' : ''}</div>
          <div class="sheet-actions">
            ${canShare ? '<button class="btn btn-primary" type="button" id="brShareBtn">Save or share</button>' : ''}
            <button class="btn ${canShare ? '' : 'btn-primary'}" type="button" id="brSheetDl">Download PNG</button>
          </div>`);
        $('#exportTitle').textContent = 'Download PNG';
        $('#brSheetDl').addEventListener('click', () => triggerDownload(brandUrl, name));
        const share = $('#brShareBtn');
        if (share) share.addEventListener('click', () => navigator.share({ files: [file] }).catch(() => {}));
        if (!IS_TOUCH) triggerDownload(brandUrl, name);
        brandStatus(`Saved ${name}`, 'ok');
      } catch (err) {
        console.error('[Brand] Export failed:', err);
        brandStatus('Export failed: ' + (err.message || err), 'err');
      }
    }

    async function brandCopy() {
      try {
        if (!navigator.clipboard || !window.ClipboardItem) throw new Error('This browser cannot copy images.');
        const item = new ClipboardItem({ 'image/png': brandBlob().then(r => r.blob) });
        await navigator.clipboard.write([item]);
        brandStatus('Copied to the clipboard.', 'ok');
      } catch (err) {
        brandStatus(err.message || 'Copy failed.', 'err');
      }
    }

    async function brandIconSet() {
      brandStatus('Preparing icons...');
      try {
        for (const n of ICON_SET) {
          const { blob } = await brandBlob('profile', n);
          const url = URL.createObjectURL(blob);
          triggerDownload(url, `tradeprint-icon-${n}.png`);
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          await new Promise(r => setTimeout(r, 350));
        }
        brandStatus(`Downloaded ${ICON_SET.length} icon sizes.`, 'ok');
      } catch (err) {
        brandStatus('Icon export failed: ' + (err.message || err), 'err');
      }
    }

    $('#brandTopDl').addEventListener('click', () => brandDownload());

    /* ---------- view switching ---------- */
    const ADS_TITLE = document.title;
    const VIEW_ICONS = {
      brand: '<rect x="3" y="3" width="7" height="7" rx="2"/><circle cx="17.5" cy="6.5" r="3.5"/><rect x="3" y="14" width="18" height="7" rx="2"/>',
      back: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>'
    };
    let studioView = 'ads';
    let brandStarted = false;

    function setView(next, push = true) {
      studioView = next === 'brand' ? 'brand' : 'ads';
      const on = studioView === 'brand';
      if (on && shotActive) exitShotMode();
      $('.st-main').hidden = on;
      $('#brandView').hidden = !on;
      $('#shotBtn').hidden = on;
      $('#exportBtn').hidden = on;
      $('#brandTopDl').hidden = !on;
      const btn = $('#viewBtn');
      btn.classList.toggle('is-back', on);
      $('#viewBtnIcon').innerHTML = on ? VIEW_ICONS.back : VIEW_ICONS.brand;
      $('#viewBtnLabel').textContent = on ? 'Back to Ads' : 'Brand Assets';
      btn.title = on ? 'Back to the ad templates' : 'Logos, profile pictures, lockups and banners';
      btn.setAttribute('aria-label', on ? 'Back to Ads' : 'Brand Assets');
      if (!on) $('#exportTitle').textContent = 'Export PNG';
      document.title = on ? 'Tradeprint | Brand Assets' : ADS_TITLE;
      if (push) {
        const url = on ? '#brand' : location.pathname + location.search;
        try { history.pushState({ view: studioView }, '', url); } catch (err) {}
      }
      if (on) {
        if (!brandStarted) {
          brandStarted = true;
          new ResizeObserver(() => { if (studioView === 'brand') queueBrand(); }).observe(brViewport);
        }
        renderBrandAll();
      } else {
        layoutPreview();
      }
    }

    $('#viewBtn').addEventListener('click', () => setView(studioView === 'brand' ? 'ads' : 'brand'));
    window.addEventListener('popstate', () => setView(location.hash === '#brand' ? 'brand' : 'ads', false));
    window.addEventListener('hashchange', () => {
      const want = location.hash === '#brand' ? 'brand' : 'ads';
      if (want !== studioView) setView(want, false);
    });
    window.addEventListener('resize', () => { if (studioView === 'brand') queueBrand(); });

    loadBrand();
    if (location.hash === '#brand') setView('brand', false);
    brandFontsReady.then(() => { if (studioView === 'brand') renderBrandAll(); });

    // Debug hook for checks in the browser console: window.__brand
    window.__brand = {
      state: brand, presets: BR_PRESETS, defaults: BR_DEFAULTS, banners: BR_BANNERS, mark: MARK,
      setView, setType(t) { brand.type = t; saveBrand(); renderBrandAll(); },
      apply(type, values) { Object.assign(brand[type], values); saveBrand(); if (studioView === 'brand') renderBrandAll(); },
      blob: brandBlob, dims: assetDims, fileName: brandFileName, fontsReady: brandFontsReady,
      render: renderBrandAll
    };
  })();
  </script>
</body>
</html>
