<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0e14" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/>
  <title>Tradeprint | Marketing Studio</title>

  <!--
    Tradeprint Marketing Studio 2.0
    Internal tool for building social ads. Static page: no Supabase, no tokens,
    no user data. Settings are saved only in this browser (localStorage).

    Ads are built from the Tradeprint UI 2.0 design system (graphite surfaces,
    indigo #6366f1, IBM Plex Sans for UI, IBM Plex Sans Condensed for figures).

    Optional assets (the page works without them, it falls back to jsDelivr):
      assets/fonts/ibm-plex-sans-latin-400-normal.woff2           (also 500, 600, 700, 400-italic)
      assets/fonts/ibm-plex-sans-condensed-latin-500-normal.woff2 (also 600)
      assets/vendor/modern-screenshot-4.7.0.js                    PNG export
      assets/logo.png                                             official TP logo, used as supplied

    Templates live in section 5 of the script. Each one is a TPL_ object with
    id, layouts, defaults, data fields and product(state, ctx). The shared shell
    adds the brand row, copy, CTA and fine print, and recomposes the ad for
    Story 9:16, Feed 4:5, Square 1:1 and Landscape 16:9.
    All numbers shown inside app screens are example data.

    Brand Assets (the "Brand Assets" button in the top bar, or /marketing#brand):
    profile pictures, transparent logos, lockups and banners (X, LinkedIn, link
    preview, YouTube). They are drawn on a canvas from a vector trace of the
    official TP mark (repo root assets/tradeprint-logo.png), embedded below in
    section 17, so this view needs no extra files.
  -->

  <style>
    /* ============================================================
       1. STUDIO TOKENS (Tradeprint UI 2.0)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --nav: #0c0e14;
      --canvas: #10121a;
      --inset: #12141c;
      --surface: #171a24;
      --raised: #1d2130;
      --overlay: #1a1d29;
      --line: #262a38;
      --line-soft: #1f2330;
      --line-strong: #353b4f;
      --text: #e9ebf2;
      --text2: #979db1;
      --text3: #6d7388;
      --accent: #6366f1;
      --accent-hover: #5458e8;
      --accent-text: #a3a6fb;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --accent-softer: rgba(99, 102, 241, 0.08);
      --accent-line: rgba(99, 102, 241, 0.5);
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
      --btn-sheen: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      --shadow-pop: 0 18px 44px rgba(2, 3, 7, 0.55), 0 2px 8px rgba(2, 3, 7, 0.35);
      --font: 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      --font-num: 'TP Plex Condensed', 'IBM Plex Sans Condensed', 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --topbar-h: 56px;
      --controls-w: 404px;
    }

    html, body { height: 100%; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

    :focus { outline: none; }
    :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px rgba(99, 102, 241, 0.7); border-radius: 6px; }

    /* ============================================================
       2. STUDIO LAYOUT
       ============================================================ */
    .st-top {
      position: relative;
      z-index: 20;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
      background: var(--nav);
      border-bottom: 1px solid var(--line-soft);
    }

    .st-logo { font-size: 19px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); text-decoration: none; white-space: nowrap; }
    .st-logo span { color: var(--accent); }

    .st-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      color: var(--accent-text);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .st-top-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: border-color 140ms, background 140ms, color 140ms;
    }

    .btn:hover { border-color: var(--line-strong); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--btn-sheen), 0 1px 2px rgba(10, 12, 40, 0.35); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-quiet { background: transparent; border-color: transparent; color: var(--text2); }
    .btn-quiet:hover { color: var(--text); border-color: var(--line); }
    .btn-quiet[aria-pressed="true"] { color: var(--text); border-color: var(--accent-line); background: var(--accent-softer); }
    .btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .st-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--controls-w);
      height: calc(100vh - var(--topbar-h));
      height: calc(100dvh - var(--topbar-h));
    }

    .st-preview { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    .st-preview-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--canvas);
    }

    .st-zoom { margin-left: auto; font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .st-viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
      background-color: var(--canvas);
      background-image: radial-gradient(var(--line-soft) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .stage-shell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 6px;
      background: #0c0e14;
      box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(2, 3, 7, 0.6);
      transition: opacity 0.2s;
    }

    .stage-shell.is-loading { opacity: 0; }
    .stage-scale { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

    .st-controls {
      min-height: 0;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line-soft);
      padding: 6px 20px 48px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .st-main { display: block; height: auto; }
      .st-preview-bar { padding: 10px 16px; }
      .st-viewport { padding: 16px; }
      .st-controls { border-left: none; border-top: 1px solid var(--line-soft); padding: 4px 16px calc(48px + env(safe-area-inset-bottom)); }
      .st-tag { display: none; }
      .st-top-actions .btn-label-long { display: none; }
      .st-zoom { flex-basis: 100%; margin-left: 0; }
    }

    @media (max-width: 520px) {
      #formatSeg em { display: none; }
    }

    @media (max-width: 380px) {
      .st-top-actions .btn { padding: 0 10px; }
    }

    /* ============================================================
       3. STUDIO CONTROLS
       ============================================================ */
    .ctl-group { border-bottom: 1px solid var(--line-soft); }
    .ctl-group:last-of-type { border-bottom: none; }

    .ctl-group > summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .ctl-group > summary::-webkit-details-marker { display: none; }
    .ctl-group > summary small { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--text3); }

    .ctl-group > summary::after {
      content: '';
      flex: none;
      width: 7px;
      height: 7px;
      border-right: 1.6px solid var(--text2);
      border-bottom: 1.6px solid var(--text2);
      transform: translateY(-2px) rotate(45deg);
      transition: transform 140ms;
    }

    .ctl-group:not([open]) > summary::after { transform: rotate(-45deg); }

    .ctl-body { display: grid; gap: 16px; padding-bottom: 20px; }

    .field { display: grid; gap: 7px; min-width: 0; }

    .field > label, .field-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .field-count { color: var(--text3); font-variant-numeric: tabular-nums; }
    .field-count.over { color: var(--danger); }

    .field input[type="text"], .field textarea, .field select {
      width: 100%;
      min-height: 38px;
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--inset);
      color: var(--text);
      outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }

    .field textarea { resize: vertical; min-height: 48px; }
    .field input:hover, .field textarea:hover, .field select:hover { border-color: var(--line-strong); }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field input.mono { font-family: var(--font-num); letter-spacing: 0.06em; font-weight: 600; }

    .field select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4.5 6.25 8 9.75l3.5-3.5' fill='none' stroke='%23979db1' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: calc(100% - 10px) 50%;
    }

    .field-hint { font-size: 12px; color: var(--text3); line-height: 1.5; }
    .field-hint b { color: var(--text2); font-weight: 600; }
    .field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

    .seg {
      display: grid;
      grid-auto-columns: minmax(0, 1fr);
      grid-auto-flow: column;
      gap: 3px;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--inset);
    }

    .seg button {
      min-height: 30px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seg button:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
    .seg button[aria-pressed="true"] em { color: var(--accent-text); }
    .seg button em { font-style: normal; color: var(--text3); margin-left: 4px; font-weight: 500; }

    .st-preview-bar .seg { grid-auto-columns: auto; }

    /* Template picker */
    .tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

    .tpl-tile {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 6px 9px;
      border-radius: 8px;
      border: 1px solid var(--line-soft);
      background: var(--inset);
      color: var(--text);
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      transition: border-color 140ms, background 140ms;
      min-width: 0;
    }

    .tpl-tile:hover { border-color: var(--line-strong); }
    .tpl-tile[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
    .tpl-tile-icon { width: 28px; height: 28px; flex: none; border-radius: 7px; display: grid; place-items: center; background: var(--raised); color: var(--text2); }
    .tpl-tile[aria-pressed="true"] .tpl-tile-icon { background: var(--accent); color: #fff; }
    .tpl-tile-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .tpl-tile-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tpl-new { margin-left: auto; flex: none; font-size: 10px; font-weight: 700; color: var(--accent-text); border: 1px solid var(--accent-line); border-radius: 999px; padding: 1px 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      border: 1px solid var(--line-soft);
      background: var(--inset);
      color: var(--text2);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.3;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip:hover { border-color: var(--accent-line); color: var(--text); }

    .toggle-list { display: grid; gap: 2px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      font-size: 14px;
      cursor: pointer;
    }

    .toggle-row small { display: block; font-size: 11.5px; color: var(--text3); margin-top: 1px; }

    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 38px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); pointer-events: none; transition: background 140ms; }
    .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); transition: transform 140ms; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(16px); }
    .switch input:focus-visible + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px rgba(99, 102, 241, 0.7); }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .range-row output { font-size: 12px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .upload-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .upload-status { font-size: 12px; color: var(--text3); }

    .ctl-note {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text2);
      background: var(--inset);
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 9px 11px;
    }

    .ctl-footer { padding-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ============================================================
       4. SAFE ZONE GUIDES (preview only, never exported)
       ============================================================ */
    .safe-guides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

    .safe-zone {
      position: absolute;
      background: repeating-linear-gradient(135deg, rgba(239, 68, 68, 0.16) 0 14px, rgba(239, 68, 68, 0.06) 14px 28px);
      border: 3px dashed rgba(239, 68, 68, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .safe-zone span {
      font: 600 30px/1.2 var(--font);
      color: #fca5a5;
      background: rgba(12, 14, 20, 0.88);
      padding: 10px 18px;
      border-radius: 10px;
      text-align: center;
    }

    /* ============================================================
       5. SCREENSHOT MODE + EXPORT SHEET
       ============================================================ */
    .shot-mode {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .shot-stage { position: relative; flex: none; overflow: hidden; }

    .shot-ui {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.25s;
      z-index: 2;
    }

    .shot-ui.is-hidden { opacity: 0; pointer-events: none; }

    .shot-hint {
      font-size: 12px;
      color: var(--text);
      background: rgba(26, 29, 41, 0.94);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 230px;
      line-height: 1.4;
    }

    .shot-exit {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--line-strong);
      background: rgba(26, 29, 41, 0.94);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 6, 10, 0.72);
    }

    .sheet-box {
      width: 100%;
      max-width: 460px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: var(--overlay);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px 22px 22px;
      display: grid;
      gap: 16px;
      box-shadow: 0 32px 90px rgba(2, 3, 7, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sheet-title { font-size: 16px; font-weight: 600; }
    .sheet-close { width: 32px; height: 32px; background: none; border: none; border-radius: 6px; color: var(--text2); font-size: 22px; line-height: 1; }
    .sheet-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .sheet-copy { font-size: 13px; color: var(--text2); line-height: 1.55; }
    .sheet-copy.error { color: #fca5a5; }

    .sheet-preview {
      display: flex;
      justify-content: center;
      background-color: var(--inset);
      background-image: radial-gradient(var(--line-soft) 1px, transparent 1px);
      background-size: 14px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      padding: 14px;
    }

    .sheet-preview img { display: block; max-width: 100%; max-height: 46vh; border-radius: 6px; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45); }
    .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sheet-actions .btn { flex: 1 1 140px; min-height: 40px; }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 8px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }

    /* ============================================================
       6. THE AD (fixed design pixels)
       Story 1080 x 1920, Feed 1080 x 1350, Square 1080 x 1080,
       Landscape 1920 x 1080. Everything below is the exported artwork.
       No studio styles leak in.
       ============================================================ */
    .ad {
      --ad-font: 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      --ad-num: 'TP Plex Condensed', 'IBM Plex Sans Condensed', 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --ad-bg: #0c0e14;
      --ad-text: #e9ebf2;
      --ad-muted: #979db1;
      --ad-dim: #6d7388;
      --ad-accent: #6366f1;
      --ad-accent-text: #a3a6fb;
      --pad-top: 270px;
      --pad-bottom: 270px;
      --pad-left: 72px;
      --pad-right: 72px;
      --copy-gap: 60px;
      --support-gap: 28px;
      --product-gap: 52px;
      --foot-gap: 52px;
      --h-max: 128;

      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--ad-bg);
      color: var(--ad-text);
      font-family: var(--ad-font);
      font-size: 32px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
    }

    .ad--feed {
      height: 1350px;
      --pad-top: 76px;
      --pad-bottom: 76px;
      --copy-gap: 50px;
      --support-gap: 22px;
      --product-gap: 44px;
      --foot-gap: 44px;
      --h-max: 108;
    }

    .ad--square {
      height: 1080px;
      --pad-top: 64px;
      --pad-bottom: 64px;
      --pad-left: 64px;
      --pad-right: 64px;
      --copy-gap: 40px;
      --support-gap: 18px;
      --product-gap: 36px;
      --foot-gap: 36px;
      --h-max: 94;
    }

    .ad--landscape {
      width: 1920px;
      height: 1080px;
      --pad-top: 84px;
      --pad-bottom: 84px;
      --pad-left: 100px;
      --pad-right: 96px;
      --copy-gap: 0px;
      --support-gap: 26px;
      --h-max: 112;
    }

    .ad--reels {
      --pad-top: 250px;
      --pad-bottom: 500px;
      --pad-right: 150px;
      --h-max: 116;
      --copy-gap: 52px;
      --product-gap: 44px;
      --foot-gap: 44px;
    }

    /* Background: graphite with an optional hairline grid that fades out */
    .ad-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 2px, transparent 2px);
      background-size: 96px 96px;
      background-position: -1px -1px;
    }

    .ad-grid-fade {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(12, 14, 20, 0.1) 0%, rgba(12, 14, 20, 0.72) 36%, #0c0e14 60%);
    }

    .ad--landscape .ad-grid-fade { background: linear-gradient(90deg, rgba(12, 14, 20, 0.15) 0%, rgba(12, 14, 20, 0.7) 34%, #0c0e14 58%); }

    .ad-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    }

    /* Landscape: copy column on the left, product on the right */
    .ad--landscape .ad-inner {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "brand product" "copy product" "foot product";
      column-gap: 84px;
    }

    .ad--landscape .ad-brand { grid-area: brand; }
    .ad--landscape .ad-copy { grid-area: copy; align-self: center; margin: 40px 0; }
    .ad--landscape .ad-product { grid-area: product; margin: 0; }
    .ad--landscape .ad-foot { grid-area: foot; margin-top: 0 !important; }

    .ad-brand {
      flex: none;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .ad-wordmark {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: var(--ad-text);
    }

    .ad-wordmark .p { color: var(--ad-accent); }
    .ad-logo { width: 76px; height: 76px; border-radius: 18px; object-fit: cover; display: block; }

    .ad-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      padding: 0 26px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.14);
      border: 2px solid rgba(99, 102, 241, 0.5);
      color: #c9cbfd;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ad-badge-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ad-accent); flex: none; box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.22); }

    .ad-copy { flex: none; margin-top: var(--copy-gap); }
    .ad-copy:first-child { margin-top: 0; }

    .ad-eyebrow {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ad-accent-text);
      margin-bottom: 28px;
    }

    .ad-headline {
      font-size: 128px;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--ad-text);
      text-wrap: balance;
    }

    .ad-headline .hl { color: var(--ad-accent); }

    .ad-subtitle {
      margin-top: 26px;
      font-size: 50px;
      line-height: 1.18;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ad-accent-text);
      text-wrap: balance;
    }

    .ad-support {
      margin-top: var(--support-gap);
      max-width: 900px;
      font-size: 39px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ad-muted);
      text-wrap: pretty;
    }

    .ad-subtitle + .ad-support { margin-top: 22px; }

    .ad-product {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: var(--product-gap) 0 0;
    }

    .ad-product + .ad-foot { margin-top: var(--foot-gap); }
    .ad-copy + .ad-foot { margin-top: auto; }

    .ad-foot { flex: none; }

    .ad-cta { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }

    .ad-button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      height: 102px;
      padding: 0 46px;
      border-radius: 18px;
      background: var(--ad-accent);
      color: #ffffff;
      font-size: 37px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.16), 0 2px 4px rgba(10, 12, 40, 0.35);
    }

    .ad-button svg { width: 36px; height: 36px; flex: none; }

    .ad-url { font-size: 37px; font-weight: 600; letter-spacing: -0.01em; color: var(--ad-text); white-space: nowrap; }

    .ad-fine { margin-top: 26px; font-size: 26px; line-height: 1.4; font-weight: 400; color: var(--ad-muted); }
    .ad-datanote { margin-top: 18px; font-size: 22px; line-height: 1.35; font-weight: 400; color: var(--ad-dim); }
    .ad-fine + .ad-datanote { margin-top: 8px; }

    .ad.no-support .ad-support, .ad.auto-compact .ad-support { display: none; }

    .ad--feed .ad-wordmark, .ad--square .ad-wordmark { font-size: 50px; }
    .ad--feed .ad-logo, .ad--square .ad-logo { width: 66px; height: 66px; border-radius: 16px; }
    .ad--feed .ad-badge, .ad--square .ad-badge { height: 54px; font-size: 22px; padding: 0 22px; }
    .ad--feed .ad-subtitle { font-size: 42px; margin-top: 20px; }
    .ad--feed .ad-support { font-size: 33px; max-width: 880px; }
    .ad--feed .ad-button, .ad--square .ad-button { height: 86px; padding: 0 38px; font-size: 31px; border-radius: 16px; }
    .ad--feed .ad-button svg, .ad--square .ad-button svg { width: 30px; height: 30px; }
    .ad--feed .ad-url, .ad--square .ad-url { font-size: 31px; }
    .ad--feed .ad-fine, .ad--square .ad-fine { font-size: 23px; margin-top: 18px; }
    .ad--feed .ad-datanote, .ad--square .ad-datanote { font-size: 20px; margin-top: 14px; }

    .ad--square .ad-subtitle { font-size: 38px; margin-top: 16px; }
    .ad--square .ad-support { font-size: 30px; }
    .ad--square .ad-eyebrow, .ad--feed .ad-eyebrow { font-size: 26px; margin-bottom: 20px; }

    .ad--landscape .ad-wordmark { font-size: 54px; }
    .ad--landscape .ad-badge { height: 56px; font-size: 23px; padding: 0 24px; }
    .ad--landscape .ad-subtitle { font-size: 46px; }
    .ad--landscape .ad-support { font-size: 34px; max-width: none; }
    .ad--landscape .ad-button { height: 92px; padding: 0 42px; font-size: 34px; }
    .ad--landscape .ad-url { font-size: 34px; }
    .ad--landscape .ad-fine { font-size: 24px; margin-top: 20px; }
    .ad--landscape .ad-datanote { font-size: 21px; }

    /* Bleed: the product sits under the CTA and runs off the bottom and right edges */
    .ad.bleed .ad-inner { padding-bottom: 0; }
    .ad.bleed .ad-foot { order: 2; margin-top: var(--foot-gap) !important; }
    .ad.bleed .ad-product { order: 3; align-items: flex-start; justify-content: flex-start; margin-top: var(--product-gap); margin-right: calc(-1 * var(--pad-right)); }
    .ad--landscape.bleed .ad-inner { padding-bottom: var(--pad-bottom); }
    .ad--landscape.bleed .ad-product { margin: 0 calc(-1 * var(--pad-right)) calc(-1 * var(--pad-bottom)) 0; align-self: stretch; align-items: center; }

    .comp { position: relative; flex: none; }

    /* Uploaded screenshot in a clean frame */
    .shot-frame {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: var(--frame-ar, 0.8);
      overflow: hidden;
      border-radius: 28px;
      border: 2px solid #262a38;
      background: #171a24;
      box-shadow: 0 40px 90px rgba(2, 3, 7, 0.6);
    }

    .shot-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% var(--focus, 30%);
      transform: scale(var(--zoom, 1));
      transform-origin: 50% var(--focus, 30%);
    }

    .shot-empty {
      height: 100%;
      aspect-ratio: 0.8;
      max-width: 100%;
      border-radius: 28px;
      border: 3px dashed #353b4f;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      color: #6d7388;
      font-size: 32px;
      font-weight: 500;
    }

    /* Marketing label on a card's top edge. Sized in ad pixels, not --u, so it
       stays readable however small the product gets. Not part of the app UI. */
    .view-chip {
      position: absolute;
      top: -30px;
      left: calc(var(--u) * 16);
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 17px;
      border-radius: 999px;
      background: #1d2130;
      border: 2px solid rgba(99, 102, 241, 0.55);
      font-family: var(--ad-font);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e9ebf2;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(2, 3, 7, 0.5);
    }

    .view-chip::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #6366f1; flex: none; }
    .view-chip.muted { border-color: #353b4f; color: #979db1; background: #171a24; }
    .view-chip.muted::before { background: #6d7388; }
    .view-chip.right { left: auto; right: calc(var(--u) * 16); }

    /* ============================================================
       7. TRADEPRINT UI 2.0, REBUILT FOR ADS
       Values come from the UI 2.0 dashboard: same tokens, radii, font
       sizes and weights, multiplied by --u so a card keeps its real
       proportions at any scale. Class names mirror the dashboard
       (t-cell = .cal-cell, t-feed-item = .trade-feed-item, ...).
       ============================================================ */
    .tpui {
      --u: 2px;
      --nav: #0c0e14;
      --canvas: #10121a;
      --inset: #12141c;
      --surface: #171a24;
      --raised: #1d2130;
      --overlay: #1a1d29;
      --line: #262a38;
      --line-soft: #1f2330;
      --line-strong: #353b4f;
      --text: #e9ebf2;
      --text2: #979db1;
      --text3: #6d7388;
      --accent: #6366f1;
      --accent-text: #a3a6fb;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --accent-softer: rgba(99, 102, 241, 0.08);
      --accent-line: rgba(99, 102, 241, 0.5);
      --green: #22c55e;
      --red: #ef4444;
      --warn: #f59e0b;
      --pos-soft: rgba(34, 197, 94, 0.12);
      --pos-line: rgba(34, 197, 94, 0.36);
      --neg-soft: rgba(239, 68, 68, 0.12);
      --neg-line: rgba(239, 68, 68, 0.38);
      --warn-soft: rgba(245, 158, 11, 0.11);
      --warn-line: rgba(245, 158, 11, 0.4);
      --sh-pop: 0 calc(var(--u) * 18) calc(var(--u) * 44) rgba(2, 3, 7, 0.55), 0 calc(var(--u) * 2) calc(var(--u) * 8) rgba(2, 3, 7, 0.35);
      --sh-modal: 0 calc(var(--u) * 32) calc(var(--u) * 90) rgba(2, 3, 7, 0.68), 0 0 0 calc(var(--u) * 1) rgba(255, 255, 255, 0.03);
      --sheen: inset 0 calc(var(--u) * 1) 0 rgba(255, 255, 255, 0.14);
      font-family: var(--ad-font);
      font-size: calc(var(--u) * 14);
      color: var(--text);
      line-height: 1.5;
      text-align: left;
      letter-spacing: 0;
    }

    .tpui .g, .tpui .green { color: var(--green); }
    .tpui .r, .tpui .red { color: var(--red); }
    .tpui .a { color: var(--accent-text); }
    .tpui .m { color: var(--text2); }
    .tpui .w { color: var(--text); }
    .tpui .num, .tpui .t-num { font-family: var(--ad-num); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

    .t-ico { width: calc(var(--u) * 18); height: calc(var(--u) * 18); stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

    /* Buttons (.btn-primary / .btn-secondary) */
    .t-btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 8); min-height: calc(var(--u) * 36); padding: 0 calc(var(--u) * 14); border-radius: calc(var(--u) * 8); border: calc(var(--u) * 1) solid var(--accent); background: var(--accent); color: #fff; font-size: calc(var(--u) * 13.5); font-weight: 600; line-height: 1; white-space: nowrap; box-shadow: var(--sheen), 0 calc(var(--u) * 1) calc(var(--u) * 2) rgba(10, 12, 40, 0.35); }
    .t-btn .t-ico { width: calc(var(--u) * 15); height: calc(var(--u) * 15); stroke-width: 2.5; }
    .t-btn.sec { background: var(--raised); border-color: var(--line); color: var(--text); box-shadow: none; }
    .t-btn.sm { min-height: calc(var(--u) * 30); padding: 0 calc(var(--u) * 11); font-size: calc(var(--u) * 12.5); }
    .t-btn.xs { min-height: calc(var(--u) * 28); padding: 0 calc(var(--u) * 10); font-size: calc(var(--u) * 12); }

    /* Shell: app window, sidebar, page header */
    .t-window { display: flex; background: var(--canvas); border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 14); overflow: hidden; box-shadow: var(--sh-modal); }
    .t-window-main { flex: 1; min-width: 0; padding: calc(var(--u) * 22) calc(var(--u) * 24) calc(var(--u) * 24); }

    .t-side { width: calc(var(--u) * 196); flex: none; background: var(--nav); border-right: calc(var(--u) * 1) solid var(--line-soft); display: flex; flex-direction: column; padding: calc(var(--u) * 14) 0 calc(var(--u) * 12); }
    .t-side-head { display: flex; align-items: center; gap: calc(var(--u) * 8); padding: 0 calc(var(--u) * 12) 0 calc(var(--u) * 13); min-height: calc(var(--u) * 36); margin-bottom: calc(var(--u) * 12); }
    .t-side-head .t-ico { width: calc(var(--u) * 17); height: calc(var(--u) * 17); color: var(--text3); }
    .t-logo { font-size: calc(var(--u) * 19); font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; line-height: 1; }
    .t-logo .p { color: var(--accent); }
    .t-nav { display: flex; flex-direction: column; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 10); }
    .t-nav-item { position: relative; display: flex; align-items: center; gap: calc(var(--u) * 12); min-height: calc(var(--u) * 36); padding: 0 calc(var(--u) * 11); border-radius: calc(var(--u) * 8); font-size: calc(var(--u) * 14); font-weight: 500; color: var(--text2); white-space: nowrap; }
    .t-nav-item .t-ico { width: calc(var(--u) * 18); height: calc(var(--u) * 18); stroke-width: 1.75; }
    .t-nav-item.active { background: var(--raised); color: var(--text); }
    .t-nav-item.active .t-ico { color: var(--accent-text); }
    .t-nav-item.active::before { content: ''; position: absolute; left: calc(var(--u) * -10); top: calc(var(--u) * 8); bottom: calc(var(--u) * 8); width: calc(var(--u) * 3); border-radius: 0 calc(var(--u) * 3) calc(var(--u) * 3) 0; background: var(--accent); }
    .t-nav-item.feature { border: calc(var(--u) * 1) solid var(--line); background: var(--surface); color: var(--text); min-height: calc(var(--u) * 38); }
    .t-nav-item.feature .t-ico { color: var(--accent-text); }
    .t-side-bottom { display: flex; flex-direction: column; gap: calc(var(--u) * 4); padding: calc(var(--u) * 12) calc(var(--u) * 10) 0; margin-top: calc(var(--u) * 10); border-top: calc(var(--u) * 1) solid var(--line-soft); }
    .t-side.collapsed { width: calc(var(--u) * 62); }
    .t-side.collapsed .t-logo, .t-side.collapsed .t-nav-label { display: none; }
    .t-side.collapsed .t-nav-item { justify-content: center; padding: 0; }
    .t-side.collapsed .t-side-head { justify-content: center; padding: 0; }

    .t-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--u) * 18); margin-bottom: calc(var(--u) * 18); }
    .t-page-head h4 { font-size: calc(var(--u) * 23); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    .t-page-head p { font-size: calc(var(--u) * 13.5); color: var(--text2); margin-top: calc(var(--u) * 5); line-height: 1.45; }

    .t-mobilebar { display: flex; align-items: center; gap: calc(var(--u) * 8); height: calc(var(--u) * 56); padding: 0 calc(var(--u) * 10) 0 calc(var(--u) * 8); border-bottom: calc(var(--u) * 1) solid var(--line-soft); background: var(--nav); }
    .t-mobilebar .t-burger { width: calc(var(--u) * 40); height: calc(var(--u) * 40); display: grid; place-items: center; color: var(--text2); }
    .t-mobilebar .t-burger .t-ico { width: calc(var(--u) * 21); height: calc(var(--u) * 21); }
    .t-mobilebar .t-logo { font-size: calc(var(--u) * 18); }
    .t-phone { background: var(--canvas); border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 30); overflow: hidden; box-shadow: var(--sh-modal); }

    /* Panels (.dashboard-panel, .tradeprint-panel, .panel) */
    .t-panel { background: var(--surface); border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 18) calc(var(--u) * 20) calc(var(--u) * 20); min-width: 0; }
    .t-panel-head { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 12); margin: calc(var(--u) * -18) calc(var(--u) * -20) calc(var(--u) * 16); padding: calc(var(--u) * 13) calc(var(--u) * 20); border-bottom: calc(var(--u) * 1) solid var(--line-soft); min-height: calc(var(--u) * 50); }
    .t-panel-title { font-size: calc(var(--u) * 13.5); font-weight: 600; color: var(--text); letter-spacing: -0.005em; line-height: 1.3; }
    .t-panel-sub { font-size: calc(var(--u) * 12.5); color: var(--text2); line-height: 1.5; margin-top: calc(var(--u) * 2); }
    .t-panel-meta { font-size: calc(var(--u) * 12.5); color: var(--text3); white-space: nowrap; }
    .t-float { box-shadow: var(--sh-pop); }
    .t-float-strong { box-shadow: var(--sh-modal); border-color: var(--line-strong); }

    /* Metric strip (.stats-grid / .stat-card) */
    .t-stats { display: grid; background: var(--surface); border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 12); overflow: hidden; }
    .t-stat { padding: calc(var(--u) * 15) calc(var(--u) * 18) calc(var(--u) * 16); min-width: 0; box-shadow: calc(var(--u) * 1) 0 0 var(--line-soft), 0 calc(var(--u) * 1) 0 var(--line-soft); }
    .t-stat-label { font-size: calc(var(--u) * 12.5); font-weight: 500; color: var(--text2); margin-bottom: calc(var(--u) * 6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-stat-value { font-family: var(--ad-num); font-variant-numeric: tabular-nums; font-size: calc(var(--u) * 23); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; white-space: nowrap; }
    .t-stat.primary .t-stat-label { color: var(--text); }
    .t-stat.primary .t-stat-value { font-size: calc(var(--u) * 36); letter-spacing: -0.02em; }
    .t-stat-foot { font-size: calc(var(--u) * 12.5); color: var(--text2); margin-top: calc(var(--u) * 4); white-space: nowrap; }

    /* Dashboard hero: metric strip + equity curve (.dash-hero) */
    .t-hero { background: var(--surface); border: calc(var(--u) * 1) solid var(--line); border-radius: calc(var(--u) * 12); overflow: hidden; }
    .t-hero > .t-stats { border: none; border-radius: 0; background: transparent; border-bottom: calc(var(--u) * 1) solid var(--line-soft); grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); }
    .t-hero > .t-stats .t-stat { padding: calc(var(--u) * 20) calc(var(--u) * 24); box-shadow: calc(var(--u) * 1) 0 0 var(--line-soft); }

       ============================================================ */
    const FMT = {
      num(value, fallback = 0) {
        const n = parseFloat(String(value ?? '').replace(/[^0-9.\-]/g, ''));
        return Number.isFinite(n) ? n : fallback;
      },
      pnl(n) { n = Number(n) || 0; return n >= 0 ? `+$${n.toFixed(2)}` : `-$${Math.abs(n).toFixed(2)}`; },
      pnlShort(n) { n = Number(n) || 0; return n >= 0 ? `+$${Math.round(n)}` : `-$${Math.round(Math.abs(n))}`; },
      money(n, dec = 0) { return `$${Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })}`; },
      signed(n, dec = 2) { n = Number(n) || 0; return `${n < 0 ? '-' : '+'}${FMT.money(n, dec)}`; },
      tone(n) { n = Number(n) || 0; return n > 0 ? 'g' : n < 0 ? 'r' : ''; },
      result(n) { n = Number(n) || 0; return n > 0 ? 'win' : n < 0 ? 'loss' : 'breakeven'; },
      rr(v) { const s = String(v ?? '').trim(); if (!s) return ''; return /r$/i.test(s) ? s.replace(/r$/i, 'R') : `${s}R`; },

        const a = Math.abs(v);
        const sign = v < 0 ? '-' : '+';
        if (a >= 1e6) return `${sign}$${Number((a / 1e6).toFixed(a >= 1e7 ? 0 : 1))}m`;
        if (a >= 1e3) return `${sign}$${Number((a / 1e3).toFixed(a >= 1e4 ? 0 : 1))}k`;
