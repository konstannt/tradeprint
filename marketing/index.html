      const today = new Date();
      const monthKey = prevMonthKey();
      const mi = monthInfo(monthKey);
      const days = tradingDays(mi.y, mi.m);
      const pattern = [[412, 2, 2], [696, 2, 2], [-180, 1, 0], [525, 3, 2], [310, 2, 1], [0, 0, 0], [845, 2, 2], [-260, 2, 0], [390, 2, 1], [240, 1, 1], [615, 2, 2], [-150, 2, 1], [470, 2, 2], [780, 3, 3], [0, 0, 0], [205, 2, 1], [-320, 2, 0], [560, 2, 2], [330, 2, 1], [690, 2, 2], [145, 1, 1], [-210, 2, 0], [505, 2, 2]];
      const calLines = days.map((d, i) => {
        const p = pattern[i % pattern.length];
        return p[1] ? `${p[0]}, ${p[1]}, ${p[2]}` : '-';
      });

      // Most recent weekday before today, for the journal day
      const back = new Date(today);
      do { back.setDate(back.getDate() - 1); } while (back.getDay() === 0 || back.getDay() === 6);

      // ISO week number, for "Week 41 review"
      const t = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
      t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
      const week = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);

      // Last month of daily P&L for the PNL Trend chart, and its tick labels
      const bars = [196, 400, -470, 696, 900, 0, 225, -400, -400, 836, 270, 750, 412, 0, 525, 310, 845, -260, 390, 240, 615, 470];
      const start = new Date(today); start.setDate(start.getDate() - 29);

      // Recent weekdays, newest first
      const recent = [];
      const r = new Date(today);
      while (recent.length < 8) { if (r.getDay() > 0 && r.getDay() < 6) recent.push(new Date(r)); r.setDate(r.getDate() - 1); }

      // Equity curve date range (about 3 months of trading)
      const eqStart = new Date(today); eqStart.setDate(eqStart.getDate() - 96);
      while (eqStart.getDay() === 0 || eqStart.getDay() === 6) eqStart.setDate(eqStart.getDate() + 1);

      // Next Monday to Friday, for upcoming economic events
      const mon = new Date(today);
      mon.setDate(mon.getDate() + ((8 - mon.getDay()) % 7 || 7));
      const wd = n => { const d = new Date(mon); d.setDate(d.getDate() + n); return d; };
      const fri = wd(4);

      // Most recent first Friday (jobs report day)
      let ff = new Date(today.getFullYear(), today.getMonth(), 1);
      while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1);
      if (ff > today) { ff = new Date(today.getFullYear(), today.getMonth() - 1, 1); while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1); }
      const prevMonth = new Date(ff.getFullYear(), ff.getMonth() - 1, 1);

      return {
        monthKey, mi, calLines: calLines.join('\n'), bars: bars.join(', '),
        barStart: `${start.getMonth() + 1}/${start.getDate()}`, barEnd: `${today.getMonth() + 1}/${today.getDate()}`,
        barDate: d => { const x = new Date(start); x.setDate(x.getDate() + d); return `${x.getMonth() + 1}/${x.getDate()}`; },
        journalDate: longDate(back.getFullYear(), back.getMonth(), back.getDate()),
        week, recent: recent.map(md), recentFull: recent.map(mdy),
        eqFrom: mdy(eqStart), eqTo: mdy(recent[0]),
        todayLabel: mdy(today),
        econWeekTitle: `${mdy(mon)} to ${mdy(fri)}`,
        econDays: [0, 1, 2, 3, 4].map(n => { const d = wd(n); return `${WEEKDAYS[d.getDay()]}, ${md(d)}`; }),
        nfpTitle: `${WEEKDAYS[ff.getDay()]}, ${longDate(ff.getFullYear(), ff.getMonth(), ff.getDate())}`,
        nfpReleased: `${mdy(ff)} at 8:30 AM ET`,
        nfpPeriod: `${MONTHS[prevMonth.getMonth()]} ${prevMonth.getFullYear()}`,
        purchased: md(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 24))
      };
    })();

    // Parsers shared by the templates. Formats are documented in each field hint.
    function parseFeedTrades(text) {
      return rows(text).map((c, i) => ({
        strategy: c[0] || 'Strategy', asset: c[1] || '', pnl: FMT.num(c[2]), rr: c[3] || '', time: c[4] || '',
        note: c[5] || '', broke: /^(x|yes|no rules|broke)/i.test(c[6] || ''), conf: seeded(i, 3, 2)
      }));
    }

    function parseLogTrades(text) {
      return rows(text).map((c, i) => ({
        date: c[0] || '', strategy: c[1] || '', asset: c[2] || '', pnl: FMT.num(c[3]), rr: c[4] || '', time: c[5] || '',
        dir: c[6] || 'Long', account: c[7] || 'Main', broke: /^(x|yes|broke)/i.test(c[8] || ''), conf: seeded(i, 3, 2)
      }));
    }

    // Calendar days. Each line is one weekday of the month, in order: PNL, trades, wins
    // ("-" = no trades that day). A line can also start with the date: day, PNL, trades, wins.
    function parseCalDays(mi, text, notes, news) {
      const days = {};
      const weekdays = tradingDays(mi.y, mi.m);
      let next = 0;
      String(text || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
        if (/^([-–—]+|off)$/i.test(line)) { next++; return; }
        const c = line.split(/[,|]/).map(v => v.trim()).filter(v => v !== '');
        let d, vals;
        if (c.length >= 4) { d = Math.round(FMT.num(c[0])); vals = c.slice(1); next = weekdays.indexOf(d) + 1 || next; }
        else { d = weekdays[next++]; vals = c; }
        const trades = Math.max(0, Math.round(FMT.num(vals[1], 1)));
        if (!d || d > mi.days || !trades) return;
        days[d] = { pnl: FMT.num(vals[0]), trades, wins: clamp(Math.round(FMT.num(vals[2], 0)), 0, trades) };
      });
      list(notes).forEach(v => { const d = Math.round(FMT.num(v)); if (d) (days[d] ||= { trades: 0, pnl: 0, wins: 0 }).note = true; });
      list(news).forEach(v => { const d = Math.round(FMT.num(v)); if (d) { const o = (days[d] ||= { trades: 0, pnl: 0, wins: 0 }); o.news = (o.news || 0) + 1; } });
      return days;
    }

    function monthStats(days) {
      let pnl = 0, trades = 0, wins = 0;
      Object.values(days).forEach(d => { if (d.trades) { pnl += d.pnl; trades += d.trades; wins += d.wins; } });
      return { pnl, trades, wr: trades ? Math.round(wins / trades * 100) : 0 };
    }

    function calcResult(ticker, contracts, a, b, c, mode = 'price') {
      const spec = TICK_SPECS[ticker] || TICK_SPECS.MNQ;
      const n = Math.max(0, FMT.num(contracts));
      let slTicks, tpTicks;
      if (mode === 'points') { slTicks = Math.abs(FMT.num(a)) / spec.tickSize; tpTicks = Math.abs(FMT.num(b)) / spec.tickSize; }
      else { slTicks = Math.abs(FMT.num(a) - FMT.num(b)) / spec.tickSize; tpTicks = Math.abs(FMT.num(c) - FMT.num(a)) / spec.tickSize; }
      const risk = slTicks * spec.tickValue * n;
      const profit = tpTicks * spec.tickValue * n;
      return { risk, profit, rr: risk > 0 ? profit / risk : 0, slTicks, tpTicks, contracts: n, spec, ticker: TICK_SPECS[ticker] ? ticker : 'MNQ' };
    }

    // Running total trade by trade, resampled to `count` trades and scaled to end at `total`.
    function equityPoints(count, total) {
      const n = clamp(Math.round(count) || EQUITY_SHAPE.length, 2, 400);
      const base = [0];
      EQUITY_SHAPE.forEach(v => base.push(base[base.length - 1] + v));
      const out = [0];
      for (let i = 1; i <= n; i++) {
        const pos = i / n * (base.length - 1);
        const lo = Math.floor(pos), hi = Math.min(base.length - 1, lo + 1);
        out.push(base[lo] + (base[hi] - base[lo]) * (pos - lo));
      }
      const end = out[out.length - 1];
      const k = end ? total / end : 0;
      return out.map(v => v * k);
    }

    function equityStats(values) {
      let peak = 0, maxDd = 0;
      values.forEach(v => { if (v > peak) peak = v; if (peak - v > maxDd) maxDd = peak - v; });
      const last = values[values.length - 1] || 0;
      return { peak, maxDd, fromPeak: last - peak };
    }

    const EXAMPLE_NOTE = 'Example data for illustration.';
    const NO_SUPPORT_HINT = ' Supporting text is hidden here so the product gets more room.';

    /* ============================================================
       5. TRADEPRINT UI 2.0 LIBRARY
       Markup mirrors dashboard.html (UI 2.0). Keep it truthful: only
       show things the product really does. All sizes are dashboard
       pixels scaled by --u through the CSS in section 7.
       ============================================================ */
    let chartSeq = 0;

    function niceStep(raw) {
      if (!(raw > 0)) return 1;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    }

    const MENTOR_PERMISSIONS = [
      { key: 'canViewTrades', label: 'View Trades', hint: 'Your logged trades and their charts', on: true },
      { key: 'canViewJournals', label: 'View Journals', hint: 'Your calendar day notes', on: true },
      { key: 'canComment', label: 'Leave Feedback', hint: 'Comment on your trades and days', on: true },
      { key: 'canViewPnL', label: 'See PnL', hint: 'Dollar P&L on your trades', on: false },
      { key: 'canViewAccountNames', label: 'See Account Names', hint: 'Your broker account names', on: false }
    ];

    const TP = {
      wordmark() { return 'trade<span class="p">print</span>'; },

      btn(label, { icon = '', cls = '' } = {}) {
        return `<span class="t-btn ${cls}">${icon ? ico(icon) : ''}${esc(label)}</span>`;
      },

      panel(inner, { title = '', sub = '', right = '', cls = '', style = '' } = {}) {
        const head = title
          ? `<div class="t-panel-head"><div style="min-width:0"><div class="t-panel-title">${esc(title)}</div>${sub ? `<div class="t-panel-sub">${esc(sub)}</div>` : ''}</div>${right}</div>`
          : '';
        return `<div class="t-panel ${cls}"${style ? ` style="${style}"` : ''}>${head}${inner}</div>`;
      },

      stat(label, value, { tone = '', primary = false, foot = '' } = {}) {
        return `<div class="t-stat${primary ? ' primary' : ''}"><div class="t-stat-label">${esc(label)}</div><div class="t-stat-value ${tone}">${value}</div>${foot ? `<div class="t-stat-foot">${esc(foot)}</div>` : ''}</div>`;
      },

      stats(items, { cols = items.length, cls = '', style = '' } = {}) {
        return `<div class="t-stats ${cls}" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr));${style}">${items.join('')}</div>`;
      },

      // Equity chart, same drawing rules as the dashboard's drawLineChart().
      // values[0] is the 0 baseline; values[i] is the running total after point i.
      equity(values, { w = 560, h = 210, padL = 52, xLabels = [], dot = null } = {}) {
        if (!values || values.length < 2) values = [0, 0];
        const id = `tpeq${++chartSeq}`;
        const padR = 8, padT = 8, padB = xLabels.length ? 22 : 6;
        const pw = Math.max(10, w - padL - padR), ph = Math.max(10, h - padT - padB);
        let min = 0, max = 0;
        values.forEach(v => { if (v < min) min = v; if (v > max) max = v; });
        if (max === min) { max += 1; min -= 1; }
        const step = niceStep((max - min) / 4);
        const lo = Math.floor(min / step) * step;
        const hi = Math.ceil(max / step) * step;
        const n = values.length - 1;
        const x = i => padL + (i / n) * pw;
        const y = v => padT + ((hi - v) / (hi - lo)) * ph;
        const y0 = y(0);
        let grid = '', labels = '';
        for (let v = lo; v <= hi + step / 2; v += step) {
          const yy = Math.round(y(v)) + 0.5;
          if (Math.abs(v) > step / 1000) grid += `<line x1="${padL}" x2="${w - padR}" y1="${yy}" y2="${yy}"/>`;
          labels += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" class="eq-axis">${esc(FMT.axis(Math.abs(v) < step / 1000 ? 0 : v))}</text>`;
        }
        let line = '';
        for (let i = 0; i <= n; i++) line += `${i ? 'L' : 'M'}${x(i).toFixed(2)} ${y(values[i]).toFixed(2)}`;
        const area = `${line}L${x(n).toFixed(2)} ${y0.toFixed(2)}L${x(0).toFixed(2)} ${y0.toFixed(2)}Z`;
        const xl = xLabels.map(l => `<text x="${x(l.i).toFixed(2)}" y="${h - 4}" text-anchor="${l.anchor || 'middle'}" class="eq-axis">${esc(l.text)}</text>`).join('');
        const dotHtml = dot !== null && dot >= 0 && dot <= n
          ? `<line x1="${x(dot).toFixed(2)}" x2="${x(dot).toFixed(2)}" y1="${padT}" y2="${padT + ph}" class="eq-cursor"/><circle cx="${x(dot).toFixed(2)}" cy="${y(values[dot]).toFixed(2)}" r="4" class="eq-dot"/>`
          : '';
        return `<div class="t-chart"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
          <defs><clipPath id="${id}p"><rect x="0" y="0" width="${w}" height="${Math.max(0, y0).toFixed(2)}"/></clipPath><clipPath id="${id}n"><rect x="0" y="${y0.toFixed(2)}" width="${w}" height="${Math.max(0, h - y0).toFixed(2)}"/></clipPath></defs>
          <g class="eq-grid">${grid}</g>${labels}
          <path d="${area}" class="eq-area-pos" clip-path="url(#${id}p)"/><path d="${area}" class="eq-area-neg" clip-path="url(#${id}n)"/>
          <line x1="${padL}" x2="${w - padR}" y1="${Math.round(y0) + 0.5}" y2="${Math.round(y0) + 0.5}" class="eq-zero"/>
          <path d="${line}" class="eq-line"/>${xl}${dotHtml}
        </svg></div>`;
      },

      // Dashboard hero: metric strip (Total PNL leads) + equity curve
      dashHero({ pnl, trades, wr, rr, count, from = SAMPLE.eqFrom, to = SAMPLE.eqTo, mobile = false, compact = false, stack = false, duo = false, chartW = 560, chartH = 210, minis = true, readout = true, cls = '' }) {
        const values = equityPoints(count || trades, pnl);
        const st = equityStats(values);
        const n = values.length - 1;
        const strip = duo
          ? `<div class="t-stats">${TP.stat('Total PNL', FMT.pnl(pnl), { tone: FMT.tone(pnl), primary: true })}${TP.stat('Win Rate', `${esc(wr)}%`)}</div>`
          : `<div class="t-stats">
          ${TP.stat('Total PNL', FMT.pnl(pnl), { tone: FMT.tone(pnl), primary: true })}
          ${TP.stat('Total Trades', esc(trades))}
          ${TP.stat('Win Rate', `${esc(wr)}%`)}
          ${TP.stat('Avg R:R', esc(rr))}
        </div>`;
        const miniHtml = minis ? `<div class="t-minis">
            <div class="t-mini"><span>Peak</span><b class="${FMT.tone(st.peak)}">${FMT.pnl(st.peak)}</b></div>
            <div class="t-mini"><span>Max drawdown</span><b class="${st.maxDd > 0.004 ? 'r' : ''}">${st.maxDd > 0.004 ? FMT.pnl(-st.maxDd) : '$0.00'}</b></div>
            <div class="t-mini"><span>From peak</span><b class="${Math.abs(st.fromPeak) < 0.005 ? '' : 'r'}">${Math.abs(st.fromPeak) < 0.005 ? 'At peak' : FMT.pnl(st.fromPeak)}</b></div>
          </div>` : '';
        return `<div class="t-hero${mobile ? ' mobile' : ''}${compact ? ' compact' : ''}${stack ? ' stack' : ''}${duo ? ' duo' : ''} ${cls}">
          ${strip}
          <div class="t-equity">
            <div class="t-equity-head">
              <div style="min-width:0"><div class="t-panel-title">Equity curve</div>${readout ? `<div class="t-equity-readout">${n} trade${n === 1 ? '' : 's'} from ${esc(from)} to ${esc(to)}</div>` : ''}</div>
              ${miniHtml}
            </div>
            ${TP.equity(values, { w: chartW, h: chartH, padL: mobile ? 46 : 52, xLabels: [{ i: 0, text: from, anchor: 'start' }, { i: n, text: to, anchor: 'end' }] })}
          </div>
        </div>`;
      },

      // PNL Trend panel (.dash-trend)
      pnlTrend({ label = 'Last month', values = [], select = 'Last month', startLabel = SAMPLE.barStart, endLabel = SAMPLE.barEnd, barsH = 190, cls = '' } = {}) {
        const total = Math.round(values.reduce((a, b) => a + b, 0) * 100) / 100;
        const maxAbs = Math.max(1, ...values.map(v => Math.abs(v)));
        const every = Math.max(1, Math.ceil(values.length / 6));
        const scale = (barsH - 32) / 2 - 1;
        const bars = values.map((v, i) => {
          const hgt = v === 0 ? 3 : Math.max(8, Math.round(Math.abs(v) / maxAbs * scale));
          const c = v > 0 ? 'g' : v < 0 ? 'r' : 'f';
          return `<div class="t-bar-wrap"><div class="t-bar ${c}" style="${v === 0 ? '' : `height:${U(hgt)}`}"></div>${i % every === 0 ? `<div class="t-bar-day">${esc(SAMPLE.barDate(Math.round(i * 29 / Math.max(1, values.length - 1))))}</div>` : ''}</div>`;
        }).join('');
        return TP.panel(`
          <div class="t-chart-sum"><div class="t-chart-date">${esc(label)}</div><div class="t-chart-pnl ${FMT.tone(total)}">${FMT.pnl(total)}</div></div>
          <div class="t-bars" style="--bars-h:${U(barsH)}">${bars}</div>
          <div class="t-bar-labels"><span>${esc(startLabel)}</span><span>${esc(endLabel)}</span></div>`,
          { title: 'PNL Trend', right: `<div class="t-select">${esc(select)}</div>`, cls });
      },

      focus(items) {
        return TP.panel(items.map(it => `<div class="t-focus-item"><div class="t-focus-label">${esc(it.label)}</div><div class="t-focus-value ${FMT.tone(it.pnl)}">${it.trades ? FMT.pnl(it.pnl) : '—'}</div><div class="t-focus-sub">${it.trades ? `${it.trades} trade${it.trades === 1 ? '' : 's'} · ${it.wr}% WR` : esc(it.empty || 'No trades')}</div></div>`).join(''), { title: 'Current Focus' });
      },

      ruleDiscipline(rate, trades, { cls = '' } = {}) {
        const followed = Math.round(rate / 100 * trades);
        return TP.panel(`
          <div class="t-rule-value">${Math.round(rate)}%</div>
          <div class="t-meter"><i style="width:${rate}%"></i></div>
          <div class="t-sub">${followed} of ${trades} trades followed rules</div>`, { title: 'Rule Discipline', cls });
      },

      listItem(title, sub, value, tone) {
        return `<div class="t-list-item"><div class="t-list-main"><div class="t-list-title">${title}</div><div class="t-list-sub">${esc(sub)}</div></div><div class="t-list-value ${tone}">${value}</div></div>`;
      },

      // Sidebar navigation, exactly as UI 2.0 lists it
      sidebar({ active = 'dashboard', collapsed = false, bottom = true, settings = true } = {}) {
        const main = [['dashboard', 'Dashboard'], ['tradeprint', 'Tradeprint'], ['strategies', 'Strategies'], ['calendar', 'Calendar'], ['trades', 'Trades'], ['notes', 'Notes'], ['calculator', 'Calculator'], ['mentorship', 'Mentorship']];
        const item = (k, l, cls = '') => `<div class="t-nav-item ${cls}${k === active ? ' active' : ''}">${ico(k)}<span class="t-nav-label">${l}</span></div>`;
        return `<div class="t-side${collapsed ? ' collapsed' : ''}">
          <div class="t-side-head">${ico('menu')}<span class="t-logo">${TP.wordmark()}</span></div>
          <div class="t-nav">${main.map(([k, l]) => item(k, l)).join('')}</div>
          ${bottom ? `<div class="t-side-bottom">${item('prop', 'Prop Firm Center', 'feature')}${item('prints', 'Prints', 'feature')}${settings ? item('settings', 'Settings') : ''}</div>` : ''}
        </div>`;
      },

      window(side, main, { cls = '', style = '', mainStyle = '' } = {}) {
        return `<div class="t-window ${cls}"${style ? ` style="${style}"` : ''}>${side}<div class="t-window-main"${mainStyle ? ` style="${mainStyle}"` : ''}>${main}</div></div>`;
      },

      pageHead(title, sub, actions = '') {
        return `<div class="t-page-head"><div style="min-width:0"><h4>${esc(title)}</h4>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${actions}</div>`;
      },

      mobileBar() { return `<div class="t-mobilebar"><span class="t-burger">${ico('menu')}</span><span class="t-logo">${TP.wordmark()}</span></div>`; },

      // Calendar header bar (.cal-header)
      calHead(mi, stats, { nav = true, statsOn = true } = {}) {
        return `<div class="t-calhead">
          <div class="t-calnav">${nav ? `<span class="t-calbtn">${ico('left')}</span>` : ''}<span class="t-calmonth">${esc(mi.label)}</span>${nav ? `<span class="t-calbtn">${ico('right')}</span><span class="t-today">Today</span>` : ''}</div>
          ${statsOn ? `<div class="t-calstats">
            <div class="t-calstat"><div class="t-calstat-label">Monthly PNL</div><div class="t-calstat-value ${FMT.tone(stats.pnl)}">${FMT.pnl(stats.pnl)}</div></div>
            <div class="t-calstat"><div class="t-calstat-label">Trades</div><div class="t-calstat-value">${stats.trades}</div></div>
            <div class="t-calstat"><div class="t-calstat-label">Win Rate</div><div class="t-calstat-value">${stats.wr}%</div></div>
          </div>` : ''}
        </div>`;
      },

      // Calendar board. days: { [day]: { pnl, trades, wins, note, news } }. Heat tint from the month's largest day.
      calendar(mi, days, { from = 0, weeks = 6, weekCol = true, weekdaysOnly = false, sel = 0, today = 0, wk = 0, row = 0, newsOnly = false } = {}) {
        const start = new Date(mi.y, mi.m, 1 - mi.first);
        const totalWeeks = Math.ceil((mi.first + mi.days) / 7);
        let maxAbs = 0;
        Object.values(days).forEach(d => { if (d.trades && Math.abs(d.pnl) > maxAbs) maxAbs = Math.abs(d.pnl); });
        const weekRows = [];
        for (let w = 0; w < totalWeeks; w++) {
          const rowCells = [];
          let wPnl = 0, wTrades = 0, wWins = 0;
          for (let i = 0; i < 7; i++) {
            const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i);
            const inMonth = date.getMonth() === mi.m;
            const d = date.getDate();
            const data = inMonth ? days[d] : null;
            if (data && data.trades) { wPnl += data.pnl; wTrades += data.trades; wWins += data.wins; }
            if (weekdaysOnly && (i === 0 || i === 6)) continue;
            const has = data && data.trades;
            const heat = has && maxAbs ? (Math.abs(data.pnl) / maxAbs).toFixed(3) : 0;
            const cls = ['t-cell', inMonth ? '' : 'other', has && data.pnl > 0 ? 'pos' : '', has && data.pnl < 0 ? 'neg' : '', inMonth && d === today ? 'today' : '', inMonth && d === sel ? 'sel' : ''].filter(Boolean).join(' ');
            let inner = `<span class="t-cday-num">${d}</span>`;
            if (has) {
              const wr = Math.round(data.wins / data.trades * 100);
              inner += `<div class="t-cday-pnl ${FMT.tone(data.pnl)}">${FMT.pnlShort(data.pnl)}</div><div class="t-cday-meta">${data.trades} trade${data.trades === 1 ? '' : 's'}</div><div class="t-cday-meta">${wr}% WR</div>`;
            }
            if (data && data.note) inner += '<span class="t-cnote"></span>';
            if (data && data.news) inner += `<span class="t-cnews">${ico('news')}<span>${data.news}</span></span>`;
            rowCells.push(`<div class="${cls}" style="--heat:${heat}">${inner}</div>`);
          }
          if (weekCol) {
            rowCells.push(wTrades
              ? `<div class="t-week"><div class="t-week-pnl ${FMT.tone(wPnl)}">${FMT.pnlShort(wPnl)}</div><div class="t-week-meta"><span>${wTrades} trade${wTrades === 1 ? '' : 's'}</span><span>${Math.round(wWins / wTrades * 100)}% WR</span></div></div>`
              : '<div class="t-week empty"></div>');
          }
          weekRows.push(rowCells.join(''));
        }
        const heads = (weekdaysOnly ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'])
          .map(h => `<div>${h}</div>`).join('') + (weekCol ? '<div class="wk">Week</div>' : '');
        const style = [wk ? `--wk:${U(wk)}` : '', row ? `--row:${U(row)}` : ''].filter(Boolean).join(';');
        return `<div class="t-cal${weekCol ? '' : ' no-week'}${weekdaysOnly ? ' weekdays' : ''}" style="${style}">
          <div class="t-cal-heads">${heads}</div>
          <div class="t-cal-grid">${weekRows.slice(from, from + weeks).join('')}</div>
        </div>`;
      },

      // Day / week modal pieces
      modalHead(title, { news = '', share = true } = {}) {
        return `<div class="t-modal-head"><div class="t-modal-date">${esc(title)}</div><div class="t-modal-acts">${news}${share ? `<span class="t-iconbtn">${ico('share')}</span>` : ''}<span class="t-close">×</span></div></div>`;
      },

      dayStats(trades) {
        const pnl = trades.reduce((a, t) => a + t.pnl, 0);
        const wins = trades.filter(t => t.pnl > 0).length;
        const losses = trades.filter(t => t.pnl < 0).length;
        const wr = trades.length ? Math.round(wins / trades.length * 100) : 0;
        const stat = (l, v, c = '') => `<div class="t-mstat"><div class="t-mstat-label">${l}</div><div class="t-mstat-val ${c}">${v}</div></div>`;
        return `<div class="t-mstats" style="--n:5">${stat('Trades', trades.length)}${stat('PNL', FMT.pnl(pnl), FMT.tone(pnl))}${stat('Win Rate', `${wr}%`)}${stat('Wins', wins, 'g')}${stat('Losses', losses, 'r')}</div>`;
      },

      // .trade-feed-item. t = { strategy, asset, pnl, rr, time, note, broke, conf }
      feedItem(t, { actions = true, note = true, flag = false } = {}) {
        const result = FMT.result(t.pnl);
        const resColor = result === 'win' ? 'g' : result === 'loss' ? 'r' : 'm';
        const label = result.charAt(0).toUpperCase() + result.slice(1);
        const detail = [t.conf ? `${t.conf} confluences` : 'No confluences', t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).map(esc).join(' · ');
        return `<div class="t-feed-item ${result}">
          <div class="t-feed-left">
            <div class="t-feed-strat">${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — <span class="${resColor}">${label}</span></div>
            <div class="t-feed-detail">${detail}${t.broke ? ' · <span class="r">Rules broken</span>' : ''}${flag ? ' <span class="t-flag">⚠</span>' : ''}</div>
            ${note && t.note ? `<div class="t-feed-note">"${esc(t.note)}"</div>` : ''}
          </div>
          <div class="t-feed-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>
          ${actions ? `<div class="t-feed-acts"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div>` : ''}
        </div>`;
      },

      ruleBanner(items) {
        return `<div class="t-rbanner"><div class="t-rbanner-title"><span>⚠ ${items.length} rule violation${items.length === 1 ? '' : 's'}</span><span>View breakdown ›</span></div>${items.map(i => `<div class="t-rbanner-item">${esc(i)}</div>`).join('')}</div>`;
      },

      econStrip(events) {
        return `<div class="t-estrip">${ico('news')}<span><b>News</b><span class="sep">·</span>${events.length} event${events.length === 1 ? '' : 's'}</span>${events.length <= 3 ? `<span class="t-estrip-events">${events.map(e => `<em>${esc(e[0])}</em>${esc(e[1])}`).join('<span class="sep">·</span>')}</span>` : ''}<span class="chev">›</span></div>`;
      },

      noteTools({ saved = true } = {}) {
        return `<div class="t-ntools"><span class="t-tool"><b>B</b></span><span class="t-tool"><i>I</i></span><span class="t-tool"><u>U</u></span><span class="t-tool-div"></span><span class="t-tool">${ico('divider')}<small>Divider</small></span><span class="t-tool">${ico('image')}<small>Image</small></span>${saved ? '<span class="t-saved">Saved</span>' : ''}</div>`;
      },

      noteHtml(text) {
        return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          if (l === '---') return '<hr>';
          const m = /^([^:]{2,24}):\s(.+)$/.exec(l);
          return m ? `<p><b>${esc(m[1])}:</b> ${esc(m[2])}</p>` : `<p>${esc(l)}</p>`;
        }).join('');
      },

      logBtn() { return `<div class="t-logbtn">${ico('plus')}Log a trade</div>`; },

      // Notes page "Insert Trade" card (.note-trade-card)
      noteTradeCard(t, date) {
        const result = FMT.result(t.pnl);
        const detail = [date, t.conf ? `${t.conf} confluences` : 'No confluences', t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).join(' · ');
        return `<div class="t-ntc"><div class="t-ntc-title"><span>${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — ${result === 'breakeven' ? 'be' : result}</span><b class="${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</b></div><div class="t-ntc-detail">${esc(detail)}</div></div>`;
      },

      // Trades page
      toolbar(count) {
        return `<div class="t-toolbar"><div class="t-filters">
          <div class="t-search">${ico('search')}Search trades...</div>
          <div class="t-fsel">All Strategies</div><div class="t-fsel">All Results</div><div class="t-fsel">All Trade Types</div>
          <div class="t-fsel">All Directions</div><div class="t-fsel">Newest First</div>
          <span class="t-btn sec">Clear</span>
          <span class="t-tmeta"><b>${count}</b> trades</span>
        </div></div>`;
      },

      // .trades-table. cols: subset of the app's columns, in the app's order
      tradesTable(trades, cols) {
        const dash = '<span style="color:var(--text3)">—</span>';
        const defs = {
          date: ['Date', 96, t => `<div class="t-tc muted date">${esc(t.date)}</div>`],
          strategy: ['Strategy', 135, t => `<div class="t-tc strong">${esc(t.strategy)}</div>`],
          account: ['Account', 105, t => `<div class="t-tc muted">${esc(t.account || 'Main')}</div>`],
          result: ['Result', 66, t => { const r = FMT.result(t.pnl); return `<div class="t-tc"><span class="t-badge ${r}">${r === 'breakeven' ? 'be' : r}</span></div>`; }],
          pnl: ['PNL', 92, t => `<div class="t-tc pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>`],
          rr: ['R:R', 58, t => `<div class="t-tc muted">${t.rr ? esc(FMT.rr(t.rr)) : dash}</div>`],
          type: ['Type', 86, () => '<div class="t-tc muted">Futures</div>'],
          direction: ['Direction', 78, t => `<div class="t-tc muted">${esc(t.dir || 'Long')}</div>`],
          time: ['Time', 82, t => `<div class="t-tc muted">${t.time ? esc(t.time) : dash}</div>`],
          asset: ['Asset', 72, t => `<div class="t-tc muted">${esc(t.asset)}</div>`],
          confluences: ['Confluences', 112, t => `<div class="t-tc muted">${t.conf ? `${t.conf} confluences` : dash}</div>`],
          rules: ['Rules', 52, t => `<div class="t-tc center">${t.broke ? `<span class="t-ricon no">${ico('x')}</span>` : `<span class="t-ricon yes">${ico('check')}</span>`}</div>`],
          notes: ['Notes', 120, t => `<div class="t-tc muted">${t.note ? esc(t.note) : dash}</div>`],
          actions: ['', 100, () => `<div class="t-tc"><div class="t-feed-acts" style="justify-content:flex-end"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div></div>`]
        };
        const use = cols.map(c => defs[c]).filter(Boolean);
        const tpl = use.map(d => U(d[1])).join(' ');
        return `<div class="t-table" style="--cols:${tpl}">
          <div class="t-tr head">${use.map(d => `<div class="t-tc"${d[0] === 'Rules' ? ' style="text-align:center"' : ''}>${d[0]}</div>`).join('')}</div>
          ${trades.map(t => `<div class="t-tr">${use.map(d => d[2](t)).join('')}</div>`).join('')}
        </div>`;
      },

      mobileTradeCard(t) {
        const r = FMT.result(t.pnl);
        return `<div class="t-mcard">
          <div class="t-mcard-main">
            <div class="t-mcard-top"><div class="t-mcard-strat">${esc(t.strategy)}</div><div class="t-mcard-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div></div>
            <div class="t-mcard-sub">${esc([t.date, t.asset].filter(Boolean).join(' · '))}</div>
            <div class="t-chips"><span class="t-chip ${r}">${r === 'breakeven' ? 'be' : r}</span><span class="t-chip">Futures</span><span class="t-chip">${esc(t.dir || 'Long')}</span></div>
          </div>
          <div class="t-mcard-acts"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div>
        </div>`;
      },

      // Tradeprint page
      ring(score) {
        const r = 41.5, c = 2 * Math.PI * r, p = clamp(score, 0, 100) / 100;
        return `<div class="t-ring"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#12141c" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="#6366f1" stroke-width="9" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 46 46)"/></svg><b>${Math.round(score)}%</b></div>`;
      },

      tpHero({ title, copy = '', score, sub = 'Strong trade detail.', cls = '', heroStyle = '' }) {
        return `<div class="t-tphero ${cls}"${heroStyle ? ` style="${heroStyle}"` : ''}>
          <div class="t-tpmain"><div class="t-kicker">Your Tradeprint</div><h4>${esc(title)}</h4>${copy ? `<p>${esc(copy)}</p>` : ''}</div>
          ${TP.scoreCard(score, sub)}
        </div>`;
      },

      scoreCard(score, sub = 'Strong trade detail.') {
        return `<div class="t-score">${TP.ring(score)}<div class="t-score-label">Clarity Score</div><div class="t-score-sub">${esc(sub)}</div></div>`;
      },

      rankItem(i, name, meta, pnl) {
        return `<div class="t-rank"><div class="t-rank-num">${i}</div><div style="min-width:0"><div class="t-rank-title">${esc(name)}</div><div class="t-rank-meta">${esc(meta)}</div></div><div class="t-rank-value ${FMT.tone(pnl)}">${FMT.pnl(pnl)}</div></div>`;
      },

      split(title, best, worst) {
        const side = (label, d) => `<div style="min-width:0"><div class="t-split-label">${label}</div><div class="t-simple-main ${FMT.tone(d.pnl)}">${esc(d.name)}</div><div class="t-simple-meta">${esc(d.meta)}</div></div>`;
        return TP.panel(`<div class="t-split">${side('Best', best)}${side('Worst', worst)}</div>`, { title });
      },

      // Calculator cards (.calc-card)
      calcCard({ kind = 'pnl', ticker, contracts, inputs, res, focusLast = true, foot = true, breakdown = true, cls = '' }) {
        const spec = TICK_SPECS[ticker] || TICK_SPECS.MNQ;
        const pointValue = spec.tickValue / spec.tickSize;
        const title = kind === 'pnl'
          ? ['dollar', 'Futures P&L Calculator', 'Risk and reward from your entry, stop and target prices']
          : ['points', 'Futures Points Calculator', 'Risk and reward from stop and target distances in points'];
        const field = (label, value, focus = false, sel = false) => `<div class="t-cfield"><span class="t-label">${esc(label)}</span><div class="t-input${sel ? ' sel' : ''}${focus ? ' focus' : ''}">${esc(value)}</div></div>`;
        const last = inputs.length - 1;
        const total = res.risk + res.profit;
        const riskShare = total > 0 ? (res.risk / total * 100).toFixed(2) : 50;
        let direction = '';
        if (kind === 'pnl') {
          const e = FMT.num(inputs[0][1]), s = FMT.num(inputs[1][1]), t = FMT.num(inputs[2][1]);
          if (t > e && s < e) direction = 'Long'; else if (t < e && s > e) direction = 'Short';
        }
        const fmtN = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
        const brk = [
          direction ? `<div class="t-cbrow ${direction === 'Long' ? 'long' : 'short'}"><span>Direction</span><b>${direction}</b></div>` : '',
          `<div class="t-cbrow"><span>Stop distance</span><b>${fmtN(res.slTicks * spec.tickSize)} pts · ${fmtN(res.slTicks)} ticks</b></div>`,
          `<div class="t-cbrow"><span>Target distance</span><b>${fmtN(res.tpTicks * spec.tickSize)} pts · ${fmtN(res.tpTicks)} ticks</b></div>`,
          res.contracts > 0 ? `<div class="t-cbrow"><span>Per contract</span><b>-$${(res.risk / res.contracts).toFixed(2)} / +$${(res.profit / res.contracts).toFixed(2)}</b></div>` : '',
          `<div class="t-cbrow"><span>Win rate to break even</span><b>${res.rr > 0 ? `${(100 / (1 + res.rr)).toFixed(1)}%` : '—'}</b></div>`
        ].join('');
        return `<div class="t-calc ${cls}">
          <div class="t-calc-title"><span class="t-icontile">${ico(title[0])}</span><span class="t-title-text">${title[1]}<small>${title[2]}</small></span></div>
          <div class="t-calc-body">
            <div class="t-cgrid c2">${field('Ticker', ticker, false, true)}${field('Contracts', contracts)}</div>
            <div class="t-cspec"><span class="tk">${esc(ticker)}</span><span>Tick <b>${spec.tickSize}</b> = <b>$${spec.tickValue.toFixed(2)}</b></span><span>1 point = <b>$${pointValue.toFixed(2)}</b> per contract</span></div>
            <div class="t-cgrid ${inputs.length === 3 ? 'c3' : 'c2'}">${inputs.map((f, i) => field(f[0], f[1], focusLast && i === last)).join('')}</div>
          </div>
          <div class="t-cout">
            <div class="t-cres">
              <div><div class="t-cres-label">Dollar Risk</div><div class="t-cres-value r">-$${res.risk.toFixed(2)}</div></div>
              <div><div class="t-cres-label">Dollar Profit</div><div class="t-cres-value g">+$${res.profit.toFixed(2)}</div></div>
              <div><div class="t-cres-label">R:R Ratio</div><div class="t-cres-value a">${res.rr.toFixed(2)}R</div></div>
            </div>
            <div class="t-rrbar" style="--risk:${riskShare}%"><i class="risk"></i><i class="reward"></i></div>
            ${breakdown ? `<div class="t-cbreak">${brk}<div class="t-chint">Break-even win rate is 1 / (1 + R:R), before fees and commissions.</div></div>` : ''}
          </div>
          ${foot ? `<div class="t-cfoot"><span class="t-cfoot-note">Clear resets contracts and ${kind === 'pnl' ? 'prices' : 'points'}. The ticker stays selected.</span><span class="t-btn sec" style="min-height:${U(34)}">Clear</span></div>` : ''}
        </div>`;
      },

      calcResults(res, { cls = '' } = {}) {
        return `<div class="t-calc ${cls}" style="padding-bottom:${U(20)}">
          <div class="t-calc-title"><span class="t-icontile">${ico('dollar')}</span><span class="t-title-text">Results<small>${esc(res.ticker)} · ${res.contracts} contract${res.contracts === 1 ? '' : 's'}</small></span></div>
          <div class="t-cres c2" style="margin-bottom:${U(12)}">
            <div><div class="t-cres-label">Dollar Risk</div><div class="t-cres-value r" style="font-size:${U(30)}">-$${res.risk.toFixed(2)}</div></div>
            <div><div class="t-cres-label">Dollar Profit</div><div class="t-cres-value g" style="font-size:${U(30)}">+$${res.profit.toFixed(2)}</div></div>
            <div style="grid-column:1 / -1"><div class="t-cres-label">R:R Ratio</div><div class="t-cres-value a" style="font-size:${U(30)}">${res.rr.toFixed(2)}R</div></div>
          </div>
          <div class="t-rrbar" style="--risk:${(res.risk + res.profit) > 0 ? (res.risk / (res.risk + res.profit) * 100).toFixed(2) : 50}%"><i class="risk"></i><i class="reward"></i></div>
        </div>`;
      },

      // Prints
      printCard(p, { expanded = false, follow = 'Follow' } = {}) {
        const pnl = FMT.num(p.pnl);
        const tone = pnl > 0 ? 'green' : pnl < 0 ? 'red' : '';
        const pnlText = p.hidden ? (pnl < 0 ? '-$*****' : pnl > 0 ? '+$*****' : '$*****') : FMT.pnl(pnl);
        const meta = `${p.time || 'No time'} · ${p.rr ? FMT.rr(p.rr) : 'No R:R'}`;
        return `<div class="t-print">
          <div class="t-print-head">
            <div class="t-puser"><div class="t-avatar">${esc((p.user || 'T')[0].toUpperCase())}</div><div style="min-width:0"><div class="t-pname">${esc(p.user)}${p.you ? '<span class="t-you">You</span>' : ''}</div><div class="t-pbio">${esc(p.bio || 'No bio yet.')}</div></div></div>
            <div class="t-pacts"><span class="t-pdate">${esc(p.date)}</span>${follow ? `<span class="t-pbtn${follow === 'Following' ? ' on' : ''}">${esc(follow)}</span>` : ''}</div>
          </div>
          <div class="t-print-top">
            <div style="min-width:0"><div class="t-print-main">${esc(p.strategy)}${p.asset ? ` · ${esc(p.asset)}` : ''}</div><div class="t-pmeta">${esc(meta)}</div></div>
            <div class="t-pnlchip ${tone}">${pnlText}</div>
          </div>
          ${p.caption ? `<div class="t-caption">${esc(p.caption)}</div>` : ''}
          <div class="t-print-foot"><span class="t-pbtn">${expanded ? 'Hide confluences' : 'View confluences'}</span><span class="t-pbtn">Reply${p.replies ? ` (${p.replies})` : ''}</span></div>
          ${expanded ? `<div class="t-print-details"><div class="t-pmeta">Confluences</div><div class="t-pills">${(p.conf || []).map(c => `<span class="t-pill">${esc(c)}</span>`).join('') || '<span class="t-pill">No confluences shared</span>'}</div></div>` : ''}
        </div>`;
      },

      printTabs(active = 'Everyone') {
        return `<div class="t-ptabs">${['Everyone', 'Following', 'Leaderboard'].map(t => `<div class="t-ptab${t === active ? ' on' : ''}">${t}</div>`).join('')}</div>`;
      },

      // Economic News card (.econ-card)
      econHead(title, sub) {
        return `<div class="t-modal-head t-econ-head"><div style="min-width:0"><div class="t-econ-kicker">Economic News</div><div class="t-econ-date">${esc(title)}</div><div class="t-econ-sub">${esc(sub)}</div></div><div class="t-modal-acts"><span class="t-close">×</span></div></div>`;
      },

      econCard(ev, { open = false, focus = false } = {}) {
        if (!open) {
          return `<div class="t-ecard"><div class="t-ecard-head"><span class="t-ecard-time">${esc(ev.time)} ET</span><span class="t-ecard-name">${esc(ev.name)}</span><span class="t-chev"></span></div></div>`;
        }
        const released = /released/i.test(ev.status);
        const rowsHtml = (ev.metrics || []).map(m => {
          const actual = released && m.actual && m.actual !== '—'
            ? `<span class="t-mval">${esc(m.actual)}</span>`
            : `<span class="t-mval empty">—<small>${released ? 'See official release' : 'Upcoming'}</small></span>`;
          const prev = m.previous ? `<span class="t-mval">${esc(m.previous)}</span>` : '<span class="t-mval empty">—</span>';
          return `<div class="t-mrow"><span class="t-mname">${esc(m.name)}</span>${actual}${prev}</div>`;
        }).join('');
        return `<div class="t-ecard open${focus ? ' focus' : ''}">
          <div class="t-ecard-head"><span class="t-ecard-time">${esc(ev.time)} ET</span><span class="t-epill${released ? ' released' : ''}">${esc(ev.status)}</span><span class="t-chev"></span><span class="t-ecard-name">${esc(ev.name)}</span></div>
          <div class="t-ecard-body">
            <div class="t-ecard-meta">USD · <b>High Impact</b> · ${esc(ev.agency)}</div>
            ${rowsHtml ? `<div class="t-metrics"><div class="t-mrow head"><span>Metric</span><span class="t-mval">Actual</span><span class="t-mval">Previous</span></div>${rowsHtml}</div>` : ''}
            <div class="t-efoot">
              ${ev.period ? `<div>Reference period: <b>${esc(ev.period)}</b></div>` : ''}
              ${released && ev.releasedAt ? `<div>Released: <b>${esc(ev.releasedAt)}</b></div>` : ''}
              <span class="t-elink">View Official Release ↗</span>
            </div>
          </div>
        </div>`;
      },

      // Prop Firm Command Center
      propHero(p, { side = true, stats: showStats = true, two = false } = {}) {
        const isEval = p.stage === 'Evaluation';
        const stats = isEval
          ? [['Tracked Balance', FMT.money(p.size + p.profit, 2), ''], ['Evaluation Profit', FMT.signed(p.profit), FMT.tone(p.profit)], ['Trading Days', p.days, ''], ['Trades', p.trades, '']]
          : [['Tracked Balance', FMT.money(p.size + p.profit, 2), ''], ['Stage P&L', FMT.signed(p.profit), FMT.tone(p.profit)], ['Cycle Profit', FMT.signed(p.cycle), FMT.tone(p.cycle)], ['Trades', p.trades, '']];
        let goal;
        if (isEval) {
          const prog = clamp(p.profit / Math.max(1, p.target) * 100, 0, 100);
          const done = prog >= 100;
          goal = `<div class="t-goal"><div class="t-goal-row"><span>Goal ${FMT.money(p.target)}</span><span>${prog.toFixed(1)}%</span></div>
            <div class="t-progress"><i class="${done ? 'green' : ''}" style="width:${prog.toFixed(1)}%"></i></div>
            <div class="t-goal-sub">${done ? 'Target reached' : `${FMT.money(p.target - p.profit)} to target`}</div></div>`;
        } else {
          goal = `<div class="t-goal"><div class="t-goal-row"><span>Next Payout #${p.payoutNo}</span><span>${p.reqDone} / ${p.reqTotal} tracked requirements</span></div>
            <div class="t-progress"><i class="${p.reqDone >= p.reqTotal ? 'green' : ''}" style="width:${(p.reqDone / Math.max(1, p.reqTotal) * 100).toFixed(1)}%"></i></div>
            <div class="t-goal-sub">${p.reqDone >= p.reqTotal ? `Appears eligible · up to ${FMT.money(p.payoutMax)}` : `Cycle profit ${FMT.signed(p.cycle)}`}</div></div>`;
        }
        const main = `<div class="t-prop-main">
          <div class="t-prop-firm">${esc(p.firm)}</div>
          <div class="t-prop-title">${esc(p.program)}</div>
          <div class="t-prop-meta"><span class="t-ppill stage">${esc(p.stage)}</span><span class="t-ppill ${p.statusTone || 'green'}">${esc(p.status)}</span>${p.linked ? `<span class="t-prop-nick">Linked: ${esc(p.linked)}</span>` : ''}</div>
          ${showStats ? `<div class="t-phstats${two ? ' two' : ''}">${stats.map(s => `<div><span>${s[0]}</span><b class="${s[2]}">${s[1]}</b></div>`).join('')}</div>` : ''}
          ${goal}
        </div>`;
        if (!side) return main;
        const sideHtml = `<div class="t-prop-side">
          <div class="t-next-label">Next Objective</div>
          <div class="t-next-text">${esc(p.next)}</div>
          <div class="t-health">${(p.health || []).map(([k, v]) => `<div class="t-health-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
          <div class="t-source"><span class="t-ppill">Template verified Oct 9, 2026</span><span class="t-linkbtn">Rules</span></div>
        </div>`;
        return `<div class="t-prop-hero">${main}${sideHtml}</div>`;
      },

      journey(steps) {
        return `<div class="t-journey">${steps.map(s => `<div class="t-jstep ${s.state}"><div class="t-jdot"></div><div class="t-jlabel">${esc(s.label)}</div>${s.sub ? `<div class="t-jsub">${esc(s.sub)}</div>` : ''}</div>`).join('')}</div>`;
      },

      kv(rowsArr) { return rowsArr.map(r => `<div class="t-kv"><span>${esc(r[0])}</span><b class="${r[2] || ''}">${esc(r[1])}</b></div>`).join(''); },

      // Mentorship sections (.mentorship-section)

      invite({ email, hint = true, steps = false }) {

          ${steps ? '<div class="t-steps"><div><i>1</i><b>Invite</b><span>Your mentor gets an email link.</span></div><div><i>2</i><b>They accept</b><span>The mentorship turns active.</span></div><div><i>3</i><b>You choose</b><span>Turn on exactly what they can see.</span></div></div>' : ''}`;

      reviewItem({ trader, target, date, note, cls = '', chip = '' }) {

    /* ---------- Pricing (new) ----------
       Every value on the card comes from the editable fields below. Prices are
       shown exactly as typed: nothing is recalculated, rounded or reformatted. */
    function splitPrice(text) {
      const t = String(text || '').trim();
      const m = /^(.*?\d[\d.,]*)\s*((?:\/|per\b|a\s|each\b|every\b).*)$/i.exec(t);
      if (m && m[2]) return { amount: m[1].trim(), period: m[2].trim() };
      return { amount: t, period: '' };
    }

    const PRICING = {
      priceHtml(text, fit = 'price') {
        const p = splitPrice(text);
        return `<div class="pr-price" data-fit="${fit}"><span class="pr-amount">${esc(p.amount || ' ')}</span>${p.period ? `<span class="pr-period">${esc(p.period)}</span>` : ''}</div>`;
      },

      regularHtml(s) {
        if (!String(s.prRegular || '').trim()) return '';
        return `<div class="pr-reg">${String(s.prRegularLabel || '').trim() ? `<span class="pr-reg-label">${esc(s.prRegularLabel)}</span>` : ''}<span class="pr-reg-value" data-fit="reg">${esc(s.prRegular)}</span></div>`;
      },

      codeHtml(s) {
        if (!String(s.prCode || '').trim()) return '';
        return `<div class="pr-code">${String(s.prCodeLabel || '').trim() ? `<span class="pr-code-label">${esc(s.prCodeLabel)}</span>` : ''}<span class="pr-code-chip" data-fit="code"><span>${esc(String(s.prCode).trim())}</span></span></div>`;
      },

      card(s, { features = true } = {}) {
        const feats = lines(s.prFeatures).slice(0, 6);
        return `<div class="pr-card">
          ${String(s.prPlan || '').trim() ? `<div class="pr-top"><span class="pr-plan">${esc(s.prPlan)}</span></div>` : ''}
          ${PRICING.regularHtml(s)}
          ${PRICING.priceHtml(s.prPrice)}
          <div style="height:${U(14)}"></div>
          ${PRICING.codeHtml(s)}
          ${features && s.prShowFeatures && feats.length ? `<div class="pr-feats">${String(s.prFeatsLabel || '').trim() ? `<div class="pr-feats-label">${esc(s.prFeatsLabel)}</div>` : ''}${feats.map(f => `<div class="pr-feat"><i>${ico('check')}</i><span>${esc(f)}</span></div>`).join('')}</div>` : ''}
        </div>`;

    function defaultsFor(tpl) { return Object.assign({}, SHARED_DEFAULTS, tpl.defaults); }

    function tplState(id = state.templateId) {
      const tpl = getTemplate(id);
      if (!live[tpl.id]) live[tpl.id] = Object.assign(defaultsFor(tpl), savedOverrides[tpl.id] || {});
      const s = live[tpl.id];
      if (!tpl.layouts.some(l => l.id === s.layout)) s.layout = tpl.layouts[0].id;
      return s;
    }

    function serializeState() {
      const out = { templateId: state.templateId, format: state.format, safeArea: state.safeArea, guides: state.guides, scale: state.scale, templates: {} };
      TEMPLATES.forEach(tpl => {
        if (!live[tpl.id]) { if (savedOverrides[tpl.id]) out.templates[tpl.id] = savedOverrides[tpl.id]; return; }
        const defs = defaultsFor(tpl);
        const diff = {};
        Object.keys(live[tpl.id]).forEach(k => { if (live[tpl.id][k] !== defs[k]) diff[k] = live[tpl.id][k]; });
        if (Object.keys(diff).length) out.templates[tpl.id] = diff;
      });
      return out;
    }

    function loadState() {

          if (typeof saved.templateId === 'string') state.templateId = saved.templateId;
          if (FORMATS[saved.format]) state.format = saved.format;
          if (SAFE_ZONES[saved.safeArea]) state.safeArea = saved.safeArea;
          if (SCALES.some(x => x.id === saved.scale)) state.scale = saved.scale;
          state.guides = !!saved.guides;
          if (saved.templates && typeof saved.templates === 'object') savedOverrides = saved.templates;

      state.templateId = getTemplate(state.templateId).id;

          const img = localStorage.getItem(IMAGE_KEY_PREFIX + t.id);
          if (img) images[t.id] = img;

        </div>`;

    // Shrink the headline until it fits its width and line limit.
    function fitHeadline() {
      const el = adEl.querySelector('.ad-headline');
      if (!el) return;
      const fmt = currentFormat();
      const max = parseFloat(getComputedStyle(adEl).getPropertyValue('--h-max')) || 128;
      const min = 56;
      let size = max;
      el.style.fontSize = size + 'px';
      // A headline written on two lines stays on two lines: a manual line never wraps.
      const intended = String(tplState().headline || '').split('\n').filter(l => l.trim()).length;
      const limit = intended > 1 ? Math.min(fmt.maxLines, intended) : fmt.maxLines;
      const linesNow = () => Math.round(el.offsetHeight / (size * 1.02));
      while (size > min && (el.scrollWidth > el.clientWidth + 1 || linesNow() > limit)) {
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }

    // Scale the built-in product UI to the space left between copy and CTA.
    function fitComposition() {
      const area = adEl.querySelector('.ad-product');
      const comp = area && area.querySelector('.fit-comp');
      if (!comp) return;

      // Size = fixed part + u * scalable part. Measure at two scales to
      // get both, then pick the largest u that fits the space.
      comp.style.setProperty('--u', '1px');
      const w1 = comp.offsetWidth, h1 = comp.offsetHeight;
      comp.style.setProperty('--u', '2px');
      const w2 = comp.offsetWidth, h2 = comp.offsetHeight;
      const availW = area.clientWidth;
      const availH = area.clientHeight;
      if (!w1 || !h1 || !availW || !availH) return;

      const bw = Math.max(1, w2 - w1), bh = Math.max(1, h2 - h1);
      const bleed = adEl.classList.contains('bleed');
      const fitW = (availW - (w1 - bw)) / bw;
      // Bleed keeps at least data-visible (share of the composition's height) on screen.
      const visible = parseFloat(comp.dataset.visible) || 0.8;
      const fitH = bleed ? (availH / visible - (h1 - bh)) / bh : (availH - (h1 - bh)) / bh;
      const uMax = parseFloat(comp.dataset.umax) || 2.4;
      const u = Math.max(0.4, Math.min(fitW, fitH, uMax));
      const apply = v => comp.style.setProperty('--u', (Math.floor(v * 1000) / 1000) + 'px');
      let fit = u;
      apply(fit);
      // Text that wraps differently at the final size can add a line. Shrink until it fits.
      for (let i = 0; i < 14 && fit > 0.4 && ((!bleed && comp.offsetHeight > availH + 0.5) || comp.offsetWidth > availW + 0.5); i++) {
        fit *= 0.98;
        apply(fit);
      }
    }

    // Single-line text that must stay on one line (prices, promo codes) shrinks to fit its box.
    function resetFitTexts() {
      adEl.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = ''; });
    }

    function fitTexts() {
      adEl.querySelectorAll('[data-fit]').forEach(el => {
        el.style.fontSize = '';
        const base = parseFloat(getComputedStyle(el).fontSize) || 16;
        let size = base;
        for (let i = 0; i < 40 && el.scrollWidth > el.clientWidth + 1 && size > base * 0.3; i++) {
          size *= 0.95;
          el.style.fontSize = size.toFixed(2) + 'px';
        }
      });
    }

    function productRoom() {
      const area = adEl.querySelector('.ad-product');
      return area ? area.clientHeight : 0;
    }

    function copyOverflows() {
      const copy = adEl.querySelector('.ad-copy');
      if (!copy) return false;
      const inner = adEl.querySelector('.ad-inner');
      const foot = adEl.querySelector('.ad-foot');
      const brand = adEl.querySelector('.ad-brand');
      const cs = getComputedStyle(inner);
      const avail = inner.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (foot ? foot.offsetHeight : 0) - (brand ? brand.offsetHeight : 0) - 60;
      return copy.offsetHeight > avail;
    }

    function fitAd() {
      const fmt = currentFormat();
      adEl.classList.remove('auto-compact');
      resetFitTexts();
      fitHeadline();
      const hasSupport = !!adEl.querySelector('.ad-support') && !adEl.classList.contains('no-support');
      const cramped = fmt.id === 'landscape' ? copyOverflows() : productRoom() < fmt.minProduct;
      if (hasSupport && cramped) adEl.classList.add('auto-compact');
      fitComposition();
      fitTexts();
    }

    function renderGuides() {
      const guides = $('#safeGuides');
      const fmt = currentFormat();
      const show = state.guides && fmt.id === 'story';
      guides.hidden = !show;
      if (!show) { guides.innerHTML = ''; return; }
      guides.innerHTML = SAFE_ZONES[state.safeArea].map(z =>
        `<div class="safe-zone" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px"><span>${esc(z.label)}</span></div>`
      ).join('');
    }

    /* ============================================================
       10. PREVIEW SCALING
       The ad is always laid out at full size and scaled with a
       transform, so the composition is identical on every screen.
       ============================================================ */
    const shell = $('#stageShell');
    const stageScale = $('#stageScale');
    const viewport = $('#viewport');

    function layoutPreview() {
      if (shotActive) return layoutShot();

      const fmt = currentFormat();
      const narrow = window.matchMedia('(max-width: 900px)').matches;
      const cs = getComputedStyle(viewport);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      const availW = viewport.clientWidth - padX;
      const availH = narrow ? Math.min(window.innerHeight * 0.74, availW * (fmt.h / fmt.w)) : viewport.clientHeight - padY;

      const sc = Math.max(0.05, Math.min(availW / fmt.w, availH / fmt.h));
      applyScale(sc, shell);
      const k = currentScale();
      $('#zoomLabel').textContent = `${fmt.w} × ${fmt.h} · ${Math.round(sc * 100)}% · PNG ${fmt.w * k} × ${fmt.h * k}`;
    }

    function applyScale(sc, box) {
      const fmt = currentFormat();
      stageScale.style.width = fmt.w + 'px';
      stageScale.style.height = fmt.h + 'px';
      stageScale.style.transform = `scale(${sc})`;
      box.style.width = Math.round(fmt.w * sc) + 'px';
      box.style.height = Math.round(fmt.h * sc) + 'px';
    }

    new ResizeObserver(() => layoutPreview()).observe(viewport);
    window.addEventListener('resize', () => layoutPreview());

    /* ============================================================
       11. CONTROLS
       ============================================================ */
    const controlsEl = $('#controls');

    function seg(name, options, value) {
      return `<div class="seg" role="group" data-seg="${name}">${options.map(o =>
        `<button type="button" data-value="${esc(o.id)}" aria-pressed="${o.id === value}"${o.disabled ? ' disabled' : ''}>${esc(o.name)}</button>`
      ).join('')}</div>`;
    }

    function textField(f, value) {
      const len = String(value ?? '').length;
      const count = f.max ? `<span class="field-count${len > f.max ? ' over' : ''}" data-count="${f.key}" data-max="${f.max}">${len}/${f.max}</span>` : '';
      const input = f.type === 'textarea'
        ? `<textarea id="f-${f.key}" data-key="${f.key}" rows="${f.rows || 2}" placeholder="${esc(f.placeholder || '')}">${esc(value)}</textarea>`
        : `<input type="text" id="f-${f.key}" class="${esc(f.cls || '')}" data-key="${f.key}" value="${esc(value)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" spellcheck="${f.cls === 'mono' ? 'false' : 'true'}" />`;
      return `
        <div class="field">
          <label for="f-${f.key}">${esc(f.label)}${count}</label>
          ${input}
          ${f.hint ? `<div class="field-hint">${f.hint.includes('<b>') ? f.hint : esc(f.hint)}</div>` : ''}
        </div>`;
    }

    function toggleRow(key, label, checked, sub = '') {
      return `
        <label class="toggle-row">
          <span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>
          <span class="switch"><input type="checkbox" data-key="${key}" ${checked ? 'checked' : ''} /><span></span></span>
        </label>`;
    }

    // Data fields can also be a select or an on/off toggle
    function dataField(f, value) {
      if (f.type === 'toggle') return toggleRow(f.key, f.label, !!value, f.hint || '');
      if (f.type === 'select') {
        return `
          <div class="field">
            <label for="f-${f.key}">${esc(f.label)}</label>
            <select id="f-${f.key}" data-key="${f.key}">${f.options.map(o => `<option value="${esc(o.id)}" ${o.id === value ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
            ${f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : ''}
          </div>`;
      }
      return textField(f, value);
    }

    const openGroups = { tpl: true, copy: true, special: true, show: false, product: false, data: false };

    function group(id, title, body, meta = '') {
      return `<details class="ctl-group" data-group="${id}" ${openGroups[id] ? 'open' : ''}><summary>${esc(title)}${meta ? `<small>${esc(meta)}</small>` : ''}</summary><div class="ctl-body">${body}</div></details>`;
    }

    function renderControls() {
      const tpl = getTemplate(state.templateId);
      const s = tplState(tpl.id);
      const layout = tpl.layouts.find(l => l.id === s.layout);

      const tiles = TEMPLATES.filter(t => t.status === 'ready').map(t =>
        `<button type="button" class="tpl-tile" data-tpl="${t.id}" aria-pressed="${t.id === tpl.id}" title="${esc(t.blurb)}"><span class="tpl-tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[t.icon] || ''}</svg></span><span class="tpl-tile-name">${esc(t.name)}</span>${t.isNew ? '<span class="tpl-new">New</span>' : ''}</button>`
      ).join('');

      const tplGroup = `
        <div class="field">
          <span class="field-label">Template</span>
          <div class="tpl-grid" role="group" aria-label="Template">${tiles}</div>
          <div class="field-hint">${esc(tpl.blurb)}</div>
        </div>
        <div class="field">
          <span class="field-label">Layout</span>
          ${seg('layout', tpl.layouts, s.layout)}
          <div class="field-hint">${esc(layout ? layout.hint : '')}</div>
        </div>
        ${state.format === 'story' ? `
        <div class="field">
          <span class="field-label">Safe area</span>
          ${seg('safeArea', [{ id: 'stories', name: 'Stories' }, { id: 'reels', name: 'Reels' }], state.safeArea)}
          <div class="field-hint">${state.safeArea === 'reels'
            ? 'Keeps clear of the Reels caption and the buttons on the right. That leaves less room, so hiding the supporting text makes the product bigger.'
            : 'Keeps text and the CTA clear of the Stories header and reply bar.'}</div>
        </div>` : ''}`;

      const presets = (tpl.headlinePresets || []).map((p, i) =>
        `<button type="button" class="chip" data-preset="${i}" title="${esc(p.replace(/\n/g, ' '))}">${esc(p.replace(/[\[\]]/g, '').replace(/\n/g, ' '))}</button>`
      ).join('');

      const labels = tpl.copyLabels || {};
      const copyGroup = COPY_FIELDS.filter(f => !f.templates || f.templates.includes(tpl.id)).map(f => {
        let html = textField(labels[f.key] ? { ...f, label: labels[f.key] } : f, s[f.key]);
        if (f.key === 'headline' && presets) html += `<div class="chips">${presets}</div>`;
        return html;
      }).join('') + (state.format === 'square' || state.format === 'feed'
        ? '<div class="field-hint">In smaller formats the supporting text steps aside on its own when the product needs the room.</div>' : '');

      const special = tpl.fieldGroup
        ? group('special', tpl.fieldGroup.title, `${tpl.fieldGroup.note ? `<div class="ctl-note">${esc(tpl.fieldGroup.note)}</div>` : ''}${tpl.fieldGroup.fields.map(f => dataField(f, s[f.key])).join('')}`)
        : '';

      const showGroup = `<div class="toggle-list">${SHOW_FIELDS
        .filter(f => (!f.layouts || f.layouts.includes(s.layout)) && (!f.templates || f.templates.includes(tpl.id)))
        .map(f => toggleRow(f.key, f.label, s[f.key])).join('')}</div>
        <div class="field">
          <span class="field-label">Logo image</span>
          <div class="upload-row">
            <label class="btn" for="logoInput">Upload logo</label>
            <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
            ${logoIsUpload ? '<button class="btn btn-quiet" type="button" id="logoRemove">Remove</button>' : ''}
          </div>
          <div class="field-hint">${logoSrc
            ? (logoIsUpload ? 'Using your uploaded logo.' : `Using <b>${esc(LOGO_ASSET)}</b>.`)
            : `No logo yet. Upload the official TP logo or add it as <b>${esc(LOGO_ASSET)}</b>. It's used exactly as supplied.`}</div>
        </div>`;

      const hasImg = !!images[tpl.id];
      const productGroup = `
        <div class="field">
          <span class="field-label">Source</span>
          ${seg('productSource', [{ id: 'builtin', name: 'Tradeprint UI 2.0' }, { id: 'upload', name: 'Screenshot' }], s.productSource)}
          <div class="field-hint">${s.productSource === 'builtin'
            ? 'The real Tradeprint UI 2.0 interface, rebuilt so it stays sharp at any size. Uses placeholder data only.'
            : 'Use your own screenshot. Check it for private emails or account details first.'}</div>
        </div>
        ${s.productSource === 'upload' ? `
        <div class="field">
          <div class="upload-row">
            <label class="btn" for="imgInput">${hasImg ? 'Replace screenshot' : 'Upload screenshot'}</label>
            <input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp" hidden />
            ${hasImg ? '<button class="btn btn-quiet" type="button" id="imgRemove">Remove</button>' : ''}
          </div>
          <div class="upload-status" id="imgStatus"></div>
        </div>
        <div class="field">
          <span class="field-label">Frame</span>
          ${seg('frameShape', [{ id: 'portrait', name: 'Portrait' }, { id: 'tall', name: 'Tall' }, { id: 'square', name: 'Square' }, { id: 'wide', name: 'Wide' }], s.frameShape)}
        </div>
        <div class="field">
          <label for="f-imageFocus">Vertical position</label>
          <div class="range-row"><input type="range" id="f-imageFocus" min="0" max="100" step="1" data-key="imageFocus" value="${+s.imageFocus}" /><output>${+s.imageFocus}%</output></div>
        </div>
        <div class="field">
          <label for="f-imageZoom">Zoom</label>
          <div class="range-row"><input type="range" id="f-imageZoom" min="100" max="250" step="5" data-key="imageZoom" value="${+s.imageZoom}" /><output>${+s.imageZoom}%</output></div>
        </div>` : ''}`;

      const dataGroup = (tpl.dataFields || [])
        .filter(f => !f.layouts || f.layouts.includes(s.layout))
        .map(f => dataField(f, s[f.key])).join('');

      controlsEl.innerHTML = [
        group('tpl', 'Template', tplGroup, tpl.name),
        group('copy', 'Copy', copyGroup),
        special,
        group('show', 'Show and hide', showGroup),
        group('product', 'Product visual', productGroup),
        dataGroup ? group('data', 'Preview data', dataGroup) : '',
        `<div class="ctl-footer"><button class="btn" type="button" id="resetBtn">Restore ${esc(tpl.name)} defaults</button></div>`
      ].join('');

      renderFormatSeg();
    }

    function renderFormatSeg() {
      $('#formatSeg').innerHTML = Object.values(FORMATS).map(f =>
        `<button type="button" data-format="${f.id}" aria-pressed="${f.id === state.format}" title="${f.name} ${f.w} × ${f.h}">${f.name}<em>${f.label}</em></button>`
      ).join('');
      const fmt = currentFormat();
      $('#scaleSeg').innerHTML = SCALES.map(x =>
        `<button type="button" data-scale="${x.id}" aria-pressed="${x.id === state.scale}" title="PNG ${fmt.w * x.value} × ${fmt.h * x.value}">PNG ${x.name}</button>`
      ).join('');
      const guidesBtn = $('#guidesBtn');
      guidesBtn.setAttribute('aria-pressed', String(state.guides));
      guidesBtn.hidden = state.format !== 'story';
    }

    let renderQueued = false;
    function queueRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; renderAd(); });
    }

    function onChange(full = false) {
      saveState();
      if (full) renderControls();
      queueRender();
    }

    function setTemplate(id) {
      state.templateId = getTemplate(id).id;
      saveState();
      renderControls();
      renderAd();
    }

    function setFormat(id) {
      if (!FORMATS[id]) return;
      state.format = id;
      saveState();
      renderControls();
      layoutPreview();
      renderAd();
    }

    controlsEl.addEventListener('input', (e) => {
      const el = e.target;
      const key = el.dataset.key;
      if (!key) return;
      const s = tplState();

      if (el.type === 'checkbox') {
        s[key] = el.checked;
        onChange(key === 'showLogo');
        return;
      }

      if (el.type === 'range') {
        s[key] = Number(el.value);
        const out = el.parentElement.querySelector('output');
        if (out) out.textContent = el.value + '%';
        onChange();
        return;
      }

      s[key] = el.value;
      const counter = controlsEl.querySelector(`[data-count="${key}"]`);
      if (counter) {
        const max = parseInt(counter.dataset.max, 10);
        counter.textContent = `${el.value.length}/${max}`;
        counter.classList.toggle('over', el.value.length > max);
      }
      onChange(el.tagName === 'SELECT');
    });

    controlsEl.addEventListener('change', (e) => {
      const el = e.target;
      if (el.id === 'imgInput' && el.files && el.files[0]) handleImageUpload(el.files[0]);
      if (el.id === 'logoInput' && el.files && el.files[0]) handleLogoUpload(el.files[0]);
    });

    controlsEl.addEventListener('click', (e) => {
      const tile = e.target.closest('[data-tpl]');
      if (tile) { setTemplate(tile.dataset.tpl); return; }

      const segBtn = e.target.closest('[data-seg] button');
      if (segBtn) {
        const name = segBtn.parentElement.dataset.seg;
        const value = segBtn.dataset.value;
        if (name === 'safeArea') state.safeArea = value;
        else tplState()[name] = value;
        onChange(true);
        return;
      }

      const preset = e.target.closest('[data-preset]');
      if (preset) {
        const tpl = getTemplate(state.templateId);
        const value = tpl.headlinePresets[+preset.dataset.preset];
        tplState().headline = value;
        const input = $('#f-headline');
        if (input) input.value = value;
        const counter = controlsEl.querySelector('[data-count="headline"]');
        if (counter) counter.textContent = `${value.length}/${counter.dataset.max}`;
        onChange();
        return;
      }

      if (e.target.id === 'resetBtn') {
        const tpl = getTemplate(state.templateId);
        if (!confirm(`Restore the ${tpl.name} ad to its default copy, ${tpl.fieldGroup ? `${tpl.fieldGroup.title.toLowerCase()}, ` : ''}layout and data?`)) return;
        resetTemplate(tpl.id);
        onChange(true);
        return;
      }

      if (e.target.id === 'imgRemove') {
        const id = getTemplate(state.templateId).id;
        delete images[id];
        try { localStorage.removeItem(IMAGE_KEY_PREFIX + id); } catch (err) {}
        onChange(true);
        return;
      }

      if (e.target.id === 'logoRemove') {
        try { localStorage.removeItem(LOGO_KEY); } catch (err) {}
        logoSrc = '';
        logoIsUpload = false;
        detectLogoAsset().then(() => onChange(true));
      }
    });

    controlsEl.addEventListener('toggle', (e) => {
      const g = e.target.closest && e.target.closest('.ctl-group');
      if (g) openGroups[g.dataset.group] = g.open;
    }, true);

    $('#formatSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-format]');
      if (btn) setFormat(btn.dataset.format);
    });

    $('#scaleSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-scale]');
      if (!btn) return;
      state.scale = btn.dataset.scale;
      saveState();
      renderFormatSeg();
      layoutPreview();
    });

    $('#guidesBtn').addEventListener('click', () => {
      state.guides = !state.guides;
      saveState();
      renderFormatSeg();
      renderGuides();
    });

    /* ============================================================
       12. IMAGE UPLOADS (kept in this browser only)
       ============================================================ */
    function readImage(file, maxSide, type, quality) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL(type, quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be read.')); };
        img.src = url;
      });
    }

    async function handleImageUpload(file) {
      const id = getTemplate(state.templateId).id;
      const status = $('#imgStatus');
      if (status) status.textContent = 'Processing...';
      try {
        images[id] = await readImage(file, 2400, 'image/jpeg', 0.94);
        let note = '';
        try { localStorage.setItem(IMAGE_KEY_PREFIX + id, images[id]); }
        catch (err) { note = 'Too large to keep after a reload. It works for this session.'; }
        renderControls();
        const st = $('#imgStatus');
        if (st) st.textContent = note;
        queueRender();
      } catch (err) {
        if (status) status.textContent = err.message;
      }
    }

    async function handleLogoUpload(file) {
      try {
        logoSrc = file.type === 'image/svg+xml'
          ? await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); })
          : await readImage(file, 512, 'image/png');
        logoIsUpload = true;
        try { localStorage.setItem(LOGO_KEY, logoSrc); } catch (err) {}
        tplState().showLogo = true;
        onChange(true);
      } catch (err) {
        alert('That logo could not be read.');
      }
    }

    function detectLogoAsset() {
      return new Promise(resolve => {
        if (logoSrc) return resolve();
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth > 0 && !logoSrc) logoSrc = asset(LOGO_ASSET);
          resolve();
        };
        img.onerror = () => resolve();
        img.src = asset(LOGO_ASSET);
      });
    }

    /* ============================================================
       13. FONTS (loaded once, embedded into every export)
       ============================================================ */
    let fontEmbedCss = '';

    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary);
    }

    function isWoff2(buffer) {
      const b = new Uint8Array(buffer, 0, 4);
      return b.length === 4 && b[0] === 0x77 && b[1] === 0x4f && b[2] === 0x46 && b[3] === 0x32; // "wOF2"
    }

    async function loadFace(face) {
      for (const url of [asset('assets/fonts/' + face.file), FONT_CDN[face.cdn] + face.file]) {
        try {
          const res = await fetch(url, { cache: 'force-cache' });
          if (!res.ok) continue;
          const buffer = await res.arrayBuffer();
          if (!isWoff2(buffer)) continue;
          const ff = new FontFace(face.family, buffer, { weight: String(face.weight), style: face.style });
          await ff.load();
          document.fonts.add(ff);
          return `@font-face{font-family:'${face.family}';src:url(data:font/woff2;base64,${bufferToBase64(buffer)}) format('woff2');font-weight:${face.weight};font-style:${face.style};}`;
        } catch (err) {}
      }
      return '';
    }

    async function loadBrandFonts() {
      const css = await Promise.all(FONT_FACES.map(loadFace));
      fontEmbedCss = css.join('');
      if (css.some(c => !c)) console.warn('[Studio] Some IBM Plex weights could not be loaded. Using system fonts for those.');
      return !!fontEmbedCss;
    }

    const fontReady = Promise.race([
      loadBrandFonts(),
      new Promise(r => setTimeout(() => r(false), 8000))
    ]);

    /* ============================================================
       14. SCREENSHOT MODE
       Shows only the ad, scaled to fill the screen. The controls fade
       out so the screenshot is clean. Tap to show them, Esc to exit.
       ============================================================ */
    const shotMode = $('#shotMode');
    const shotStage = $('#shotStage');
    const shotUi = $('#shotUi');
    let shotActive = false;
    let shotTimer = null;

    function layoutShot() {
      const fmt = currentFormat();
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      applyScale(Math.min(w / fmt.w, h / fmt.h), shotStage);
    }

    function showShotUi() {
      shotUi.classList.remove('is-hidden');
      clearTimeout(shotTimer);
      shotTimer = setTimeout(() => shotUi.classList.add('is-hidden'), 2000);
    }

    function enterShotMode() {
      shotActive = true;

      if (!shotActive) return;

    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (shotActive) layoutShot(); });
