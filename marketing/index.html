          const g = tone(ac, out, t, 'sine', 620, 980, 0.13, 0.22);
          g.connect(send);
          break;
        }
        case 'tap': {
          tone(ac, out, t, 'sine', 1900, 1500, 0.035, 0.16, 0.001);
          tone(ac, out, t, 'triangle', 820, 600, 0.07, 0.12, 0.001);
          break;
        }
        case 'tick': tone(ac, out, t, 'sine', 2400, 2200, 0.03, 0.08, 0.001); break;
        case 'ping': {
          tone(ac, out, t, 'sine', 1320, 1320, 0.55, 0.11).connect(send);
          tone(ac, out, t + 0.09, 'sine', 1980, 1980, 0.5, 0.08).connect(send);
          break;
        }
        case 'strike': sweep(ac, out, t, 0.16, 2500, 6500, 4000, 0.14, noiseSrc, { q: 0.9 }); break;
        case 'price': {
          [0, 0.06, 0.12, 0.2].forEach((d, k) => tone(ac, out, t + d, 'sine', midiHz([84, 88, 91, 96][k]), midiHz([84, 88, 91, 96][k]), 0.7, 0.07).connect(send));
          tone(ac, out, t, 'sine', 110, 55, 0.5, 0.3, 0.004);
          break;
        }
        case 'logo': {
          sweep(ac, out, t, 0.9, 200, 1800, 900, 0.18, noiseSrc, { type: 'lowpass', q: 0.7 });
          [65, 72, 76].forEach((m, k) => tone(ac, out, t + 0.05 * k, 'sine', midiHz(m), midiHz(m), 1.2, 0.05, 0.08).connect(send));
          break;
        }
        default: break;
      }
    }

    // A licensed track the user uploads (kept in memory only)
    let userTrack = null;
    async function loadUserTrack(file) {
      const buf = await file.arrayBuffer();
      const ac = new OfflineAudioContext({ numberOfChannels: 2, length: AUDIO_SR, sampleRate: AUDIO_SR });
      const decoded = await ac.decodeAudioData(buf);
      userTrack = { id: `${file.name}:${file.size}:${file.lastModified}`, name: file.name, buffer: decoded };
      return userTrack;
    }

    /* ============================================================
       13. PLAYER (preview, transport, timeline)
       The preview canvas is sized to the screen; renderFrame() scales
       the same 1080 x 1920 composition into it. While playing, motion
       blur uses up to 8 samples per frame to keep the preview smooth;
       when paused or scrubbing (and in the export) it uses all of them.
       ============================================================ */
    const viewport = $('#viewport');
    const stageEl = $('#stage');
    const pcanvas = $('#previewCanvas');
    const guidesEl = $('#guides');
    const timelineEl = $('#timeline');
    const blocksEl = $('#blocks');
    const playheadEl = $('#playhead');
    const hoverLine = $('#hoverLine');
    const timeLabel = $('#timeLabel');
    const loadingEl = $('#loading');
    const loadingText = $('#loadingText');
    const bigPlay = $('#bigPlay');

    let project = null;          // the project on screen (layers loaded)
    let currentAudio = null;     // { buffer, meta } for the project on screen
    let playT = 0;
    let playing = false;
    let loopOn = true;
    let muted = false;
    let audioCtx = null, audioSrc = null, audioGain = null;
    let clockRef = 0, clockT = 0, clockAudio = false;
    let rafId = 0;
    let scrubbing = false;
    let resumeAfterScrub = false;

    const ICON_PLAY = '<path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/>';
    const ICON_PAUSE = '<rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor" stroke="none"/>';
    const ICON_SOUND = '<path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
    const ICON_MUTED = '<path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/>';

    function fmtTime(t) {
      t = Math.max(0, t);
      const m = Math.floor(t / 60), s = t - m * 60;
      return `${m}:${s.toFixed(2).padStart(5, '0')}`;
    }

    function layoutStage() {
      const r = viewport.getBoundingClientRect();
      const pad = window.innerWidth <= 900 ? 28 : 44;
      const k = Math.max(0.05, Math.min((r.width - pad) / W, (r.height - pad) / H));
      const cssW = Math.floor(W * k), cssH = Math.floor(H * k);
      stageEl.style.width = cssW + 'px';
      stageEl.style.height = cssH + 'px';
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const pw = Math.max(108, Math.min(W, Math.round(cssW * dpr)));
      if (pcanvas.width !== pw) {
        pcanvas.width = pw;
        pcanvas.height = Math.round(pw * H / W);
      }
      layoutGuides();
      draw();
    }

    function layoutGuides() {
      const zones = SAFE_ZONES[state.guide];
      guidesEl.hidden = !zones;
      if (!zones) return;
      const k = stageEl.clientWidth / W;
      guidesEl.innerHTML = zones.map(z => `<div class="vs-zone" style="left:${z.x * k}px;top:${z.y * k}px;width:${z.w * k}px;height:${z.h * k}px"><span>${esc(z.label)}</span></div>`).join('');
    }

    function draw() {
      if (!project) {
        const ctx = pcanvas.getContext('2d');
        const k = pcanvas.width / W;
        ctx.setTransform(k, 0, 0, k, 0, 0);
        drawBackdrop(ctx, 0, 1);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        return;
      }
      renderFrame(pcanvas, Math.min(playT, project.duration - 1e-4), project, { maxSamples: playing ? 8 : 20 });
      updateTransport();
    }

    function updateTransport() {
      const D = project ? project.duration : 0;
      timeLabel.innerHTML = `<b>${fmtTime(playT)}</b> / ${fmtTime(D)}`;
      playheadEl.style.left = D ? `${(Math.min(playT, D) / D) * 100}%` : '0';
      timelineEl.setAttribute('aria-valuemax', D.toFixed(2));
      timelineEl.setAttribute('aria-valuenow', playT.toFixed(2));
      timelineEl.setAttribute('aria-valuetext', fmtTime(playT));
      const cur = project && project.scenes.find(S => playT >= S.start && playT < S.end);
      blocksEl.querySelectorAll('.vs-block').forEach((b, i) => b.classList.toggle('on', !!cur && cur.i === i));
    }

    function renderBlocks() {
      if (!project) { blocksEl.innerHTML = ''; return; }
      const D = project.duration;
      blocksEl.innerHTML = project.scenes.map(S => {
        const name = S.key === 'hook' ? 'Hook' : S.key === 'end' ? (S.data.showPricing ? 'Offer' : 'Call to action') : (S.cap && S.cap.label) || S.type.name;
        return `<div class="vs-block" style="left:calc(${(S.start / D) * 100}% + 2px);width:calc(${(S.dur / D) * 100}% - 4px)" title="${esc(name)} · ${S.dur.toFixed(1)} s">${esc(name)}<small>${S.dur.toFixed(1)} s</small></div>`;
      }).join('');
      updateTransport();
    }

    /* ---------- clock + audio ---------- */
    function ensureAudioCtx() {
      if (audioCtx) return audioCtx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC({ sampleRate: AUDIO_SR }); } catch (err) { audioCtx = new AC(); }
      audioGain = audioCtx.createGain();
      audioGain.connect(audioCtx.destination);
      return audioCtx;
    }

    function stopAudio() {
      if (audioSrc) { try { audioSrc.stop(); } catch (err) {} audioSrc.disconnect(); audioSrc = null; }
    }

    function startClock() {
      stopAudio();
      clockT = playT;
      clockAudio = false;
      if (!muted && currentAudio && audioCtx && !currentAudio.meta.silent) {
        audioSrc = audioCtx.createBufferSource();
        audioSrc.buffer = currentAudio.buffer;
        audioSrc.connect(audioGain);
        const when = audioCtx.currentTime + 0.03;
        audioSrc.start(when, Math.min(playT, currentAudio.buffer.duration - 0.01));
        clockRef = when;
        clockAudio = true;
      } else {
        clockRef = performance.now() / 1000;
      }
    }

    function clockNow() {
      if (clockAudio && audioCtx) return clockT + Math.max(0, audioCtx.currentTime - clockRef);
      return clockT + (performance.now() / 1000 - clockRef);
    }

    function tick() {
      rafId = 0;
      if (!playing || !project) return;
      let t = clockNow();
      if (t >= project.duration) {
        if (loopOn) { playT = 0; startClock(); t = 0; }
        else { playT = project.duration; pause(); draw(); return; }
      }
      playT = t;
      draw();
      rafId = requestAnimationFrame(tick);
    }

    function play() {
      if (!project || playing) return;
      if (playT >= project.duration - 0.02) playT = 0;
      ensureAudioCtx();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      playing = true;
      startClock();
      setPlayUi();
      if (!rafId) rafId = requestAnimationFrame(tick);
    }

    function pause() {
      if (!playing) return;
      playT = Math.min(clockNow(), project ? project.duration : 0);
      playing = false;
      stopAudio();
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      setPlayUi();
      draw();
    }

    function togglePlay() { playing ? pause() : play(); }

    function seek(t, { snap = true } = {}) {
      if (!project) return;
      t = Math.max(0, Math.min(project.duration, t));
      if (snap) t = Math.round(t * FPS) / FPS;
      playT = t;
      if (playing) startClock();
      draw();
    }

    let everPlayed = false;
    function setPlayUi() {
      if (playing) everPlayed = true;
      $('#playIcon').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      $('#playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
      bigPlay.hidden = playing || !project || everPlayed || scrubbing;
    }

    function setMuteUi() {
      $('#muteIcon').innerHTML = muted ? ICON_MUTED : ICON_SOUND;
      $('#muteBtn').setAttribute('aria-pressed', String(muted));
      $('#muteBtn').setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
    }

    // New audio for the project on screen: restart it in place if playing
    function setAudio(a) {
      currentAudio = a;
      if (playing) { playT = clockNow(); startClock(); }
    }

    /* ---------- transport events ---------- */
    $('#playBtn').addEventListener('click', togglePlay);
    bigPlay.addEventListener('click', play);
    stageEl.addEventListener('click', e => { if (e.target === pcanvas) togglePlay(); });
    $('#muteBtn').addEventListener('click', () => {
      muted = !muted;
      setMuteUi();
      if (playing) { playT = clockNow(); startClock(); }
      saveState();
    });
    $('#loopBtn').addEventListener('click', () => {
      loopOn = !loopOn;
      $('#loopBtn').setAttribute('aria-pressed', String(loopOn));
    });

    function timeFromEvent(e) {
      const r = timelineEl.getBoundingClientRect();
      return clamp((e.clientX - r.left) / r.width, 0, 1) * (project ? project.duration : 0);
    }

    timelineEl.addEventListener('pointerdown', e => {
      if (!project) return;
      scrubbing = true;
      everPlayed = true;
      bigPlay.hidden = true;
      resumeAfterScrub = playing;
      if (playing) pause();
      timelineEl.setPointerCapture(e.pointerId);
      seek(timeFromEvent(e));
    });
    timelineEl.addEventListener('pointermove', e => {
      if (!project) return;
      const r = timelineEl.getBoundingClientRect();
      hoverLine.hidden = false;
      hoverLine.style.left = `${clamp(e.clientX - r.left, 0, r.width)}px`;
      if (scrubbing) seek(timeFromEvent(e));
    });
    timelineEl.addEventListener('pointerleave', () => { hoverLine.hidden = true; });
    const endScrub = () => {
      if (!scrubbing) return;
      scrubbing = false;
      if (resumeAfterScrub) play();
    };
    timelineEl.addEventListener('pointerup', endScrub);
    timelineEl.addEventListener('pointercancel', endScrub);
    timelineEl.addEventListener('keydown', e => {
      if (!project) return;
      const step = e.shiftKey ? 1 : 1 / FPS;
      if (e.key === 'ArrowRight') { e.preventDefault(); if (playing) pause(); seek(playT + step); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (playing) pause(); seek(playT - step); }
      else if (e.key === 'Home') { e.preventDefault(); seek(0); }
      else if (e.key === 'End') { e.preventDefault(); seek(project.duration); }
    });

    document.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target.isContentEditable) return;
      if (!$('#exportSheet').hidden) return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.key === 'ArrowRight' && e.target !== timelineEl) { if (playing) pause(); seek(playT + (e.shiftKey ? 1 : 1 / FPS)); }
      else if (e.key === 'ArrowLeft' && e.target !== timelineEl) { if (playing) pause(); seek(playT - (e.shiftKey ? 1 : 1 / FPS)); }
    });

    new ResizeObserver(() => layoutStage()).observe(viewport);
    document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });

    /* ---------- building the project on screen ---------- */
    let buildSeq = 0;
    let rebuildTimer = 0;

    let buildsPending = 0;
    function scheduleRebuild(delay = 220) {
      if (!rebuildTimer) buildsPending++;
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(() => { rebuildTimer = 0; buildsPending--; rebuild(); }, delay);
    }

    async function rebuild() {
      buildsPending++;
      try { await rebuildInner(); } finally { buildsPending--; }
    }

    async function rebuildInner() {
      const seq = ++buildSeq;
      await fontReady;
      const s = settings();
      const P = buildProject(state.tpl, s, shotImages);
      const slow = setTimeout(() => { if (seq === buildSeq) { loadingEl.hidden = false; } }, project ? 350 : 0);
      try {
        await loadProjectLayers(P, (d, n) => { if (seq === buildSeq) loadingText.textContent = `Rendering app screens ${d} of ${n}...`; });
      } catch (err) {
        clearTimeout(slow);
        if (seq !== buildSeq) return;
        loadingEl.hidden = false;
        loadingText.innerHTML = `<b style="color:#fca5a5">The app screens could not be rendered.</b><br>${esc(err.message || err)}<br><br><button class="btn" type="button" id="retryLayers">Try again</button>`;
        $('#retryLayers').onclick = () => { loadingText.textContent = 'Loading...'; scheduleRebuild(0); };
        return;
      }
      clearTimeout(slow);
      if (seq !== buildSeq) return;
      const wasPlaying = playing;
      if (playing) { playT = clockNow(); }
      project = P;
      playT = Math.min(playT, P.duration);
      loadingEl.hidden = true;
      $('#barTitle').textContent = P.tplName;
      $('#barMeta').textContent = `${P.duration.toFixed(1)} s · 1080 × 1920 · 30 fps`;
      renderBlocks();
      setPlayUi();
      draw();
      updateExportState();
      renderAudio(P, s, userTrack).then(a => {
        if (seq !== buildSeq) return;
        setAudio(a);
      }).catch(err => console.warn('[Video Studio] audio', err));
      if (wasPlaying) startClock();
    }

    /* ============================================================
       14. STATE + CONTROLS (saved in this browser only)
       Only values you change are saved, so improved defaults reach
       old settings. Offer, call to action, example data and audio are
       shared by all templates; scenes and hook copy are per template.
       ============================================================ */
    const state = { tpl: 'showcase', shared: {}, tpls: {}, guide: 'off', muted: false };
    const shotImages = {};      // scene key -> ImageBitmap/Image (uploaded screenshots)

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (raw && typeof raw === 'object') {
          if (TEMPLATES.some(t => t.id === raw.tpl && t.status === 'ready')) state.tpl = raw.tpl;
          if (raw.shared && typeof raw.shared === 'object') state.shared = raw.shared;
          if (raw.tpls && typeof raw.tpls === 'object') state.tpls = raw.tpls;
          if (SAFE_ZONES[raw.guide] || raw.guide === 'off') state.guide = raw.guide;
          state.muted = !!raw.muted;
        }
      } catch (err) {}
      muted = state.muted;
    }

    let saveTimer = 0;
    function saveState() {
      state.muted = muted;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
      }, 200);
    }

    function settings(tplId = state.tpl) {
      const tpl = getTemplate(tplId);
      return { ...SHARED_DEFAULTS, ...tpl.defaults, ...state.shared, ...(state.tpls[tpl.id] || {}) };
    }

    function isShared(key) { return Object.prototype.hasOwnProperty.call(SHARED_DEFAULTS, key); }

    function defaultOf(key) {
      if (isShared(key)) return SHARED_DEFAULTS[key];
      const tpl = getTemplate(state.tpl);
      if (Object.prototype.hasOwnProperty.call(tpl.defaults, key)) return tpl.defaults[key];
      const m = /^cap_(\w+)_(label|title)$/.exec(key);
      if (m && SCENE_TYPES[m[1]] && SCENE_TYPES[m[1]].cap) return SCENE_TYPES[m[1]].cap[m[2]];
      const sp = /^sp_(\w+)_(chip|hook|c[123])$/.exec(key);
      if (sp && SCENE_TYPES[sp[1]] && SCENE_TYPES[sp[1]].spot) {
        const F = SCENE_TYPES[sp[1]];
        return sp[2] === 'chip' ? FEATURE_NAMES[sp[1]] : sp[2] === 'hook' ? F.spot.hook : F.spot.callouts[+sp[2].slice(1) - 1];
      }
      const pp = /^pp_(\w+)_title$/.exec(key);
      if (pp && MINI_TITLES[pp[1]]) return MINI_TITLES[pp[1]];
      return undefined;
    }

    function setVal(key, value, { rebuildNow = false, silent = false } = {}) {
      const bucket = isShared(key) ? state.shared : (state.tpls[state.tpl] ||= {});
      if (value === defaultOf(key)) delete bucket[key];
      else bucket[key] = value;
      saveState();
      if (!silent) scheduleRebuild(rebuildNow ? 0 : 220);
      refreshDerived();
    }

    /* ---------- field builders ---------- */
    const controlsEl = $('#controls');

    function fieldHtml(f, s) {
      const id = `f_${f.key}`;
      const v = s[f.key] ?? '';
      const count = f.max ? `<span class="field-count" data-count="${f.key}">${String(v).length}/${f.max}</span>` : '';
      const hint = f.hint ? `<div class="field-hint">${f.hint}</div>` : '';
      if (f.type === 'textarea') {
        return `<div class="field"><label for="${id}"><span>${esc(f.label)}</span>${count}</label><textarea id="${id}" data-key="${f.key}" rows="${f.rows || 2}" ${f.max ? `maxlength="${f.max * 2}"` : ''} spellcheck="true">${esc(v)}</textarea>${hint}</div>`;
      }
      if (f.type === 'toggle') {
        return `<label class="toggle-row"><span>${esc(f.label)}${f.small ? `<small>${esc(f.small)}</small>` : ''}</span><span class="switch"><input type="checkbox" data-key="${f.key}" ${v ? 'checked' : ''}><span></span></span></label>`;
      }
      if (f.type === 'seg') {
        return `<div class="field"><span class="field-label">${esc(f.label)}</span><div class="seg" role="group" aria-label="${esc(f.label)}">${f.options.map(o => `<button type="button" data-seg="${f.key}" data-val="${esc(o.id)}" aria-pressed="${String(v) === o.id}">${esc(o.name)}</button>`).join('')}</div>${hint}</div>`;
      }
      if (f.type === 'select') {
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><select id="${id}" data-key="${f.key}">${f.options.map(o => `<option value="${esc(o.id)}"${String(v) === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}</select>${hint}</div>`;
      }
      if (f.type === 'range') {
        return `<div class="field"><label for="${id}">${esc(f.label)}</label><div class="range-row"><input type="range" id="${id}" data-key="${f.key}" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${esc(v)}"><output data-out="${f.key}">${esc(v)}${f.unit || ''}</output></div>${hint}</div>`;
      }
      return `<div class="field"><label for="${id}"><span>${esc(f.label)}</span>${count}</label><input type="text" id="${id}" data-key="${f.key}" value="${esc(v)}" ${f.max ? `maxlength="${f.max * 2}"` : ''} ${f.mono ? 'class="mono"' : ''} spellcheck="${f.mono ? 'false' : 'true'}">${hint}</div>`;
    }

    const group = (id, title, body, { open = false, meta = '' } = {}) =>
      `<details class="ctl-group" data-group="${id}"${open ? ' open' : ''}><summary>${title}${meta ? `<small data-meta="${id}">${meta}</small>` : `<small data-meta="${id}"></small>`}</summary><div class="ctl-body">${body}</div></details>`;

    const plainTitle = t => String(t || '').replace(/[\[\]]/g, '').replace(/\s*\n\s*/g, ' ').trim();
    const EDIT_ICON = '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';

    function renderControls() {
      const s = settings();
      const tpl = getTemplate(state.tpl);
      const openGroups = new Set([...controlsEl.querySelectorAll('details[open]')].map(d => d.dataset.group));
      const isOpen = (id, dflt) => controlsEl.children.length ? openGroups.has(id) : dflt;

      const tplTiles = TEMPLATES.map(t => {
        const P = t.status === 'ready' ? buildProject(t.id, settings(t.id)) : null;
        return `<button class="tpl-tile" type="button" data-tpl="${t.id}" aria-pressed="${t.id === tpl.id}" ${t.status !== 'ready' ? 'disabled style="opacity:.6;cursor:default"' : ''}>
          <span class="tpl-tile-icon"><svg viewBox="0 0 24 24">${TPL_ICONS[t.id] || ''}</svg></span>
          <span style="min-width:0"><span class="tpl-tile-name">${esc(t.name)}</span><span class="tpl-tile-blurb">${esc(t.blurb)}</span></span>
          <span class="tpl-tile-len">${P ? `${P.duration.toFixed(1)} s` : 'Next'}</span>
        </button>`;
      }).join('');

      // Scenes (Feature Showcase)
      const sceneRow = (num, key, name, sub, len, on, body, toggle = true, toggleKey = `on_${key}`) => `
        <div class="sc-row${on ? '' : ' off'}" data-scene="${key}">
          <div class="sc-head">
            <span class="sc-num">${num}</span>
            <span class="sc-name">${esc(name)}<small>${esc(sub)}</small></span>
            <span class="sc-len">${len}</span>
            ${toggle ? `<span class="switch" title="Include this scene"><input type="checkbox" data-key="${toggleKey}" ${on ? 'checked' : ''} aria-label="Include ${esc(name)}"><span></span></span>` : ''}
            <button class="sc-edit" type="button" data-edit="${key}" aria-label="Edit ${esc(name)}">${EDIT_ICON}</button>
          </div>
          <div class="sc-body">${body}</div>
        </div>`;

      let scenesHtml = '';
      if (tpl.id === 'showcase') {
        let n = 1;
        const rowsHtml = [];
        rowsHtml.push(sceneRow(n++, 'hook', 'Hook', 'Logo, label and headline', `${(SCENE_TYPES.hook.beats * BEAT).toFixed(1)} s`, true,
          [fieldHtml({ key: 'hookChip', label: 'Label', max: 28 }, s), fieldHtml({ key: 'hookTitle', label: 'Headline', type: 'textarea', rows: 2, max: 48, hint: 'New line = line break. Wrap words in <b>[brackets]</b> to make them purple.' }, s), fieldHtml({ key: 'hookSub', label: 'Subline', max: 40 }, s)].join(''), false));
        tpl.sceneKeys.forEach(key => {
          const t = SCENE_TYPES[key];
          const on = !!s[`on_${key}`];
          const cap = capFor(s, key);
          const fields = [
            fieldHtml({ key: `cap_${key}_label`, label: 'Label', max: 28 }, { ...s, [`cap_${key}_label`]: cap.label }),
            fieldHtml({ key: `cap_${key}_title`, label: 'Headline', type: 'textarea', rows: 2, max: 44, hint: 'Two short lines read best. <b>[Brackets]</b> = purple.' }, { ...s, [`cap_${key}_title`]: cap.title })
          ];
          if (key === 'broker') fields.push(fieldHtml({ key: 'brokerLine', label: 'Card line', max: 56, hint: 'Always shown with a Coming Soon label. Name no broker until the integration is live.' }, s));
          rowsHtml.push(sceneRow(on ? n++ : '·', key, t.name, plainTitle(cap.title), `${(t.beats * BEAT).toFixed(1)} s`, on, fields.join('')));
        });
        rowsHtml.push(sceneRow(n, 'end', s.showPricing ? 'Offer + call to action' : 'Call to action', 'Edit in Offer below', `${(SCENE_TYPES.end.beats * BEAT).toFixed(1)} s`, true, '<div class="field-hint">Prices, codes, button and website are under <b>Offer and call to action</b>.</div>', false));
        scenesHtml = `<div class="sc-list">${rowsHtml.join('')}</div><div class="sc-total" id="scTotal"></div>`;
      }
      if (tpl.id === 'spotlight') {
        const f = FEATURE_KEYS.includes(s.spFeature) ? s.spFeature : 'dashboard';
        const sp = spotFor(s, f);
        const v = { ...s, [`sp_${f}_chip`]: sp.chip, [`sp_${f}_hook`]: sp.hook, [`sp_${f}_c1`]: sp.callouts[0], [`sp_${f}_c2`]: sp.callouts[1], [`sp_${f}_c3`]: sp.callouts[2] };
        scenesHtml = `
          ${fieldHtml({ key: 'spFeature', label: 'Feature', type: 'select', options: FEATURE_KEYS.map(k => ({ id: k, name: FEATURE_NAMES[k] })) }, s)}
          ${fieldHtml({ key: `sp_${f}_chip`, label: 'Label', max: 28 }, v)}
          ${fieldHtml({ key: `sp_${f}_hook`, label: 'Hook headline', type: 'textarea', rows: 2, max: 48, hint: 'New line = line break. <b>[Brackets]</b> = purple.' }, v)}
          ${[1, 2, 3].map(i => fieldHtml({ key: `sp_${f}_c${i}`, label: `Callout ${i}`, max: 40, hint: i === 1 ? 'Each callout points at a detail on the screen, in this order. Describe only what the feature does.' : '' }, v)).join('')}
          <div class="sc-total" id="scTotal"></div>`;
      }
      if (tpl.id === 'pricing') {
        let n = 2;
        const rows2 = FEATURE_KEYS.map(f => {
          const on = !!s[`pp_on_${f}`];
          const title = s[`pp_${f}_title`] ?? MINI_TITLES[f];
          return sceneRow(on ? n++ : '·', `pp_${f}`, FEATURE_NAMES[f], plainTitle(title), '1.0 s', on,
            fieldHtml({ key: `pp_${f}_title`, label: 'Headline', type: 'textarea', rows: 2, max: 40 }, { ...s, [`pp_${f}_title`]: title }), true, `pp_on_${f}`);
        }).join('');
        scenesHtml = `
          ${fieldHtml({ key: 'ppChip', label: 'Hook label', max: 28 }, s)}
          ${fieldHtml({ key: 'ppTitle', label: 'Hook headline', type: 'textarea', rows: 2, max: 48, hint: 'New line = line break. <b>[Brackets]</b> = purple.' }, s)}
          ${fieldHtml({ key: 'ppSub', label: 'Hook subline', max: 60, hint: '<b>{code}</b> is replaced by your promo codes.' }, s)}
          ${fieldHtml({ key: 'ppLabel', label: 'Label on each feature', max: 28, hint: 'Pro includes every feature shown. Keep it true if you change it.' }, s)}
          <div class="sc-list">${rows2}</div><div class="sc-total" id="scTotal"></div>`;
      }

      // Offer + CTA + verification
      const offerHtml = `
        ${fieldHtml({ key: 'showPricing', label: 'Show pricing on the end card', type: 'toggle' }, s)}
        <div class="field-row">${fieldHtml({ key: 'regularLabel', label: 'Regular label', max: 16 }, s)}${fieldHtml({ key: 'regular', label: 'Regular price', max: 20, mono: true }, s)}</div>
        <div class="field-row">${fieldHtml({ key: 'promo', label: 'Promo price', max: 20, mono: true, hint: 'Text after "/" is set smaller.' }, s)}${fieldHtml({ key: 'codeLabel', label: 'Code label', max: 16 }, s)}</div>
        ${fieldHtml({ key: 'codes', label: 'Promo codes', max: 40, mono: true, hint: 'Comma separated, up to 3. Shown exactly as typed, in capitals.' }, s)}
        <div class="ctl-note" id="discountNote"></div>
        ${fieldHtml({ key: 'plan', label: 'Plan label', max: 24, hint: 'Small pill under the wordmark. Leave empty to hide it.' }, s)}
        ${fieldHtml({ key: 'endHeadline', label: 'Headline when pricing is hidden', type: 'textarea', rows: 2, max: 48 }, s)}
        ${fieldHtml({ key: 'cta', label: 'Button text', max: 28 }, s)}
        ${fieldHtml({ key: 'url', label: 'Website', max: 28 }, s)}
        ${fieldHtml({ key: 'fine', label: 'Fine print', max: 70 }, s)}
        <div class="verify-box" id="verifyBox">
          <label class="toggle-row"><span>Prices and codes verified</span><span class="switch"><input type="checkbox" id="verifyToggle"><span></span></span></label>
          <div class="verify-status" id="verifyStatus"></div>
        </div>`;

      const demoHtml = `
        <div class="ctl-note">Numbers inside app screens are examples. Keep them believable, never present them as real results.</div>
        ${fieldHtml({ key: 'showDemoNote', label: 'Show the example data note', type: 'toggle' }, s)}
        ${fieldHtml({ key: 'demoNote', label: 'Note text', max: 48 }, s)}
        <div class="field-row">${fieldHtml({ key: 'dPnl', label: 'Total PNL ($)', max: 12 }, s)}${fieldHtml({ key: 'dTrades', label: 'Total trades', max: 6 }, s)}</div>
        <div class="field-row">${fieldHtml({ key: 'dWinRate', label: 'Win rate (%)', max: 5 }, s)}${fieldHtml({ key: 'dRR', label: 'Avg R:R', max: 6 }, s)}</div>
        ${fieldHtml({ key: 'dClarity', label: 'Clarity Score (%)', max: 5 }, s)}
        ${fieldHtml({ key: 'dStrategies', label: 'Strategies', type: 'textarea', rows: 3, max: 300, hint: 'Name | trades | win rate % | rules followed % | PNL. The first is the top strategy.' }, s)}
        <div class="field-row">${fieldHtml({ key: 'dFirm', label: 'Prop firm', max: 28 }, s)}${fieldHtml({ key: 'dProgram', label: 'Program', max: 28 }, s)}</div>
        <div class="field-hint">Firm names belong to their owners. Showing support is fine; don't imply a partnership.</div>
        <div class="field-row">${fieldHtml({ key: 'dProfit', label: 'Evaluation profit ($)', max: 8 }, s)}${fieldHtml({ key: 'dTarget', label: 'Profit target ($)', max: 8 }, s)}</div>
        <div class="field-row">${fieldHtml({ key: 'dMentorEmail', label: 'Mentor email shown', max: 32, hint: 'A placeholder, never a real address.' }, s)}${fieldHtml({ key: 'dTrader', label: 'Trader username', max: 20 }, s)}</div>
        ${fieldHtml({ key: 'dNote', label: 'Review request note', max: 48 }, s)}
        ${fieldHtml({ key: 'dPrint1', label: 'Print 1', max: 120, hint: 'Username | bio | strategy | asset | PNL | time | R | replies' }, s)}
        ${fieldHtml({ key: 'dPrint1Caption', label: 'Print 1 caption', type: 'textarea', rows: 2, max: 140 }, s)}
        ${fieldHtml({ key: 'dPrint2', label: 'Print 2', max: 120 }, s)}
        ${fieldHtml({ key: 'dPrint2Hide', label: 'Hide Print 2 PNL', type: 'toggle' }, s)}`;

      const shotsHtml = `
        <div class="ctl-note">Optional. Drop in a real screenshot of the app (with demo data) to replace a built screen. Kept in this browser only.</div>
        ${SHOT_SCENES.map(x => `<div class="field"><span class="field-label">${esc(x.name)}</span><div class="upload-row">
          <label class="btn" style="min-height:32px"><input type="file" accept="image/png,image/jpeg,image/webp" data-shot="${x.key}" hidden>${shotImages[x.key] ? 'Replace' : 'Upload'}</label>
          ${shotImages[x.key] ? `<button class="btn btn-quiet" type="button" data-shot-clear="${x.key}" style="min-height:32px">Use built screen</button><span class="upload-status">Screenshot in use</span>` : '<span class="upload-status">Built UI 2.0 screen</span>'}
        </div></div>`).join('')}`;

      const audioHtml = `
        ${fieldHtml({ key: 'music', label: 'Music', type: 'seg', options: [{ id: 'synth', name: 'Original score' }, { id: 'upload', name: 'Licensed track' }, { id: 'off', name: 'Off' }] }, s)}
        <div class="ctl-note" id="musicNote"></div>
        <div id="trackBox"${s.music === 'upload' ? '' : ' hidden'}>
          <div class="field"><span class="field-label">Track</span><div class="upload-row">
            <label class="btn" style="min-height:32px"><input type="file" accept="audio/*" id="trackInput" hidden>${userTrack ? 'Replace' : 'Upload audio'}</label>
            <span class="upload-status" id="trackStatus">${userTrack ? esc(userTrack.name) : 'MP3, WAV, M4A or AAC'}</span>
          </div></div>
          ${fieldHtml({ key: 'trackStart', label: 'Start the track at (seconds)', type: 'range', min: 0, max: 60, step: 0.5, unit: ' s' }, { ...s, trackStart: s.trackStart || 0 })}
          ${fieldHtml({ key: 'licenseOk', label: 'I have a license to use this track in ads', type: 'toggle', small: 'Required before exporting with this track.' }, s)}
          ${fieldHtml({ key: 'licenseNote', label: 'License note (source, license ID)', max: 80, hint: 'Saved here and written into the MP4 metadata so the license travels with the file.' }, s)}
        </div>
        ${fieldHtml({ key: 'musicVol', label: 'Music volume', type: 'range', min: 0, max: 100, unit: '%' }, s)}
        ${fieldHtml({ key: 'sfx', label: 'Sound effects', type: 'toggle', small: 'Whooshes on cuts, taps, pops and the price reveal.' }, s)}
        ${fieldHtml({ key: 'sfxVol', label: 'Sound effects volume', type: 'range', min: 0, max: 100, unit: '%' }, s)}`;

      const exportHtml = `
        ${fieldHtml({ key: 'quality', label: 'Quality', type: 'seg', options: [{ id: 'high', name: 'High · 16 Mbps' }, { id: 'standard', name: 'Standard · 10 Mbps' }], hint: 'Instagram, TikTok and YouTube re-encode uploads. High keeps small UI text sharp after that.' }, s)}
        <div class="ctl-note" id="encoderNote">Checking what this browser can export...</div>
        <button class="btn btn-primary" type="button" id="exportBtn2" style="min-height:42px">Export MP4 · 1080 × 1920 · 30 fps</button>`;

      controlsEl.innerHTML = [
        group('template', 'Template', `<div class="tpl-list">${tplTiles}</div>`, { open: isOpen('template', true) }),
        group('scenes', tpl.id === 'spotlight' ? 'Spotlight' : tpl.id === 'pricing' ? 'Hook and montage' : 'Scenes', scenesHtml, { open: isOpen('scenes', true) }),
        group('offer', 'Offer and call to action', offerHtml, { open: isOpen('offer', true) }),
        group('demo', 'Example data', demoHtml, { open: isOpen('demo', false) }),
        group('shots', 'Screenshots', shotsHtml, { open: isOpen('shots', false) }),
        group('audio', 'Music and sound', audioHtml, { open: isOpen('audio', false) }),
        group('export', 'Export', exportHtml, { open: isOpen('export', true) }),
        `<div class="ctl-footer"><button class="btn btn-quiet" type="button" id="resetTpl">Reset this template</button><button class="btn btn-quiet" type="button" id="resetAll">Reset everything</button></div>`
      ].join('');
      refreshDerived();
      updateExportState();
    }

    // Small live readouts that don't need a full re-render
    function refreshDerived() {
      const s = settings();
      const P = buildProject(state.tpl, s);
      const tot = $('#scTotal');
      if (tot) {
        const range = state.tpl === 'showcase' ? [20, 25] : [9, 15];
        const ok = P.duration >= range[0] && P.duration <= range[1];
        tot.innerHTML = `<span>Total length</span><b class="${ok ? '' : 'warn'}">${P.duration.toFixed(1)} s${ok ? '' : ` · aim for ${range[0]} to ${range[1]} s`}</b>`;
      }
      const dn = $('#discountNote');
      if (dn) {
        const chk = discountCheck(s);
        dn.className = `ctl-note${/not lower/.test(chk) ? ' warn' : ''}`;
        dn.innerHTML = chk ? `${esc(chk)} Codes shown: <b>${esc(pricingOf(s).codes.join(', ') || 'none')}</b>.` : 'Enter both prices to check the discount.';
      }
      const ok = pricingVerified(s);
      const vb = $('#verifyBox');
      if (vb) {
        vb.classList.toggle('ok', ok);
        $('#verifyToggle').checked = ok;
        const when = s.verifiedAt ? new Date(s.verifiedAt) : null;
        $('#verifyStatus').innerHTML = !s.showPricing
          ? 'Pricing is hidden on the end card, so there is nothing to verify.'
          : ok
            ? `<b>Verified</b> ${when ? esc(when.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })) : ''}. Changing any price, code, label or the fine print clears this.`
            : '<b>Not verified.</b> Exports are marked DRAFT until you check the live checkout: regular price, the price after each code, and that every code is active. Then switch this on.';
        vb.hidden = false;
      }
      const meta = $('[data-meta="offer"]');
      if (meta) {
        meta.className = s.showPricing ? (ok ? 'ok' : 'warn') : '';
        meta.textContent = s.showPricing ? (ok ? 'Verified' : 'Not verified') : 'Pricing hidden';
      }
      const mn = $('#musicNote');
      if (mn) {
        mn.innerHTML = s.music === 'synth'
          ? 'An original score made in this browser for Tradeprint. No third-party music, so no license needed.'
          : s.music === 'upload'
            ? 'Use only music you have a commercial license for (for example an Artlist or Epidemic Sound license that covers ads). Platform music libraries are not cleared for exported ads.'
            : 'No music. Sound effects still play if they are on.';
      }
      const tb = $('#trackBox');
      if (tb) tb.hidden = s.music !== 'upload';
      const am = $('[data-meta="audio"]');
      if (am) am.textContent = s.music === 'synth' ? 'Original score' : s.music === 'upload' ? (userTrack ? 'Licensed track' : 'No track yet') : 'Music off';
      const sm = $('[data-meta="shots"]');
      if (sm) { const n = Object.keys(shotImages).length; sm.textContent = n ? `${n} in use` : ''; }
      const scm = $('[data-meta="scenes"]');
      if (scm) scm.textContent = `${P.scenes.length} scenes · ${P.duration.toFixed(1)} s`;
    }

    /* ---------- events ---------- */
    controlsEl.addEventListener('input', e => {
      const el = e.target;
      const key = el.dataset.key;
      if (!key) return;
      if (el.type === 'checkbox') return;
      let v = el.value;
      if (el.type === 'range') {
        v = parseFloat(v);
        const out = controlsEl.querySelector(`[data-out="${key}"]`);
        if (out) out.textContent = `${v}${key === 'trackStart' ? ' s' : '%'}`;
      }
      const cnt = controlsEl.querySelector(`[data-count="${key}"]`);
      if (cnt) {
        const max = parseInt(cnt.textContent.split('/')[1], 10);
        cnt.textContent = `${String(v).length}/${max}`;
        cnt.classList.toggle('over', String(v).length > max);
      }
      setVal(key, v);
      if (/^cap_\w+_title$/.test(key)) {
        const row = el.closest('.sc-row');
        const sub = row && row.querySelector('.sc-name small');
        if (sub) sub.textContent = plainTitle(v);
      }
    });

    controlsEl.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'verifyToggle') {
        const s = settings();
        if (el.checked) {
          setVal('verifiedSig', pricingSig(s), { rebuildNow: true });
          setVal('verifiedAt', new Date().toISOString(), { silent: true });
        } else {
          setVal('verifiedSig', '', { rebuildNow: true });
          setVal('verifiedAt', '', { silent: true });
        }
        return;
      }
      if (el.dataset.shot) { handleShot(el.dataset.shot, el.files && el.files[0]); return; }
      if (el.id === 'trackInput') { handleTrack(el.files && el.files[0]); return; }
      if (el.tagName === 'SELECT' && el.dataset.key) {
        setVal(el.dataset.key, el.value, { rebuildNow: true });
        renderControls();
        return;
      }
      const key = el.dataset.key;
      if (!key || el.type !== 'checkbox') return;
      setVal(key, el.checked, { rebuildNow: true });
      if (/^(pp_)?on_/.test(key) || key === 'showPricing') renderControls();
    });

    controlsEl.addEventListener('click', e => {
      const tile = e.target.closest('[data-tpl]');
      if (tile && !tile.disabled) {
        if (tile.dataset.tpl !== state.tpl) {
          state.tpl = tile.dataset.tpl;
          saveState();
          renderControls();
          scheduleRebuild(0);
        }
        return;
      }
      const seg = e.target.closest('[data-seg]');
      if (seg) {
        setVal(seg.dataset.seg, seg.dataset.val, { rebuildNow: true });
        seg.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === seg)));
        if (seg.dataset.seg === 'quality') updateExportState();
        return;
      }
      const edit = e.target.closest('[data-edit]');
      if (edit) { edit.closest('.sc-row').classList.toggle('open'); return; }
      const clear = e.target.closest('[data-shot-clear]');
      if (clear) {
        delete shotImages[clear.dataset.shotClear];
        try { localStorage.removeItem(SHOT_KEY_PREFIX + clear.dataset.shotClear); } catch (err) {}
        renderControls();
        scheduleRebuild(0);
        return;
      }
      if (e.target.id === 'resetTpl') {
        if (!confirm('Reset the scenes and hook text of this template to the defaults?')) return;
        delete state.tpls[state.tpl];
        saveState();
        renderControls();
        scheduleRebuild(0);
        return;
      }
      if (e.target.id === 'resetAll') {
        if (!confirm('Reset every setting, including prices, codes, example data and audio?')) return;
        state.shared = {};
        state.tpls = {};
        saveState();
        renderControls();
        scheduleRebuild(0);
        return;
      }
      if (e.target.id === 'exportBtn2') runExport();
    });

    // Screenshots: scaled down and kept in this browser (localStorage), like the Studio's uploads
    async function handleShot(key, file) {
      if (!file) return;
      try {
        const bmp = await createImageBitmap(file);
        const maxW = 1600;
        const k = Math.min(1, maxW / bmp.width);
        const c = document.createElement('canvas');
        c.width = Math.round(bmp.width * k);
        c.height = Math.round(bmp.height * k);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        shotImages[key] = c;
        try {
          const url = c.toDataURL('image/webp', 0.92);
          localStorage.setItem(SHOT_KEY_PREFIX + key, url.startsWith('data:image/webp') ? url : c.toDataURL('image/jpeg', 0.9));
        } catch (err) { console.warn('[Video Studio] Screenshot not saved (storage full). It stays for this session.'); }
        renderControls();
        scheduleRebuild(0);
      } catch (err) {
        alert('That image could not be read. Try a PNG or JPEG.');
      }
    }

    async function loadShots() {
      await Promise.all(SHOT_SCENES.map(async x => {
        let url = null;
        try { url = localStorage.getItem(SHOT_KEY_PREFIX + x.key); } catch (err) {}
        if (!url) return;
        try {
          const img = new Image();
          img.src = url;
          await img.decode();
          shotImages[x.key] = img;
        } catch (err) {}
      }));
    }

    async function handleTrack(file) {
      if (!file) return;
      const st = $('#trackStatus');
      if (st) st.textContent = 'Reading...';
      try {
        await loadUserTrack(file);
        setVal('licenseOk', false, { silent: true });
        renderControls();
        scheduleRebuild(0);
      } catch (err) {
        if (st) st.textContent = 'That file could not be decoded. Try MP3, WAV or M4A.';
      }
    }

    /* ============================================================
       15. MP4 EXPORT + VERIFICATION
       Frames come from renderFrame() (the preview's composition), are
       encoded by the browser's H.264 encoder (WebCodecs) and muxed with
       Mediabunny into an MP4 with the index at the front. AAC comes
       from the browser, or from Mediabunny's AAC encoder (WASM) when
       the browser has none. The finished file is then opened again
       and checked before it is offered for download.
       ============================================================ */
    const exportSheet = $('#exportSheet');
    const exportBody = $('#exportBody');
    let exporting = false;
    let abortExport = null;
    let resultUrl = '';
    let encoderSupport = null;   // { avc, aac, reason }

    class ExportCancelled extends Error {}

    // Yields to the page without timer throttling (keeps background tabs moving)
    const yieldChannel = new MessageChannel();
    const yieldQueue = [];
    yieldChannel.port1.onmessage = () => { const r = yieldQueue.shift(); if (r) r(); };
    const yieldToUi = () => new Promise(r => { yieldQueue.push(r); yieldChannel.port2.postMessage(0); });

    async function probeEncoders() {
      if (encoderSupport) return encoderSupport;
      if (!window.isSecureContext) return (encoderSupport = { avc: false, aac: false, reason: 'MP4 export needs a secure (https) page.' });
      if (!window.VideoEncoder) return (encoderSupport = { avc: false, aac: false, reason: 'This browser has no WebCodecs video encoder. Use Chrome or Edge on a computer.' });
      let avc = false, aac = false;
      for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.640032']) {
        try { if ((await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate: 16e6, framerate: FPS })).supported) { avc = true; break; } } catch (err) {}
      }
      try { aac = !!window.AudioEncoder && (await AudioEncoder.isConfigSupported({ codec: 'mp4a.40.2', sampleRate: AUDIO_SR, numberOfChannels: 2, bitrate: 192000 })).supported; } catch (err) {}
      encoderSupport = { avc, aac, reason: avc ? '' : "This browser can't encode H.264 video at 1080 × 1920. Use Chrome or Edge on a computer." };
      return encoderSupport;
    }

    function updateExportState() {
      const busy = exporting || !project;
      const btns = [$('#exportBtn'), $('#exportBtn2')].filter(Boolean);
      btns.forEach(b => { b.disabled = busy || (encoderSupport && !encoderSupport.avc); });
      const note = $('#encoderNote');
      if (note && encoderSupport) {
        note.className = `ctl-note ${encoderSupport.avc ? 'ok' : 'warn'}`;
        note.innerHTML = encoderSupport.avc
          ? `This browser can export MP4: <b>H.264</b> video and <b>AAC</b> audio${encoderSupport.aac ? '' : ' (AAC is added by a small encoder that loads on export)'}.`
          : esc(encoderSupport.reason);
      }
    }

    function exportFileName(P, draft) {
      const d = new Date();
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const slug = P.tplName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      return `tradeprint-${slug}-1080x1920-30fps-${date}${draft ? '-DRAFT' : ''}.mp4`;
    }

    // The export itself. Also used by the debug hook for automated checks.
    async function exportMp4(P, s, { onProgress = () => {}, signal = { cancelled: false }, compat = false } = {}) {
      const stage = (name, extra = {}) => onProgress({ stage: name, ...extra });
      stage('prepare');
      const MB = await loadDep('mediabunny');
      window.Mediabunny = window.Mediabunny || MB;
      const bitrate = compat ? 8e6 : s.quality === 'standard' ? 10e6 : 16e6;
      const hw = compat ? 'prefer-software' : 'no-preference';
      if (!(await MB.canEncodeVideo('avc', { width: W, height: H, bitrate, frameRate: FPS }))) {
        const e = new Error("This browser can't encode H.264 video at 1080 × 1920.");
        e.code = 'NO_AVC';
        throw e;
      }
      let aacEngine = 'browser';
      if (!(await MB.canEncodeAudio('aac', { numberOfChannels: 2, sampleRate: AUDIO_SR, bitrate: 192e3 }))) {
        const ext = await loadDep('aac');
        ext.registerAacEncoder();
        aacEngine = 'Mediabunny AAC (WASM)';
        if (!(await MB.canEncodeAudio('aac', { numberOfChannels: 2, sampleRate: AUDIO_SR, bitrate: 192e3 }))) {
          const e = new Error('No AAC audio encoder is available in this browser.');
          e.code = 'NO_AAC';
          throw e;
        }
      }
      const audio = await renderAudio(P, s, userTrack);
      if (signal.cancelled) throw new ExportCancelled();

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new MB.BufferTarget() });
      const video = new MB.CanvasSource(canvas, { codec: 'avc', quality: new MB.Quality({ bitrate }), keyFrameInterval: 1, hardwareAcceleration: hw, latencyMode: 'quality' });
      output.addVideoTrack(video, { frameRate: FPS });
      const audioSrc = new MB.AudioBufferSource({ codec: 'aac', quality: new MB.Quality({ bitrate: 192e3 }) });
      output.addAudioTrack(audioSrc);
      const music = s.music === 'synth' ? 'Original score (Tradeprint)' : s.music === 'upload' && userTrack ? `${userTrack.name}${s.licenseNote ? ` · License: ${s.licenseNote}` : ''}` : 'None';
      try {
        output.setMetadataTags({ title: `Tradeprint · ${P.tplName}`, comment: `Made with Tradeprint Video Studio. Music: ${music}. App screens show example data.${P.draft ? ' DRAFT: pricing not verified.' : ''}`, date: new Date() });
      } catch (err) {}
      await output.start();

      let cancelled = false;
      try {
        stage('audio');
        await audioSrc.add(audio.buffer);
        audioSrc.close();
        stage('video', { done: 0, total: P.frames });
        const t0 = performance.now();
        for (let i = 0; i < P.frames; i++) {
          if (signal.cancelled) { cancelled = true; break; }
          renderFrame(canvas, i / FPS, P);
          await video.add(i / FPS, 1 / FPS);
          if (i % 2 === 1 || i === P.frames - 1) {
            const el = (performance.now() - t0) / 1000;
            onProgress({ stage: 'video', done: i + 1, total: P.frames, eta: (el / (i + 1)) * (P.frames - i - 1) });
            await yieldToUi();
          }
        }
        if (cancelled) { await output.cancel(); throw new ExportCancelled(); }
        video.close();
        stage('finish');
        await output.finalize();
      } catch (err) {
        if (!(err instanceof ExportCancelled)) { try { await output.cancel(); } catch (e) {} }
        throw err;
      }
      const blob = new Blob([output.target.buffer], { type: 'video/mp4' });
      return { blob, bitrate, aacEngine, audioMeta: audio.meta, music };
    }

    /* ---------- verification ---------- */
    function waitEvent(el, ok, bad, ms) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { cleanup(); reject(new Error('timed out')); }, ms);
        const okFn = () => { cleanup(); resolve(); };
        const badFn = () => { cleanup(); reject(new Error((el.error && el.error.message) || 'media error')); };
        const cleanup = () => { clearTimeout(timer); el.removeEventListener(ok, okFn); if (bad) el.removeEventListener(bad, badFn); };
        el.addEventListener(ok, okFn);
        if (bad) el.addEventListener(bad, badFn);
      });
    }

    function smallPixels(src, w = 72, h = 128) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const g = c.getContext('2d', { willReadFrequently: true });
      g.drawImage(src, 0, 0, w, h);
      return g.getImageData(0, 0, w, h).data;
    }

    async function verifyMp4(blob, P) {
      const checks = [];
      const add = (status, text) => checks.push({ status, text });
      const MB = await loadDep('mediabunny');
      let codecStr = 'avc1.640028';
      // 1. Read the file back
      try {
        const input = new MB.Input({ source: new MB.BlobSource(blob), formats: MB.ALL_FORMATS });
        const fmt = await input.getFormat();
        const vt = await input.getPrimaryVideoTrack();
        const at = await input.getPrimaryAudioTrack();
        const dur = await input.computeDuration();
        add(/mp4/i.test(fmt.name || '') ? 'ok' : 'fail', `Container: <b>${esc(fmt.name || 'unknown')}</b>`);
        if (!vt) { add('fail', 'No video track found.'); }
        else {
          codecStr = (await vt.getCodecParameterString()) || codecStr;
          const st = await vt.computePacketStats();
          add(vt.codec === 'avc' ? 'ok' : 'fail', `Video: <b>H.264</b> (${esc(codecStr)})`);
          add(vt.displayWidth === W && vt.displayHeight === H ? 'ok' : 'fail', `Size: <b>${vt.displayWidth} × ${vt.displayHeight}</b>`);
          add(Math.abs(st.averagePacketRate - FPS) < 0.2 ? 'ok' : 'fail', `Frame rate: <b>${st.averagePacketRate.toFixed(2)} fps</b>`);
          add(st.packetCount === P.frames ? 'ok' : 'fail', `Frames: <b>${st.packetCount}</b> of ${P.frames}`);
          add('ok', `Video bitrate: <b>${(st.averageBitrate / 1e6).toFixed(1)} Mbps</b>`);
        }
        if (!at) add('fail', 'No audio track found.');
        else add(at.codec === 'aac' && at.sampleRate === AUDIO_SR && at.numberOfChannels === 2 ? 'ok' : 'warn', `Audio: <b>AAC</b>, ${at.sampleRate / 1000} kHz, ${at.numberOfChannels === 2 ? 'stereo' : at.numberOfChannels + ' ch'}`);
        add(Math.abs(dur - P.duration) < 0.12 ? 'ok' : 'fail', `Duration: <b>${dur.toFixed(2)} s</b> (expected ${P.duration.toFixed(2)} s)`);
        const head = new Uint8Array(await blob.slice(0, 4096).arrayBuffer());
        const txt = String.fromCharCode.apply(null, head);
        const moov = txt.indexOf('moov'), mdat = txt.indexOf('mdat');
        add(moov >= 0 && (mdat < 0 || moov < mdat) ? 'ok' : 'warn', moov >= 0 && (mdat < 0 || moov < mdat) ? 'Fast start: index at the front (streams before it finishes downloading)' : 'Index is at the end of the file');
      } catch (err) {
        add('fail', `The file could not be read back: ${esc(err.message || err)}`);
      }
      // 2. Play it in a <video> element and compare frames with the composition
      const url = URL.createObjectURL(blob);
      const v = document.createElement('video');
      v.muted = true;
      v.playsInline = true;
      v.preload = 'auto';
      v.style.cssText = 'position:fixed;left:-9999px;top:0;width:108px;height:192px;';
      document.body.appendChild(v);
      try {
        const can = v.canPlayType(`video/mp4; codecs="${codecStr}, mp4a.40.2"`);
        v.src = url;
        await waitEvent(v, 'loadedmetadata', 'error', 10000);
        add(v.videoWidth === W && v.videoHeight === H ? 'ok' : 'fail', `Opens in this browser's player${can ? ` (canPlayType: ${esc(can)})` : ''}`);
        await v.play();
        const t0 = performance.now();
        while (v.currentTime < 0.3 && performance.now() - t0 < 4000) await new Promise(r => setTimeout(r, 50));
        v.pause();
        add(v.currentTime >= 0.3 ? 'ok' : 'fail', v.currentTime >= 0.3 ? 'Plays: playback advanced normally' : 'Playback did not start');
        const ref = document.createElement('canvas');
        ref.width = 270;
        ref.height = 480;
        const marks = [0.8, P.duration * 0.5, P.duration - 0.6].map(t => Math.round(t * FPS));
        let worst = 0, blank = false;
        for (const fi of marks) {
          v.currentTime = (fi + 0.5) / FPS;
          await waitEvent(v, 'seeked', 'error', 6000);
          if (v.requestVideoFrameCallback) await new Promise(r => { v.requestVideoFrameCallback(() => r()); setTimeout(r, 300); });
          const a = smallPixels(v);
          renderFrame(ref, fi / FPS, P);
          const b = smallPixels(ref);
          let diff = 0, lum = 0, lum2 = 0;
          for (let i = 0; i < a.length; i += 4) {
            diff += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
            const l = (a[i] + a[i + 1] + a[i + 2]) / 3;
            lum += l;
            lum2 += l * l;
          }
          const n = a.length / 4;
          const mean = diff / (n * 3);
          const variance = lum2 / n - (lum / n) * (lum / n);
          if (variance < 4) blank = true;
          worst = Math.max(worst, mean);
        }
        add(!blank ? 'ok' : 'fail', !blank ? 'Decoded frames have picture content (not blank)' : 'A decoded frame came back blank');
        add(worst < 9 ? 'ok' : worst < 16 ? 'warn' : 'fail', `Matches the preview at ${marks.length} points: ${Math.max(0, 100 - worst / 2.55).toFixed(1)}% similar`);
      } catch (err) {
        add('fail', `This browser could not play the file back: ${esc(err.message || err)}`);
      } finally {
        v.removeAttribute('src');
        v.load();
        v.remove();
        URL.revokeObjectURL(url);
      }
      const passed = checks.every(c => c.status !== 'fail');
      return { checks, passed, warnings: checks.some(c => c.status === 'warn') };
    }

    /* ---------- export UI ---------- */
    const STEPS = [
      ['prepare', 'Prepare encoder and audio'],
      ['audio', 'Encode audio (AAC)'],
      ['video', 'Render and encode frames'],
      ['finish', 'Finish the MP4'],
      ['verify', 'Verify the file plays']
    ];

    function openExportSheet(html, title = 'Export MP4') {
      $('#exportTitle').textContent = title;
      exportBody.innerHTML = html;
      exportSheet.hidden = false;
    }

    function closeExportSheet() {
      if (exporting) return;
      exportSheet.hidden = true;
      exportBody.innerHTML = '';
      if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = ''; }
    }

    $('#exportClose').addEventListener('click', () => { if (exporting) { if (abortExport) abortExport(); } else closeExportSheet(); });
    exportSheet.addEventListener('click', e => { if (e.target === exportSheet && !exporting) closeExportSheet(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !exportSheet.hidden && !exporting) closeExportSheet(); });

    function progressHtml(P) {
      return `
        <div class="sheet-copy"><b>${esc(P.tplName)}</b> · ${P.duration.toFixed(1)} s · ${P.frames} frames · 1080 × 1920 · 30 fps. Keep this tab open while it runs.</div>
        <div class="vs-steps">${STEPS.map(([id, label]) => `<div class="vs-step" data-step="${id}"><i></i><span>${label}</span></div>`).join('')}</div>
        <div class="vs-progress"><i id="exProg"></i></div>
        <div class="vs-progress-row"><span id="exLabel">Starting...</span><span id="exEta"></span></div>
        <div class="sheet-actions"><button class="btn" type="button" id="exCancel">Cancel</button></div>`;
    }

    function markStep(id) {
      const idx = STEPS.findIndex(s => s[0] === id);
      exportBody.querySelectorAll('.vs-step').forEach((el, i) => {
        el.classList.toggle('done', i < idx);
        el.classList.toggle('active', i === idx);
      });
    }

    function friendlyError(err) {
      const msg = String((err && err.message) || err || 'Unknown error');
      if (err && err.code === 'NO_AVC') return { text: "This browser can't encode H.264 video at 1080 × 1920.", tip: 'Use Chrome or Edge on a Mac or Windows computer.' };
      if (err && err.code === 'NO_AAC') return { text: 'No AAC audio encoder is available here.', tip: 'Use Chrome or Edge on a computer, or check your connection (the AAC encoder downloads on demand).' };
      if (/could not be loaded/i.test(msg)) return { text: msg, tip: 'The export libraries load from this site or jsDelivr. Check your connection, then try again.' };
      if (/memory|allocation|RangeError/i.test(msg)) return { text: 'The browser ran out of memory while encoding.', tip: 'Close other tabs and try Standard quality.' };
      if (/encod|codec|VideoEncoder|configure/i.test(msg)) return { text: `The video encoder stopped: ${msg}`, tip: 'Try compatibility mode (software encoder, 8 Mbps).' };
      return { text: msg, tip: 'Try again. If it keeps failing, try compatibility mode or another browser.' };
    }

    async function runExport({ compat = false } = {}) {
      if (exporting || !project) return;
      // Wait for edits still being applied, so the file matches what is on screen
      for (let i = 0; i < 300 && buildsPending; i++) await new Promise(r => setTimeout(r, 100));
      const s = project.s;
      if (s.music === 'upload' && !userTrack) {
        openExportSheet(`<div class="sheet-copy error">Music is set to a licensed track, but no track is uploaded in this session.</div><div class="sheet-copy">Upload the track under <b>Music and sound</b>, or switch Music to Original score.</div><div class="sheet-actions"><button class="btn" type="button" data-close>OK</button></div>`, 'Before you export');
        exportBody.querySelector('[data-close]').onclick = closeExportSheet;
        return;
      }
      if (s.music === 'upload' && !s.licenseOk) {
        openExportSheet(`<div class="sheet-copy error">Confirm the track license first.</div><div class="sheet-copy">Only export with music you have a commercial license for. Switch on <b>I have a license to use this track in ads</b> under Music and sound, and add the license ID.</div><div class="sheet-actions"><button class="btn" type="button" data-close>OK</button></div>`, 'Before you export');
        exportBody.querySelector('[data-close]').onclick = closeExportSheet;
        return;
      }
      pause();
      const P = project;
      exporting = true;
      updateExportState();
      const signal = { cancelled: false };
      abortExport = () => { signal.cancelled = true; const l = $('#exLabel'); if (l) l.textContent = 'Cancelling...'; };
      openExportSheet(progressHtml(P), compat ? 'Export MP4 (compatibility mode)' : 'Export MP4');
      $('#exCancel').onclick = abortExport;
      let wake = null;
      try { wake = navigator.wakeLock ? await navigator.wakeLock.request('screen') : null; } catch (err) {}
      const started = performance.now();
      try {
        const res = await exportMp4(P, P.s, {
          compat, signal,
          onProgress: p => {
            markStep(p.stage);
            const bar = $('#exProg'), label = $('#exLabel'), eta = $('#exEta');
            if (!bar) return;
            if (p.stage === 'video' && p.total) {
              bar.style.width = `${(p.done / p.total) * 100}%`;
              label.innerHTML = `Frame <b>${p.done}</b> of ${p.total}`;
              eta.textContent = p.eta != null && p.done > 10 ? `About ${Math.max(1, Math.round(p.eta))} s left` : '';
            } else if (p.stage === 'prepare') label.textContent = 'Loading the encoder and rendering audio...';
            else if (p.stage === 'audio') label.textContent = 'Encoding audio...';
            else if (p.stage === 'finish') { bar.style.width = '100%'; label.textContent = 'Writing the MP4...'; eta.textContent = ''; }
          }
        });
        markStep('verify');
        $('#exLabel').textContent = 'Opening the file and checking playback...';
        $('#exCancel').disabled = true;
        const report = await verifyMp4(res.blob, P);
        exporting = false;
        abortExport = null;
        showResult(P, P.s, res, report, (performance.now() - started) / 1000);
      } catch (err) {
        exporting = false;
        abortExport = null;
        if (err instanceof ExportCancelled) {
          openExportSheet('<div class="sheet-copy">Export cancelled. Nothing was saved.</div><div class="sheet-actions"><button class="btn" type="button" data-close>Close</button></div>');
          exportBody.querySelector('[data-close]').onclick = closeExportSheet;
        } else {
          console.error('[Video Studio] export failed', err);
          const f = friendlyError(err);
          openExportSheet(`<div class="vs-verdict fail">Export failed</div><div class="sheet-copy error">${esc(f.text)}</div><div class="sheet-copy">${esc(f.tip)}</div>
            <div class="sheet-actions"><button class="btn btn-primary" type="button" data-retry>Try again</button><button class="btn" type="button" data-compat>Compatibility mode</button><button class="btn btn-quiet" type="button" data-close>Close</button></div>`, 'Export MP4');
          exportBody.querySelector('[data-retry]').onclick = () => { closeExportSheet(); runExport(); };
          exportBody.querySelector('[data-compat]').onclick = () => { closeExportSheet(); runExport({ compat: true }); };
          exportBody.querySelector('[data-close]').onclick = closeExportSheet;
        }
      } finally {
        exporting = false;
        if (wake) { try { await wake.release(); } catch (err) {} }
        updateExportState();
      }
    }

    function showResult(P, s, res, report, seconds) {
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(res.blob);
      const name = exportFileName(P, P.draft);
      const mb = (res.blob.size / 1048576).toFixed(1);
      const verdict = report.passed
        ? (report.warnings ? '<div class="vs-verdict warn">Exported and playable, with notes below</div>' : '<div class="vs-verdict ok">Verified: the MP4 plays and matches the preview</div>')
        : '<div class="vs-verdict fail">Exported, but some checks failed. Review before posting.</div>';
      openExportSheet(`
        ${verdict}
        ${P.draft ? '<div class="ctl-note warn"><b>DRAFT.</b> Prices and codes are not verified, so the video carries a DRAFT tag. Verify them under Offer and call to action, then export again for publishing.</div>' : ''}
        <video class="vs-result-video" src="${resultUrl}" controls playsinline loop></video>
        <div class="sheet-copy"><b>${esc(name)}</b><br>${mb} MB · ${P.duration.toFixed(1)} s · encoded in ${seconds.toFixed(0)} s · audio: ${esc(res.music)}${res.aacEngine !== 'browser' ? ` · AAC by ${esc(res.aacEngine)}` : ''}</div>
        <ul class="vs-report">${report.checks.map(c => `<li class="${c.status === 'ok' ? '' : c.status}">${c.text}</li>`).join('')}</ul>
        <div class="sheet-actions">
          <a class="btn btn-primary" href="${resultUrl}" download="${esc(name)}">Download MP4</a>
          <button class="btn" type="button" data-close>Close</button>
        </div>`, 'Your video is ready');
      exportBody.querySelector('[data-close]').onclick = closeExportSheet;
    }

    $('#exportBtn').addEventListener('click', () => runExport());

    /* ============================================================
       16. START
       ============================================================ */
    function renderGuideSeg() {
      const opts = [['off', 'Safe zones off'], ['reels', 'Reels'], ['tiktok', 'TikTok'], ['shorts', 'Shorts']];
      $('#guideSeg').innerHTML = opts.map(([id, name]) => `<button type="button" data-guide="${id}" aria-pressed="${state.guide === id}" title="${id === 'off' ? 'Hide platform overlays' : `Approximate ${name} buttons and captions (preview only)`}">${id === 'off' ? 'Off' : name}</button>`).join('');
    }
    $('#guideSeg').addEventListener('click', e => {
      const b = e.target.closest('[data-guide]');
      if (!b) return;
      state.guide = b.dataset.guide;
      saveState();
      renderGuideSeg();
      layoutGuides();
    });

    // The Marketing Studio links here; keep the "Back" target on the same deployment
    $('#backBtn').href = PAGE_DIR.replace(/video\/$/, '') || '/marketing';

    loadState();
    setMuteUi();
    setPlayUi();
    $('#loopBtn').setAttribute('aria-pressed', String(loopOn));
    renderGuideSeg();
    layoutStage();
    loadShots().then(async () => {
      await fontReady;
      renderControls();
      await rebuild();
    });
    probeEncoders().then(updateExportState).catch(() => {});
    if (!fontsOk) fontReady.then(ok => { if (!ok) console.warn('[Video Studio] Brand fonts unavailable, system fonts are used.'); });

    // Debug hook for checks in the browser console: window.__video
    window.__video = {
      state, settings, templates: TEMPLATES, scenes: SCENE_TYPES,
      get project() { return project; },
      get time() { return playT; },
      buildProject, loadProjectLayers, renderFrame, renderAudio, blurSamples, cameraFor, activeScenes,
      seek, play, pause, setVal, rebuild,
      // Export the project on screen; returns the project too so the check uses the same one
      async exportMp4(opts = {}) { const P = project; const r = await exportMp4(P, settings(), opts); return { ...r, project: P }; },
      verifyMp4: (blob, P = project) => verifyMp4(blob, P),
      runExport,
      probeEncoders,
      // Renders one frame to a PNG data URL (for checks)
      frame(t, w = 540) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = Math.round(w * H / W);
        renderFrame(c, t, project);
        return c.toDataURL('image/png');
      },
      ready: () => new Promise(r => { const chk = () => (project && !buildsPending && loadingEl.hidden) ? r(true) : setTimeout(chk, 100); chk(); })
    };
  })();
  </script>
</body>
</html>
