<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Tradeprint Marketing Studio</title>

  <!--
    Tradeprint Marketing Studio
    Internal tool for building Instagram ads. Static page: no Supabase, no tokens,
    no user data. Settings are saved only in this browser (localStorage).

    Optional assets (the page works without them):
      assets/fonts/inter-latin-opsz-normal.woff2   ad font (falls back to jsDelivr)
      assets/vendor/modern-screenshot-4.7.0.js     PNG export (falls back to jsDelivr)
      assets/logo.png                              official TP logo, used as supplied

    Templates: Mentorship lives in TEMPLATES (section 4). Every other ad is a TPL_ object
    in section 4c, built from the shared Tradeprint UI library (TP, section 3b).
    To add an ad: copy a TPL_ object, change its id, layouts, defaults and product(),
    then add it to NEW_TEMPLATES. All numbers shown in ads are example data.
  -->

  <style>
    /* ============================================================
       1. STUDIO TOKENS (matches the Tradeprint dashboard)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #ffffff;
      --text2: #8a8a8a;
      --text3: #5f5f5f;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --accent-line: rgba(99, 102, 241, 0.45);
      --danger: #ef4444;
      --success: #22c55e;
      --font: 'TP Inter', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --topbar-h: 56px;
      --controls-w: 400px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: var(--bg2); }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg2); }

    /* ============================================================
       2. STUDIO LAYOUT
       ============================================================ */
    .st-top {
      position: relative;
      z-index: 20;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .st-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .st-logo span { color: var(--accent); }

    .st-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .st-top-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-quiet { background: transparent; color: var(--text2); }
    .btn-quiet:hover { color: var(--text); }
    .btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .st-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--controls-w);
      height: calc(100vh - var(--topbar-h));
      height: calc(100dvh - var(--topbar-h));
    }

    .st-preview { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    .st-preview-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .st-zoom { margin-left: auto; font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; }

    .st-viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
    }

    .stage-shell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 6px;
      background: #0a0a0a;
      box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0, 0, 0, 0.55);
      transition: opacity 0.2s;
    }

    .stage-shell.is-loading { opacity: 0; }

    .stage-scale { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

    .st-controls {
      min-height: 0;
      overflow-y: auto;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      padding: 8px 20px 48px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .st-main { display: block; height: auto; }
      .st-preview-bar { padding: 10px 16px; }
      .st-viewport { padding: 16px; }
      .st-controls { border-left: none; border-top: 1px solid var(--border); padding: 4px 16px calc(48px + env(safe-area-inset-bottom)); }
      .st-tag { display: none; }
      .st-top-actions .btn-label-long { display: none; }
    }

    @media (max-width: 380px) {
      .st-top-actions .btn { padding: 0 10px; }
    }

    /* ============================================================
       3. STUDIO CONTROLS
       ============================================================ */
    .ctl-group { border-bottom: 1px solid var(--border); }
    .ctl-group:last-of-type { border-bottom: none; }

    .ctl-group > summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      cursor: pointer;
      user-select: none;
    }

    .ctl-group > summary::-webkit-details-marker { display: none; }

    .ctl-group > summary::after {
      content: '';
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--text3);
      border-bottom: 1.5px solid var(--text3);
      transform: translateY(-2px) rotate(45deg);
      transition: transform 0.15s;
    }

    .ctl-group:not([open]) > summary::after { transform: rotate(-45deg); }

    .ctl-body { display: grid; gap: 16px; padding-bottom: 20px; }

    .field { display: grid; gap: 8px; min-width: 0; }

    .field > label, .field-label {
      font-size: 12px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .field-count { color: var(--text3); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .field-count.over { color: var(--danger); }

    .field input[type="text"], .field textarea, .field select {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field textarea { resize: vertical; min-height: 48px; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }

    .field select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 38px;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='18' height='18' viewBox='0 0 18 18' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 7l4 4 4-4' fill='none' stroke='%23777' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: calc(100% - 12px) 50%;
    }

    .field-hint { font-size: 12px; color: var(--text3); line-height: 1.5; }
    .field-hint b { color: var(--text2); font-weight: 600; }

    .seg {
      display: grid;
      grid-auto-columns: minmax(0, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .seg button {
      min-height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .st-preview-bar .seg { grid-auto-columns: auto; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text2);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.3;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip:hover { border-color: var(--accent); color: var(--text); }

    .toggle-list { display: grid; gap: 2px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
    }

    .switch { position: relative; width: 40px; height: 22px; flex: 0 0 40px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); pointer-events: none; transition: background 0.15s; }
    .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .range-row output { font-size: 12px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .upload-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .upload-status { font-size: 12px; color: var(--text3); }

    .tpl-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text2);
    }

    .ctl-footer { padding-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ============================================================
       4. SAFE ZONE GUIDES (preview only, never exported)
       ============================================================ */
    .safe-guides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

    .safe-zone {
      position: absolute;
      background: repeating-linear-gradient(135deg, rgba(239, 68, 68, 0.16) 0 14px, rgba(239, 68, 68, 0.06) 14px 28px);
      border: 3px dashed rgba(239, 68, 68, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .safe-zone span {
      font: 700 30px/1.2 var(--font);
      color: #fca5a5;
      background: rgba(10, 10, 10, 0.85);
      padding: 10px 18px;
      border-radius: 10px;
      text-align: center;
    }

    /* ============================================================
       5. SCREENSHOT MODE + EXPORT SHEET
       ============================================================ */
    .shot-mode {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .shot-stage { position: relative; flex: none; overflow: hidden; }

    .shot-ui {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.25s;
      z-index: 2;
    }

    .shot-ui.is-hidden { opacity: 0; pointer-events: none; }

    .shot-hint {
      font-size: 12px;
      color: #d4d4d4;
      background: rgba(17, 17, 17, 0.92);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 230px;
      line-height: 1.4;
    }

    .shot-exit {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: rgba(17, 17, 17, 0.92);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .sheet-box {
      width: 100%;
      max-width: 440px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sheet-title { font-size: 18px; font-weight: 700; }
    .sheet-close { background: none; border: none; color: var(--text2); font-size: 24px; line-height: 1; padding: 4px; }
    .sheet-close:hover { color: var(--text); }
    .sheet-copy { font-size: 13px; color: var(--text2); line-height: 1.55; }
    .sheet-copy.error { color: #fca5a5; }

    .sheet-preview {
      display: flex;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .sheet-preview img { display: block; max-width: 100%; max-height: 46vh; border-radius: 6px; }

    .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sheet-actions .btn { flex: 1 1 140px; }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 8px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       6. THE AD (fixed design pixels: 1080 wide, 1920 or 1350 tall)
       Everything below is the exported artwork. No studio styles leak in.
       ============================================================ */
    .ad {
      --ad-font: 'TP Inter', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --ad-bg: #0a0a0a;
      --ad-text: #ffffff;
      --ad-muted: #a3a3a3;
      --ad-dim: #737373;
      --ad-accent: #6366f1;
      --pad-top: 270px;
      --pad-bottom: 270px;
      --pad-left: 72px;
      --pad-right: 72px;
      --copy-gap: 64px;
      --support-gap: 30px;
      --product-gap: 52px;
      --foot-gap: 52px;
      --h-max: 128;

      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--ad-bg);
      color: var(--ad-text);
      font-family: var(--ad-font);
      font-size: 32px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .ad--feed {
      height: 1350px;
      --pad-top: 80px;
      --pad-bottom: 80px;
      --copy-gap: 60px;
      --support-gap: 26px;
      --product-gap: 44px;
      --foot-gap: 44px;
      --h-max: 108;
    }

    .ad.layout-flow .ad-support { display: none; }

    .ad--reels {
      --pad-top: 250px;
      --pad-bottom: 500px;
      --pad-right: 150px;
      --h-max: 116;
      --copy-gap: 52px;
      --product-gap: 44px;
      --foot-gap: 44px;
    }

    .ad-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 2px, transparent 2px);
      background-size: 90px 90px;
      background-position: 0 -1px, -1px 0;
    }

    .ad-grid-fade {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.15) 0%, rgba(10, 10, 10, 0.7) 38%, #0a0a0a 62%);
    }

    .ad-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    }

    .ad-brand {
      flex: none;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .ad-wordmark {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
      white-space: nowrap;
    }

    .ad-wordmark .p { color: var(--ad-accent); }
    .ad-logo { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; display: block; }

    .ad-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      padding: 0 26px;
      border-radius: 16px;
      background: rgba(99, 102, 241, 0.14);
      border: 2px solid rgba(99, 102, 241, 0.4);
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ad-badge-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ad-accent); flex: none; }

    .ad-copy { flex: none; margin-top: var(--copy-gap); }
    .ad-brand.is-empty + .ad-copy, .ad-copy:first-child { margin-top: 0; }

    .ad-eyebrow {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ad-accent);
      margin-bottom: 30px;
    }

    .ad-headline {
      font-size: 140px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.045em;
      color: var(--ad-text);
      text-wrap: balance;
    }

    .ad-headline .hl { color: var(--ad-accent); }

    .ad-support {
      margin-top: var(--support-gap);
      max-width: 900px;
      font-size: 40px;
      line-height: 1.38;
      font-weight: 450;
      letter-spacing: -0.012em;
      color: var(--ad-muted);
      text-wrap: pretty;
    }

    .ad-product {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: var(--product-gap) 0 0;
    }

    .ad-product + .ad-foot { margin-top: var(--foot-gap); }
    .ad-copy + .ad-foot { margin-top: auto; }

    .ad-foot { flex: none; }

    .ad-cta { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }

    .ad-button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      height: 104px;
      padding: 0 48px;
      border-radius: 20px;
      background: var(--ad-accent);
      color: #ffffff;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .ad-button svg { width: 38px; height: 38px; flex: none; }

    .ad-url { font-size: 38px; font-weight: 650; letter-spacing: -0.01em; color: var(--ad-text); white-space: nowrap; }

    .ad-fine { margin-top: 26px; font-size: 27px; line-height: 1.35; font-weight: 500; color: var(--ad-dim); }

    .ad--feed .ad-wordmark { font-size: 50px; }
    .ad--feed .ad-support { font-size: 34px; max-width: 880px; }
    .ad--feed .ad-button { height: 88px; padding: 0 40px; font-size: 32px; border-radius: 18px; }
    .ad--feed .ad-button svg { width: 32px; height: 32px; }
    .ad--feed .ad-url { font-size: 32px; }
    .ad--feed .ad-fine { font-size: 24px; margin-top: 20px; }

    /* Uploaded screenshot in a clean frame */
    .shot-frame {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: var(--frame-ar, 0.8);
      overflow: hidden;
      border-radius: 28px;
      border: 2px solid #232323;
      background: #111111;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
    }

    .shot-frame img {
      display: block;
      width: 100%;
      height: 100%;

    /* ============================================================

  <script>
  (() => {
    'use strict';

    /* ============================================================
       1. CONFIG
       ============================================================ */
    const STORAGE_KEY = 'tp_marketing_studio_v1';
    const IMAGE_KEY_PREFIX = 'tp_marketing_studio_img_';
    const LOGO_KEY = 'tp_marketing_studio_logo';
    // Assets load from this page's folder, so the page works at /marketing,
    // /marketing/ and /marketing/index.html alike.
    const PAGE_DIR = (() => {
      const path = location.pathname;
      if (path.endsWith('/')) return path;
      if (/\.html?$/i.test(path)) return path.replace(/[^/]*$/, '');
      return path + '/';
    })();
    const asset = (file) => PAGE_DIR + file;

    const LOGO_ASSET = 'assets/logo.png';

    const FONT_FAMILY = 'TP Inter';
    const FONT_SOURCES = [
      asset('assets/fonts/inter-latin-opsz-normal.woff2'),
      'https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/files/inter-latin-opsz-normal.woff2'
    ];

    const EXPORT_LIB_SOURCES = [
      { src: asset('assets/vendor/modern-screenshot-4.7.0.js') },
      {
        src: 'https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js',
        integrity: 'sha384-5Ua3TI0kiMYH8QdNy+vc5IWS3MTa2DzQEm/uKFDQ+/biJctek9hiSP6moIm2PVog'
      }
    ];

    // Ad sizes in design pixels. Story safe zones follow Meta's guidance
    // (about 14% top and bottom). Reels also keeps clear of the caption
    // area and the action buttons on the right.
    const FORMATS = {
      story: { id: 'story', label: '9:16', name: 'Story', w: 1080, h: 1920 },
      feed: { id: 'feed', label: '4:5', name: 'Feed', w: 1080, h: 1350 }
    };

    const SAFE_ZONES = {
      stories: [
        { x: 0, y: 0, w: 1080, h: 250, label: 'Profile and progress bar' },
        { x: 0, y: 1670, w: 1080, h: 250, label: 'Reply bar' }
      ],
      reels: [
        { x: 0, y: 0, w: 1080, h: 230, label: 'Reels header' },
        { x: 0, y: 1440, w: 1080, h: 480, label: 'Caption, username, audio' },
        { x: 940, y: 860, w: 140, h: 580, label: 'Buttons' }
      ]
    };

    const IS_SAFARI = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|FxiOS/.test(navigator.userAgent);
    const IS_TOUCH = matchMedia('(hover: none)').matches;

    /* ============================================================
       2. HELPERS
       ============================================================ */
    const $ = (sel, root = document) => root.querySelector(sel);

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // New lines become line breaks, [words] become brand purple.
    function rich(value) {
      return esc(value)
        .replace(/\[([^\]\n]+)\]/g, '<span class="hl">$1</span>')
        .replace(/\n/g, '<br>');
    }

    function todayLabel() {
      return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

    function nextFrame() { return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }

    const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>';

    /* ============================================================
       3. TRADEPRINT UI PIECES (shared by all templates)
       Labels and layout follow dashboard.html. Keep them truthful:
       only show things the product really does.
       ============================================================ */
    const MENTOR_PERMISSIONS = [
      { label: 'View Trades', on: true },
      { label: 'View Journals', on: true },
      { label: 'Leave Feedback', on: true },
      { label: 'See PnL', on: false },
      { label: 'See Account Names', on: false }
    ];

    const UI = {
      switch(on) {
        return `<span class="u-switch${on ? ' on' : ''}"><span class="u-knob"></span></span>`;
      },

      perms(list, cols = 1) {
        return `<div class="u-perms${cols === 2 ? ' cols-2' : ''}">${list.map(p =>
          `<div class="u-perm"><span class="u-perm-label">${esc(p.label)}</span>${UI.switch(p.on)}</div>`
        ).join('')}</div>`;
      },

      // Trader side: Mentorship page, "Your Mentors" card
      mentorCard({ email, since, cols = 1, perms = MENTOR_PERMISSIONS }) {
        return `
          <div class="u-card">
            <div class="u-email">${esc(email)}</div>
            <div class="u-meta"><span class="u-pill">Active</span>· Mentor since ${esc(since)}</div>
            ${UI.perms(perms, cols)}
          </div>`;
      },

      // Mentor side: Mentor Dashboard, Review Queue item.
      // In the app the buttons sit to the right of the text on wide screens.
      // Ad cards are narrow, so they sit under it here. Same labels, same styles.
      reviewItem({ trader, strategy, asset, date, note, cls = '', chip = '' }) {
        const target = [strategy, asset, date].filter(Boolean).join(' · ');
        return `
          <div class="u-card ${cls}">
            ${chip}
            <div class="u-review-title">Trade review from ${esc(trader)}</div>
            <div class="u-review-meta">${esc(target)} · Requested ${esc(date)}</div>
            ${note ? `<div class="u-review-note">"${esc(note)}"</div>` : ''}
            <div class="u-btns">
              <span class="u-btn primary">Give Feedback</span>
              <span class="u-btn">Open</span>
              <span class="u-btn">Dismiss</span>
            </div>
          </div>`;
      },

      // Trader side: Invite a Mentor
      inviteRow({ email, hint = true }) {
        return `
          <div class="u-invite">
            <div class="u-input">${esc(email)}<span class="u-caret"></span></div>
            <div class="u-send">Send Invite</div>
          </div>
          ${hint ? '<div class="u-hint">They\'ll get a link to accept and create or log in to a Tradeprint account.</div>' : ''}`;
      },

      // Trader side: Recent Feedback item
      feedbackItem({ strategy, asset, date, body, email }) {
        const context = [strategy, asset, date].filter(Boolean).join(' · ');
        return `
          <div class="u-feedback">
            <div class="u-fb-meta">${esc(context)}</div>
            <div class="u-fb-body">${esc(body)}</div>
            <div class="u-fb-from">From ${esc(email)} · ${esc(date)} · Answered your review request</div>
          </div>`;
      },

      frame(inner, { title = '', cls = '', chip = '' } = {}) {
        return `<div class="u-frame ${cls}">${chip}${title ? `<div class="u-section-title">${esc(title)}</div>` : ''}${inner}</div>`;
      },

      // Marketing label on a card's top edge (not part of the app UI)
      chip(text, show = true) {
        return show ? `<span class="view-chip">${esc(text)}</span>` : '';
      }
    };

    /* ============================================================
       3b. TRADEPRINT UI LIBRARY (all templates except Mentorship)
       Markup mirrors dashboard.html. Number formats match the app:
       formatPnl (+$1234.00, no commas) for trades and dashboard,
       formatPnlShort (+$696) for calendar cells, propMoney ($55,211)
       for the Prop Firm Command Center.
       ============================================================ */
    const FMT = {
      num(value, fallback = 0) {
        const n = parseFloat(String(value ?? '').replace(/[^0-9.\-]/g, ''));
        return Number.isFinite(n) ? n : fallback;
      },
      pnl(n) { n = Number(n) || 0; return n >= 0 ? `+$${n.toFixed(2)}` : `-$${Math.abs(n).toFixed(2)}`; },
      pnlShort(n) { n = Number(n) || 0; return n >= 0 ? `+$${Math.round(n)}` : `-$${Math.round(Math.abs(n))}`; },
      money(n, dec = 0) { return `$${Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })}`; },
      signed(n, dec = 2) { n = Number(n) || 0; return `${n < 0 ? '-' : '+'}${FMT.money(n, dec)}`; },
      tone(n) { n = Number(n) || 0; return n > 0 ? 'g' : n < 0 ? 'r' : 'm'; },
      result(n) { n = Number(n) || 0; return n > 0 ? 'win' : n < 0 ? 'loss' : 'breakeven'; },
      rr(v) { const s = String(v ?? '').trim(); if (!s) return ''; return /r$/i.test(s) ? s.replace(/r$/i, 'R') : `${s}R`; }
    };

    // Text helpers for the data fields: one item per line, columns split by "|".
    function rows(text) {
      return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => l.split('|').map(c => c.trim()));
    }
    function list(text) {
      return String(text || '').split(/[\n,]+/).map(v => v.trim()).filter(Boolean);
    }
    function pct(value) { return clamp(FMT.num(value), 0, 100); }

    // Small, stable variation for derived numbers (confluence counts and so on)
    function seeded(i, mod, base = 0) { return base + ((i * 7 + 3) % mod); }

    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function monthInfo(value) {
      const m = /^(\d{4})-(\d{1,2})$/.exec(String(value || '').trim());
      const now = new Date();
      const y = m ? +m[1] : now.getFullYear();
      const mo = m ? clamp(+m[2], 1, 12) - 1 : now.getMonth();
      return { y, m: mo, label: `${MONTHS[mo]} ${y}`, days: new Date(y, mo + 1, 0).getDate(), first: new Date(y, mo, 1).getDay() };
    }

    function longDate(y, m, d) { return `${MONTHS[m]} ${d}, ${y}`; }
    function shortDate(y, m, d) { return `${MONTHS[m].slice(0, 3)} ${d}, ${y}`; }

    // Weekdays of a month, most recent last. Used to build default data.
    function tradingDays(y, m) {
      const out = [];
      const n = new Date(y, m + 1, 0).getDate();
      for (let d = 1; d <= n; d++) { const wd = new Date(y, m, d).getDay(); if (wd > 0 && wd < 6) out.push(d); }
      return out;
    }

    function prevMonthKey() {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // The dashboard's own icons (sidebar and buttons)
    const ICON = {
      dashboard: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
      tradeprint: '<path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .1-5.3 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/>',
      strategies: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
      trades: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      notes: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
      calculator: '<rect x="4" y="2" width="16" height="20" rx="2"/><rect x="7" y="5" width="10" height="4" rx="1"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>',
      mentorship: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      prop: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
      prints: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>',
      menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
      plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
      left: '<polyline points="15 18 9 12 15 6"/>',
      right: '<polyline points="9 18 15 12 9 6"/>',
      share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>',
      edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
      trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
      news: '<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>'
    };
    const ico = (name, cls = '') => `<svg class="t-ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ''}</svg>`;

    const TP = {
      wordmark() { return 'trade<span class="p">print</span>'; },

      statCard(label, value, tone = '') {
        return `<div class="t-stat"><div class="t-stat-label">${esc(label)}</div><div class="t-stat-value ${tone}">${value}</div></div>`;
      },

      panel(inner, { title = '', strong = false, sub = '', cls = '', head = '' } = {}) {
        const titleHtml = title ? `<div class="t-panel-title${strong ? ' strong' : ''}">${esc(title)}</div>` : '';
        const top = head ? `<div class="t-panel-head">${titleHtml}${head}</div>` : titleHtml;
        return `<div class="t-panel ${cls}">${top}${sub ? `<div class="t-panel-sub" style="margin-bottom:calc(var(--u)*16)">${esc(sub)}</div>` : ''}${inner}</div>`;
      },

      // Dashboard: PNL Trend bars. values = daily P&L, oldest first
      bars(values, ticks = []) {
        const max = Math.max(1, ...values.map(v => Math.abs(v)));
        const barHtml = values.map(v => {
          const h = Math.max(2, Math.abs(v) / max * 48);
          const cls = v > 0 ? 'g' : v < 0 ? 'r' : 'f';
          return `<div class="t-bar-wrap"><div class="t-bar ${cls}" style="${v === 0 ? '' : `height:${h.toFixed(2)}%`}"></div></div>`;
        }).join('');
        return `<div class="t-bars">${barHtml}</div>${ticks.length ? `<div class="t-bar-ticks">${ticks.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}`;
      },

      pnlTrend({ label, values, ticks, select = 'Last month' }) {
        const total = values.reduce((a, b) => a + b, 0);
        return TP.panel(`
          <div class="t-chart-sum"><div class="t-chart-date">${esc(label)}</div><div class="t-chart-pnl ${FMT.tone(total)}">${FMT.pnl(total)}</div></div>
          ${TP.bars(values, ticks)}`, { title: 'PNL Trend', head: `<div class="t-select" style="min-height:calc(var(--u)*34);font-size:calc(var(--u)*13)">${esc(select)}</div>` });
      },

      listItem(title, sub, value, tone) {
        return `<div class="t-list-item"><div class="t-list-main"><div class="t-list-title">${title}</div><div class="t-list-sub">${esc(sub)}</div></div><div class="t-list-value ${tone}">${value}</div></div>`;
      },

      ruleDiscipline(rate, trades, { strong = false } = {}) {
        const followed = Math.round(rate / 100 * trades);
        if (strong) {
          return TP.panel(`
            <div class="t-simple-main g" style="font-size:calc(var(--u)*28)">${Math.round(rate)}%</div>
            <div class="t-simple-meta">${followed} of ${trades} trades followed rules.</div>
            <div class="t-meter" style="margin-top:calc(var(--u)*16)"><i style="width:${rate}%"></i></div>`, { title: 'Rule Discipline', strong: true });
        }
        return TP.panel(`
          <div class="t-focus-value">${Math.round(rate)}%</div>
          <div class="t-meter t-rule-meter"><i style="width:${rate}%"></i></div>
          <div class="t-focus-sub">${followed} of ${trades} trades followed rules</div>`, { title: 'Rule Discipline' });
      },

      // Sidebar navigation, exactly as the app lists it
      sidebar({ active = 'dashboard', bottom = true } = {}) {
        const main = [['dashboard', 'Dashboard'], ['tradeprint', 'Tradeprint'], ['strategies', 'Strategies'], ['calendar', 'Calendar'], ['trades', 'Trades'], ['notes', 'Notes'], ['calculator', 'Calculator'], ['mentorship', 'Mentorship']];
        return `<div class="t-sidebar">
          <div class="t-side-logo"><span>${TP.wordmark()}</span>${ico('menu')}</div>
          ${main.map(([k, l]) => `<div class="t-nav-item${k === active ? ' active' : ''}">${ico(k)}<span>${l}</span></div>`).join('')}
          ${bottom ? `<div class="t-nav-divider"></div>
          <div class="t-nav-row">${ico('prop')}<span>Prop Firm Center</span></div>
          <div class="t-nav-row">${ico('prints')}<span>Prints</span></div>` : ''}
        </div>`;
      },

      appbar() { return `<div class="t-appbar">${ico('menu')}<b>${TP.wordmark()}</b></div>`; },

      // Calendar. days: { [day]: { pnl, trades, wins, note, news } }
      calendar(mi, days, { from = 0, weeks = 6, weekCol = true, weekdaysOnly = false, sel = 0, today = 0, wk = 0, row = 0 } = {}) {
        const cells = [];
        const start = new Date(mi.y, mi.m, 1 - mi.first);
        const totalWeeks = Math.ceil((mi.first + mi.days) / 7);
        const weekRows = [];
        for (let w = 0; w < totalWeeks; w++) {
          const rowCells = [];
          let wPnl = 0, wTrades = 0, wWins = 0;
          for (let i = 0; i < 7; i++) {
            const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i);
            const inMonth = date.getMonth() === mi.m;
            const d = date.getDate();
            const data = inMonth ? days[d] : null;
            if (data && data.trades) { wPnl += data.pnl; wTrades += data.trades; wWins += data.wins; }
            if (weekdaysOnly && (i === 0 || i === 6)) continue;
            const cls = ['t-cal-cell', inMonth ? '' : 'other', inMonth && d === today ? 'today' : '', inMonth && d === sel ? 'sel' : ''].filter(Boolean).join(' ');
            let inner = `<span class="t-cal-num">${d}</span>`;
            if (data && data.trades) {
              const wr = Math.round(data.wins / data.trades * 100);
              inner += `<div class="t-cal-pnl ${FMT.tone(data.pnl)}">${FMT.pnlShort(data.pnl)}</div><div class="t-cal-meta">${data.trades} trade${data.trades === 1 ? '' : 's'}</div><div class="t-cal-meta">${wr}% WR</div>`;
            }
            if (data && data.note) inner += '<span class="t-cal-dot"></span>';
            if (data && data.news) inner += `<span class="t-cal-news">${ico('news')}<span>${data.news}</span></span>`;
            rowCells.push(`<div class="${cls}">${inner}</div>`);
          }
          if (weekCol) {
            rowCells.push(wTrades
              ? `<div class="t-cal-week"><div class="t-cal-week-pnl ${FMT.tone(wPnl)}">${FMT.pnlShort(wPnl)}</div><div class="t-cal-meta">${wTrades} trades<br>${Math.round(wWins / wTrades * 100)}% WR</div></div>`
              : '<div class="t-cal-week"></div>');
          }
          weekRows.push(rowCells.join(''));
        }
        const heads = (weekdaysOnly ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'])
          .map(h => `<div>${h}</div>`).join('') + (weekCol ? '<div class="wk">Week</div>' : '');
        const style = [wk ? `--wk:calc(var(--u)*${wk})` : '', row ? `--row:calc(var(--u)*${row})` : ''].filter(Boolean).join(';');
        return `<div class="t-cal${weekCol ? '' : ' no-week'}${weekdaysOnly ? ' weekdays' : ''}" style="${style}">
          <div class="t-cal-heads">${heads}</div>
          <div class="t-cal-grid">${weekRows.slice(from, from + weeks).join('')}</div>
        </div>`;
      },

      calHeader(mi, stats, { nav = true } = {}) {
        return `<div class="t-cal-top">
          <div class="t-cal-nav">${nav ? `<span class="t-cal-btn">${ico('left')}</span>` : ''}<span class="t-cal-month">${esc(mi.label)}</span>${nav ? `<span class="t-cal-btn">${ico('right')}</span>` : ''}</div>
          <div class="t-cal-stats">
            <div class="t-cal-stat"><div class="t-cal-stat-label">Monthly PNL</div><div class="t-cal-stat-value ${FMT.tone(stats.pnl)}">${FMT.pnl(stats.pnl)}</div></div>
            <div class="t-cal-stat"><div class="t-cal-stat-label">Trades</div><div class="t-cal-stat-value">${stats.trades}</div></div>
            <div class="t-cal-stat"><div class="t-cal-stat-label">Win Rate</div><div class="t-cal-stat-value">${stats.wr}%</div></div>
          </div>
        </div>`;
      },

      // Day modal trade row (.trade-feed-item). t = { strategy, asset, pnl, rr, time, note, broke, conf }
      feedItem(t, { actions = true, note = true } = {}) {
        const result = FMT.result(t.pnl);
        const resColor = result === 'win' ? 'g' : result === 'loss' ? 'r' : 'm';
        const label = result.charAt(0).toUpperCase() + result.slice(1);
        const detail = [`${t.conf ? `${t.conf} confluences` : 'No confluences'}`, t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).join(' · ');
        return `<div class="t-feed-item">
          <div class="t-feed-left">
            <div class="t-feed-strat">${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — <span class="${resColor}">${label}</span></div>
            <div class="t-feed-detail">${esc(detail)}${t.broke ? ' · <span class="r">Rules broken</span>' : ''}</div>
            ${note && t.note ? `<div class="t-feed-note">"${esc(t.note)}"</div>` : ''}
          </div>
          <div class="t-feed-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>
          ${actions ? `<div class="t-feed-actions">${ico('share')}${ico('edit')}${ico('trash')}</div>` : ''}
        </div>`;
      },

      dayStats(trades) {
        const pnl = trades.reduce((a, t) => a + t.pnl, 0);
        const wins = trades.filter(t => t.pnl > 0).length;
        const losses = trades.filter(t => t.pnl < 0).length;
        const wr = trades.length ? Math.round(wins / trades.length * 100) : 0;
        const stat = (l, v, c = '') => `<div><div class="t-modal-stat-label">${l}</div><div class="t-modal-stat-val ${c}">${v}</div></div>`;
        return `<div class="t-modal-stats">${stat('Trades', trades.length)}${stat('PNL', FMT.pnl(pnl), FMT.tone(pnl))}${stat('Win Rate', `${wr}%`)}${stat('Wins', wins, 'g')}${stat('Losses', losses, 'r')}</div>`;
      },

      modalHead(title) {
        return `<div class="t-modal-head"><div class="t-modal-date">${esc(title)}</div><div class="t-modal-icons">${ico('share')}<span class="x">×</span></div></div>`;
      },

      noteHtml(text) {
        return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          if (l === '---') return '<hr>';
          const m = /^([^:]{2,24}):\s(.+)$/.exec(l);
          return m ? `<p><b>${esc(m[1])}:</b> ${esc(m[2])}</p>` : `<p>${esc(l)}</p>`;
        }).join('');
      },

      // Notes page "Insert Trade" card (.note-trade-card)
      noteTradeCard(t, date) {
        const result = FMT.result(t.pnl);
        const detail = [date, t.conf ? `${t.conf} confluences` : 'No confluences', t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).join(' · ');
        return `<div class="t-ntc"><div class="t-ntc-title"><span>${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — ${result === 'breakeven' ? 'be' : result}</span><b class="${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</b></div><div class="t-ntc-detail">${esc(detail)}</div></div>`;
      },

      // Trades page table (.trades-table). cols: subset of the app's columns, in the app's order
      tradesTable(trades, cols) {
        const defs = {
          date: ['Date', 'calc(var(--u)*92)', t => `<div class="t-tc muted">${esc(t.date)}</div>`],
          strategy: ['Strategy', 'calc(var(--u)*135)', t => `<div class="t-tc">${esc(t.strategy)}</div>`],
          account: ['Account', 'calc(var(--u)*105)', t => `<div class="t-tc muted">${esc(t.account || 'Main')}</div>`],
          result: ['Result', 'calc(var(--u)*64)', t => { const r = FMT.result(t.pnl); return `<div class="t-tc"><span class="t-badge ${r}">${r === 'breakeven' ? 'be' : r}</span></div>`; }],
          pnl: ['PNL', 'calc(var(--u)*92)', t => `<div class="t-tc pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>`],
          rr: ['R:R', 'calc(var(--u)*58)', t => `<div class="t-tc muted">${esc(FMT.rr(t.rr))}</div>`],
          type: ['Type', 'calc(var(--u)*94)', () => '<div class="t-tc muted">Futures</div>'],
          direction: ['Direction', 'calc(var(--u)*78)', t => `<div class="t-tc muted">${esc(t.dir || 'Long')}</div>`],
          time: ['Time', 'calc(var(--u)*88)', t => `<div class="t-tc muted">${esc(t.time)}</div>`],
          asset: ['Asset', 'calc(var(--u)*72)', t => `<div class="t-tc muted">${esc(t.asset)}</div>`],
          confluences: ['Confluences', 'calc(var(--u)*120)', t => `<div class="t-tc muted">${t.conf ? `${t.conf} confluences` : '—'}</div>`],
          rules: ['Rules', 'calc(var(--u)*48)', t => `<div class="t-tc" style="text-align:center">${t.broke ? '<span class="t-rules-no">✗</span>' : '<span class="t-rules-yes">✓</span>'}</div>`]
        };
        const use = cols.map(c => defs[c]).filter(Boolean);
        const tpl = use.map(d => d[1]).join(' ');
        return `<div class="t-table" style="--cols:${tpl}">
          <div class="t-tr head">${use.map(d => `<div class="t-tc" style="font-size:inherit">${d[0]}</div>`).join('')}</div>
          ${trades.map(t => `<div class="t-tr">${use.map(d => d[2](t)).join('')}</div>`).join('')}
        </div>`;
      },

      mobileTradeCard(t) {
        const r = FMT.result(t.pnl);
        return `<div class="t-mcard">
          <div class="t-mcard-main">
            <div class="t-mcard-top"><div class="t-mcard-strat">${esc(t.strategy)}</div><div class="t-mcard-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div></div>
            <div class="t-mcard-sub">${esc([t.date, t.asset].filter(Boolean).join(' · '))}</div>
            <div class="t-mcard-chips"><span class="t-chip ${r}">${r === 'breakeven' ? 'be' : r}</span><span class="t-chip">Futures</span><span class="t-chip">${esc(t.dir || 'Long')}</span></div>
          </div>
          <div class="t-mcard-actions">${ico('share')}${ico('edit')}${ico('trash')}</div>
        </div>`;
      },

      filters() {
        return `<div class="t-filters">
          <div class="t-select">All Strategies</div><div class="t-select">All Results</div><div class="t-select">All Trade Types</div>
          <div class="t-select">All Directions</div><div class="t-select">Newest First</div><div class="t-input">Search trades...</div>
          <div class="t-btn ghost">Clear</div>
        </div>`;
      },

      // Tradeprint page
      rankItem(i, name, meta, pnl) {
        return `<div class="t-rank"><div class="t-rank-num">${i}</div><div style="min-width:0"><div class="t-rank-title">${esc(name)}</div><div class="t-rank-meta">${esc(meta)}</div></div><div class="t-rank-value ${FMT.tone(pnl)}">${FMT.pnl(pnl)}</div></div>`;
      },

      split(title, best, worst) {
        const side = (label, d) => `<div style="min-width:0"><div class="t-mini-label">${label}</div><div class="t-simple-main ${FMT.tone(d.pnl)}">${esc(d.name)}</div><div class="t-simple-meta">${esc(d.meta)}</div></div>`;
        return TP.panel(`<div class="t-split">${side('Best', best)}${side('Worst', worst)}</div>`, { title, strong: true });
      },

      // Calculator (.calc-card)
      calcCard(title, fields, { clear = true, cls = '' } = {}) {
        return `<div class="t-calc-card ${cls}">
          <div class="t-panel-title">${esc(title)}</div>
          <div class="t-calc-grid">${fields.map(f => `<div class="t-calc-field"><span>${esc(f[0])}</span><div class="t-calc-input${f[2] ? ' sel' : ''}${f[3] ? ' focus' : ''}">${esc(f[1])}</div></div>`).join('')}</div>
          ${clear ? '<span class="t-calc-clear">Clear</span>' : ''}
        </div>`;
      },

      calcResults(res, { cols = 2, cls = '' } = {}) {
        const card = (l, v, c) => `<div class="t-result"><div class="t-result-label">${l}</div><div class="t-result-value ${c}">${v}</div></div>`;
        return `<div class="t-calc-card ${cls}">
          <div class="t-panel-title">Results</div>
          <div class="t-results" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr))">
            ${card('Dollar Risk', `-$${res.risk.toFixed(2)}`, 'r')}${card('Dollar Profit', `+$${res.profit.toFixed(2)}`, 'g')}${card('R:R Ratio', `${res.rr.toFixed(2)}R`, 'a')}
          </div>
        </div>`;
      },

      // Prints
      printCard(p, { expanded = false, follow = 'Follow', cls = '' } = {}) {
        const pnl = FMT.num(p.pnl);
        const tone = pnl > 0 ? 'green' : pnl < 0 ? 'red' : '';
        const pnlText = p.hidden ? (pnl < 0 ? '-$*****' : pnl > 0 ? '+$*****' : '$*****') : FMT.pnl(pnl);
        const meta = `${p.time || 'No time'} · ${p.rr ? FMT.rr(p.rr) : 'No R:R'}`;
        return `<div class="t-print ${cls}">
          <div class="t-print-head">

      const calLines = days.map((d, i) => {
        const p = pattern[i % pattern.length];
        return p[1] ? `${p[0]}, ${p[1]}, ${p[2]}` : '-';
      });

      // Most recent weekday before today, for the journal day
      const back = new Date(today);
      do { back.setDate(back.getDate() - 1); } while (back.getDay() === 0 || back.getDay() === 6);

      // ISO week number, for "Week 41 review"
      const t = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
      t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
      const week = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);

      // Last month of daily P&L for the PNL Trend chart, and its tick labels
      const bars = [196, 400, -470, 696, 900, 0, 225, -400, -400, 836, 270, 750, 412, 0, 525, 310, 845, -260, 390, 240, 615, 470];
      const ticks = [];
      for (let i = 0; i <= 6; i++) { const d = new Date(today); d.setDate(d.getDate() - 30 + i * 5); ticks.push(`${d.getMonth() + 1}/${d.getDate()}`); }

      // Recent weekdays as "Oct 12" labels, newest first
      const recent = [];
      const r = new Date(today);
      while (recent.length < 8) { if (r.getDay() > 0 && r.getDay() < 6) recent.push(new Date(r)); r.setDate(r.getDate() - 1); }
      const md = d => `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
      const mdy = d => `${md(d)}, ${d.getFullYear()}`;

      // Next Monday to Friday, for upcoming economic events
      const mon = new Date(today);
      mon.setDate(mon.getDate() + ((8 - mon.getDay()) % 7 || 7));
      const wd = n => { const d = new Date(mon); d.setDate(d.getDate() + n); return d; };
      const fri = wd(4);

      // Most recent first Friday (jobs report day)
      let ff = new Date(today.getFullYear(), today.getMonth(), 1);
      while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1);
      if (ff > today) { ff = new Date(today.getFullYear(), today.getMonth() - 1, 1); while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1); }
      const prevMonth = new Date(ff.getFullYear(), ff.getMonth() - 1, 1);

      return {
        monthKey, mi, calLines: calLines.join('\n'), bars: bars.join(', '), ticks,
        journalDate: longDate(back.getFullYear(), back.getMonth(), back.getDate()),

    // Parsers shared by the templates. Formats are documented in each field hint.
    function parseFeedTrades(text) {
      return rows(text).map((c, i) => ({
        strategy: c[0] || 'Strategy', asset: c[1] || '', pnl: FMT.num(c[2]), rr: c[3] || '', time: c[4] || '',
        note: c[5] || '', broke: /^(x|yes|no rules|broke)/i.test(c[6] || ''), conf: seeded(i, 3, 2)
      }));
    }

    function parseLogTrades(text) {
      return rows(text).map((c, i) => ({
        date: c[0] || '', strategy: c[1] || '', asset: c[2] || '', pnl: FMT.num(c[3]), rr: c[4] || '', time: c[5] || '',
        dir: c[6] || 'Long', account: c[7] || 'Main', broke: /^(x|yes|broke)/i.test(c[8] || ''), conf: seeded(i, 3, 2)
      }));
    }

    // Calendar days. Each line is one weekday of the month, in order: PNL, trades, wins
    // ("-" = no trades that day). A line can also start with the date: day, PNL, trades, wins.
    function parseCalDays(mi, text, notes, news) {
      const days = {};
      const weekdays = tradingDays(mi.y, mi.m);
      let next = 0;
      String(text || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
        if (/^([-–—]+|off)$/i.test(line)) { next++; return; }
        const c = line.split(/[,|]/).map(v => v.trim()).filter(v => v !== '');
        let d, vals;
        if (c.length >= 4) { d = Math.round(FMT.num(c[0])); vals = c.slice(1); next = weekdays.indexOf(d) + 1 || next; }
        else { d = weekdays[next++]; vals = c; }
        const trades = Math.max(0, Math.round(FMT.num(vals[1], 1)));
        if (!d || d > mi.days || !trades) return;
        days[d] = { pnl: FMT.num(vals[0]), trades, wins: clamp(Math.round(FMT.num(vals[2], 0)), 0, trades) };
      });
      list(notes).forEach(v => { const d = Math.round(FMT.num(v)); if (d) (days[d] ||= { trades: 0, pnl: 0, wins: 0 }).note = true; });
      list(news).forEach(v => { const d = Math.round(FMT.num(v)); if (d) { const o = (days[d] ||= { trades: 0, pnl: 0, wins: 0 }); o.news = (o.news || 0) + 1; } });
      return days;
    }

    function monthStats(days) {
      let pnl = 0, trades = 0, wins = 0;
      Object.values(days).forEach(d => { if (d.trades) { pnl += d.pnl; trades += d.trades; wins += d.wins; } });
      return { pnl, trades, wr: trades ? Math.round(wins / trades * 100) : 0 };
    }

    function calcResult(ticker, contracts, a, b, c, mode = 'price') {
      const spec = TICK_SPECS[ticker] || TICK_SPECS.MNQ;
      const n = Math.max(0, FMT.num(contracts));
      let slTicks, tpTicks;
      if (mode === 'points') { slTicks = Math.abs(FMT.num(a)) / spec.tickSize; tpTicks = Math.abs(FMT.num(b)) / spec.tickSize; }
      else { slTicks = Math.abs(FMT.num(a) - FMT.num(b)) / spec.tickSize; tpTicks = Math.abs(FMT.num(c) - FMT.num(a)) / spec.tickSize; }
      const risk = slTicks * spec.tickValue * n;
      const profit = tpTicks * spec.tickValue * n;
      return { risk, profit, rr: risk > 0 ? profit / risk : 0 };
    }
