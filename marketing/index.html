    /* ============================================================
       6. LAYERS
       App screens are built from the UI 2.0 library in #layerStage,
       measured (anchors for native animation), rasterized once with
       modern-screenshot, and cached. The composition only draws
       bitmaps, so every frame is fast and identical in preview and
       export.
       ============================================================ */
    const layerStage = $('#layerStage');
    const layerCache = new Map();   // key -> Promise<layer>
    let safariWarm = false;

    const measureCtx = document.createElement('canvas').getContext('2d');

    function nextFrame() { return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }

    // Text metrics for a DOM text element, so the canvas can draw the same text in the same place.
    function textInfo(el, rootRect) {
      const cs = getComputedStyle(el);
      const r = el.getBoundingClientRect();
      const size = parseFloat(cs.fontSize) || 16;
      const fontStr = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
      measureCtx.font = fontStr;
      const m = measureCtx.measureText('Hg0');
      const asc = m.fontBoundingBoxAscent || size * 0.8;
      const desc = m.fontBoundingBoxDescent || size * 0.2;
      const lh = cs.lineHeight === 'normal' ? asc + desc : parseFloat(cs.lineHeight);
      return {
        font: fontStr, size, weight: cs.fontWeight, family: cs.fontFamily, color: cs.color,
        letterSpacing: cs.letterSpacing === 'normal' ? 0 : parseFloat(cs.letterSpacing) || 0,
        left: r.left - rootRect.left,
        baseline: (r.top - rootRect.top) + (lh - (asc + desc)) / 2 + asc,
        text: el.textContent
      };
    }

    // Equity line points (from the SVG path) in layer coordinates
    function pathPoints(pathEl, rootRect) {
      const svg = pathEl.closest('svg');
      const vb = svg.viewBox.baseVal;
      const r = svg.getBoundingClientRect();
      const kx = r.width / vb.width, ky = r.height / vb.height;
      const nums = (pathEl.getAttribute('d') || '').match(/-?\d+(\.\d+)?/g) || [];
      const pts = [];
      for (let i = 0; i + 1 < nums.length; i += 2) {
        pts.push([r.left - rootRect.left + (+nums[i] - vb.x) * kx, r.top - rootRect.top + (+nums[i + 1] - vb.y) * ky]);
      }
      return pts;
    }

    function layerKey(desc) {
      return JSON.stringify([desc.html, desc.width, desc.u, desc.scale, desc.hide || [], desc.remove || [], Object.keys(desc.anchors || {}), fontEmbedCss.length]);
    }

    // A painted frame where almost nothing is opaque means the browser drew an empty image (Safari, now and then).
    function looksEmpty(canvas) {
      try {
        const probe = document.createElement('canvas');
        probe.width = 48;
        probe.height = Math.max(1, Math.round(48 * canvas.height / canvas.width));
        const c = probe.getContext('2d');
        c.drawImage(canvas, 0, 0, probe.width, probe.height);
        const data = c.getImageData(0, 0, probe.width, probe.height).data;
        let solid = 0;
        for (let i = 3; i < data.length; i += 4) if (data[i] > 200) solid++;
        return solid < (probe.width * probe.height) * 0.15;
      } catch (err) {
        return false;
      }
    }

    async function rasterize(desc) {
      const lib = await loadDep('screenshot');
      const root = document.createElement('div');
      root.className = 'vlayer tpui';
      root.style.cssText = `--u:${desc.u || 2}px;width:${desc.width}px;`;
      root.innerHTML = desc.html;
      (desc.remove || []).forEach(sel => root.querySelectorAll(sel).forEach(el => el.remove()));
      layerStage.appendChild(root);
      try {
        await fontReady;
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        await nextFrame();
        const rootRect = root.getBoundingClientRect();
        const first = root.firstElementChild;
        const radius = first ? parseFloat(getComputedStyle(first).borderTopLeftRadius) || 0 : 0;
        const anchors = {};
        for (const [name, spec] of Object.entries(desc.anchors || {})) {
          const sel = typeof spec === 'string' ? spec : spec.sel;
          const el = root.querySelector(sel);
          if (!el) continue;
          const r = el.getBoundingClientRect();
          const a = { x: r.left - rootRect.left, y: r.top - rootRect.top, w: r.width, h: r.height };
          if (spec.text) a.text = textInfo(el, rootRect);
          if (spec.path) a.points = pathPoints(el, rootRect);
          if (spec.radius) a.radius = parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
          anchors[name] = a;
        }
        (desc.hide || []).forEach(sel => root.querySelectorAll(sel).forEach(el => el.classList.add('v-hide')));
        const w = Math.round(rootRect.width), h = Math.round(rootRect.height);
        const options = {
          width: w,
          height: h,
          scale: desc.scale || 2,
          backgroundColor: null,
          font: fontEmbedCss ? { cssText: fontEmbedCss } : false,
          timeout: 30000
        };
        if (IS_SAFARI && !safariWarm) { safariWarm = true; try { await lib.domToCanvas(root, options); } catch (err) {} }
        let canvas = await lib.domToCanvas(root, options);
        if (looksEmpty(canvas)) canvas = await lib.domToCanvas(root, options);
        if (looksEmpty(canvas)) throw new Error(`The browser returned an empty image for the ${desc.label || desc.id} screen.`);
        let img = canvas;
        // 1x copy, downscaled once in steps of 2 for a clean result
        let one = canvas;
        while (one.width >= w * 2 - 1) {
          const c = document.createElement('canvas');
          c.width = Math.round(one.width / 2);
          c.height = Math.round(one.height / 2);
          const g = c.getContext('2d');
          g.imageSmoothingQuality = 'high';
          g.drawImage(one, 0, 0, c.width, c.height);
          one = c;
        }
        let img1 = one === canvas ? null : one;
        if (window.createImageBitmap) {
          try { img = await createImageBitmap(canvas); } catch (err) { img = canvas; }
          if (img1) { try { img1 = await createImageBitmap(img1); } catch (err) {} }
        }
        return { id: desc.id, label: desc.label, img, img1, w, h, radius, anchors, kind: 'ui' };
      } finally {
        root.remove();
      }
    }

    function getLayer(desc) {
      const key = layerKey(desc);
      if (!layerCache.has(key)) {
        const p = rasterize(desc);
        layerCache.set(key, p);
        p.catch(() => layerCache.delete(key));
      }
      return layerCache.get(key);
    }

    // An uploaded screenshot used in place of a built screen. Framed like a UI 2.0 window.
    function shotLayer(id, image, width) {
      const w = Math.round(width);
      const h = Math.round(width * image.height / image.width);
      const k = Math.min(2, (image.width / w) || 1);
      const c = document.createElement('canvas');
      c.width = Math.round(w * k);
      c.height = Math.round(h * k);
      const g = c.getContext('2d');
      g.scale(k, k);
      const r = 26;
      roundRectPath(g, 0, 0, w, h, r);
      g.save();
      g.clip();
      g.fillStyle = '#171a24';
      g.fillRect(0, 0, w, h);
      g.imageSmoothingQuality = 'high';
      g.drawImage(image, 0, 0, w, h);
      g.restore();
      roundRectPath(g, 1, 1, w - 2, h - 2, r - 1);
      g.lineWidth = 2;
      g.strokeStyle = '#262a38';
      g.stroke();
      return { id, label: 'Screenshot', img: c, w, h, radius: r, anchors: {}, kind: 'shot' };
    }

    /* ============================================================
       7. MOTION KIT
       Easing, springs, layer drawing (shadow, tilt, light sweep),
       kinetic type and the backdrop. Everything is a pure function of
       time, so any frame can be drawn in any order (scrubbing, export).
       ============================================================ */
    const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
    const lerp = (a, b, k) => a + (b - a) * k;
    const prog = (t, a, b) => b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a));

    const Ease = {
      linear: p => p,
      inQuad: p => p * p,
      outQuad: p => 1 - (1 - p) * (1 - p),
      inCubic: p => p * p * p,
      outCubic: p => 1 - Math.pow(1 - p, 3),
      inOutCubic: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
      outQuart: p => 1 - Math.pow(1 - p, 4),
      inQuart: p => p * p * p * p,
      inOutQuart: p => p < 0.5 ? 8 * p * p * p * p : 1 - Math.pow(-2 * p + 2, 4) / 2,
      outQuint: p => 1 - Math.pow(1 - p, 5),
      outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
      inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
      inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
      outBack: p => { const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
      // Damped spring from 0 to 1 that settles by p = 1 with a small overshoot
      spring: p => {
        if (p <= 0) return 0;
        if (p >= 1) return 1;
        const z = 0.52, w = 11, wd = w * Math.sqrt(1 - z * z);
        return 1 - Math.exp(-z * w * p) * (Math.cos(wd * p) + (z * w / wd) * Math.sin(wd * p));
      }
    };

    const ease = (t, a, b, fn = Ease.outCubic) => fn(prog(t, a, b));

    // Deterministic noise for audio and textures (mulberry32)
    function rng(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      r = Math.max(0, Math.min(r, w / 2, h / 2));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const supportsTracking = 'letterSpacing' in CanvasRenderingContext2D.prototype;
    function setFont(ctx, weight, size, family = FONT_UI, tracking = 0) {
      ctx.font = `${weight} ${size}px ${family}`;
      if (supportsTracking) ctx.letterSpacing = `${tracking}px`;
    }

    /* ---------- soft shadows: pre-blurred once, drawn as a sprite ---------- */
    const shadowCache = new Map();
    function shadowSprite(w, h, r, blur) {
      const key = `${Math.round(w)}x${Math.round(h)}r${Math.round(r)}b${blur}`;
      if (shadowCache.has(key)) return shadowCache.get(key);
      const k = 0.25;   // the blur hides the low resolution
      const pad = blur * 1.6;
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round((w + pad * 2) * k));
      c.height = Math.max(1, Math.round((h + pad * 2) * k));
      const g = c.getContext('2d');
      g.scale(k, k);
      g.shadowColor = 'rgba(2, 3, 7, 1)';
      g.shadowBlur = blur * k;   // shadowBlur ignores the transform
      g.shadowOffsetX = 10000 * k;
      g.fillStyle = '#000';
      roundRectPath(g, pad - 10000, pad, w, h, r);
      g.fill();
      const s = { canvas: c, pad };
      shadowCache.set(key, s);
      return s;
    }

    // Draws a perspective tilt (rotation around the horizontal axis) by slicing the image
    // into thin horizontal strips, each scaled by its depth. Top edge leans away for deg > 0.
    function drawTiltX(ctx, img, cx, cy, w, h, deg, persp = 2000) {
      const th = deg * Math.PI / 180;
      const n = Math.max(12, Math.min(72, Math.round(Math.abs(deg) * 2.2) + 24));
      const sw = img.width, sh = img.height;
      const cos = Math.cos(th), sin = Math.sin(th);
      const proj = v => {   // v in [-0.5, 0.5] from top to bottom
        const y3 = v * h * cos;
        const z = -v * h * sin;   // top (v < 0) goes back
        const p = persp / (persp + z);
        return { y: cy + y3 * p, p };
      };
      let prev = proj(-0.5);
      for (let i = 0; i < n; i++) {
        const v1 = -0.5 + (i + 1) / n;
        const next = proj(v1);
        const pm = (prev.p + next.p) / 2;
        const ww = w * pm;
        const sy = (i / n) * sh, sH = sh / n;
        ctx.drawImage(img, 0, sy, sw, sH + (i < n - 1 ? 1 : 0), cx - ww / 2, prev.y, ww, next.y - prev.y + 0.6);
        prev = next;
      }
    }

    // Layers keep a 2x bitmap for zooms and a 1x copy for normal draws (cheaper and just as sharp)
    function pickBitmap(ctx, L, s) {
      const m = ctx.getTransform();
      const k = Math.hypot(m.a, m.b) * s;
      const img = L.img1 && k <= 1.08 ? L.img1 : L.img;
      // Near 1:1 a plain bilinear draw is as sharp as 'high' and much cheaper
      const ratio = (L.w * k) / img.width;
      ctx.imageSmoothingQuality = ratio > 0.92 && ratio < 1.09 ? 'low' : 'high';
      return img;
    }

    // One layer: o = { cx, cy, s, a, rx, shadow, dim, sweep, blurShadow }
    function drawLayer(ctx, L, o) {
      if (!L) return;
      const s = o.s == null ? 1 : o.s;
      const a = o.a == null ? 1 : o.a;
      if (a <= 0.001 || s <= 0.001) return;
      const w = L.w * s, h = L.h * s;
      const x = o.cx - w / 2, y = o.cy - h / 2;
      ctx.save();
      ctx.globalAlpha *= a;
      const sh = o.shadow == null ? 1 : o.shadow;
      if (sh > 0) {
        const blur = o.blurShadow || 110;
        const sp = shadowSprite(L.w, L.h, L.radius, blur);
        ctx.save();
        ctx.globalAlpha *= 0.62 * sh;
        ctx.imageSmoothingQuality = 'low';
        const tilt = o.rx ? Math.cos(o.rx * Math.PI / 180) : 1;
        ctx.drawImage(sp.canvas, x - sp.pad * s, y - sp.pad * s + 46 * s * tilt, w + sp.pad * 2 * s, (h + sp.pad * 2 * s) * tilt);
        ctx.restore();
      }
      const img = pickBitmap(ctx, L, s);
      if (o.rx && Math.abs(o.rx) > 0.05) {
        drawTiltX(ctx, img, o.cx, o.cy, w, h, o.rx);
      } else {
        ctx.drawImage(img, x, y, w, h);
      }
      if (o.dim > 0.001) {
        roundRectPath(ctx, x, y, w, h, L.radius * s);
        ctx.fillStyle = `rgba(6, 7, 11, ${clamp01(o.dim)})`;
        ctx.fill();
      }
      if (o.sweep > 0 && o.sweep < 1 && !o.rx) drawSweep(ctx, x, y, w, h, L.radius * s, o.sweep, o.sweepStrength || 1);
      ctx.restore();
    }

    // A soft diagonal band of light that crosses a card
    function drawSweep(ctx, x, y, w, h, r, p, strength = 1) {
      ctx.save();
      roundRectPath(ctx, x, y, w, h, r);
      ctx.clip();
      const span = w + h;
      const cx = x - h * 0.6 + span * 1.25 * Ease.inOutSine(p) - span * 0.1;
      const band = Math.max(160, w * 0.28);
      const g = ctx.createLinearGradient(cx - band, y, cx + band, y + h * 0.35);
      const peak = 0.11 * strength * Math.sin(Math.PI * p);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.5, `rgba(214,216,255,${peak})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, h);
      ctx.restore();
    }

    // Layer-local point -> frame point (no tilt)
    function anchorPoint(L, o, ax, ay) {
      const s = o.s == null ? 1 : o.s;
      return [o.cx + (ax - L.w / 2) * s, o.cy + (ay - L.h / 2) * s];
    }

    // Soft radial light. Drawn from a small cached sprite: smooth, and far cheaper than a gradient per frame.
    const glowSprites = new Map();
    function glowSprite(rgb) {
      let c = glowSprites.get(rgb);
      if (c) return c;
      c = document.createElement('canvas');
      c.width = c.height = 256;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      for (let i = 0; i <= 16; i++) {
        const p = i / 16;
        // smooth falloff close to the old 3-stop gradient, without banding
        const a = Math.pow(1 - p, 1.9) * (0.55 + 0.45 * Math.cos(p * Math.PI * 0.5));
        gr.addColorStop(p, `rgba(${rgb},${a.toFixed(4)})`);
      }
      g.fillStyle = gr;
      g.fillRect(0, 0, 256, 256);
      glowSprites.set(rgb, c);
      return c;
    }

    function glow(ctx, x, y, r, rgb, alpha) {
      if (alpha <= 0.001 || r <= 0) return;
      const prev = ctx.globalAlpha, q = ctx.imageSmoothingQuality;
      ctx.globalAlpha = prev * Math.min(1, alpha);
      ctx.imageSmoothingQuality = 'low';   // smooth gradients scale perfectly with bilinear
      ctx.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2);
      ctx.imageSmoothingQuality = q;
      ctx.globalAlpha = prev;
    }

    // Expanding ring, used for taps and markers
    function pulse(ctx, x, y, p, { r0 = 14, r1 = 70, color = '163,166,251', width = 4 } = {}) {
      if (p <= 0 || p >= 1) return;
      const e = Ease.outCubic(p);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, lerp(r0, r1, e), 0, Math.PI * 2);
      ctx.lineWidth = width * (1 - e * 0.6);
      ctx.strokeStyle = `rgba(${color},${0.85 * (1 - e)})`;
      ctx.stroke();
      ctx.restore();
    }

    /* ---------- kinetic type ---------- */
    // Text: new line = line break, [words] = brand purple.
    function layoutRich(ctx, text, { size, weight = 600, family = FONT_UI, tracking = 0, maxW = 936, lineH = 1.08 }) {
      setFont(ctx, weight, size, family, tracking);
      const space = ctx.measureText(' ').width;
      const lines = [];
      let accent = false;
      String(text || '').split('\n').forEach(raw => {
        const words = [];
        raw.split(/\s+/).filter(Boolean).forEach(tok => {
          let out = '', segs = [];
          for (const ch of tok) {
            if (ch === '[') { if (out) segs.push({ text: out, accent }); out = ''; accent = true; continue; }
            if (ch === ']') { if (out) segs.push({ text: out, accent }); out = ''; accent = false; continue; }
            out += ch;
          }
          if (out) segs.push({ text: out, accent });
          if (!segs.length) return;
          const w = segs.reduce((acc, sg) => acc + ctx.measureText(sg.text).width, 0);
          words.push({ segs, w });
        });
        // greedy wrap
        let line = [], lw = 0;
        words.forEach(wd => {
          const add = (line.length ? space : 0) + wd.w;
          if (line.length && lw + add > maxW) { lines.push({ words: line, w: lw }); line = []; lw = 0; }
          lw += (line.length ? space : 0) + wd.w;
          line.push(wd);
        });
        if (line.length) lines.push({ words: line, w: lw });
      });
      const m = ctx.measureText('Hg');
      const asc = m.fontBoundingBoxAscent || size * 0.8;
      const desc = m.fontBoundingBoxDescent || size * 0.22;
      return { lines, size, weight, family, tracking, space, lineH: size * lineH, asc, desc, width: Math.max(0, ...lines.map(l => l.w)) };
    }

    // Words rise out of a mask, one after another. inT/outT are local times.
    function drawRich(ctx, lay, x, y, t, {
      align = 'left', color = '#e9ebf2', accent = '#6366f1', start = 0, stagger = 0.055, dur = 0.5,
      outStart = null, outStagger = 0.03, outDur = 0.32, alpha = 1, mask = true, rise = 0.92
    } = {}) {
      setFont(ctx, lay.weight, lay.size, lay.family, lay.tracking);
      ctx.textBaseline = 'alphabetic';
      const base0 = ctx.globalAlpha;
      let k = 0;
      lay.lines.forEach((line, li) => {
        const top = y + li * lay.lineH;
        const base = top + (lay.lineH - (lay.asc + lay.desc)) / 2 + lay.asc;
        let cx = align === 'center' ? x - line.w / 2 : align === 'right' ? x - line.w : x;
        ctx.save();
        if (mask) {
          ctx.beginPath();
          ctx.rect(cx - lay.size, top - lay.size * 0.2, line.w + lay.size * 2, lay.lineH + lay.size * 0.42);
          ctx.clip();
        }
        line.words.forEach(wd => {
          const p = Ease.outQuart(prog(t, start + k * stagger, start + k * stagger + dur));
          let dy = (1 - p) * lay.size * rise;
          let a = alpha * Math.min(1, p * 1.6);
          if (outStart != null) {
            const q = Ease.inCubic(prog(t, outStart + k * outStagger, outStart + k * outStagger + outDur));
            dy -= q * lay.size * 0.9;
            a *= 1 - q;
          }
          if (a > 0.002) {
            let wx = cx;
            ctx.globalAlpha = base0 * a;
            wd.segs.forEach(sg => {
              ctx.fillStyle = sg.accent ? accent : color;
              ctx.fillText(sg.text, wx, base + dy);
              wx += ctx.measureText(sg.text).width;
            });
          }
          cx += wd.w + lay.space;
          k++;
        });
        ctx.restore();
      });
      ctx.globalAlpha = base0;
      return lay.lines.length * lay.lineH;
    }

    // Marketing label pill (same look as the Studio's card labels)
    function drawChip(ctx, text, x, y, { align = 'left', size = 27, a = 1, s = 1, tone = 'accent' } = {}) {
      if (a <= 0.002 || !text) return 0;
      const label = String(text).toUpperCase();
      setFont(ctx, 600, size, FONT_UI, size * 0.07);
      const tw = ctx.measureText(label).width;
      const h = Math.round(size * 2.05), padL = size * 0.95, dot = size * 0.36, gap = size * 0.5, padR = size * 0.9;
      const w = padL + dot + gap + tw + padR;
      const x0 = align === 'center' ? x - w / 2 : x;
      ctx.save();
      ctx.globalAlpha *= a;
      ctx.translate(x0 + w / 2, y + h / 2);
      ctx.scale(s, s);
      ctx.translate(-w / 2, -h / 2);
      const amber = tone === 'amber';
      roundRectPath(ctx, 0, 0, w, h, h / 2);
      ctx.fillStyle = amber ? 'rgba(245, 158, 11, 0.13)' : 'rgba(29, 33, 48, 0.92)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = amber ? 'rgba(245, 158, 11, 0.62)' : 'rgba(99, 102, 241, 0.6)';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(padL + dot / 2, h / 2, dot / 2, 0, Math.PI * 2);
      ctx.fillStyle = amber ? '#f59e0b' : '#6366f1';
      ctx.fill();
      ctx.fillStyle = amber ? '#fcd34d' : '#e9ebf2';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, padL + dot + gap, h / 2 + size * 0.04);
      ctx.restore();
      return w;
    }

    /* ---------- backdrop: graphite, a slow grid and indigo light ---------- */
    let backdropCache = null;
    function backdropParts() {
      if (backdropCache) return backdropCache;
      const grid = document.createElement('canvas');
      grid.width = W;
      grid.height = H + 96;
      const g = grid.getContext('2d');
      g.strokeStyle = 'rgba(255,255,255,0.045)';
      g.lineWidth = 2;
      g.beginPath();
      for (let x = 12; x <= W; x += 96) { g.moveTo(x, 0); g.lineTo(x, H + 96); }
      for (let y = 0; y <= H + 96; y += 96) { g.moveTo(0, y); g.lineTo(W, y); }
      g.stroke();
      // fade the grid out away from the top centre
      g.globalCompositeOperation = 'destination-in';
      const fade = g.createRadialGradient(W / 2, 420, 80, W / 2, 620, 1300);
      fade.addColorStop(0, 'rgba(0,0,0,1)');
      fade.addColorStop(0.55, 'rgba(0,0,0,0.45)');
      fade.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = fade;
      g.fillRect(0, 0, W, H + 96);

      const vig = document.createElement('canvas');
      vig.width = W / 4;
      vig.height = H / 4;
      const v = vig.getContext('2d');
      const vg = v.createRadialGradient(W / 8, H / 8, H / 16, W / 8, H / 8, H / 4.6);
      vg.addColorStop(0, 'rgba(4,5,8,0)');
      vg.addColorStop(1, 'rgba(4,5,8,0.62)');
      v.fillStyle = vg;
      v.fillRect(0, 0, W / 4, H / 4);
      backdropCache = { grid, vig };
      return backdropCache;
    }

    // Light is soft, so it is painted at quarter size and scaled up; the grid stays full size.
    let lightCanvas = null;
    function drawBackdrop(ctx, t, level = 1) {
      const { grid } = backdropParts();
      if (!lightCanvas) { lightCanvas = document.createElement('canvas'); lightCanvas.width = W / 4; lightCanvas.height = H / 4; }
      const g = lightCanvas.getContext('2d');
      g.setTransform(0.25, 0, 0, 0.25, 0, 0);
      g.globalAlpha = 1;
      g.fillStyle = '#0c0e14';
      g.fillRect(0, 0, W, H);
      const lv = clamp01(level / 1.6) * 1.6;
      glow(g, 540 + 230 * Math.sin(t * 0.33), 560 + 110 * Math.cos(t * 0.27), 980, '99,102,241', 0.17 * lv);
      glow(g, 860 + 120 * Math.cos(t * 0.29), 1560 + 90 * Math.sin(t * 0.21), 820, '79,70,229', 0.11 * lv);
      glow(g, 160 + 90 * Math.sin(t * 0.25 + 1), 1180 + 120 * Math.cos(t * 0.19), 620, '139,92,246', 0.05 * lv);
      const q = ctx.imageSmoothingQuality;
      ctx.imageSmoothingQuality = 'low';
      ctx.drawImage(lightCanvas, 0, 0, W, H);
      ctx.imageSmoothingQuality = 'low';
      const off = (t * 14) % 96;
      ctx.drawImage(grid, 0, -off);
      ctx.imageSmoothingQuality = q;
    }

    function drawVignette(ctx) {
      const q = ctx.imageSmoothingQuality;
      ctx.imageSmoothingQuality = 'low';
      ctx.drawImage(backdropParts().vig, 0, 0, W, H);
      ctx.imageSmoothingQuality = q;

    /* ============================================================
       8. SCENES
       Each scene draws itself from its local time lt (seconds since its
       start; negative while it is coming in, past its length while it is
       going out). Transitions move whole scenes; scenes add their own
       detail: staggered layers, count-ups, light sweeps, taps.
       Layout is in video pixels (1080 x 1920). Captions stay above
       y = 230 and below the platform header; prices and buttons stay
       above y = 1440, clear of the Reels caption area.
       ============================================================ */
    const UI_TOP = 600;
    const UI_MID = 1040;
    const CAP_X = 72;
    const CAP_Y = 262;

    // Transition library. p runs 0 -> 1 across the cut. mb = motion blur samples.
    const TRANS = {
      rise: { id: 'rise', tw: 0.6, mb: 5, order: 'in', sfx: 'rise',
        out: p => ({ dy: -240 * Ease.inCubic(p), a: 1 - Ease.outQuad(p) }),
        in: p => ({ dy: 760 * (1 - Ease.outCubic(p)), a: clamp01(p * 2.2) }) },
      whipLeft: { id: 'whipLeft', tw: 0.44, mb: 7, order: 'in', sfx: 'whip',
        out: p => ({ dx: -W * 1.04 * Ease.inOutCubic(p) }),
        in: p => ({ dx: W * 1.04 * (1 - Ease.inOutCubic(p)) }) },
      whipUp: { id: 'whipUp', tw: 0.44, mb: 7, order: 'in', sfx: 'whip',
        out: p => ({ dy: -H * 0.6 * Ease.inOutCubic(p), a: 1 - Ease.inQuad(p) }),
        in: p => ({ dy: H * 0.6 * (1 - Ease.inOutCubic(p)), a: clamp01(p * 3) }) },
      zoom: { id: 'zoom', tw: 0.5, mb: 4, order: 'out', sfx: 'swell',
        out: p => ({ s: 1 + 0.32 * Ease.inCubic(p), a: 1 - Ease.outCubic(p) }),
        in: p => ({ s: 0.84 + 0.16 * Ease.outCubic(p), a: Ease.outQuad(p) }) },
      push: { id: 'push', tw: 0.56, mb: 5, order: 'in', sfx: 'whoosh',
        out: p => ({ s: 1 - 0.07 * Ease.inOutCubic(p), dim: 0.62 * p, a: 1 - Ease.outQuad(p) }),
        in: p => ({ dy: H * 0.9 * (1 - Ease.outQuart(p)) }) },
      flash: { id: 'flash', tw: 0.5, mb: 3, order: 'in', sfx: 'impact', flash: true,
        out: p => ({ a: 1 - Ease.outQuad(clamp01(p * 1.8)), s: 1 + 0.08 * p }),
        in: p => ({ a: Ease.outQuad(prog(p, 0.42, 1)), s: 1.07 - 0.07 * Ease.outCubic(p) }) }
    };

    function stackTops(heights, gap, top = UI_TOP, mid = UI_MID) {
      const total = heights.reduce((a, b) => a + b, 0) + gap * Math.max(0, heights.length - 1);
      let y = Math.max(top, mid - total / 2);
      return heights.map(h => { const t = y; y += h + gap; return t; });
    }

    // Scales a layer down if it would not fit the video width
    const fitW = (L, max = 984) => L ? Math.min(1, max / L.w) : 1;

    // Layer-local point -> video point, including the tilt (for overlays during a tilt)
    function lp(L, o, ax, ay) {
      const s = o.s == null ? 1 : o.s;
      const w = L.w * s, h = L.h * s;
      if (!o.rx) return { x: o.cx + (ax - L.w / 2) * s, y: o.cy + (ay - L.h / 2) * s, k: s };
      const th = o.rx * Math.PI / 180, persp = 2000;
      const v = ay / L.h - 0.5;
      const p = persp / (persp - v * h * Math.sin(th));
      return { x: o.cx + (ax / L.w - 0.5) * w * p, y: o.cy + v * h * Math.cos(th) * p, k: s * p };
    }

    function zoomAround(ctx, z, fx, fy, tx = fx, ty = fy) {
      ctx.translate(tx, ty);
      ctx.scale(z, z);
      ctx.translate(-fx, -fy);
    }

    /* ---------- captions: chip + headline (+ example data note) ---------- */
    // Largest size (from the list) at which the text fits in maxLines; tracking scales with size
    function fitRich(text, opts, maxLines, sizes) {
      let lay = null;
      for (const size of sizes) {
        lay = layoutRich(measureCtx, text, { ...opts, size, tracking: -size * 0.032 });
        if (lay.lines.length <= maxLines) return lay;
      }
      return lay;
    }

    function capLayouts(S) {
      if (S._cap !== undefined) return S._cap;
      if (!S.cap || (!S.cap.label && !S.cap.title)) return (S._cap = null);
      S._cap = { title: fitRich(S.cap.title, { weight: 600, maxW: 900, lineH: 1.06 }, 2, [82, 76, 70, 64, 58]) };
      return S._cap;
    }

    function drawCaption(ctx, lt, S, P, { y = CAP_Y } = {}) {
      const lay = capLayouts(S);
      if (!lay) return;
      const pc = prog(lt, -0.05, 0.4);
      drawChip(ctx, S.cap.label, CAP_X, y, { a: clamp01(pc * 2), s: 0.92 + 0.08 * Ease.outBack(pc) });
      const ty = y + 82;
      const th = drawRich(ctx, lay.title, CAP_X, ty, lt, { start: 0.06, stagger: 0.05, dur: 0.5 });
      if (S.type.demo && P.s.showDemoNote && P.s.demoNote) {
        ctx.save();
        setFont(ctx, 500, 25, FONT_UI, 0);
        ctx.fillStyle = '#6d7388';
        ctx.globalAlpha *= clamp01(prog(lt, 0.35, 0.7));
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(P.s.demoNote, CAP_X + 2, ty + th + 34);
        ctx.restore();
      }
    }

    /* ---------- shared bits ---------- */
    let logoImg = null;
    const logoReady = new Promise(resolve => {
      const img = new Image();
      img.onload = () => { logoImg = img; resolve(true); };
      img.onerror = () => resolve(false);
      img.src = '/assets/tradeprint-logo-768.png';
    });

    // The official logo, as supplied (rounded like an app icon). Falls back to the vector mark.
    function drawLogoTile(ctx, cx, cy, size, a = 1, glowAmt = 1) {
      if (a <= 0.002) return;
      ctx.save();
      ctx.globalAlpha *= a;
      glow(ctx, cx, cy, size * 2.1, '99,102,241', 0.32 * glowAmt);
      const r = size * 0.23, x = cx - size / 2, y = cy - size / 2;
      if (logoImg) {
        roundRectPath(ctx, x, y, size, size, r);
        ctx.save();
        ctx.clip();
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(logoImg, x, y, size, size);
        ctx.restore();
        roundRectPath(ctx, x + 1, y + 1, size - 2, size - 2, r);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.09)';
        ctx.stroke();
      } else {
        roundRectPath(ctx, x, y, size, size, r);
        ctx.fillStyle = '#0b0b0d';
        ctx.fill();
        drawMark(ctx, cx, cy, size * 0.56, '#6366f1');
      }
      ctx.restore();
    }

    function drawWordmark(ctx, cx, baseline, size, a = 1) {
      if (a <= 0.002) return;
      setFont(ctx, 700, size, FONT_UI, -size * 0.03);
      const w1 = ctx.measureText('trade').width, w2 = ctx.measureText('print').width;
      const x = cx - (w1 + w2) / 2;
      ctx.save();
      ctx.globalAlpha *= a;
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#e9ebf2';
      ctx.fillText('trade', x, baseline);
      ctx.fillStyle = '#6366f1';
      ctx.fillText('print', x + w1, baseline);
      ctx.restore();
      return w1 + w2;
    }

    // Shimmer across a rounded button
    function buttonShimmer(ctx, x, y, w, h, r, p) {
      if (p <= 0 || p >= 1) return;
      drawSweep(ctx, x, y, w, h, r, p, 2.4);
    }

    // Draws a measured app text (count-ups) exactly where the hidden DOM text was
    function drawAnchorText(ctx, L, o, anchor, text, { align = 'left', a = 1 } = {}) {
      if (!anchor || !anchor.text) return;
      const ti = anchor.text;
      const pt = lp(L, o, align === 'center' ? anchor.x + anchor.w / 2 : ti.left, ti.baseline);
      ctx.save();
      ctx.globalAlpha *= a;
      ctx.font = `${ti.weight} ${ti.size * pt.k}px ${ti.family}`;
      if (supportsTracking) ctx.letterSpacing = `${ti.letterSpacing * pt.k}px`;
      ctx.fillStyle = ti.color;
      ctx.textAlign = align;
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(text, pt.x, pt.y);
      ctx.restore();
    }

    // A glowing trace that runs along a polyline (the equity curve)
    function drawTrace(ctx, L, o, pts, q, { span = 0.22 } = {}) {
      if (!pts || pts.length < 2 || q <= 0) return;
      const n = pts.length - 1;
      const head = clamp01(q) * n;
      const tail = Math.max(0, head - span * n);
      const at = f => {
        const i = Math.min(n - 1, Math.floor(f)), k = f - i;
        const p0 = pts[i], p1 = pts[i + 1];
        return lp(L, o, lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k));
      };
      const path = [at(tail)];
      for (let i = Math.ceil(tail); i <= Math.floor(head); i++) path.push(lp(L, o, pts[i][0], pts[i][1]));
      const hp = at(head);
      path.push(hp);
      const tp = path[0];
      const fade = 1 - Ease.inQuad(prog(q, 0.92, 1));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      [[16, 0.10], [7, 0.35], [2.6, 0.9]].forEach(([wd, al], idx) => {
        const g = ctx.createLinearGradient(tp.x, tp.y, hp.x, hp.y);
        const col = idx === 2 ? '235,236,255' : '129,132,248';
        g.addColorStop(0, `rgba(${col},0)`);
        g.addColorStop(1, `rgba(${col},${al * fade})`);
        ctx.strokeStyle = g;
        ctx.lineWidth = wd * o.s;
        ctx.beginPath();
        path.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
      });
      glow(ctx, hp.x, hp.y, 46 * o.s, '160,163,255', 0.55 * fade);
      ctx.beginPath();
      ctx.arc(hp.x, hp.y, 6 * o.s, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.95 * fade})`;
      ctx.fill();
      ctx.restore();
    }

    // Generic treatment for an uploaded screenshot: settle in, then a slow push
    function drawShotScene(ctx, lt, S, P, L) {
      if (!S.spot) drawCaption(ctx, lt, S, P);
      if (!L) return;
      const maxH = 1560 - UI_TOP;
      const s0 = Math.min(fitW(L, 960), maxH / L.h);
      const pin = Ease.outCubic(prog(lt, -0.2, 0.7));
      const z = 1 + 0.06 * Ease.inOutCubic(prog(lt, 0.4, S.dur + 0.3));
      const cy = UI_TOP + (L.h * s0) / 2 + 10;
      drawLayer(ctx, L, { cx: 540, cy: cy + 50 * (1 - pin), s: s0 * (0.94 + 0.06 * pin) * z, a: clamp01(pin * 1.5), sweep: prog(lt, 0.8, 1.7) });
    }

    // Spotlight callout: a card near the bottom with a line to the detail it describes
    function drawCallout(ctx, i, n, text, px, py, a, linked) {
      const e = Ease.outCubic(clamp01(a));
      setFont(ctx, 600, 44, FONT_UI, -0.6);
      const tw = Math.min(800, ctx.measureText(text).width);
      const cw = tw + 150, ch = 116;
      const cx = 540, cy = 1362 + 26 * (1 - e);
      const x = cx - cw / 2, y = cy - ch / 2;
      ctx.save();
      ctx.globalAlpha *= clamp01(a * 1.4);
      if (linked) {
        const top = py < y ? y : y + ch;
        ctx.strokeStyle = 'rgba(163,166,251,0.75)';
        ctx.lineWidth = 3;
        ctx.setLineDash([2, 9]);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, top);
        ctx.lineTo(px, py + (py < y ? 22 : -22));
        ctx.stroke();
        ctx.setLineDash([]);
        glow(ctx, px, py, 70, '129,132,248', 0.55);
        ctx.beginPath();
        ctx.arc(px, py, 22 + 6 * Math.sin(e * Math.PI), 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(199,201,255,0.95)';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px, py, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      }
      const sp = shadowSprite(cw, ch, 26, 70);
      ctx.save();
      ctx.imageSmoothingQuality = 'low';
      ctx.globalAlpha *= 0.7;
      ctx.drawImage(sp.canvas, x - sp.pad, y - sp.pad + 26, cw + sp.pad * 2, ch + sp.pad * 2);
      ctx.restore();
      roundRectPath(ctx, x, y, cw, ch, 26);
      ctx.fillStyle = 'rgba(23,26,36,0.97)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(99,102,241,0.6)';
      ctx.stroke();
      roundRectPath(ctx, x + 26, cy - 26, 52, 52, 14);

      spot: {
        name: 'Spotlight',
        beats: 14,
        tin: 'rise',
        demo: true,
        layers: S => SCENE_TYPES[S.data.feature].layers,
        draw(ctx, lt, S, P) {
          const F = SCENE_TYPES[S.data.feature];
          const sub = S._sub || (S._sub = { key: S.data.feature, type: F, start: S.start, dur: F.beats * BEAT, cap: S.cap, data: {}, spot: true });
          const flt = Math.min(lt, F.settle);
          const pl = F.place(F.settle, sub, P);
          // With an uploaded screenshot there are no anchors: callouts show without pointers
          const pts = !pl ? F.spot.focus.map(() => null) : F.spot.focus.map(f => {
            const L = P.layers[f.layer], o = pl[f.layer], a = L && L.anchors[f.anchor];
            if (!L || !o || !a) return null;
            const p = lp(L, o, a.x + a.w / 2, a.y + a.h / 2);
            return { x: p.x, y: p.y, z: f.z };
          });
          // camera: overview, then each detail, then back out
          const T0 = 1.9, STEP = 1.6, MOVE = 0.5;
          const views = [{ z: 1, fx: 540, fy: 960, tx: 540, ty: 960 }];
          pts.forEach(p => views.push(p ? { z: p.z, fx: p.x, fy: p.y, tx: 540, ty: 1010 } : views[0]));
          const n = pts.length;
          const outAt = T0 + n * STEP;
          let cam = views[0], from = views[0], to = views[0], k = 0, active = -1;
          for (let i = 0; i < n; i++) {
            const a = T0 + i * STEP;
            if (lt >= a) { from = i ? views[i] : views[0]; to = views[i + 1]; k = Ease.inOutCubic(prog(lt, a, a + MOVE)); active = i; }
          }
          if (lt >= outAt && n) { from = views[n]; to = views[0]; k = Ease.inOutCubic(prog(lt, outAt, outAt + MOVE)); active = -1; }
          const zf = lerp(from.z, to.z, k);
          cam = { z: zf, fx: lerp(from.fx, to.fx, k), fy: lerp(from.fy, to.fy, k), tx: lerp(from.tx, to.tx, k), ty: lerp(from.ty, to.ty, k) };
          ctx.save();
          zoomAround(ctx, cam.z, cam.fx, cam.fy, cam.tx, cam.ty);
          F.draw(ctx, flt, sub, P);
          ctx.restore();
          // keep the caption readable over a zoomed screen
          const scr = clamp01((cam.z - 1) * 3);
          if (scr > 0) {
            const g = ctx.createLinearGradient(0, 0, 0, 660);
            g.addColorStop(0, `rgba(12,14,20,${0.94 * scr})`);
            g.addColorStop(0.75, `rgba(12,14,20,${0.82 * scr})`);
            g.addColorStop(1, 'rgba(12,14,20,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, 660);
          }
          drawCaption(ctx, lt, S, P);
          // callouts
          const texts = S.data.callouts || [];
          for (let i = 0; i < n; i++) {
            const a = T0 + i * STEP + 0.25, b = T0 + (i + 1) * STEP;
            const ap = prog(lt, a, a + 0.35) * (1 - prog(lt, b - 0.05, b + 0.2));
            if (ap <= 0 || !texts[i]) continue;
            const p = pts[i];
            const sx = p ? (p.x - cam.fx) * cam.z + cam.tx : 540;

        draw(ctx, lt, S, P) {

          const x = cx - cw / 2, y = cy - ch / 2;
          ctx.save();
          ctx.globalAlpha *= clamp01(pin * 1.6);
          const sp = shadowSprite(cw, ch, 34, 110);
          ctx.imageSmoothingQuality = 'low';
          ctx.globalAlpha *= 0.62;
          ctx.drawImage(sp.canvas, x - sp.pad, y - sp.pad + 46, cw + sp.pad * 2, ch + sp.pad * 2);
          ctx.globalAlpha /= 0.62;
          roundRectPath(ctx, x, y, cw, ch, 34);
          ctx.fillStyle = '#171a24';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#262a38';
          ctx.stroke();
          // Generic broker node -> Tradeprint, with trades flowing along a dashed line
          const ny = y + 175, lx = x + 190, rx = x + cw - 190;
          ctx.setLineDash([10, 14]);
          ctx.lineDashOffset = -lt * 60;
          ctx.lineWidth = 4;
          ctx.strokeStyle = 'rgba(163,166,251,0.45)';
          ctx.beginPath();
          ctx.moveTo(lx + 82, ny);
          ctx.lineTo(rx - 82, ny);
          ctx.stroke();
          ctx.setLineDash([]);
          for (let i = 0; i < 3; i++) {
            const f = ((lt * 0.75 + i / 3) % 1 + 1) % 1;
            const px = lerp(lx + 90, rx - 90, f);
            const al = Math.sin(Math.PI * f);
            glow(ctx, px, ny, 34, '129,132,248', 0.55 * al);
            ctx.beginPath();
            ctx.arc(px, ny, 7, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(233,235,242,${0.9 * al})`;
            ctx.fill();
          }
          // broker node (generic candles, no third-party logos)
          roundRectPath(ctx, lx - 72, ny - 72, 144, 144, 34);
          ctx.fillStyle = '#1d2130';
          ctx.fill();
          ctx.strokeStyle = '#353b4f';
          ctx.lineWidth = 2;
          ctx.stroke();
          [[-34, -10, 40, '#22c55e'], [-6, -26, 52, '#ef4444'], [22, -16, 46, '#22c55e']].forEach(([dx, dy, hh, col]) => {
            ctx.fillStyle = col;
            ctx.fillRect(lx + dx - 1.5, ny + dy - 14, 3, hh + 28);
            roundRectPath(ctx, lx + dx - 9, ny + dy, 18, hh, 3);
            ctx.fill();

          drawLogoTile(ctx, rx, ny, 144, 1, 0.5);
          setFont(ctx, 600, 26, FONT_UI, 0.5);
          ctx.fillStyle = '#979db1';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.fillText('Your broker', lx, ny + 118);

          drawRich(ctx, S._lay.t, cx, y + 360, lt, { align: 'center', start: 0.2, stagger: 0.04, dur: 0.45 });
          const pc = prog(lt, 0.3, 0.65);
          drawChip(ctx, d.badge || 'Coming soon', cx, y - 32, { align: 'center', size: 30, tone: 'amber', a: clamp01(pc * 2), s: 0.9 + 0.1 * Ease.outBack(pc) });

      end: {
        name: 'Pricing + call to action',
        beats: 7,
        tin: 'flash',
        glow: 1.5,
        layers: [],
        draw(ctx, lt, S, P) {
          const d = S.data;
          const pr = P.pricing;
          const showPrice = d.showPricing && pr.promo;
          // logo + wordmark
          const pl = prog(lt, -0.1, 0.5);
          drawLogoTile(ctx, 540, 372, 136 * (0.84 + 0.16 * Ease.outBack(pl)), clamp01(pl * 2), 0.8);
          drawWordmark(ctx, 540, 540, 66, clamp01(prog(lt, 0.08, 0.4)));
          if (d.plan) drawChip(ctx, d.plan, 540, 572, { align: 'center', size: 25, a: clamp01(prog(lt, 0.2, 0.5) * 1.6) });
          let y = 700;
          if (showPrice) {
            // regular price, then the strike
            if (pr.regular) {
              const a = clamp01(prog(lt, 0.3, 0.6) * 1.4);
              setFont(ctx, 500, 30, FONT_UI, 0);
              const lab = pr.regularLabel ? pr.regularLabel + ' ' : '';
              const lw = ctx.measureText(lab).width;
              setFont(ctx, 500, 54, FONT_NUM, 0);
              const vw = ctx.measureText(pr.regular).width;
              const x0 = 540 - (lw + vw) / 2;
              ctx.save();
              ctx.globalAlpha *= a;
              ctx.textBaseline = 'alphabetic';
              setFont(ctx, 500, 30, FONT_UI, 0);
              ctx.fillStyle = '#6d7388';
              ctx.fillText(lab, x0, y);
              setFont(ctx, 500, 54, FONT_NUM, 0);
              ctx.fillStyle = '#979db1';
              ctx.fillText(pr.regular, x0 + lw, y);
              const sk = Ease.inOutCubic(prog(lt, 0.72, 1.02));
              if (sk > 0) {
                ctx.fillStyle = '#e9ebf2';
                ctx.fillRect(x0 + lw - 4, y - 19, (vw + 8) * sk, 4);
              }
              ctx.restore();
            }
            // promo price
            const pp = prog(lt, 0.95, 1.75);
            const sp = Ease.spring(pp);
            const m = /^([^/]*)(\/.*)?$/.exec(pr.promo) || [];
            const amount = (m[1] || pr.promo).trim(), period = (m[2] || '').trim();
            setFont(ctx, 600, 214, FONT_NUM, -4);
            const aw = ctx.measureText(amount).width;
            setFont(ctx, 500, 60, FONT_UI, 0);
            const pw = period ? ctx.measureText(period).width + 14 : 0;
            const base = y + 210;
            const sc = Math.min(1, 800 / (aw + pw));   // stays clear of the platform buttons on the right
            ctx.save();
            ctx.globalAlpha *= clamp01(pp * 3);
            ctx.translate(540, base - 80);
            ctx.scale(sc * (0.82 + 0.18 * sp), sc * (0.82 + 0.18 * sp));
            ctx.translate(-540, -(base - 80));
            glow(ctx, 540, base - 80, 420, '99,102,241', 0.34 * Ease.outCubic(pp));
            const x0 = 540 - (aw + pw) / 2;
            ctx.textBaseline = 'alphabetic';
            setFont(ctx, 600, 214, FONT_NUM, -4);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(amount, x0, base);
            if (period) {
              setFont(ctx, 500, 60, FONT_UI, 0);
              ctx.fillStyle = '#979db1';
              ctx.fillText(period, x0 + aw + 14, base);
            }
            ctx.restore();
            y = base + 84;
            // codes
            if (pr.codes.length) {
              const pcode = prog(lt, 1.35, 1.95);
              ctx.save();
              setFont(ctx, 500, 34, FONT_UI, 0);
              ctx.fillStyle = '#979db1';
              ctx.textAlign = 'center';
              ctx.globalAlpha *= clamp01(pcode * 2);
              ctx.fillText(pr.codeLabel || 'with code', 540, y);
              ctx.restore();
              y += 30;
              let size = 54;
              const chipsW = sz => {
                setFont(ctx, 600, sz, FONT_NUM, sz * 0.14);
                const ws = pr.codes.map(c => ctx.measureText(c).width + sz * 1.1);
                setFont(ctx, 500, sz * 0.62, FONT_UI, 0);
                const orw = ctx.measureText('or').width + sz * 0.9;
                return { ws, orw, total: ws.reduce((a, b) => a + b, 0) + orw * (ws.length - 1) };
              };
              let cw = chipsW(size);
              while (cw.total > 960 && size > 30) { size -= 4; cw = chipsW(size); }
              let cx = 540 - cw.total / 2;
              const chH = size * 1.9;
              pr.codes.forEach((code, i) => {
                const ci = prog(lt, 1.45 + i * 0.12, 1.9 + i * 0.12);
                const e = Ease.outBack(ci);
                const w = cw.ws[i];
                ctx.save();
                ctx.globalAlpha *= clamp01(ci * 2);
                ctx.translate(cx + w / 2, y + chH / 2);
                ctx.scale(0.86 + 0.14 * e, 0.86 + 0.14 * e);
                roundRectPath(ctx, -w / 2, -chH / 2, w, chH, 18);
                ctx.fillStyle = 'rgba(99,102,241,0.16)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(99,102,241,0.68)';
                ctx.stroke();
                setFont(ctx, 600, size, FONT_NUM, size * 0.14);
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(code, size * 0.07, size * 0.04);
                ctx.restore();
                cx += w;
                if (i < pr.codes.length - 1) {
                  ctx.save();
                  ctx.globalAlpha *= clamp01(ci * 2);
                  setFont(ctx, 500, size * 0.62, FONT_UI, 0);
                  ctx.fillStyle = '#6d7388';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText('or', cx + cw.orw / 2, y + chH / 2);
                  ctx.restore();
                  cx += cw.orw;
                }
              });
              y += chH + 56;
            }
          } else {
            if (!S._lay) S._lay = { h: fitRich(d.headline || 'Your trading edge\n[starts here.]', { weight: 600, maxW: 940, lineH: 1.05 }, 3, [96, 86, 76, 68]) };
            y += 10 + drawRich(ctx, S._lay.h, 540, y - 30, lt, { align: 'center', start: 0.3, stagger: 0.06, dur: 0.55 }) + 40;
          }
          // CTA button + website
          y = Math.max(y, 1150);
          const pb = prog(lt, showPrice ? 1.75 : 0.9, showPrice ? 2.2 : 1.35);
          if (d.cta) {
            setFont(ctx, 600, 40, FONT_UI, -0.4);
            const tw = ctx.measureText(d.cta).width;
            const bw = tw + 64 + 46, bh = 104, bx = 540 - bw / 2;
            const e = Ease.outCubic(pb);
            ctx.save();
            ctx.globalAlpha *= clamp01(pb * 2);
            ctx.translate(0, 30 * (1 - e));
            roundRectPath(ctx, bx, y, bw, bh, 22);
            ctx.fillStyle = '#6366f1';
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.14)';
            ctx.fillRect(bx + 22, y + 1, bw - 44, 2);
            ctx.fillStyle = '#fff';
            ctx.textBaseline = 'middle';
            ctx.fillText(d.cta, bx + 32, y + bh / 2 + 1);
            // arrow
            const ax = bx + 32 + tw + 18, ay = y + bh / 2;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(ax, ay); ctx.lineTo(ax + 30, ay);
            ctx.moveTo(ax + 17, ay - 13); ctx.lineTo(ax + 30, ay); ctx.lineTo(ax + 17, ay + 13);
            ctx.stroke();
            const cyc = lt - (showPrice ? 2.3 : 1.5);
            if (cyc > 0) buttonShimmer(ctx, bx, y, bw, bh, 22, (cyc % 1.6) / 1.1);
            ctx.restore();
            y += bh + 68;
          }
          if (d.url) {
            ctx.save();
            setFont(ctx, 600, 40, FONT_UI, -0.4);
            ctx.fillStyle = '#e9ebf2';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.globalAlpha *= clamp01(prog(lt, showPrice ? 1.95 : 1.1, showPrice ? 2.35 : 1.5) * 1.5);
            ctx.fillText(d.url, 540, y);
            ctx.restore();
            y += 52;
          }
          if (d.fine) {
            ctx.save();
            setFont(ctx, 400, 25, FONT_UI, 0);
            ctx.fillStyle = '#6d7388';
            ctx.textAlign = 'center';
            ctx.globalAlpha *= clamp01(prog(lt, 2.0, 2.4) * 1.5);
            ctx.fillText(d.fine, 540, Math.min(y, 1428));
            ctx.restore();
          }
        },
        cues: S => S.data.showPricing ? [{ t: 0.72, k: 'strike' }, { t: 0.98, k: 'price' }, { t: 1.45, k: 'pop' }, { t: 1.8, k: 'tap' }] : [{ t: 0.9, k: 'tap' }]

      dFirm: 'Apex Trader Funding', dProgram: '50K EOD Evaluation', dSize: '50000', dProfit: '2172', dTarget: '3000',
      dMentorEmail: 'mentor@example.com', dTrader: 'alextrades', dNote: 'Was my entry too early here?',
      dPrint1: 'ny_open | First hour only. | ORB | NQ | 640 | 9:41 AM | 2.5 | 2',
      dPrint1Caption: 'Waited for the retest of the range high. Held the runner to 2.5R.',
      dPrint2: 'es_scalps | ES scalper, process over P&L. | VWAP Reclaim | ES | 312.50 | 10:05 AM | 1.8 | 0',
      dPrint2Hide: true,
      // audio
      music: 'synth',
      musicVol: 70,
      sfx: true,
      sfxVol: 65,
      trackStart: 0,
      licenseOk: false,
      licenseNote: '',
      // export
      quality: 'high'
    };

    function pricingOf(s) {
      return {
        regular: String(s.regular || '').trim(),
        regularLabel: String(s.regularLabel || '').trim(),
        promo: String(s.promo || '').trim(),
        codes: list(s.codes).map(c => c.toUpperCase()).slice(0, 3),
        codeLabel: String(s.codeLabel || '').trim()
      };
    }

    // Prices, codes and the words around them. Any change means the ad must be verified again.
    function pricingSig(s) {
      return JSON.stringify([s.showPricing, s.plan, s.regularLabel, s.regular, s.promo, s.codeLabel, list(s.codes).map(c => c.toUpperCase()), s.fine]);
    }
    const pricingVerified = s => !!s.verifiedSig && s.verifiedSig === pricingSig(s);

    function discountCheck(s) {
      const a = FMT.num(s.regular, NaN), b = FMT.num(s.promo, NaN);
      if (!(a > 0) || !(b > 0)) return '';
      if (b >= a) return 'The promo price is not lower than the regular price.';
      const off = (1 - b / a) * 100;
      return `${off.toFixed(1).replace(/\.0$/, '')}% off the regular price.`;
    }

    const TPL_ICONS = {
      showcase: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="m10 9 5 2.5-5 2.5z"/><path d="M8 21h8"/>',
      spotlight: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/><path d="m4.9 4.9 2.1 2.1"/><path d="m17 17 2.1 2.1"/>',
      pricing: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>'
    };

    const SHOWCASE_SCENES = ['dashboard', 'analytics', 'econ', 'prop', 'mentorship', 'prints', 'broker'];

    function capFor(s, key) {
      const t = SCENE_TYPES[key];
      return { label: s[`cap_${key}_label`] ?? t.cap.label, title: s[`cap_${key}_title`] ?? t.cap.title };
    }

    function endScene(s) {
      return { key: 'end', data: { showPricing: !!s.showPricing, plan: s.plan, cta: s.cta, url: s.url, fine: s.fine, headline: s.endHeadline } };
    }

    const FEATURE_KEYS = ['dashboard', 'analytics', 'econ', 'prop', 'mentorship', 'prints'];
    const FEATURE_NAMES = { dashboard: 'UI 2.0 Dashboard', analytics: 'Performance analytics', econ: 'Economic calendar', prop: 'Prop Firm Command Center', mentorship: 'Mentorship', prints: 'Prints' };
    const MINI_TITLES = { dashboard: 'The UI 2.0\n[Dashboard]', analytics: 'Performance\n[analytics]', econ: 'Economic\n[calendar]', prop: 'Prop Firm\n[Command Center]', mentorship: '[Mentorship]\nwith trade reviews', prints: '[Prints]' };

    function spotFor(s, f) {
      const F = SCENE_TYPES[f];
      return {
        chip: s[`sp_${f}_chip`] ?? FEATURE_NAMES[f],
        hook: s[`sp_${f}_hook`] ?? F.spot.hook,
        callouts: [1, 2, 3].map(i => s[`sp_${f}_c${i}`] ?? F.spot.callouts[i - 1])
      };
    }

    const codeLine = s => {
      const codes = pricingOf(s).codes;
      return String(s.ppSub || '').replace(/\{code\}/gi, codes.length ? codes.join(' or ') : '').replace(/\s+/g, ' ').trim();
    };

    const TEMPLATES = [
      {
        id: 'showcase',
        name: 'Feature Showcase',
        blurb: 'The new interface and every major feature in quick cuts, ending on the Pro offer.',
        status: 'ready',
        defaults: {

          hookTitle: 'Meet the new\n[Tradeprint.]',
          hookSub: 'Your trading journal, rebuilt.',
          on_dashboard: true, on_analytics: true, on_econ: true, on_prop: true, on_mentorship: true, on_prints: true, on_broker: true,
          brokerLine: 'Trades from your broker, imported automatically.'
        },
        sceneKeys: SHOWCASE_SCENES,
        scenes(s) {
          const out = [{ key: 'hook', data: { chip: s.hookChip, title: s.hookTitle, sub: s.hookSub } }];
          SHOWCASE_SCENES.forEach(key => {
            if (!s[`on_${key}`]) return;
            out.push({ key, cap: capFor(s, key), data: key === 'broker' ? { line: s.brokerLine, badge: 'Coming soon' } : {} });
          });
          out.push(endScene(s));
          return out;
        }
      },
      {
        id: 'spotlight',
        name: 'Feature Spotlight',
        blurb: 'One feature up close: the camera visits three details, each with a callout.',
        status: 'ready',
        defaults: { spFeature: 'dashboard' },
        scenes(s) {
          const f = FEATURE_KEYS.includes(s.spFeature) ? s.spFeature : 'dashboard';
          const sp = spotFor(s, f);
          return [
            { key: 'hook', beats: 4, data: { chip: sp.chip, title: sp.hook, sub: '' } },
            { key: 'spot', cap: { label: sp.chip, title: '' }, data: { feature: f, callouts: sp.callouts } },
            endScene(s)
          ];
        }
      },
      {
        id: 'pricing',
        name: 'Pricing Promotion',
        blurb: 'The Pro offer front and center, with a fast montage of what Pro includes.',
        status: 'ready',
        defaults: {
          ppChip: 'Tradeprint Pro',
          ppTitle: 'Your trading edge,\n[for less.]',
          ppSub: 'Use code {code} at checkout.',
          ppLabel: 'Included in Pro',
          pp_on_dashboard: true, pp_on_analytics: true, pp_on_econ: false, pp_on_prop: true, pp_on_mentorship: true, pp_on_prints: false
        },
        scenes(s) {
          const out = [{ key: 'hook', beats: 4, data: { chip: s.ppChip, title: s.ppTitle, sub: codeLine(s) } }];
          let k = 0;
          FEATURE_KEYS.forEach(f => {
            if (!s[`pp_on_${f}`]) return;
            out.push({ key: 'mini', tin: k++ % 2 ? 'whipUp' : 'whipLeft', cap: { label: s.ppLabel, title: s[`pp_${f}_title`] ?? MINI_TITLES[f] }, data: { feature: f } });
          });
          if (out[1]) out[1].tin = 'rise';
          out.push({ ...endScene(s), beats: 9 });
          return out;
        }
      }
    ];

    const getTemplate = id => TEMPLATES.find(t => t.id === id && t.status === 'ready') || TEMPLATES[0];

    /* ============================================================
       11. COMPOSITION
       buildProject() turns settings into a timeline. renderFrame()
       draws any moment of it. Preview and export both call renderFrame.
       ============================================================ */
    function buildProject(tplId, s, shots = {}) {
      const tpl = getTemplate(tplId);
      const items = tpl.scenes(s);
      let t = 0;
      const scenes = items.map((it, i) => {
        const type = SCENE_TYPES[it.key];
        const dur = (it.beats || type.beats) * BEAT;
        const S = { key: it.key, type, start: t, dur, end: t + dur, cap: it.cap || null, data: it.data || {}, i, tinId: it.tin };
        t += dur;
        return S;
      });
      scenes.forEach((S, i) => { S.tin = i ? TRANS[S.tinId || S.type.tin || 'zoom'] : null; });
      scenes.forEach((S, i) => { S.tout = scenes[i + 1] ? scenes[i + 1].tin : null; });
      const P = {
        tplId: tpl.id, tplName: tpl.name, s, d: demoData(s), pricing: pricingOf(s), scenes,
        duration: t, frames: Math.round(t * FPS), layers: {}, cues: [],
        // Prices or codes on screen (end card, or the Pricing Promotion hook) must be verified
        draft: (scenes.some(S => S.key === 'end' && S.data.showPricing) || tpl.id === 'pricing') && !pricingVerified(s),
        shots
      };
      scenes.forEach(S => {
        if (S.tin) {
          P.cues.push({ t: S.start - 0.2, k: S.tin.sfx });
        }
        (S.type.cues ? S.type.cues(S) : []).forEach(c => P.cues.push({ t: S.start + c.t, k: c.k }));
      });
      P.cues.sort((a, b) => a.t - b.t);
      // layers this project needs
      const ids = new Set();
      scenes.forEach(S => {
        const fkey = S.data.feature || S.key;
        const shot = SHOT_SCENES.find(x => x.key === fkey);
        if (shot && shots[fkey]) { ids.add(shot.layer); return; }
        (typeof S.type.layers === 'function' ? S.type.layers(S) : S.type.layers).forEach(id => ids.add(id));
      });
      P.layerIds = [...ids];
      return P;
    }

    async function loadProjectLayers(P, onProgress) {
      const total = P.layerIds.length;
      let done = 0;
      for (const id of P.layerIds) {
        const shot = SHOT_SCENES.find(x => x.layer === id && P.shots[x.key]);
        if (shot) P.layers[id] = shotLayer(id, P.shots[shot.key], 960);
        else P.layers[id] = await getLayer(LAYER_DEFS[id](P.d));
        done++;
        if (onProgress) onProgress(done, total);
      }
      await logoReady;
      return P;
    }

    function activeScenes(P, t) {
      const out = [];
      const last = P.scenes[P.scenes.length - 1];
      for (const S of P.scenes) {
        const a0 = S.start - (S.tin ? S.tin.tw / 2 : 0);
        const a1 = S.end + (S.tout ? S.tout.tw / 2 : 0);
        if ((t >= a0 && t < a1) || (S === last && t >= a0)) out.push(S);
      }
      if (out.length === 2 && out[1].tin && out[1].tin.order === 'out') out.reverse();
      return out;
    }

    function cameraFor(S, t) {
      const cam = { dx: 0, dy: 0, s: 1, a: 1, dim: 0 };
      const add = c => {
        if (!c) return;
        cam.dx += c.dx || 0;
        cam.dy += c.dy || 0;
        cam.s *= c.s == null ? 1 : c.s;
        cam.a *= c.a == null ? 1 : c.a;
        cam.dim = Math.max(cam.dim, c.dim || 0);
      };
      if (S.tin) { const p = prog(t, S.start - S.tin.tw / 2, S.start + S.tin.tw / 2); if (p < 1) add(S.tin.in(p)); }
      if (S.tout) { const p = prog(t, S.end - S.tout.tw / 2, S.end + S.tout.tw / 2); if (p > 0) add(S.tout.out(p)); }
      return cam;
    }

    function drawDraftTag(ctx) {
      drawChip(ctx, 'Draft · pricing not verified', 540, 112, { align: 'center', size: 24, tone: 'amber' });
    }

    function drawFrameOnce(ctx, t, P) {
      const active = activeScenes(P, t);
      const cams = active.map(S => cameraFor(S, t));
      let lv = 0, wsum = 0;
      active.forEach((S, i) => { const wgt = Math.max(0.001, cams[i].a); lv += (S.type.glow || 1) * wgt; wsum += wgt; });
      drawBackdrop(ctx, t, wsum ? lv / wsum : 1);
      active.forEach((S, i) => {
        const cam = cams[i];
        if (cam.a <= 0.001) return;
        ctx.save();
        ctx.globalAlpha = cam.a;
        if (cam.dx || cam.dy || cam.s !== 1) {
          ctx.translate(540 + cam.dx, 960 + cam.dy);
          ctx.scale(cam.s, cam.s);
          ctx.translate(-540, -960);
        }
        S.type.draw(ctx, t - S.start, S, P);
        ctx.restore();
        if (cam.dim > 0.001) {
          ctx.fillStyle = `rgba(6, 7, 11, ${cam.dim})`;
          ctx.fillRect(0, 0, W, H);
        }
      });
      // flash on a 'flash' cut
      P.scenes.forEach(S => {
        if (!S.tin || !S.tin.flash) return;
        const f = 1 - Math.abs(t - S.start) / 0.3;
        if (f > 0) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          glow(ctx, 540, 900, 1500, '150,153,255', 0.42 * f * f);
          ctx.restore();
        }
      });
      drawVignette(ctx);
      if (P.draft) drawDraftTag(ctx);
    }

    // Motion blur: frames inside a fast cut are averaged over a 200 degree shutter.
    const scratch = new Map();
    function scratchCanvas(w, h) {
      const key = `${w}x${h}`;
      let c = scratch.get(key);
      if (!c) { c = document.createElement('canvas'); c.width = w; c.height = h; scratch.set(key, c); }
      return c;
    }

    // Samples per frame follow how far the scenes move during the shutter (about one every 5 px).
    const SHUTTER = 0.55 / FPS;
    function blurSamples(P, t) {
      const half = SHUTTER / 2;
      let d = 0;
      for (const S of activeScenes(P, t)) {
        const a = cameraFor(S, t - half), b = cameraFor(S, t + half);
        d = Math.max(d, Math.hypot(b.dx - a.dx, b.dy - a.dy) + Math.abs(b.s - a.s) * 1100);
      }
      return d < 1 ? 1 : Math.min(20, Math.ceil(d / 5) + 2);
    }

    function renderFrame(canvas, t, P, { blur = true, maxSamples = 20 } = {}) {
      const ctx = canvas.getContext('2d');
      const k = canvas.width / W;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      const n = blur ? Math.min(maxSamples, blurSamples(P, t)) : 1;
      if (n <= 1) {
        ctx.setTransform(k, 0, 0, k, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        drawFrameOnce(ctx, t, P);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        return;
      }
      const tmp = scratchCanvas(canvas.width, canvas.height);
      const tctx = tmp.getContext('2d');
      tctx.imageSmoothingQuality = 'high';
      for (let i = 0; i < n; i++) {
        const ts = t + SHUTTER * (i / (n - 1) - 0.5);
        tctx.setTransform(k, 0, 0, k, 0, 0);
        tctx.globalAlpha = 1;
        drawFrameOnce(tctx, ts, P);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1 / (i + 1);
        ctx.drawImage(tmp, 0, 0);
      }
      ctx.globalAlpha = 1;
    }

    /* ============================================================
       12. AUDIO
       An original score and sound effects, synthesized with Web Audio
       in an OfflineAudioContext. Nothing is sampled or downloaded, so
       Tradeprint owns the result outright. 120 BPM, Fmaj7 Am7 Cmaj7 G6.
       The same rendered buffer plays in the preview and goes into the
       MP4. A licensed track can replace the score (Audio settings).
       ============================================================ */
    const AUDIO_SR = 48000;
    const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
    const CHORDS = [
      { root: 41, pad: [53, 57, 60, 64], arp: [65, 69, 72, 76, 72, 69, 64, 60] },   // Fmaj7
      { root: 45, pad: [57, 60, 64, 67], arp: [69, 72, 76, 79, 76, 72, 67, 64] },   // Am7
      { root: 48, pad: [55, 60, 64, 71], arp: [67, 72, 76, 79, 76, 71, 67, 64] },   // Cmaj7
      { root: 43, pad: [55, 59, 62, 64], arp: [67, 71, 74, 76, 74, 71, 67, 62] }    // G6
    ];

    let noiseCache = null;
    function noiseData() {
      if (noiseCache) return noiseCache;
      const r = rng(20261016);
      const n = AUDIO_SR * 2;
      const L = new Float32Array(n), R = new Float32Array(n);
      for (let i = 0; i < n; i++) { L[i] = r() * 2 - 1; R[i] = r() * 2 - 1; }
      noiseCache = { L, R };
      return noiseCache;
    }

    function makeNoiseBuffer(ac) {
      const { L, R } = noiseData();
      const b = ac.createBuffer(2, L.length, AUDIO_SR);
      b.copyToChannel(L, 0);
      b.copyToChannel(R, 1);
      return b;
    }

    function makeImpulse(ac, seconds = 2.4, decay = 3.2) {
      const r = rng(7);
      const n = Math.round(AUDIO_SR * seconds);
      const b = ac.createBuffer(2, n, AUDIO_SR);
      for (let ch = 0; ch < 2; ch++) {
        const d = b.getChannelData(ch);
        for (let i = 0; i < n; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / n, decay);
      }
      return b;
    }

    // Shapes an AudioParam: [[time, value, 'lin'|'exp'|'set'], ...]
    function env(param, points) {
      points.forEach(([t, v, mode]) => {
        if (mode === 'set') param.setValueAtTime(v, t);
        else if (mode === 'exp') param.exponentialRampToValueAtTime(Math.max(1e-4, v), t);
        else param.linearRampToValueAtTime(v, t);
      });
    }

    function audioKey(P, s, track) {
      return JSON.stringify([P.duration, P.scenes.map(S => [S.key, S.start, S.data.showPricing]), P.cues.map(c => [c.k, Math.round(c.t * 1000)]),
        s.music, s.musicVol, s.sfx, s.sfxVol, track ? track.id : '', s.trackStart || 0]);
    }

    let audioCacheKey = '', audioCacheBuf = null, audioCacheMeta = null;

    async function renderAudio(P, s, track) {
      const key = audioKey(P, s, track);
      if (key === audioCacheKey && audioCacheBuf) return { buffer: audioCacheBuf, meta: audioCacheMeta };
      const D = P.duration;
      const length = Math.round(D * AUDIO_SR);
      const ac = new OfflineAudioContext({ numberOfChannels: 2, length, sampleRate: AUDIO_SR });
      const noise = makeNoiseBuffer(ac);

      const master = ac.createGain();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 10;
      comp.ratio.value = 3.5;
      comp.attack.value = 0.004;
      comp.release.value = 0.22;
      master.connect(comp).connect(ac.destination);
      env(master.gain, [[0, 0, 'set'], [0.04, 1], [Math.max(0.05, D - 0.75), 1, 'set'], [D, 0]]);

      const reverb = ac.createConvolver();
      reverb.buffer = makeImpulse(ac);
      const revOut = ac.createGain();
      revOut.gain.value = 0.32;
      reverb.connect(revOut).connect(master);

      const musicBus = ac.createGain();
      musicBus.gain.value = s.music === 'off' ? 0 : (s.musicVol / 100) * 0.95;
      musicBus.connect(master);
      const sfxBus = ac.createGain();
      sfxBus.gain.value = s.sfx ? (s.sfxVol / 100) * 0.9 : 0;
      sfxBus.connect(master);

      const noiseSrc = (t, dur, offset = 0) => {
        const src = ac.createBufferSource();
        src.buffer = noise;
        src.loop = true;
        src.start(t, (offset * 0.37) % 1.5, dur);
        return src;
      };

      if (s.music === 'synth') buildScore(ac, P, musicBus, reverb, noiseSrc);
      if (s.music === 'upload' && track && track.buffer) {
        const src = ac.createBufferSource();
        src.buffer = track.buffer;
        const g = ac.createGain();
        env(g.gain, [[0, 0, 'set'], [0.06, 1], [Math.max(0.1, D - 1.4), 1, 'set'], [D, 0]]);
        src.connect(g).connect(musicBus);
        src.start(0, Math.max(0, Math.min(track.buffer.duration - 0.1, s.trackStart || 0)));
      }
      if (s.sfx) P.cues.forEach((c, i) => playSfx(ac, c.k, Math.max(0, c.t), sfxBus, reverb, noiseSrc, i));

      const buffer = await ac.startRendering();
      // Peak-normalize to -1.5 dBFS so nothing clips after AAC encoding
      let peak = 0, sum = 0;
      for (let ch = 0; ch < 2; ch++) {
        const d = buffer.getChannelData(ch);
        for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; sum += d[i] * d[i]; }
      }
      const target = 0.84;
      if (peak > 0.0001) {
        const k = Math.min(target / peak, 4);
        for (let ch = 0; ch < 2; ch++) { const d = buffer.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] *= k; }
        peak *= k;
        sum *= k * k;
      }
      const meta = { peak, rms: Math.sqrt(sum / (buffer.length * 2)), silent: peak < 0.0001 };
      audioCacheKey = key;
      audioCacheBuf = buffer;
      audioCacheMeta = meta;
      return { buffer, meta };
    }

    function buildScore(ac, P, bus, reverb, noiseSrc) {
      const D = P.duration;
      const first = P.scenes[0];
      const dropAt = first && P.scenes.length > 1 ? first.end : 0;      // drums enter on the first cut
      const endS = P.scenes.find(S => S.key === 'end');
      const endAt = endS ? endS.start : D;
      const barLen = BEAT * 4;
      const barOf = t => Math.floor((t - dropAt) / barLen);
      const chordAt = t => CHORDS[((barOf(t) % 4) + 4) % 4];

      // sidechain-style duck for bass and pads
      const duck = ac.createGain();
      duck.connect(bus);
      const padBus = ac.createGain();
      padBus.gain.value = 1;
      padBus.connect(duck);
      const padSend = ac.createGain();
      padSend.gain.value = 0.45;
      padBus.connect(padSend).connect(reverb);

      const padFilter = ac.createBiquadFilter();
      padFilter.type = 'lowpass';
      padFilter.Q.value = 0.7;
      env(padFilter.frequency, [[0, 420, 'set'], [Math.max(0.1, dropAt), 2400, 'exp'], [Math.max(dropAt + 0.1, endAt - 0.1), 2600, 'exp'], [endAt + 0.2, 4200, 'exp'], [D, 1800, 'exp']]);
      padFilter.connect(padBus);

      // Pads: one voice per chord tone, two detuned saws each
      const firstBar = barOf(0);
      for (let b = firstBar; dropAt + b * barLen < D; b++) {
        const t0 = Math.max(0, dropAt + b * barLen), t1 = Math.min(D, dropAt + (b + 1) * barLen);
        if (t1 <= t0) continue;
        const ch = CHORDS[((b % 4) + 4) % 4];
        ch.pad.forEach(m => {
          [-7, 7].forEach(cents => {
            const o = ac.createOscillator();
            o.type = 'sawtooth';
            o.frequency.value = midiHz(m);
            o.detune.value = cents;
            const g = ac.createGain();
            env(g.gain, [[t0, 0, 'set'], [t0 + 0.28, 0.022], [t1, 0.02], [Math.min(D, t1 + 0.45), 0]]);
            o.connect(g).connect(padFilter);
            o.start(t0);
            o.stop(Math.min(D, t1 + 0.5));
          });
        });
      }

      // Pluck arpeggio in 8ths, quiet in the intro
      const pluckBus = ac.createGain();
      pluckBus.connect(bus);
      const delay = ac.createDelay(1);
      delay.delayTime.value = BEAT * 0.75;
      const fb = ac.createGain();
      fb.gain.value = 0.28;
      const dlp = ac.createBiquadFilter();
      dlp.type = 'lowpass';
      dlp.frequency.value = 2600;
      pluckBus.connect(delay);
      delay.connect(dlp).connect(fb).connect(delay);
      const dOut = ac.createGain();
      dOut.gain.value = 0.32;
      dlp.connect(dOut).connect(bus);
      const pSend = ac.createGain();
      pSend.gain.value = 0.35;
      pluckBus.connect(pSend).connect(reverb);
      for (let k = 0; k * BEAT / 2 < D - 0.6; k++) {
        const t = k * BEAT / 2;
        if (t >= endAt - BEAT * 2 && t < endAt) continue;   // space for the riser
        const ch = chordAt(t);
        const step = Math.round((t - dropAt) / (BEAT / 2));
        const m = ch.arp[((step % 8) + 8) % 8];
        const vel = t < dropAt ? 0.05 : t >= endAt ? 0.06 : 0.075;
        const o = ac.createOscillator();
        o.type = 'square';
        o.frequency.value = midiHz(m);
        const f = ac.createBiquadFilter();
        f.type = 'lowpass';
        f.Q.value = 2;
        env(f.frequency, [[t, 3800, 'set'], [t + 0.2, 520, 'exp']]);
        const g = ac.createGain();
        env(g.gain, [[t, 0, 'set'], [t + 0.004, vel], [t + 0.3, 0.0001, 'exp']]);
        o.connect(f).connect(g).connect(pluckBus);
        o.start(t);
        o.stop(t + 0.32);
      }

      // Drums from the first cut. Kick on every beat, claps on 2 and 4, offbeat hats.
      const kicks = [];
      const drumEnd = endAt - BEAT;
      for (let t = dropAt; t < D - 0.8; t += BEAT) {
        const inBreak = t >= drumEnd && t < endAt;
        if (inBreak) continue;
        const afterEnd = t >= endAt;
        if (afterEnd && t > endAt + BEAT * 5) break;
        kicks.push(t);
        kick(ac, bus, t, t === endAt ? 1.15 : afterEnd ? 0.7 : 0.85, noiseSrc);
        const beatInBar = Math.round((t - dropAt) / BEAT) % 4;
        if (!afterEnd && (beatInBar === 1 || beatInBar === 3) && t >= dropAt + BEAT * 4) clap(ac, bus, reverb, t, noiseSrc);
        if (!afterEnd && t + BEAT / 2 < drumEnd) hat(ac, bus, t + BEAT / 2, 0.11, 0.06, noiseSrc);
        if (!afterEnd && t >= dropAt + BEAT * 8) { hat(ac, bus, t + BEAT * 0.25, 0.035, 0.03, noiseSrc); hat(ac, bus, t + BEAT * 0.75, 0.035, 0.03, noiseSrc); }
      }
      // duck automation
      duck.gain.setValueAtTime(1, 0);
      kicks.forEach(t => { duck.gain.setValueAtTime(1, t); duck.gain.linearRampToValueAtTime(0.42, t + 0.012); duck.gain.linearRampToValueAtTime(1, t + 0.24); });

      // Bass: 8th notes on the chord root, low-passed, from the first cut
      const bassF = ac.createBiquadFilter();
      bassF.type = 'lowpass';
      bassF.frequency.value = 340;
      bassF.Q.value = 0.8;
      bassF.connect(duck);
      for (let t = dropAt; t < Math.min(D - 0.6, endAt + BEAT * 6); t += BEAT / 2) {
        if (t >= drumEnd && t < endAt) continue;
        const ch = chordAt(t);
        const step = Math.round((t - dropAt) / (BEAT / 2)) % 4;
        const m = ch.root + (step === 2 ? 12 : 0);
        [['triangle', 0.16, 0], ['sine', 0.2, -12]].forEach(([type, vel, off]) => {
          const o = ac.createOscillator();
          o.type = type;
          o.frequency.value = midiHz(m + off);
          const g = ac.createGain();
          env(g.gain, [[t, 0, 'set'], [t + 0.008, vel], [t + 0.2, vel * 0.5], [t + 0.24, 0.0001, 'exp']]);
          o.connect(g).connect(bassF);
          o.start(t);
          o.stop(t + 0.26);
        });
      }

      // Riser into the end card, then the impact and a crash
      if (endS && endAt > 1.2) {
        const r0 = endAt - BEAT * 2;
        const src = noiseSrc(r0, BEAT * 2 + 0.02, 3);
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 3;
        env(bp.frequency, [[r0, 300, 'set'], [endAt, 6000, 'exp']]);
        const g = ac.createGain();
        env(g.gain, [[r0, 0, 'set'], [endAt - 0.02, 0.32], [endAt, 0]]);
        src.connect(bp).connect(g).connect(bus);
        const crash = noiseSrc(endAt, 1.8, 5);
        const hp = ac.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 4500;
        const cg = ac.createGain();
        env(cg.gain, [[endAt, 0.22, 'set'], [endAt + 1.7, 0.0001, 'exp']]);
        crash.connect(hp).connect(cg);
        cg.connect(bus);
        const cs = ac.createGain();
        cs.gain.value = 0.5;
        cg.connect(cs).connect(reverb);
      }
    }

    function kick(ac, out, t, vel, noiseSrc) {
      const o = ac.createOscillator();
      o.type = 'sine';
      env(o.frequency, [[t, 150, 'set'], [t + 0.11, 46, 'exp']]);
      const g = ac.createGain();
      env(g.gain, [[t, 0, 'set'], [t + 0.003, vel], [t + 0.42, 0.0001, 'exp']]);
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + 0.45);
      const c = noiseSrc(t, 0.012, t * 13);
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 3000;
      const cg = ac.createGain();
      env(cg.gain, [[t, 0.09 * vel, 'set'], [t + 0.012, 0.0001, 'exp']]);
      c.connect(hp).connect(cg).connect(out);
    }

    function hat(ac, out, t, vel, dec, noiseSrc) {
      const src = noiseSrc(t, dec + 0.02, t * 7);
      const hp = ac.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 7600;
      const g = ac.createGain();
      env(g.gain, [[t, vel, 'set'], [t + dec, 0.0001, 'exp']]);
      src.connect(hp).connect(g).connect(out);
    }

    function clap(ac, out, reverb, t, noiseSrc) {
      const src = noiseSrc(t, 0.2, t * 5);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1500;
      bp.Q.value = 0.9;
      const g = ac.createGain();
      env(g.gain, [[t, 0.0001, 'set'], [t + 0.002, 0.18], [t + 0.012, 0.05], [t + 0.014, 0.16], [t + 0.024, 0.05], [t + 0.026, 0.15], [t + 0.17, 0.0001, 'exp']]);
      src.connect(bp).connect(g).connect(out);
      const send = ac.createGain();
      send.gain.value = 0.5;
      g.connect(send).connect(reverb);
    }

    function tone(ac, out, t, type, f0, f1, dur, vel, attack = 0.004) {
      const o = ac.createOscillator();
      o.type = type;
      env(o.frequency, [[t, f0, 'set'], [t + dur * 0.6, f1, 'exp']]);
      const g = ac.createGain();
      env(g.gain, [[t, 0, 'set'], [t + attack, vel], [t + dur, 0.0001, 'exp']]);
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + dur + 0.02);
      return g;
    }

    function sweep(ac, out, t, dur, f0, f1, f2, vel, noiseSrc, { pan = null, q = 1.2, type = 'bandpass' } = {}) {
      const src = noiseSrc(t, dur + 0.02, t * 11);
      const f = ac.createBiquadFilter();
      f.type = type;
      f.Q.value = q;
      env(f.frequency, [[t, f0, 'set'], [t + dur * 0.55, f1, 'exp'], [t + dur, f2, 'exp']]);
      const g = ac.createGain();
      env(g.gain, [[t, 0.0001, 'set'], [t + dur * 0.55, vel, 'exp'], [t + dur, 0.0001, 'exp']]);
      let node = src.connect(f).connect(g);
      if (pan && ac.createStereoPanner) {
        const p = ac.createStereoPanner();
        env(p.pan, [[t, pan[0], 'set'], [t + dur, pan[1]]]);
        node = node.connect(p);
      }
      node.connect(out);
    }

    function playSfx(ac, kind, t, out, reverb, noiseSrc, i) {
      const send = ac.createGain();
      send.gain.value = 0.4;
      send.connect(reverb);
      switch (kind) {
        case 'whip': sweep(ac, out, t, 0.36, 500, 3400, 900, 0.5, noiseSrc, { pan: i % 2 ? [0.6, -0.6] : [-0.6, 0.6], q: 1.4 }); break;
        case 'swell': sweep(ac, out, t - 0.1, 0.5, 220, 2600, 1400, 0.32, noiseSrc, { type: 'lowpass', q: 0.9 }); break;
        case 'rise': sweep(ac, out, t, 0.42, 300, 2200, 1600, 0.3, noiseSrc, { q: 1.6 }); break;
        case 'whoosh': sweep(ac, out, t, 0.44, 380, 1700, 600, 0.36, noiseSrc, { q: 1.1 }); break;
        case 'impact': {
          tone(ac, out, t + 0.2, 'sine', 70, 32, 1.4, 0.55, 0.006);
          sweep(ac, out, t - 0.15, 0.4, 2000, 6000, 3000, 0.16, noiseSrc, { q: 0.8 });
          break;
        }
        case 'pop': {
