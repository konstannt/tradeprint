<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Tradeprint Marketing Studio</title>

  <!--
    Tradeprint Marketing Studio
    Internal tool for building Instagram ads. Static page: no Supabase, no tokens,
    no user data. Settings are saved only in this browser (localStorage).

    Optional assets (the page works without them):
      assets/fonts/inter-latin-opsz-normal.woff2   ad font (falls back to jsDelivr)
      assets/vendor/modern-screenshot-4.7.0.js     PNG export (falls back to jsDelivr)
      assets/logo.png                              official TP logo, used as supplied

    Adding a new ad: copy the Mentorship entry in TEMPLATES (section 4 of the script),
    change its defaults, and write its product() function. Shared UI pieces live in UI.
  -->

  <style>
    /* ============================================================
       1. STUDIO TOKENS (matches the Tradeprint dashboard)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --bg2: #111111;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #ffffff;
      --text2: #8a8a8a;
      --text3: #5f5f5f;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --accent-line: rgba(99, 102, 241, 0.45);
      --danger: #ef4444;
      --success: #22c55e;
      --font: 'TP Inter', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --topbar-h: 56px;
      --controls-w: 400px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: var(--bg2); }
    *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg2); }

    /* ============================================================
       2. STUDIO LAYOUT
       ============================================================ */
    .st-top {
      position: relative;
      z-index: 20;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }

    .st-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .st-logo span { color: var(--accent); }

    .st-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .st-top-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-quiet { background: transparent; color: var(--text2); }
    .btn-quiet:hover { color: var(--text); }
    .btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .st-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--controls-w);
      height: calc(100vh - var(--topbar-h));
      height: calc(100dvh - var(--topbar-h));
    }

    .st-preview { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    .st-preview-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .st-zoom { margin-left: auto; font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; }

    .st-viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow: hidden;
    }

    .stage-shell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 6px;
      background: #0a0a0a;
      box-shadow: 0 0 0 1px var(--border), 0 24px 60px rgba(0, 0, 0, 0.55);
      transition: opacity 0.2s;
    }

    .stage-shell.is-loading { opacity: 0; }

    .stage-scale { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

    .st-controls {
      min-height: 0;
      overflow-y: auto;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      padding: 8px 20px 48px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .st-main { display: block; height: auto; }
      .st-preview-bar { padding: 10px 16px; }
      .st-viewport { padding: 16px; }
      .st-controls { border-left: none; border-top: 1px solid var(--border); padding: 4px 16px calc(48px + env(safe-area-inset-bottom)); }
      .st-tag { display: none; }
      .st-top-actions .btn-label-long { display: none; }
    }

    @media (max-width: 380px) {
      .st-top-actions .btn { padding: 0 10px; }
    }

    /* ============================================================
       3. STUDIO CONTROLS
       ============================================================ */
    .ctl-group { border-bottom: 1px solid var(--border); }
    .ctl-group:last-of-type { border-bottom: none; }

    .ctl-group > summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text2);
      cursor: pointer;
      user-select: none;
    }

    .ctl-group > summary::-webkit-details-marker { display: none; }

    .ctl-group > summary::after {
      content: '';
      width: 8px;
      height: 8px;
      border-right: 1.5px solid var(--text3);
      border-bottom: 1.5px solid var(--text3);
      transform: translateY(-2px) rotate(45deg);
      transition: transform 0.15s;
    }

    .ctl-group:not([open]) > summary::after { transform: rotate(-45deg); }

    .ctl-body { display: grid; gap: 16px; padding-bottom: 20px; }

    .field { display: grid; gap: 8px; min-width: 0; }

    .field > label, .field-label {
      font-size: 12px;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .field-count { color: var(--text3); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
    .field-count.over { color: var(--danger); }

    .field input[type="text"], .field textarea, .field select {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field textarea { resize: vertical; min-height: 48px; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }

    .field select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 38px;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='18' height='18' viewBox='0 0 18 18' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M5 7l4 4 4-4' fill='none' stroke='%23777' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: calc(100% - 12px) 50%;
    }

    .field-hint { font-size: 12px; color: var(--text3); line-height: 1.5; }
    .field-hint b { color: var(--text2); font-weight: 600; }

    .seg {
      display: grid;
      grid-auto-columns: minmax(0, 1fr);
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .seg button {
      min-height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .st-preview-bar .seg { grid-auto-columns: auto; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text2);
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.3;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip:hover { border-color: var(--accent); color: var(--text); }

    .toggle-list { display: grid; gap: 2px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
    }

    .switch { position: relative; width: 40px; height: 22px; flex: 0 0 40px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); pointer-events: none; transition: background 0.15s; }
    .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .range-row output { font-size: 12px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .upload-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .upload-status { font-size: 12px; color: var(--text3); }

    .tpl-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text2);
    }

    .ctl-footer { padding-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ============================================================
       4. SAFE ZONE GUIDES (preview only, never exported)
       ============================================================ */
    .safe-guides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

    .safe-zone {
      position: absolute;
      background: repeating-linear-gradient(135deg, rgba(239, 68, 68, 0.16) 0 14px, rgba(239, 68, 68, 0.06) 14px 28px);
      border: 3px dashed rgba(239, 68, 68, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .safe-zone span {
      font: 700 30px/1.2 var(--font);
      color: #fca5a5;
      background: rgba(10, 10, 10, 0.85);
      padding: 10px 18px;
      border-radius: 10px;
      text-align: center;
    }

    /* ============================================================
       5. SCREENSHOT MODE + EXPORT SHEET
       ============================================================ */
    .shot-mode {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .shot-stage { position: relative; flex: none; overflow: hidden; }

    .shot-ui {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 0.25s;
      z-index: 2;
    }

    .shot-ui.is-hidden { opacity: 0; pointer-events: none; }

    .shot-hint {
      font-size: 12px;
      color: #d4d4d4;
      background: rgba(17, 17, 17, 0.92);
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 230px;
      line-height: 1.4;
    }

    .shot-exit {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: rgba(17, 17, 17, 0.92);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    .sheet-box {
      width: 100%;
      max-width: 440px;
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sheet-title { font-size: 18px; font-weight: 700; }
    .sheet-close { background: none; border: none; color: var(--text2); font-size: 24px; line-height: 1; padding: 4px; }
    .sheet-close:hover { color: var(--text); }
    .sheet-copy { font-size: 13px; color: var(--text2); line-height: 1.55; }
    .sheet-copy.error { color: #fca5a5; }

    .sheet-preview {
      display: flex;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .sheet-preview img { display: block; max-width: 100%; max-height: 46vh; border-radius: 6px; }

    .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .sheet-actions .btn { flex: 1 1 140px; }

    .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      margin: 8px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       6. THE AD (fixed design pixels: 1080 wide, 1920 or 1350 tall)
       Everything below is the exported artwork. No studio styles leak in.
       ============================================================ */
    .ad {
      --ad-font: 'TP Inter', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --ad-bg: #0a0a0a;
      --ad-text: #ffffff;
      --ad-muted: #a3a3a3;
      --ad-dim: #737373;
      --ad-accent: #6366f1;
      --pad-top: 270px;
      --pad-bottom: 270px;
      --pad-left: 72px;
      --pad-right: 72px;
      --copy-gap: 64px;
      --support-gap: 30px;
      --product-gap: 52px;
      --foot-gap: 52px;
      --h-max: 128;

      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--ad-bg);
      color: var(--ad-text);
      font-family: var(--ad-font);
      font-size: 32px;
      line-height: 1.3;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .ad--feed {
      height: 1350px;
      --pad-top: 80px;
      --pad-bottom: 80px;
      --copy-gap: 60px;
      --support-gap: 26px;
      --product-gap: 44px;
      --foot-gap: 44px;
      --h-max: 108;
    }

    .ad.layout-flow .ad-support { display: none; }

    .ad--reels {
      --pad-top: 250px;
      --pad-bottom: 500px;
      --pad-right: 150px;
      --h-max: 116;
      --copy-gap: 52px;
      --product-gap: 44px;
      --foot-gap: 44px;
    }

    .ad-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 2px, transparent 2px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 2px, transparent 2px);
      background-size: 90px 90px;
      background-position: 0 -1px, -1px 0;
    }

    .ad-grid-fade {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.15) 0%, rgba(10, 10, 10, 0.7) 38%, #0a0a0a 62%);
    }

    .ad-inner {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--pad-top) var(--pad-right) var(--pad-bottom) var(--pad-left);
    }

    .ad-brand {
      flex: none;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .ad-wordmark {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1;
      white-space: nowrap;
    }

    .ad-wordmark .p { color: var(--ad-accent); }
    .ad-logo { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; display: block; }

    .ad-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      height: 60px;
      padding: 0 26px;
      border-radius: 16px;
      background: rgba(99, 102, 241, 0.14);
      border: 2px solid rgba(99, 102, 241, 0.4);
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .ad-badge-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ad-accent); flex: none; }

    .ad-copy { flex: none; margin-top: var(--copy-gap); }
    .ad-brand.is-empty + .ad-copy, .ad-copy:first-child { margin-top: 0; }

    .ad-eyebrow {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ad-accent);
      margin-bottom: 30px;
    }

    .ad-headline {
      font-size: 140px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.045em;
      color: var(--ad-text);
      text-wrap: balance;
    }

    .ad-headline .hl { color: var(--ad-accent); }

    .ad-support {
      margin-top: var(--support-gap);
      max-width: 900px;
      font-size: 40px;
      line-height: 1.38;
      font-weight: 450;
      letter-spacing: -0.012em;
      color: var(--ad-muted);
      text-wrap: pretty;
    }

    .ad-product {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: var(--product-gap) 0 0;
    }

    .ad-product + .ad-foot { margin-top: var(--foot-gap); }
    .ad-copy + .ad-foot { margin-top: auto; }

    .ad-foot { flex: none; }

    .ad-cta { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }

    .ad-button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      height: 104px;
      padding: 0 48px;
      border-radius: 20px;
      background: var(--ad-accent);
      color: #ffffff;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .ad-button svg { width: 38px; height: 38px; flex: none; }

    .ad-url { font-size: 38px; font-weight: 650; letter-spacing: -0.01em; color: var(--ad-text); white-space: nowrap; }

    .ad-fine { margin-top: 26px; font-size: 27px; line-height: 1.35; font-weight: 500; color: var(--ad-dim); }

    .ad--feed .ad-wordmark { font-size: 50px; }
    .ad--feed .ad-support { font-size: 34px; max-width: 880px; }
    .ad--feed .ad-button { height: 88px; padding: 0 40px; font-size: 32px; border-radius: 18px; }
    .ad--feed .ad-button svg { width: 32px; height: 32px; }
    .ad--feed .ad-url { font-size: 32px; }
    .ad--feed .ad-fine { font-size: 24px; margin-top: 20px; }

    /* Uploaded screenshot in a clean frame */
    .shot-frame {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: var(--frame-ar, 0.8);
      overflow: hidden;
      border-radius: 28px;
      border: 2px solid #232323;
      background: #111111;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
    }

    .shot-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% var(--focus, 30%);
      transform: scale(var(--zoom, 1));
      transform-origin: 50% var(--focus, 30%);
    }

      text-align: center;
      padding: 40px;
      color: #5f5f5f;
      font-size: 32px;
      font-weight: 600;

    /* ============================================================
       7. TRADEPRINT UI REBUILT FOR ADS
       Sizes are the dashboard's own pixel values times --u, so a card
       keeps its real proportions at any scale. Colors match dashboard.html.
       Only change: secondary text is #666 instead of the app's #555 so
       it stays readable at phone size.
       ============================================================ */
    .tpui {
      --u: 2px;
      --ui-bg: #0a0a0a;
      --ui-bg2: #111111;
      --ui-border: #1e1e1e;
      --ui-text2: #666666;

      text-align: left;

    .u-frame {
      background: var(--ui-bg2);
      border: calc(var(--u) * 1) solid var(--ui-border);
      border-radius: calc(var(--u) * 12);
      padding: calc(var(--u) * 14);
      box-shadow: 0 calc(var(--u) * 20) calc(var(--u) * 44) rgba(0, 0, 0, 0.6);
    }

    .u-section-title {
      font-size: calc(var(--u) * 15);
      font-weight: 700;
      padding: calc(var(--u) * 4) calc(var(--u) * 2) calc(var(--u) * 12);
      margin-bottom: calc(var(--u) * 14);
      border-bottom: calc(var(--u) * 1) solid var(--ui-border);
    }

    .u-card {
      background: var(--ui-bg);
      border: calc(var(--u) * 1) solid var(--ui-border);
      border-radius: calc(var(--u) * 10);
      padding: calc(var(--u) * 16);

    .u-email { font-size: calc(var(--u) * 14); font-weight: 700; margin-bottom: calc(var(--u) * 6); white-space: nowrap; }

    .u-meta {
      display: flex;
      align-items: center;
      font-size: calc(var(--u) * 12);
      line-height: 1.5;
      color: var(--ui-text2);
      white-space: nowrap;
    }

    .u-pill {
      display: inline-flex;
      align-items: center;
      min-height: calc(var(--u) * 24);
      padding: 0 calc(var(--u) * 9);
      border-radius: calc(var(--u) * 8);
      font-size: calc(var(--u) * 11);
      font-weight: 900;
      background: rgba(34, 197, 94, 0.14);
      color: #22c55e;
      border: calc(var(--u) * 1) solid rgba(34, 197, 94, 0.28);
      margin-right: calc(var(--u) * 6);
    }

    .u-perms { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 14); }
    .u-perms.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .u-card > .u-perms:first-child { margin-top: 0; }

    .u-perm {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--u) * 12);
      padding: calc(var(--u) * 10) calc(var(--u) * 12);
      background: var(--ui-bg2);
      border: calc(var(--u) * 1) solid var(--ui-border);
      border-radius: calc(var(--u) * 8);
    }

    .u-perm-label { font-size: calc(var(--u) * 13); white-space: nowrap; }

    .u-switch {
      position: relative;
      flex: none;
      width: calc(var(--u) * 40);
      height: calc(var(--u) * 22);
      border-radius: 999px;
      background: var(--ui-border);
    }

    .u-switch.on { background: #6366f1; }

    .u-knob {
      position: absolute;
      top: calc(var(--u) * 3);
      left: calc(var(--u) * 3);
      width: calc(var(--u) * 16);

    .u-review-title { font-size: calc(var(--u) * 14); font-weight: 700; white-space: nowrap; }
    .u-review-meta { font-size: calc(var(--u) * 12); color: var(--ui-text2); margin-top: calc(var(--u) * 3); white-space: nowrap; }
    .u-review-note { font-size: calc(var(--u) * 12); color: var(--ui-text2); margin-top: calc(var(--u) * 6); }

    .u-btns { display: flex; gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 14); }

    .u-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--u) * 7) calc(var(--u) * 12);
      border-radius: calc(var(--u) * 8);
      border: calc(var(--u) * 1) solid var(--ui-border);
      font-size: calc(var(--u) * 12);

    .u-input {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      padding: calc(var(--u) * 10) calc(var(--u) * 14);
      border-radius: calc(var(--u) * 8);
      border: calc(var(--u) * 1) solid #6366f1;
      background: var(--ui-bg);
      font-size: calc(var(--u) * 14);
      white-space: nowrap;
      overflow: hidden;
    }

    .u-caret { width: calc(var(--u) * 1.5); height: calc(var(--u) * 17); background: #6366f1; margin-left: calc(var(--u) * 1); flex: none; }

    .u-send {
      flex: none;
      display: flex;
      align-items: center;
      padding: calc(var(--u) * 10) calc(var(--u) * 20);

    .u-feedback {
      background: var(--ui-bg);
      border: calc(var(--u) * 1) solid var(--ui-border);
      border-left: calc(var(--u) * 3) solid #6366f1;
      border-radius: calc(var(--u) * 8);
      padding: calc(var(--u) * 14);

    .u-fb-meta { font-size: calc(var(--u) * 11); color: var(--ui-text2); text-transform: uppercase; letter-spacing: calc(var(--u) * 0.4); margin-bottom: calc(var(--u) * 6); }
    .u-fb-body { font-size: calc(var(--u) * 14); line-height: 1.6; }
    .u-fb-from { font-size: calc(var(--u) * 12); color: var(--ui-text2); margin-top: calc(var(--u) * 8); white-space: nowrap; }

    .u-step-num {
      width: calc(var(--u) * 28);
      height: calc(var(--u) * 28);
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--u) * 8);
      background: rgba(99, 102, 241, 0.14);
      color: #6366f1;
      font-size: calc(var(--u) * 13);
      font-weight: 900;
    }

    /* Compositions */
    .comp { position: relative; flex: none; }

    /* Showcase: the trader's mentor card, with the mentor's Review Queue
       item layered over its lower right corner. */
    .comp-showcase { width: calc(var(--u) * 470); }
    .comp-showcase.has-chips { padding-top: 21px; }
    .comp-showcase.has-chips .sc-b { padding-top: calc(var(--u) * 16 + 12px); }
    .sc-a { width: calc(var(--u) * 430); position: relative; z-index: 1; padding: calc(var(--u) * 12); }
    .sc-b {
      width: calc(var(--u) * 340);
      margin: calc(var(--u) * -12) 0 0 auto;
      position: relative;
      z-index: 2;
      border-color: #262626;
      box-shadow: 0 calc(var(--u) * 18) calc(var(--u) * 44) rgba(0, 0, 0, 0.8);
    }

    /* Label tab on a card's top edge. Sized in ad pixels, not --u, so it
       stays readable however small the product gets. Same look as the badge. */
    .view-chip {
      position: absolute;
      top: -21px;
      left: calc(var(--u) * 14);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      background: #17172a;
      border: 2px solid #2e2f66;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
    }

    .view-chip::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #6366f1; flex: none; }

    .comp-focus { width: calc(var(--u) * 470); }

    /* Flow: three numbered steps, left-aligned with the copy */
    .comp-flow { width: calc(var(--u) * 440); margin-right: auto; display: grid; gap: calc(var(--u) * 20); }
    .flow-step { display: grid; gap: calc(var(--u) * 10); }
    .flow-head { display: flex; align-items: center; gap: calc(var(--u) * 10); font-size: calc(var(--u) * 15); font-weight: 700; letter-spacing: -0.01em; }
    .comp-flow .u-card, .comp-flow .u-feedback { box-shadow: 0 calc(var(--u) * 12) calc(var(--u) * 30) rgba(0, 0, 0, 0.5); }
  </style>
</head>

  <script>
  (() => {
    'use strict';

    /* ============================================================
       1. CONFIG
       ============================================================ */
    const STORAGE_KEY = 'tp_marketing_studio_v1';
    const IMAGE_KEY_PREFIX = 'tp_marketing_studio_img_';
    const LOGO_KEY = 'tp_marketing_studio_logo';
    // Assets load from this page's folder, so the page works at /marketing,
    // /marketing/ and /marketing/index.html alike.
    const PAGE_DIR = (() => {
      const path = location.pathname;
      if (path.endsWith('/')) return path;
      if (/\.html?$/i.test(path)) return path.replace(/[^/]*$/, '');
      return path + '/';
    })();
    const asset = (file) => PAGE_DIR + file;

    const LOGO_ASSET = 'assets/logo.png';

    const FONT_FAMILY = 'TP Inter';
    const FONT_SOURCES = [
      asset('assets/fonts/inter-latin-opsz-normal.woff2'),
      'https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/files/inter-latin-opsz-normal.woff2'
    ];

    const EXPORT_LIB_SOURCES = [
      { src: asset('assets/vendor/modern-screenshot-4.7.0.js') },
      {
        src: 'https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js',
        integrity: 'sha384-5Ua3TI0kiMYH8QdNy+vc5IWS3MTa2DzQEm/uKFDQ+/biJctek9hiSP6moIm2PVog'
      }
    ];

    // Ad sizes in design pixels. Story safe zones follow Meta's guidance
    // (about 14% top and bottom). Reels also keeps clear of the caption
    // area and the action buttons on the right.
    const FORMATS = {
      story: { id: 'story', label: '9:16', name: 'Story', w: 1080, h: 1920 },
      feed: { id: 'feed', label: '4:5', name: 'Feed', w: 1080, h: 1350 }
    };

    const SAFE_ZONES = {
      stories: [
        { x: 0, y: 0, w: 1080, h: 250, label: 'Profile and progress bar' },
        { x: 0, y: 1670, w: 1080, h: 250, label: 'Reply bar' }
      ],
      reels: [
        { x: 0, y: 0, w: 1080, h: 230, label: 'Reels header' },
        { x: 0, y: 1440, w: 1080, h: 480, label: 'Caption, username, audio' },
        { x: 940, y: 860, w: 140, h: 580, label: 'Buttons' }
      ]
    };

    const IS_SAFARI = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|FxiOS/.test(navigator.userAgent);
    const IS_TOUCH = matchMedia('(hover: none)').matches;

    /* ============================================================
       2. HELPERS
       ============================================================ */
    const $ = (sel, root = document) => root.querySelector(sel);

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // New lines become line breaks, [words] become brand purple.
    function rich(value) {
      return esc(value)
        .replace(/\[([^\]\n]+)\]/g, '<span class="hl">$1</span>')
        .replace(/\n/g, '<br>');
    }

    function todayLabel() {
      return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

    function nextFrame() { return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }

    const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>';

    /* ============================================================
       3. TRADEPRINT UI PIECES (shared by all templates)
       Labels and layout follow dashboard.html. Keep them truthful:
       only show things the product really does.
       ============================================================ */
    const MENTOR_PERMISSIONS = [
      { label: 'View Trades', on: true },
      { label: 'View Journals', on: true },
      { label: 'Leave Feedback', on: true },
      { label: 'See PnL', on: false },
      { label: 'See Account Names', on: false }
    ];

    const UI = {
      switch(on) {
        return `<span class="u-switch${on ? ' on' : ''}"><span class="u-knob"></span></span>`;
      },

      perms(list, cols = 1) {
        return `<div class="u-perms${cols === 2 ? ' cols-2' : ''}">${list.map(p =>
          `<div class="u-perm"><span class="u-perm-label">${esc(p.label)}</span>${UI.switch(p.on)}</div>`
        ).join('')}</div>`;
      },

      // Trader side: Mentorship page, "Your Mentors" card
      mentorCard({ email, since, cols = 1, perms = MENTOR_PERMISSIONS }) {
        return `
          <div class="u-card">
            <div class="u-email">${esc(email)}</div>
            <div class="u-meta"><span class="u-pill">Active</span>· Mentor since ${esc(since)}</div>
            ${UI.perms(perms, cols)}
          </div>`;
      },

      // Mentor side: Mentor Dashboard, Review Queue item.
      // In the app the buttons sit to the right of the text on wide screens.
      // Ad cards are narrow, so they sit under it here. Same labels, same styles.
      reviewItem({ trader, strategy, asset, date, note, cls = '', chip = '' }) {
        const target = [strategy, asset, date].filter(Boolean).join(' · ');
        return `
          <div class="u-card ${cls}">
            ${chip}
            <div class="u-review-title">Trade review from ${esc(trader)}</div>
            <div class="u-review-meta">${esc(target)} · Requested ${esc(date)}</div>
            ${note ? `<div class="u-review-note">"${esc(note)}"</div>` : ''}
            <div class="u-btns">
              <span class="u-btn primary">Give Feedback</span>
              <span class="u-btn">Open</span>
              <span class="u-btn">Dismiss</span>
            </div>
          </div>`;
      },

      // Trader side: Invite a Mentor
      inviteRow({ email, hint = true }) {
        return `
          <div class="u-invite">
            <div class="u-input">${esc(email)}<span class="u-caret"></span></div>
            <div class="u-send">Send Invite</div>
          </div>
          ${hint ? '<div class="u-hint">They\'ll get a link to accept and create or log in to a Tradeprint account.</div>' : ''}`;
      },

      // Trader side: Recent Feedback item
      feedbackItem({ strategy, asset, date, body, email }) {
        const context = [strategy, asset, date].filter(Boolean).join(' · ');
        return `
          <div class="u-feedback">
            <div class="u-fb-meta">${esc(context)}</div>
            <div class="u-fb-body">${esc(body)}</div>
            <div class="u-fb-from">From ${esc(email)} · ${esc(date)} · Answered your review request</div>
          </div>`;
      },

      frame(inner, { title = '', cls = '', chip = '' } = {}) {
        return `<div class="u-frame ${cls}">${chip}${title ? `<div class="u-section-title">${esc(title)}</div>` : ''}${inner}</div>`;
      },

      // Marketing label on a card's top edge (not part of the app UI)
      chip(text, show = true) {
        return show ? `<span class="view-chip">${esc(text)}</span>` : '';
      }
    };

    /* ============================================================
       4. TEMPLATES
       Each template: id, name, status, layouts, defaults, optional
       headline presets and data fields, and product(state) which
       returns the hero visual. The shared shell adds brand, copy and CTA.
       ============================================================ */
    const COPY_FIELDS = [
      { key: 'badge', label: 'Badge', type: 'text', max: 24 },
      { key: 'eyebrow', label: 'Eyebrow', type: 'text', max: 40, placeholder: 'Optional line above the headline' },

      { key: 'support', label: 'Supporting text', type: 'textarea', rows: 3, max: 150 },
      { key: 'cta', label: 'Button text', type: 'text', max: 26 },
      { key: 'url', label: 'Website', type: 'text', max: 32 },
      { key: 'fine', label: 'Fine print', type: 'text', max: 70 }
    ];

    const SHOW_FIELDS = [
      { key: 'showBrand', label: 'Tradeprint wordmark' },
      { key: 'showLogo', label: 'Logo image', hint: 'logo' },
      { key: 'showBadge', label: 'Badge' },
      { key: 'showEyebrow', label: 'Eyebrow' },
      { key: 'showSupport', label: 'Supporting text' },
      { key: 'showCta', label: 'Button' },
      { key: 'showUrl', label: 'Website' },
      { key: 'showFine', label: 'Fine print' },
      { key: 'showLabels', label: '"Your view" labels', layouts: ['showcase'] },
      { key: 'showGrid', label: 'Background grid' }
    ];

    const SHARED_DEFAULTS = {
      badge: 'New feature',
      eyebrow: '',
      cta: 'Try it now',
      url: 'tradeprint.ai',
      fine: '',
      showBrand: true,
      showLogo: false,
      showBadge: true,
      showEyebrow: false,
      showSupport: true,
      showCta: true,
      showUrl: true,
      showFine: false,
      showLabels: true,
      showGrid: true,
      productSource: 'builtin',
      frameShape: 'portrait',
      imageFocus: 25,
      imageZoom: 100
    };

    const TEMPLATES = [
      {
        id: 'mentorship',
        name: 'Mentorship',
        status: 'ready',
        blurb: 'New feature announcement',
        layouts: [
          { id: 'showcase', name: 'Showcase', hint: 'Your view and your mentor\'s view, layered.' },

        defaults: {

          trader: 'alextrades',
          date: todayLabel(),
          strategy: 'ORB',
          asset: 'NQ',
          note: 'Was my entry too early here?',
          feedback: 'Good read on the level. Next time, wait for the retest before adding size.'
        },
        headlinePresets: [
          'Introducing\n[Mentorship.]',
          '[Mentorship]\nis here.',
          'Your trading.\n[Their guidance.]',
          'Trade better.\n[Together.]',
          'Your mentor,\n[in your journal.]'
        ],
        dataFields: [
          { key: 'mentorEmail', label: 'Mentor email shown', type: 'text', max: 32, hint: 'Use a placeholder. Never a real address.' },
          { key: 'trader', label: 'Trader username', type: 'text', max: 20 },
          { key: 'date', label: 'Date shown', type: 'text', max: 16 },
          { key: 'strategy', label: 'Strategy', type: 'text', max: 16 },
          { key: 'asset', label: 'Asset', type: 'text', max: 8 },
          { key: 'note', label: 'Trader note on the review request', type: 'text', max: 48 },
          { key: 'feedback', label: 'Mentor feedback (Flow layout)', type: 'textarea', rows: 2, max: 110 }
        ],
        product(s) {
          if (s.layout === 'focus') {
            return `
              <div class="tpui comp comp-focus fit-comp" data-umax="2.6">
                ${UI.frame(UI.mentorCard({ email: s.mentorEmail, since: s.date, cols: 2 }), { title: 'Your Mentors' })}
              </div>`;
          }

          if (s.layout === 'flow') {
            const steps = [
              ['Invite your mentor by email', UI.inviteRow({ email: s.mentorEmail, hint: false })],
              ['Choose exactly what they can see', `<div class="u-card">${UI.perms(MENTOR_PERMISSIONS.slice(0, 4), 2)}</div>`],
              ['Get feedback on the trades you pick', UI.feedbackItem({ strategy: s.strategy, asset: s.asset, date: s.date, body: s.feedback, email: s.mentorEmail })]
            ];
            return `
              <div class="tpui comp comp-flow fit-comp" data-umax="2.4">
                ${steps.map(([title, card], i) => `
                  <div class="flow-step">
                    <div class="flow-head"><span class="u-step-num">${i + 1}</span>${esc(title)}</div>
                    ${card}
                  </div>`).join('')}
              </div>`;
          }

          return `
            <div class="tpui comp comp-showcase fit-comp${s.showLabels ? ' has-chips' : ''}" data-umax="2.4">
              ${UI.frame(UI.mentorCard({ email: s.mentorEmail, since: s.date, cols: 2, perms: MENTOR_PERMISSIONS.slice(0, 4) }), {
                cls: 'sc-a',
                chip: UI.chip('Your view', s.showLabels)
              })}
              ${UI.reviewItem({
                trader: s.trader, strategy: s.strategy, asset: s.asset, date: s.date, note: s.note,
                cls: 'sc-b',
                chip: UI.chip('Your mentor\'s view', s.showLabels)
              })}
            </div>`;
        }
      },

      // Planned ads. Give each one layouts, defaults and product() to switch it on.
      { id: 'general', name: 'Tradeprint (general)', status: 'planned', blurb: 'Brand ad' },
      { id: 'journal', name: 'Trading Journal', status: 'planned', blurb: 'Feature promo' },
      { id: 'calendar', name: 'Trading Calendar', status: 'planned', blurb: 'Feature promo' },
      { id: 'analytics', name: 'Performance Analytics', status: 'planned', blurb: 'Feature promo' },
      { id: 'prop', name: 'Prop Firm Command Center', status: 'planned', blurb: 'Feature promo' }
    ];

    function getTemplate(id) {
      return TEMPLATES.find(t => t.id === id && t.status === 'ready') || TEMPLATES.find(t => t.status === 'ready');
    }

    /* ============================================================
       5. STATE (saved in this browser only)
       ============================================================ */
    const state = {
      templateId: 'mentorship',
      format: 'story',
      safeArea: 'stories',
      guides: false,
      templates: {}
    };

    const images = {};       // uploaded product screenshots by template id
    let logoSrc = '';         // uploaded logo or assets/logo.png
    let logoIsUpload = false;

    function tplState(id = state.templateId) {
      const tpl = getTemplate(id);
      state.templates[tpl.id] = Object.assign({}, SHARED_DEFAULTS, tpl.defaults, state.templates[tpl.id] || {});
      if (!tpl.layouts.some(l => l.id === state.templates[tpl.id].layout)) state.templates[tpl.id].layout = tpl.layouts[0].id;
      return state.templates[tpl.id];
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && typeof saved === 'object') {
          if (typeof saved.templateId === 'string') state.templateId = saved.templateId;
          if (FORMATS[saved.format]) state.format = saved.format;
          if (SAFE_ZONES[saved.safeArea]) state.safeArea = saved.safeArea;
          state.guides = !!saved.guides;
          if (saved.templates && typeof saved.templates === 'object') state.templates = saved.templates;
        }
      } catch (err) {}

      state.templateId = getTemplate(state.templateId).id;

      TEMPLATES.filter(t => t.status === 'ready').forEach(t => {
        try {
          const img = localStorage.getItem(IMAGE_KEY_PREFIX + t.id);
          if (img) images[t.id] = img;
        } catch (err) {}
      });

      try {
        const logo = localStorage.getItem(LOGO_KEY);
        if (logo) { logoSrc = logo; logoIsUpload = true; }
      } catch (err) {}
    }

    let saveTimer = null;
    function saveState() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
      }, 250);
    }

    /* ============================================================
       6. AD RENDERING
       ============================================================ */
    const adEl = $('#ad');

    function currentFormat() { return FORMATS[state.format] || FORMATS.story; }

    function productHtml(tpl, s) {
      if (s.productSource === 'upload') {
        const img = images[tpl.id];
        const ratio = { tall: 0.5625, portrait: 0.8, square: 1 }[s.frameShape] || 0.8;
        if (!img) return `<div class="shot-empty" style="aspect-ratio:${ratio}">Upload a Tradeprint screenshot in Product visual</div>`;
        return `
          <div class="shot-frame" style="--frame-ar:${ratio};--focus:${clamp(+s.imageFocus || 0, 0, 100)}%;--zoom:${clamp((+s.imageZoom || 100) / 100, 1, 3)}">
            <img src="${img}" alt="" />
          </div>`;
      }
      return tpl.product(s);
    }

    function renderAd() {
      const tpl = getTemplate(state.templateId);
      const s = tplState(tpl.id);
      const fmt = currentFormat();

      const classes = ['ad', `ad--${fmt.id}`, `tpl-${tpl.id}`, `layout-${s.layout}`];
      if (fmt.id === 'story' && state.safeArea === 'reels') classes.push('ad--reels');
      adEl.className = classes.join(' ');

      const useLogo = s.showLogo && logoSrc;
      const brandParts = [];
      if (s.showBrand || useLogo) {
        brandParts.push(`<div class="ad-wordmark">${useLogo ? `<img class="ad-logo" src="${esc(logoSrc)}" alt="" />` : ''}${s.showBrand ? '<span>trade<span class="p">print</span></span>' : ''}</div>`);
      }
      if (s.showBadge && s.badge.trim()) {
        brandParts.push(`<div class="ad-badge"><span class="ad-badge-dot"></span>${esc(s.badge)}</div>`);
      }

      const foot = [];
      if (s.showCta && s.cta.trim()) foot.push(`<span class="ad-button">${esc(s.cta)}${ARROW_SVG}</span>`);
      if (s.showUrl && s.url.trim()) foot.push(`<span class="ad-url">${esc(s.url)}</span>`);
      const fine = s.showFine && s.fine.trim() ? `<div class="ad-fine">${esc(s.fine)}</div>` : '';

      adEl.innerHTML = `
        ${s.showGrid ? '<div class="ad-grid"></div><div class="ad-grid-fade"></div>' : ''}
        <div class="ad-inner">
          ${brandParts.length ? `<div class="ad-brand">${brandParts.join('')}</div>` : ''}
          <div class="ad-copy">
            ${s.showEyebrow && s.eyebrow.trim() ? `<div class="ad-eyebrow">${esc(s.eyebrow)}</div>` : ''}
            <div class="ad-headline">${rich(s.headline)}</div>
            ${s.showSupport && s.support.trim() ? `<div class="ad-support">${esc(s.support)}</div>` : ''}
          </div>
          <div class="ad-product">${productHtml(tpl, s)}</div>
          ${foot.length || fine ? `<div class="ad-foot">${foot.length ? `<div class="ad-cta">${foot.join('')}</div>` : ''}${fine}</div>` : ''}
        </div>`;

      fitAd();
      renderGuides();
    }

    // Shrink the headline until it fits its width and line limit.
    function fitHeadline() {
      const el = adEl.querySelector('.ad-headline');
      if (!el) return;

      const fmt = currentFormat();
      const max = parseFloat(getComputedStyle(adEl).getPropertyValue('--h-max')) || 140;
      const min = 64;
      const maxLines = fmt.id === 'feed' ? 2 : 3;
      let size = max;

      el.style.fontSize = size + 'px';
      const lines = () => Math.round(el.offsetHeight / (size * 0.98));

      while (size > min && (el.scrollWidth > el.clientWidth + 1 || lines() > maxLines)) {
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }

    // Scale the built-in product UI to the space left between copy and CTA.
    function fitComposition() {
      const area = adEl.querySelector('.ad-product');
      const comp = area && area.querySelector('.fit-comp');
      if (!comp) return;

      // Size = fixed part + u * scalable part. Measure at two scales to
      // get both, then pick the largest u that fits the space.
      comp.style.setProperty('--u', '1px');
      const w1 = comp.offsetWidth, h1 = comp.offsetHeight;
      comp.style.setProperty('--u', '2px');
      const w2 = comp.offsetWidth, h2 = comp.offsetHeight;
      const availW = area.clientWidth;
      const availH = area.clientHeight;
      if (!w1 || !h1 || !availW || !availH) return;

      const bw = Math.max(1, w2 - w1), bh = Math.max(1, h2 - h1);
      const fitW = (availW - (w1 - bw)) / bw;
      const fitH = (availH - (h1 - bh)) / bh;
      const uMax = parseFloat(comp.dataset.umax) || 2.4;
      const u = Math.max(0.5, Math.min(fitW, fitH, uMax));
      comp.style.setProperty('--u', (Math.floor(u * 1000) / 1000) + 'px');
    }

    function fitAd() {
      fitHeadline();
      fitComposition();
    }

    function renderGuides() {
      const guides = $('#safeGuides');
      const fmt = currentFormat();
      const show = state.guides && fmt.id === 'story';
      guides.hidden = !show;
      if (!show) { guides.innerHTML = ''; return; }
      guides.innerHTML = SAFE_ZONES[state.safeArea].map(z =>
        `<div class="safe-zone" style="left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px"><span>${esc(z.label)}</span></div>`
      ).join('');
    }

    /* ============================================================
       7. PREVIEW SCALING
       The ad is always laid out at full size and scaled with a
       transform, so the composition is identical on every screen.
       ============================================================ */
    const shell = $('#stageShell');
    const stageScale = $('#stageScale');
    const viewport = $('#viewport');
    let scaleNow = 1;

    function layoutPreview() {
      if (shotActive) return layoutShot();

      const fmt = currentFormat();
      const narrow = window.matchMedia('(max-width: 900px)').matches;
      const cs = getComputedStyle(viewport);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      const availW = viewport.clientWidth - padX;
      const availH = narrow ? window.innerHeight * 0.78 : viewport.clientHeight - padY;

      const s = Math.max(0.05, Math.min(availW / fmt.w, availH / fmt.h));
      applyScale(s, shell);
      $('#zoomLabel').textContent = `${fmt.w} × ${fmt.h} · ${Math.round(s * 100)}%`;
    }

    function applyScale(s, box) {
      const fmt = currentFormat();
      scaleNow = s;
      stageScale.style.width = fmt.w + 'px';
      stageScale.style.height = fmt.h + 'px';
      stageScale.style.transform = `scale(${s})`;
      box.style.width = Math.round(fmt.w * s) + 'px';
      box.style.height = Math.round(fmt.h * s) + 'px';
    }

    new ResizeObserver(() => layoutPreview()).observe(viewport);
    window.addEventListener('resize', () => layoutPreview());

    /* ============================================================
       8. CONTROLS
       ============================================================ */
    const controlsEl = $('#controls');

    function seg(name, options, value) {
      return `<div class="seg" role="group" data-seg="${name}">${options.map(o =>
        `<button type="button" data-value="${esc(o.id)}" aria-pressed="${o.id === value}"${o.disabled ? ' disabled' : ''}>${esc(o.name)}</button>`
      ).join('')}</div>`;
    }

    function textField(f, value, scope = 'tpl') {
      const len = String(value ?? '').length;
      const count = f.max ? `<span class="field-count${len > f.max ? ' over' : ''}" data-count="${f.key}">${len}/${f.max}</span>` : '';
      const input = f.type === 'textarea'
        ? `<textarea id="f-${f.key}" data-key="${f.key}" data-scope="${scope}" rows="${f.rows || 2}" placeholder="${esc(f.placeholder || '')}">${esc(value)}</textarea>`
        : `<input type="text" id="f-${f.key}" data-key="${f.key}" data-scope="${scope}" value="${esc(value)}" placeholder="${esc(f.placeholder || '')}" autocomplete="off" spellcheck="true" />`;
      return `
        <div class="field">
          <label for="f-${f.key}">${esc(f.label)}${count}</label>
          ${input}
          ${f.hint ? `<div class="field-hint">${f.hint.includes('<b>') ? f.hint : esc(f.hint)}</div>` : ''}
        </div>`;
    }

    function toggleRow(key, label, checked) {
      return `
        <label class="toggle-row">
          <span>${esc(label)}</span>
          <span class="switch"><input type="checkbox" data-key="${key}" data-scope="tpl" ${checked ? 'checked' : ''} /><span></span></span>
        </label>`;
    }

    const openGroups = { ad: true, copy: true, show: false, product: false, data: false };

    function group(id, title, body) {
      return `<details class="ctl-group" data-group="${id}" ${openGroups[id] ? 'open' : ''}><summary>${esc(title)}</summary><div class="ctl-body">${body}</div></details>`;
    }

    function renderControls() {
      const tpl = getTemplate(state.templateId);
      const s = tplState(tpl.id);
      const layout = tpl.layouts.find(l => l.id === s.layout);

      const tplOptions = TEMPLATES.map(t =>
        `<option value="${t.id}" ${t.id === tpl.id ? 'selected' : ''} ${t.status !== 'ready' ? 'disabled' : ''}>${esc(t.name)}${t.status !== 'ready' ? ' (coming next)' : ''}</option>`
      ).join('');

      const adGroup = `
        <div class="field">
          <label for="tplSelect">Template</label>
          <select id="tplSelect">${tplOptions}</select>
          <div class="field-hint">${esc(tpl.blurb)}</div>
        </div>
        <div class="field">
          <span class="field-label">Layout</span>
          ${seg('layout', tpl.layouts, s.layout)}
          <div class="field-hint">${esc(layout ? layout.hint : '')}</div>
        </div>
        ${state.format === 'story' ? `
        <div class="field">
          <span class="field-label">Safe area</span>
          ${seg('safeArea', [{ id: 'stories', name: 'Stories' }, { id: 'reels', name: 'Reels' }], state.safeArea)}
          <div class="field-hint">${state.safeArea === 'reels'
            ? 'Keeps clear of the Reels caption and the buttons on the right. That leaves less room, so hiding the supporting text makes the product bigger.'
            : "Keeps text and the CTA clear of the Stories header and reply bar."}</div>
        </div>` : ''}`;

      const presets = (tpl.headlinePresets || []).map((p, i) =>
        `<button type="button" class="chip" data-preset="${i}" title="${esc(p.replace(/\n/g, ' '))}">${esc(p.replace(/[\[\]]/g, '').replace(/\n/g, ' '))}</button>`
      ).join('');

      const copyGroup = COPY_FIELDS.map(f => {
        let html = textField(f, s[f.key]);
        if (f.key === 'headline' && presets) html += `<div class="chips">${presets}</div>`;
        return html;
      }).join('');

      const showGroup = `<div class="toggle-list">${SHOW_FIELDS
        .filter(f => !f.layouts || f.layouts.includes(s.layout))
        .map(f => toggleRow(f.key, f.label, s[f.key])).join('')}</div>
        <div class="field">
          <span class="field-label">Logo image</span>
          <div class="upload-row">
            <label class="btn" for="logoInput">Upload logo</label>
            <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
            ${logoIsUpload ? '<button class="btn btn-quiet" type="button" id="logoRemove">Remove</button>' : ''}
          </div>
          <div class="field-hint">${logoSrc
            ? (logoIsUpload ? 'Using your uploaded logo.' : `Using <b>${esc(LOGO_ASSET)}</b>.`)
            : `No logo yet. Upload the official TP logo or add it as <b>${esc(LOGO_ASSET)}</b>. It's used exactly as supplied.`}</div>
        </div>`;

      const hasImg = !!images[tpl.id];
      const productGroup = `
        <div class="field">
          <span class="field-label">Source</span>
          ${seg('productSource', [{ id: 'builtin', name: 'Tradeprint UI' }, { id: 'upload', name: 'Screenshot' }], s.productSource)}
          <div class="field-hint">${s.productSource === 'builtin'
            ? 'The real Tradeprint interface, rebuilt so it stays sharp at full size. Uses placeholder data only.'
            : 'Use your own screenshot. Check it for private emails or account details first.'}</div>
        </div>
        ${s.productSource === 'upload' ? `
        <div class="field">
          <div class="upload-row">
            <label class="btn" for="imgInput">${hasImg ? 'Replace screenshot' : 'Upload screenshot'}</label>
            <input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp" hidden />
            ${hasImg ? '<button class="btn btn-quiet" type="button" id="imgRemove">Remove</button>' : ''}
          </div>
          <div class="upload-status" id="imgStatus"></div>
        </div>
        <div class="field">
          <span class="field-label">Frame</span>
          ${seg('frameShape', [{ id: 'portrait', name: 'Portrait' }, { id: 'tall', name: 'Tall' }, { id: 'square', name: 'Square' }], s.frameShape)}
        </div>
        <div class="field">
          <label for="f-imageFocus">Vertical position</label>
          <div class="range-row"><input type="range" id="f-imageFocus" min="0" max="100" step="1" data-key="imageFocus" data-scope="tpl" value="${+s.imageFocus}" /><output>${+s.imageFocus}%</output></div>
        </div>
        <div class="field">
          <label for="f-imageZoom">Zoom</label>
          <div class="range-row"><input type="range" id="f-imageZoom" min="100" max="250" step="5" data-key="imageZoom" data-scope="tpl" value="${+s.imageZoom}" /><output>${+s.imageZoom}%</output></div>
        </div>` : ''}`;

      const dataGroup = (tpl.dataFields || []).map(f => textField(f, s[f.key])).join('');

      controlsEl.innerHTML = [
        group('ad', 'Ad', adGroup),
        group('copy', 'Copy', copyGroup),
        group('show', 'Show and hide', showGroup),
        group('product', 'Product visual', productGroup),
        dataGroup ? group('data', 'Preview data', dataGroup) : '',
        `<div class="ctl-footer"><button class="btn" type="button" id="resetBtn">Reset this ad</button></div>`
      ].join('');

      renderFormatSeg();
    }

    function renderFormatSeg() {
      $('#formatSeg').innerHTML = Object.values(FORMATS).map(f =>
        `<button type="button" data-format="${f.id}" aria-pressed="${f.id === state.format}" title="${f.name} ${f.w} × ${f.h}">${f.name} ${f.label}</button>`
      ).join('');
      const guidesBtn = $('#guidesBtn');
      guidesBtn.setAttribute('aria-pressed', String(state.guides));
      guidesBtn.style.color = state.guides ? 'var(--text)' : '';
      guidesBtn.style.borderColor = state.guides ? 'var(--accent)' : '';
      guidesBtn.hidden = state.format !== 'story';
    }

    let renderQueued = false;
    function queueRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; renderAd(); });
    }

    function onChange(full = false) {
      saveState();
      if (full) renderControls();
      queueRender();
    }

    controlsEl.addEventListener('input', (e) => {
      const el = e.target;
      const key = el.dataset.key;
      if (!key) return;
      const s = tplState();

      if (el.type === 'checkbox') {
        s[key] = el.checked;
        onChange(key === 'showLogo');
        return;
      }

      if (el.type === 'range') {
        s[key] = Number(el.value);
        const out = el.parentElement.querySelector('output');
        if (out) out.textContent = el.value + '%';
        onChange();
        return;
      }

      s[key] = el.value;
      const counter = controlsEl.querySelector(`[data-count="${key}"]`);
      if (counter) {
        const max = parseInt(counter.textContent.split('/')[1], 10);
        counter.textContent = `${el.value.length}/${max}`;
        counter.classList.toggle('over', el.value.length > max);
      }
      onChange();
    });

    controlsEl.addEventListener('change', (e) => {
      const el = e.target;
      if (el.id === 'tplSelect') {
        state.templateId = getTemplate(el.value).id;
        onChange(true);
      }
      if (el.id === 'imgInput' && el.files && el.files[0]) handleImageUpload(el.files[0]);
      if (el.id === 'logoInput' && el.files && el.files[0]) handleLogoUpload(el.files[0]);
    });

    controlsEl.addEventListener('click', (e) => {
      const segBtn = e.target.closest('[data-seg] button');
      if (segBtn) {
        const name = segBtn.parentElement.dataset.seg;
        const value = segBtn.dataset.value;
        if (name === 'safeArea') state.safeArea = value;
        else tplState()[name] = value;
        onChange(true);
        return;
      }

      const preset = e.target.closest('[data-preset]');
      if (preset) {
        const tpl = getTemplate(state.templateId);
        const value = tpl.headlinePresets[+preset.dataset.preset];
        tplState().headline = value;
        const input = $('#f-headline');
        if (input) input.value = value;
        const counter = controlsEl.querySelector('[data-count="headline"]');
        if (counter) counter.textContent = `${value.length}/80`;
        onChange();
        return;
      }

      if (e.target.id === 'resetBtn') {
        const tpl = getTemplate(state.templateId);
        if (!confirm(`Reset the ${tpl.name} ad to its default copy and layout?`)) return;
        delete state.templates[tpl.id];
        onChange(true);
        return;
      }

      if (e.target.id === 'imgRemove') {
        const id = getTemplate(state.templateId).id;
        delete images[id];
        try { localStorage.removeItem(IMAGE_KEY_PREFIX + id); } catch (err) {}
        onChange(true);
        return;
      }

      if (e.target.id === 'logoRemove') {
        try { localStorage.removeItem(LOGO_KEY); } catch (err) {}
        logoSrc = '';
        logoIsUpload = false;
        detectLogoAsset().then(() => onChange(true));
      }
    });

    controlsEl.addEventListener('toggle', (e) => {
      const g = e.target.closest && e.target.closest('.ctl-group');
      if (g) openGroups[g.dataset.group] = g.open;
    }, true);

    $('#formatSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-format]');
      if (!btn || !FORMATS[btn.dataset.format]) return;
      state.format = btn.dataset.format;
      saveState();
      renderControls();
      layoutPreview();
      renderAd();
    });

    $('#guidesBtn').addEventListener('click', () => {
      state.guides = !state.guides;
      saveState();
      renderFormatSeg();
      renderGuides();
    });

    /* ============================================================
       9. IMAGE UPLOADS (kept in this browser only)
       ============================================================ */
    function readImage(file, maxSide, type, quality) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL(type, quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That image could not be read.')); };
        img.src = url;
      });
    }

    async function handleImageUpload(file) {
      const id = getTemplate(state.templateId).id;
      const status = $('#imgStatus');
      if (status) status.textContent = 'Processing...';
      try {
        images[id] = await readImage(file, 2000, 'image/jpeg', 0.94);
        let note = '';
        try { localStorage.setItem(IMAGE_KEY_PREFIX + id, images[id]); }
        catch (err) { note = 'Too large to keep after a reload. It works for this session.'; }
        renderControls();
        const st = $('#imgStatus');
        if (st) st.textContent = note;
        queueRender();
      } catch (err) {
        if (status) status.textContent = err.message;
      }
    }

    async function handleLogoUpload(file) {
      try {
        logoSrc = file.type === 'image/svg+xml'
          ? await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); })
          : await readImage(file, 512, 'image/png');
        logoIsUpload = true;
        try { localStorage.setItem(LOGO_KEY, logoSrc); } catch (err) {}
        tplState().showLogo = true;
        onChange(true);
      } catch (err) {
        alert('That logo could not be read.');
      }
    }

    function detectLogoAsset() {
      return new Promise(resolve => {
        if (logoSrc) return resolve();
        const img = new Image();
        img.onload = () => {
          if (img.naturalWidth > 0 && !logoSrc) logoSrc = asset(LOGO_ASSET);
          resolve();
        };
        img.onerror = () => resolve();
        img.src = asset(LOGO_ASSET);
      });
    }

    /* ============================================================
       10. FONT (loaded once, embedded into every export)
       ============================================================ */
    let fontEmbedCss = '';

    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary);
    }

    function isWoff2(buffer) {
      const b = new Uint8Array(buffer, 0, 4);
      return b.length === 4 && b[0] === 0x77 && b[1] === 0x4f && b[2] === 0x46 && b[3] === 0x32; // "wOF2"
    }

    async function loadBrandFont() {
      for (const url of FONT_SOURCES) {
        try {
          const res = await fetch(url, { cache: 'force-cache' });
          if (!res.ok) continue;
          const buffer = await res.arrayBuffer();
          if (!isWoff2(buffer)) continue;
          const face = new FontFace(FONT_FAMILY, buffer, { weight: '100 900', style: 'normal' });
          await face.load();
          document.fonts.add(face);
          fontEmbedCss = `@font-face{font-family:'${FONT_FAMILY}';src:url(data:font/woff2;base64,${bufferToBase64(buffer)}) format('woff2');font-weight:100 900;font-style:normal;}`;
          return true;
        } catch (err) {}
      }
      console.warn('[Studio] Inter could not be loaded. Using system fonts.');
      return false;
    }

    const fontReady = Promise.race([
      loadBrandFont(),
      new Promise(r => setTimeout(() => r(false), 6000))
    ]);

    /* ============================================================
       11. SCREENSHOT MODE
       Shows only the ad, scaled to fill the screen. The controls fade
       out so the screenshot is clean. Tap to show them, Esc to exit.
       ============================================================ */
    const shotMode = $('#shotMode');
    const shotStage = $('#shotStage');
    const shotUi = $('#shotUi');
    let shotActive = false;
    let shotTimer = null;

    function layoutShot() {
      const fmt = currentFormat();
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      applyScale(Math.min(w / fmt.w, h / fmt.h), shotStage);
    }

    function showShotUi() {
      shotUi.classList.remove('is-hidden');
      clearTimeout(shotTimer);
      shotTimer = setTimeout(() => shotUi.classList.add('is-hidden'), 2000);
    }

    function enterShotMode() {
      shotActive = true;
      $('#safeGuides').hidden = true;
      shotStage.appendChild(stageScale);
      shotMode.hidden = false;
      document.body.style.overflow = 'hidden';
      layoutShot();
      showShotUi();
      if (!IS_TOUCH && shotMode.requestFullscreen) shotMode.requestFullscreen().catch(() => {});
    }

    function exitShotMode() {
      if (!shotActive) return;
      shotActive = false;
      clearTimeout(shotTimer);
      shell.appendChild(stageScale);
      shotMode.hidden = true;
      document.body.style.overflow = '';
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      layoutPreview();
      renderGuides();
    }

    $('#shotBtn').addEventListener('click', enterShotMode);
    $('#shotExit').addEventListener('click', (e) => { e.stopPropagation(); exitShotMode(); });
    shotMode.addEventListener('click', () => showShotUi());
    document.addEventListener('fullscreenchange', () => { if (shotActive) layoutShot(); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (shotActive) layoutShot(); });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!$('#exportSheet').hidden) closeExportSheet();
      else exitShotMode();
    });

    /* ============================================================
       12. PNG EXPORT
       Renders the ad element at its native size with modern-screenshot
       (the browser's own layout engine, drawn through SVG). Fonts are
       embedded from the same file the preview uses.
       ============================================================ */
    let exportLibPromise = null;

    function loadScript({ src, integrity }) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src;
        if (integrity) { el.integrity = integrity; el.crossOrigin = 'anonymous'; }
        el.onload = () => resolve();
        el.onerror = () => { el.remove(); reject(new Error('Could not load ' + src)); };
        document.head.appendChild(el);
      });
    }

    function loadExportLib() {
      if (window.modernScreenshot) return Promise.resolve(window.modernScreenshot);
      if (!exportLibPromise) {
        exportLibPromise = (async () => {
          for (const source of EXPORT_LIB_SOURCES) {
            try {
              await loadScript(source);
              if (window.modernScreenshot && window.modernScreenshot.domToCanvas) return window.modernScreenshot;
            } catch (err) {}
          }
          throw new Error('The export library could not be loaded. Check your connection.');
        })().catch(err => { exportLibPromise = null; throw err; });
      }
      return exportLibPromise;
    }

    async function waitForImages(root) {
      const imgs = Array.from(root.querySelectorAll('img'));
      await Promise.all(imgs.map(img => (img.complete && img.naturalWidth)
        ? (img.decode ? img.decode().catch(() => {}) : null)
        : new Promise(r => { img.onload = img.onerror = r; })));
    }

    // A render where nearly every pixel is the background color means the
    // browser drew an empty frame. That happens now and then in Safari.
    function looksBlank(canvas) {
      try {
        const probe = document.createElement('canvas');
        probe.width = 54;
        probe.height = Math.round(54 * canvas.height / canvas.width);
        const ctx = probe.getContext('2d');
        ctx.drawImage(canvas, 0, 0, probe.width, probe.height);
        const data = ctx.getImageData(0, 0, probe.width, probe.height).data;
        let distinct = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (Math.abs(data[i] - 10) + Math.abs(data[i + 1] - 10) + Math.abs(data[i + 2] - 10) > 30) distinct++;
        }
        return distinct < 12;
      } catch (err) {
        return false;
      }
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG encoding failed.')), 'image/png');
      });
    }

    function exportFileName() {
      const tpl = getTemplate(state.templateId);
      const s = tplState();
      const fmt = currentFormat();
      const d = new Date();
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return `tradeprint-${tpl.id}-${s.layout}-${fmt.w}x${fmt.h}-${date}.png`;
    }

    async function renderPng() {
      await fontReady;
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const lib = await loadExportLib();
      fitAd();
      await waitForImages(adEl);
      await nextFrame();

      const fmt = currentFormat();
      const options = {
        width: fmt.w,
        height: fmt.h,
        scale: 1,
        backgroundColor: '#0a0a0a',
        font: fontEmbedCss ? { cssText: fontEmbedCss } : false,
        timeout: 20000
      };

      // Safari sometimes needs one warm-up draw before images and fonts show.
      if (IS_SAFARI) { try { await lib.domToCanvas(adEl, options); } catch (err) {} }

      let canvas = await lib.domToCanvas(adEl, options);
      if (looksBlank(canvas)) canvas = await lib.domToCanvas(adEl, options);
      if (looksBlank(canvas)) throw new Error('The browser returned an empty image.');
      if (canvas.width !== fmt.w || canvas.height !== fmt.h) {
        throw new Error(`Expected ${fmt.w} × ${fmt.h}, got ${canvas.width} × ${canvas.height}.`);
      }
      return canvasToBlob(canvas);
    }

    const sheet = $('#exportSheet');
    const sheetBody = $('#exportBody');
    let exportUrl = '';
    let exporting = false;

    function openSheet(html) {
      sheetBody.innerHTML = html;
      sheet.hidden = false;
    }

    function closeExportSheet() {
      sheet.hidden = true;
      sheetBody.innerHTML = '';
      if (exportUrl) { URL.revokeObjectURL(exportUrl); exportUrl = ''; }
    }

    function triggerDownload(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function runExport() {
      if (exporting) return;
      exporting = true;
      const fmt = currentFormat();
      const name = exportFileName();
      $('#exportBtn').disabled = true;

      openSheet(`<div class="spinner"></div><div class="sheet-copy" style="text-align:center">Rendering ${fmt.w} × ${fmt.h} PNG...</div>`);

      try {
        const blob = await renderPng();
        if (exportUrl) URL.revokeObjectURL(exportUrl);
        exportUrl = URL.createObjectURL(blob);
        const file = new File([blob], name, { type: 'image/png' });
        const canShare = IS_TOUCH && navigator.canShare && navigator.canShare({ files: [file] });
        const kb = Math.round(blob.size / 1024);

        openSheet(`
          <div class="sheet-preview"><img src="${exportUrl}" alt="Exported ad" /></div>
          <div class="sheet-copy">${fmt.w} × ${fmt.h} PNG · ${kb.toLocaleString()} KB${IS_TOUCH ? '<br>On iPhone you can also press and hold the image and choose Save to Photos.' : ''}</div>
          <div class="sheet-actions">
            ${canShare ? '<button class="btn btn-primary" type="button" id="shareBtn">Save or share</button>' : ''}
            <button class="btn ${canShare ? '' : 'btn-primary'}" type="button" id="downloadBtn">Download PNG</button>
          </div>`);

        $('#downloadBtn').addEventListener('click', () => triggerDownload(exportUrl, name));
        const shareBtn = $('#shareBtn');
        if (shareBtn) shareBtn.addEventListener('click', () => navigator.share({ files: [file] }).catch(() => {}));
        if (!IS_TOUCH) triggerDownload(exportUrl, name);
      } catch (err) {
        console.error('[Studio] Export failed:', err);
        openSheet(`
          <div class="sheet-copy error">Export didn't work in this browser: ${esc(err.message || err)}</div>
          <div class="sheet-copy">Use Screenshot mode instead. It shows only the ad, scaled to your screen, so you can screenshot it and crop to the ad.</div>
          <div class="sheet-actions">
            <button class="btn btn-primary" type="button" id="fallbackShot">Open screenshot mode</button>
            <button class="btn" type="button" id="retryExport">Try again</button>
          </div>`);
        $('#fallbackShot').addEventListener('click', () => { closeExportSheet(); enterShotMode(); });
        $('#retryExport').addEventListener('click', () => { exporting = false; runExport(); });
      } finally {
        exporting = false;
        $('#exportBtn').disabled = false;
      }
    }

    $('#exportBtn').addEventListener('click', runExport);
    $('#exportClose').addEventListener('click', closeExportSheet);
    sheet.addEventListener('click', (e) => { if (e.target === sheet) closeExportSheet(); });

    // Warm the export library once the page is idle.
    const warmExport = () => loadExportLib().catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(warmExport, { timeout: 4000 });
    else setTimeout(warmExport, 1500);

    /* ============================================================
       13. START
       ============================================================ */
    loadState();
    renderControls();
    layoutPreview();
    renderAd();

    Promise.all([fontReady, detectLogoAsset()]).then(() => {
      renderControls();
      renderAd();
      shell.classList.remove('is-loading');
    });

    // Debug hook for checks in the browser console: window.__studio
    window.__studio = { state, render: renderAd, exportPng: renderPng };
  })();
  </script>
</body>
</html>
