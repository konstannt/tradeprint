<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0e14" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/>
  <title>Tradeprint | Video Studio</title>

  <!--
    Tradeprint Video Studio
    Internal tool for animated MP4 ads (Reels, TikTok, Shorts): 1080 x 1920, 30 fps,
    H.264 + AAC. Static page: no build step, no Supabase, no tokens, no user data.
    Settings are saved only in this browser (localStorage). Lives at /marketing/video
    and is opened from the Marketing Studio top bar. It does not touch the app.

    How it works
      One composition, renderFrame(ctx, t, project), draws every frame on a canvas.
      The preview calls it on each animation frame; the export calls it for frame
      0..N at t = i / 30 and hands each frame to the browser's H.264 encoder
      (WebCodecs, through Mediabunny). Preview and MP4 are the same pixels.

      App screens are the Marketing Studio's UI 2.0 library (same markup and CSS,
      copied in sections 5 and 7 below) filled with example data. Each screen is
      rasterized once with modern-screenshot, then animated as a layer: zooms,
      pans, depth, light sweeps and motion blur (sub-frame sampling).

      Music and sound effects are synthesized in the browser (Web Audio), so they
      are original and owned by Tradeprint. A licensed track can be uploaded
      instead; the export asks you to confirm the license.

      After export the file is opened again and checked: codec, size, frame rate,
      frame count, duration, audio, playback in a <video> element, and decoded
      frames compared with the composition.

    Optional local files (the page falls back to jsDelivr, every file is hash-checked):
      vendor/mediabunny-1.61.0.min.mjs              (MPL-2.0) MP4 muxing + WebCodecs
      vendor/mediabunny-aac-encoder-1.61.0.min.js   (MPL-2.0) AAC for browsers without it
      vendor/modern-screenshot-4.7.0.js             (MIT)     UI screen rasterizing
      ../assets/fonts/*.woff2                       IBM Plex Sans + Condensed (same as the Studio)

    All numbers shown inside app screens are example data.
  -->

  <style>
    /* ============================================================
       1. STUDIO TOKENS (Tradeprint UI 2.0, same as the Marketing Studio)
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --nav: #0c0e14;
      --canvas: #10121a;
      --inset: #12141c;
      --surface: #171a24;
      --raised: #1d2130;
      --overlay: #1a1d29;
      --line: #262a38;
      --line-soft: #1f2330;
      --line-strong: #353b4f;
      --text: #e9ebf2;
      --text2: #979db1;
      --text3: #6d7388;
      --accent: #6366f1;
      --accent-hover: #5458e8;
      --accent-text: #a3a6fb;
      --accent-soft: rgba(99, 102, 241, 0.14);
      --accent-softer: rgba(99, 102, 241, 0.08);
      --accent-line: rgba(99, 102, 241, 0.5);
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
      --btn-sheen: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      --font: 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      --font-num: 'TP Plex Condensed', 'IBM Plex Sans Condensed', 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
      --topbar-h: 56px;
      --controls-w: 404px;
    }

    html, body { height: 100%; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      overflow: hidden;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

    :focus { outline: none; }
    :focus-visible { outline: none; box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px rgba(99, 102, 241, 0.7); border-radius: 6px; }

    /* ============================================================
       2. STUDIO LAYOUT
       ============================================================ */
    .st-top {
      position: relative;
      z-index: 20;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 max(16px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left));
      background: var(--nav);
      border-bottom: 1px solid var(--line-soft);
    }

    .st-logo { font-size: 19px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); text-decoration: none; white-space: nowrap; }
    .st-logo span { color: var(--accent); }

    .st-tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-line);
      color: var(--accent-text);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .st-top-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--raised);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      text-decoration: none;
      transition: border-color 140ms, background 140ms, color 140ms;
    }

    .btn:hover { border-color: var(--line-strong); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: var(--btn-sheen), 0 1px 2px rgba(10, 12, 40, 0.35); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-quiet { background: transparent; border-color: transparent; color: var(--text2); }
    .btn-quiet:hover { color: var(--text); border-color: var(--line); }
    .btn-quiet[aria-pressed="true"] { color: var(--text); border-color: var(--accent-line); background: var(--accent-softer); }
    .btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-icon { width: 36px; padding: 0; }
    .st-back svg { width: 15px; height: 15px; }

    .vs-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--controls-w);
      height: calc(100vh - var(--topbar-h));
      height: calc(100dvh - var(--topbar-h));
    }

    .vs-preview { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    .vs-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--canvas);
    }

    .vs-bar-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
    .vs-bar-meta { font-size: 12px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .vs-bar .seg { grid-auto-columns: auto; margin-left: auto; }

    .vs-viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: hidden;
      background-color: var(--canvas);
      background-image: radial-gradient(var(--line-soft) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .vs-stage {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 10px;
      background: #0c0e14;
      box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(2, 3, 7, 0.6);
    }

    .vs-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .vs-guides { position: absolute; inset: 0; pointer-events: none; }
    .vs-zone { position: absolute; background: rgba(239, 68, 68, 0.13); border: 1px dashed rgba(239, 68, 68, 0.6); }
    .vs-zone span { position: absolute; left: 6px; top: 4px; font-size: 10px; font-weight: 600; color: #fca5a5; letter-spacing: 0.02em; white-space: nowrap; }

    .vs-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(12, 14, 20, 0.82);
      color: var(--text2);
      font-size: 12.5px;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }

    .vs-big-play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 64px;
      height: 64px;
      margin: -32px 0 0 -32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 14, 20, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      color: #fff;
      z-index: 1;
      transition: opacity 160ms, transform 160ms;
    }

    .vs-big-play svg { width: 24px; height: 24px; fill: currentColor; margin-left: 3px; }
    .vs-big-play:hover { transform: scale(1.05); }

    /* Transport: play, time, timeline */
    .vs-transport {
      flex: none;
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 10px 20px 14px;
      border-top: 1px solid var(--line-soft);
      background: var(--canvas);
    }

    .vs-time { font-family: var(--font-num); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text2); white-space: nowrap; min-width: 112px; }
    .vs-time b { color: var(--text); font-weight: 600; }

    .vs-timeline {
      position: relative;
      height: 44px;
      border-radius: 8px;
      background: var(--inset);
      border: 1px solid var(--line);
      cursor: pointer;
      touch-action: none;
      user-select: none;
      overflow: hidden;
    }

    .vs-block {
      position: absolute;
      top: 4px;
      bottom: 4px;
      border-radius: 5px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      overflow: hidden;
      padding: 4px 7px;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text2);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .vs-block.on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--text); }
    .vs-block small { display: block; font-weight: 500; color: var(--text3); font-size: 10px; }
    .vs-playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4); pointer-events: none; }
    .vs-playhead::before { content: ''; position: absolute; top: -1px; left: -4px; width: 10px; height: 8px; border-radius: 0 0 3px 3px; background: #fff; }
    .vs-hover { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.35); pointer-events: none; }

    .st-controls {
      min-height: 0;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line-soft);
      padding: 6px 20px 48px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .vs-main { display: block; height: auto; }
      .vs-viewport { height: 72vh; padding: 14px; }
      .vs-bar { padding: 10px 16px; }
      .vs-transport { padding: 10px 14px 14px; grid-template-columns: auto minmax(0, 1fr) auto; }
      .vs-transport .vs-time { grid-column: 1 / -1; order: -1; }
      #loopBtn { display: none; }
      .st-controls { border-left: none; border-top: 1px solid var(--line-soft); padding: 4px 16px calc(48px + env(safe-area-inset-bottom)); }
      .st-tag { display: none; }
      .btn-label-long { display: none; }
    }

    @media (max-width: 420px) {
      .st-back span { display: none; }
      .st-top .btn { padding: 0 10px; }
    }

    /* ============================================================
       3. STUDIO CONTROLS (same as the Marketing Studio)
       ============================================================ */
    .ctl-group { border-bottom: 1px solid var(--line-soft); }
    .ctl-group:last-of-type { border-bottom: none; }

    .ctl-group > summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 0;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .ctl-group > summary::-webkit-details-marker { display: none; }
    .ctl-group > summary small { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--text3); }
    .ctl-group > summary small.warn { color: var(--warn); }
    .ctl-group > summary small.ok { color: var(--success); }

    .ctl-group > summary::after {
      content: '';
      flex: none;
      width: 7px;
      height: 7px;
      border-right: 1.6px solid var(--text2);
      border-bottom: 1.6px solid var(--text2);
      transform: translateY(-2px) rotate(45deg);
      transition: transform 140ms;
    }

    .ctl-group:not([open]) > summary::after { transform: rotate(-45deg); }

    .ctl-body { display: grid; gap: 16px; padding-bottom: 20px; }

    .field { display: grid; gap: 7px; min-width: 0; }

    .field > label, .field-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .field-count { color: var(--text3); font-variant-numeric: tabular-nums; }
    .field-count.over { color: var(--danger); }

    .field input[type="text"], .field textarea, .field select {
      width: 100%;
      min-height: 38px;
      padding: 9px 12px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--inset);
      color: var(--text);
      outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }

    .field textarea { resize: vertical; min-height: 48px; }
    .field input:hover, .field textarea:hover, .field select:hover { border-color: var(--line-strong); }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field input.mono { font-family: var(--font-num); letter-spacing: 0.06em; font-weight: 600; }

    .field select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
      cursor: pointer;
      background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4.5 6.25 8 9.75l3.5-3.5' fill='none' stroke='%23979db1' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: calc(100% - 10px) 50%;
    }

    .field-hint { font-size: 12px; color: var(--text3); line-height: 1.5; }
    .field-hint b { color: var(--text2); font-weight: 600; }
    .field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

    .seg {
      display: grid;
      grid-auto-columns: minmax(0, 1fr);
      grid-auto-flow: column;
      gap: 3px;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--inset);
    }

    .seg button {
      min-height: 30px;
      padding: 0 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .seg button:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
    .seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }

    /* Template picker */
    .tpl-list { display: grid; gap: 6px; }

    .tpl-tile {
      position: relative;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      min-height: 56px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--line-soft);
      background: var(--inset);
      color: var(--text);
      text-align: left;
      transition: border-color 140ms, background 140ms;
      min-width: 0;
    }

    .tpl-tile:hover { border-color: var(--line-strong); }
    .tpl-tile[aria-pressed="true"] { border-color: var(--accent-line); background: var(--accent-soft); }
    .tpl-tile-icon { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--raised); color: var(--text2); }
    .tpl-tile[aria-pressed="true"] .tpl-tile-icon { background: var(--accent); color: #fff; }
    .tpl-tile-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .tpl-tile-name { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tpl-tile-blurb { display: block; font-size: 12px; color: var(--text2); line-height: 1.4; margin-top: 2px; }
    .tpl-tile-len { font-family: var(--font-num); font-size: 12px; font-weight: 600; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Scene list */
    .sc-list { display: grid; gap: 6px; }
    .sc-row { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--inset); }
    .sc-row.off { opacity: 0.6; }
    .sc-head { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 8px 6px 12px; }
    .sc-num { width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; background: var(--raised); color: var(--text2); font-size: 11.5px; font-weight: 700; }
    .sc-row:not(.off) .sc-num { background: var(--accent-soft); color: var(--accent-text); }
    .sc-name { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-name small { display: block; font-size: 11.5px; font-weight: 500; color: var(--text3); }
    .sc-len { font-family: var(--font-num); font-size: 12px; color: var(--text3); font-variant-numeric: tabular-nums; }
    .sc-edit { width: 30px; height: 30px; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--text2); display: grid; place-items: center; }
    .sc-edit:hover { border-color: var(--line); color: var(--text); }
    .sc-edit svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 140ms; }
    .sc-row.open .sc-edit svg { transform: rotate(180deg); }
    .sc-body { display: none; gap: 12px; padding: 4px 12px 14px; border-top: 1px solid var(--line-soft); }
    .sc-row.open .sc-body { display: grid; padding-top: 12px; }
    .sc-total { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text2); }
    .sc-total b { font-family: var(--font-num); color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .sc-total b.warn { color: var(--warn); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      border: 1px solid var(--line-soft);
      background: var(--inset);
      color: var(--text2);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      line-height: 1.3;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip:hover { border-color: var(--accent-line); color: var(--text); }

    .toggle-list { display: grid; gap: 2px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      font-size: 14px;
      cursor: pointer;
    }

    .toggle-row small { display: block; font-size: 11.5px; color: var(--text3); margin-top: 1px; }

    .switch { position: relative; width: 38px; height: 22px; flex: 0 0 38px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); pointer-events: none; transition: background 140ms; }
    .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); transition: transform 140ms; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::before { transform: translateX(16px); }
    .switch input:focus-visible + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px rgba(99, 102, 241, 0.7); }

    .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
    .range-row output { font-size: 12px; color: var(--text2); text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .upload-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .upload-status { font-size: 12px; color: var(--text3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .ctl-note {
      font-size: 12px;
      line-height: 1.5;
      color: var(--text2);
      background: var(--inset);
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 9px 11px;
    }

    .ctl-note.warn { border-left-color: var(--warn); }

    .sheet {

    .vs-step i { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; }

  <script>
  (() => {
    'use strict';
    /* ============================================================
       1. CONFIG

    const STORAGE_KEY = 'tp_video_studio_v1';
    const SHOT_KEY_PREFIX = 'tp_video_studio_shot_';

    const W = 1080;            // video width

    // Assets load from this page's folder, so /marketing/video, /marketing/video/

    const PAGE_DIR = (() => {
      const path = location.pathname;
      if (path.endsWith('/')) return path;
      if (/\.html?$/i.test(path)) return path.replace(/[^/]*$/, '');

    })();
    const asset = (file) => PAGE_DIR + file;

    // Third-party code, pinned and hash-checked (SHA-384 of the published npm files).
    // Each one loads from this folder first, then jsDelivr.

        sha384: 'dgXqh40lPRThVN6GITp7isudOPkdn0tmG6I1Q82V90ioA/xmApk2YnPzIZJ/hOWL'

        name: 'Mediabunny AAC encoder 1.61.0',

        urls: [asset('vendor/mediabunny-aac-encoder-1.61.0.min.js'), 'https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.0/dist/bundles/mediabunny-aac-encoder.min.js'],
        sha384: 'MBbjZwlrQ2jU7YnwTG7HKBJWxFFnFQrXoCw0frcgYObRmT3/zpBMTMHjANZimKoT'
      },
      screenshot: {
        name: 'modern-screenshot 4.7.0',
        kind: 'script',
        global: 'modernScreenshot',
        urls: [asset('vendor/modern-screenshot-4.7.0.js'), asset('../assets/vendor/modern-screenshot-4.7.0.js'), 'https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js'],
        sha384: '5Ua3TI0kiMYH8QdNy+vc5IWS3MTa2DzQEm/uKFDQ+/biJctek9hiSP6moIm2PVog'
      }
    };

    // UI 2.0 type, same files as the Marketing Studio
    const FONT_CDN = {
      sans: 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.3.0/files/',
      cond: 'https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-condensed@5.3.0/files/'
    };
    const FONT_FACES = [
      { family: 'TP Plex', weight: 400, style: 'normal', file: 'ibm-plex-sans-latin-400-normal.woff2', cdn: 'sans' },
      { family: 'TP Plex', weight: 400, style: 'italic', file: 'ibm-plex-sans-latin-400-italic.woff2', cdn: 'sans' },
      { family: 'TP Plex', weight: 500, style: 'normal', file: 'ibm-plex-sans-latin-500-normal.woff2', cdn: 'sans' },
      { family: 'TP Plex', weight: 600, style: 'normal', file: 'ibm-plex-sans-latin-600-normal.woff2', cdn: 'sans' },
      { family: 'TP Plex', weight: 700, style: 'normal', file: 'ibm-plex-sans-latin-700-normal.woff2', cdn: 'sans' },
      { family: 'TP Plex Condensed', weight: 500, style: 'normal', file: 'ibm-plex-sans-condensed-latin-500-normal.woff2', cdn: 'cond' },
      { family: 'TP Plex Condensed', weight: 600, style: 'normal', file: 'ibm-plex-sans-condensed-latin-600-normal.woff2', cdn: 'cond' }
    ];
    const FONT_UI = "'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif";
    const FONT_NUM = "'TP Plex Condensed', 'IBM Plex Sans Condensed', 'TP Plex', 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif";

    // Where each app's own buttons and captions sit on a 1080 x 1920 video.

        { x: 0, y: 1440, w: 1080, h: 480, label: 'Caption, username, audio' },

        { x: 950, y: 900, w: 130, h: 620, label: 'Buttons' }
      ]
    };

    const IS_SAFARI = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|FxiOS/.test(navigator.userAgent);

    /* ---------- loaders ---------- */
    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(binary);
    }

    function injectScript(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src;
        el.onload = () => resolve();
        el.onerror = () => { el.remove(); reject(new Error('Could not run ' + src)); };
        document.head.appendChild(el);
      });
    }

    // Fetches a dependency, checks its SHA-384, then runs it from a blob URL.
    // A file that fails the check is never run.
    const depCache = {};
    function loadDep(key) {
      const dep = DEPS[key];
      if (depCache[key]) return depCache[key];
      depCache[key] = (async () => {
        if (dep.global && window[dep.global]) return window[dep.global];
        const problems = [];
        for (const url of dep.urls) {
          try {
            const res = await fetch(url, { cache: 'force-cache' });
            if (!res.ok) { problems.push(`${url}: HTTP ${res.status}`); continue; }
            const buf = await res.arrayBuffer();
            const hash = bufferToBase64(await crypto.subtle.digest('SHA-384', buf));
            if (hash !== dep.sha384) { problems.push(`${url}: file hash does not match`); continue; }
            const blobUrl = URL.createObjectURL(new Blob([buf], { type: 'text/javascript' }));
            if (dep.kind === 'module') return await import(blobUrl);
            await injectScript(blobUrl);
            if (window[dep.global]) return window[dep.global];
            problems.push(`${url}: loaded but ${dep.global} is missing`);
          } catch (err) {
            problems.push(`${url}: ${err.message || err}`);
          }
        }
        console.warn(`[Video Studio] ${dep.name} could not be loaded`, problems);
        throw new Error(`${dep.name} could not be loaded. Check your connection and try again.`);
      })().catch(err => { delete depCache[key]; throw err; });
      return depCache[key];
    }

    /* ---------- fonts (loaded once, used by the canvas and embedded into every layer) ---------- */
    let fontEmbedCss = '';
    let fontsOk = false;

    function isWoff2(buffer) {
      const b = new Uint8Array(buffer, 0, 4);
      return b.length === 4 && b[0] === 0x77 && b[1] === 0x4f && b[2] === 0x46 && b[3] === 0x32;
    }

    async function loadFace(face) {
      for (const url of [asset('assets/fonts/' + face.file), asset('../assets/fonts/' + face.file), FONT_CDN[face.cdn] + face.file]) {
        try {
          const res = await fetch(url, { cache: 'force-cache' });
          if (!res.ok) continue;
          const buffer = await res.arrayBuffer();
          if (!isWoff2(buffer)) continue;
          const ff = new FontFace(face.family, buffer, { weight: String(face.weight), style: face.style });
          await ff.load();
          document.fonts.add(ff);
          return `@font-face{font-family:'${face.family}';src:url(data:font/woff2;base64,${bufferToBase64(buffer)}) format('woff2');font-weight:${face.weight};font-style:${face.style};}`;
        } catch (err) {}
      }
      return '';
    }

    const fontReady = Promise.race([
      Promise.all(FONT_FACES.map(loadFace)).then(css => {
        fontEmbedCss = css.join('');
        fontsOk = css.every(Boolean);
        if (!fontsOk) console.warn('[Video Studio] Some IBM Plex weights could not be loaded. Using system fonts for those.');
        return fontsOk;
      }),
      new Promise(r => setTimeout(() => r(false), 9000))
    ]);
    /* ============================================================
       2-5. HELPERS, NUMBER FORMATS, EXAMPLE DATA, UI 2.0 LIBRARY
       Copied verbatim from /marketing so app screens match the
       Marketing Studio exactly. Do not edit here; edit /marketing
       and copy the block again.
       ============================================================ */
    /* ============================================================
       2. HELPERS
       ============================================================ */
    const $ = (sel, root = document) => root.querySelector(sel);

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // New lines become line breaks, [words] become brand purple.
    function rich(value) {
      return esc(value)
        .replace(/\[([^\]\n]+)\]/g, '<span class="hl">$1</span>')
        .replace(/\n/g, '<br>');
    }

    function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }
    function nextFrame() { return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }

    // Dashboard pixel value scaled by the composition's --u
    const U = (n) => `calc(var(--u) * ${n})`;

    const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>';

    // The dashboard's own icons (sidebar, buttons, section titles)
    const ICON = {
      dashboard: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
      tradeprint: '<path d="M3.37 9.09L14.27 3.04A4.28 4.28 0 0 1 18.59 10.43L16.72 11.58"/><path d="M15.89 7.05L11.8 9.38V21.5"/><path d="M7.24 11.88V17.81"/>',

      trades: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      notes: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',

      mentorship: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

    };
    const ico = (name, cls = '') => `<svg class="t-ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ''}</svg>`;

    /* ============================================================
       3. NUMBER FORMATS (the dashboard's own)
       formatPnl (+$1234.00, no commas) for trades and dashboard,
       formatPnlShort (+$696) for calendar cells, propMoney ($55,211)
       for the Prop Firm Command Center.
       ============================================================ */
    const FMT = {
      num(value, fallback = 0) {
        const n = parseFloat(String(value ?? '').replace(/[^0-9.\-]/g, ''));
        return Number.isFinite(n) ? n : fallback;
      },
      pnl(n) { n = Number(n) || 0; return n >= 0 ? `+$${n.toFixed(2)}` : `-$${Math.abs(n).toFixed(2)}`; },
      pnlShort(n) { n = Number(n) || 0; return n >= 0 ? `+$${Math.round(n)}` : `-$${Math.round(Math.abs(n))}`; },
      money(n, dec = 0) { return `$${Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec })}`; },
      signed(n, dec = 2) { n = Number(n) || 0; return `${n < 0 ? '-' : '+'}${FMT.money(n, dec)}`; },
      tone(n) { n = Number(n) || 0; return n > 0 ? 'g' : n < 0 ? 'r' : ''; },
      result(n) { n = Number(n) || 0; return n > 0 ? 'win' : n < 0 ? 'loss' : 'breakeven'; },
      rr(v) { const s = String(v ?? '').trim(); if (!s) return ''; return /r$/i.test(s) ? s.replace(/r$/i, 'R') : `${s}R`; },
      axis(v) {
        if (Math.abs(v) < 0.005) return '$0';
        const a = Math.abs(v);
        const sign = v < 0 ? '-' : '+';
        if (a >= 1e6) return `${sign}$${Number((a / 1e6).toFixed(a >= 1e7 ? 0 : 1))}m`;
        if (a >= 1e3) return `${sign}$${Number((a / 1e3).toFixed(a >= 1e4 ? 0 : 1))}k`;
        return `${sign}$${Math.round(a)}`;
      }
    };

    // Text helpers for the data fields: one item per line, columns split by "|".
    function rows(text) {
      return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => l.split('|').map(c => c.trim()));
    }
    function list(text) {
      return String(text || '').split(/[\n,]+/).map(v => v.trim()).filter(Boolean);
    }
    function lines(text) {
      return String(text || '').split('\n').map(v => v.trim()).filter(Boolean);
    }
    function pct(value) { return clamp(FMT.num(value), 0, 100); }

    // Small, stable variation for derived numbers (confluence counts and so on)
    function seeded(i, mod, base = 0) { return base + ((i * 7 + 3) % mod); }

    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function monthInfo(value) {
      const m = /^(\d{4})-(\d{1,2})$/.exec(String(value || '').trim());
      const now = new Date();
      const y = m ? +m[1] : now.getFullYear();
      const mo = m ? clamp(+m[2], 1, 12) - 1 : now.getMonth();
      return { y, m: mo, label: `${MONTHS[mo]} ${y}`, days: new Date(y, mo + 1, 0).getDate(), first: new Date(y, mo, 1).getDay() };
    }

    function longDate(y, m, d) { return `${MONTHS[m]} ${d}, ${y}`; }
    function shortDate(y, m, d) { return `${MONTHS[m].slice(0, 3)} ${d}, ${y}`; }
    function mdy(d) { return `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}, ${d.getFullYear()}`; }
    function md(d) { return `${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`; }

    // Weekdays of a month, in order. Used to build default data.
    function tradingDays(y, m) {
      const out = [];
      const n = new Date(y, m + 1, 0).getDate();
      for (let d = 1; d <= n; d++) { const wd = new Date(y, m, d).getDay(); if (wd > 0 && wd < 6) out.push(d); }
      return out;
    }

    function prevMonthKey() {
      const now = new Date();
      const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    /* ============================================================
       4. EXAMPLE DATA (illustrative only, built once per load)
       ============================================================ */
    const TICK_SPECS = {
      MNQ: { tickSize: 0.25, tickValue: 0.5 },
      NQ: { tickSize: 0.25, tickValue: 5 },
      MES: { tickSize: 0.25, tickValue: 1.25 },
      ES: { tickSize: 0.25, tickValue: 12.5 },
      MGC: { tickSize: 0.1, tickValue: 1 },
      GC: { tickSize: 0.1, tickValue: 10 }
    };
    const TICKERS = Object.keys(TICK_SPECS).map(k => ({ id: k, name: k }));

    // Example trade-by-trade P&L. The equity curve is resampled to the trade
    // count and scaled so it always ends at the Total PNL shown on the card.
    const EQUITY_SHAPE = [310, -220, 610, 340, 610, 180, -300, -150, 260, -300, 340, 520, 220, -150, 340, -180, 390, 260, 180, 260, 260, 390, 180, 260, -340, -200, -150, -220, 560, -220, 220, 450, -220, 610, 180, -300, 260, 220, 610, -340, -340, 560, 420, 610, 480, 750, 310, 390, 560, 690, 560, 310, -180, 610, 520, 340, 610, 480, 180, 450, 220, -260, 260];

    const SAMPLE = (() => {
      const today = new Date();
      const monthKey = prevMonthKey();
      const mi = monthInfo(monthKey);
      const days = tradingDays(mi.y, mi.m);
      const pattern = [[412, 2, 2], [696, 2, 2], [-180, 1, 0], [525, 3, 2], [310, 2, 1], [0, 0, 0], [845, 2, 2], [-260, 2, 0], [390, 2, 1], [240, 1, 1], [615, 2, 2], [-150, 2, 1], [470, 2, 2], [780, 3, 3], [0, 0, 0], [205, 2, 1], [-320, 2, 0], [560, 2, 2], [330, 2, 1], [690, 2, 2], [145, 1, 1], [-210, 2, 0], [505, 2, 2]];
      const calLines = days.map((d, i) => {
        const p = pattern[i % pattern.length];
        return p[1] ? `${p[0]}, ${p[1]}, ${p[2]}` : '-';
      });

      // Most recent weekday before today, for the journal day
      const back = new Date(today);
      do { back.setDate(back.getDate() - 1); } while (back.getDay() === 0 || back.getDay() === 6);

      // ISO week number, for "Week 41 review"
      const t = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
      t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
      const week = Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);

      // Last month of daily P&L for the PNL Trend chart, and its tick labels
      const bars = [196, 400, -470, 696, 900, 0, 225, -400, -400, 836, 270, 750, 412, 0, 525, 310, 845, -260, 390, 240, 615, 470];
      const start = new Date(today); start.setDate(start.getDate() - 29);

      // Recent weekdays, newest first
      const recent = [];
      const r = new Date(today);
      while (recent.length < 8) { if (r.getDay() > 0 && r.getDay() < 6) recent.push(new Date(r)); r.setDate(r.getDate() - 1); }

      // Equity curve date range (about 3 months of trading)
      const eqStart = new Date(today); eqStart.setDate(eqStart.getDate() - 96);
      while (eqStart.getDay() === 0 || eqStart.getDay() === 6) eqStart.setDate(eqStart.getDate() + 1);

      // Next Monday to Friday, for upcoming economic events
      const mon = new Date(today);
      mon.setDate(mon.getDate() + ((8 - mon.getDay()) % 7 || 7));
      const wd = n => { const d = new Date(mon); d.setDate(d.getDate() + n); return d; };
      const fri = wd(4);

      // Most recent first Friday (jobs report day)
      let ff = new Date(today.getFullYear(), today.getMonth(), 1);
      while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1);
      if (ff > today) { ff = new Date(today.getFullYear(), today.getMonth() - 1, 1); while (ff.getDay() !== 5) ff.setDate(ff.getDate() + 1); }
      const prevMonth = new Date(ff.getFullYear(), ff.getMonth() - 1, 1);

      return {
        monthKey, mi, calLines: calLines.join('\n'), bars: bars.join(', '),
        barStart: `${start.getMonth() + 1}/${start.getDate()}`, barEnd: `${today.getMonth() + 1}/${today.getDate()}`,
        barDate: d => { const x = new Date(start); x.setDate(x.getDate() + d); return `${x.getMonth() + 1}/${x.getDate()}`; },
        journalDate: longDate(back.getFullYear(), back.getMonth(), back.getDate()),
        week, recent: recent.map(md), recentFull: recent.map(mdy),
        eqFrom: mdy(eqStart), eqTo: mdy(recent[0]),
        todayLabel: mdy(today),
        econWeekTitle: `${mdy(mon)} to ${mdy(fri)}`,
        econDays: [0, 1, 2, 3, 4].map(n => { const d = wd(n); return `${WEEKDAYS[d.getDay()]}, ${md(d)}`; }),
        nfpTitle: `${WEEKDAYS[ff.getDay()]}, ${longDate(ff.getFullYear(), ff.getMonth(), ff.getDate())}`,
        nfpReleased: `${mdy(ff)} at 8:30 AM ET`,
        nfpPeriod: `${MONTHS[prevMonth.getMonth()]} ${prevMonth.getFullYear()}`,
        purchased: md(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 24))
      };
    })();

    // Parsers shared by the templates. Formats are documented in each field hint.
    function parseFeedTrades(text) {
      return rows(text).map((c, i) => ({
        strategy: c[0] || 'Strategy', asset: c[1] || '', pnl: FMT.num(c[2]), rr: c[3] || '', time: c[4] || '',
        note: c[5] || '', broke: /^(x|yes|no rules|broke)/i.test(c[6] || ''), conf: seeded(i, 3, 2)
      }));
    }

    function parseLogTrades(text) {
      return rows(text).map((c, i) => ({
        date: c[0] || '', strategy: c[1] || '', asset: c[2] || '', pnl: FMT.num(c[3]), rr: c[4] || '', time: c[5] || '',
        dir: c[6] || 'Long', account: c[7] || 'Main', broke: /^(x|yes|broke)/i.test(c[8] || ''), conf: seeded(i, 3, 2)
      }));
    }

    // Calendar days. Each line is one weekday of the month, in order: PNL, trades, wins
    // ("-" = no trades that day). A line can also start with the date: day, PNL, trades, wins.
    function parseCalDays(mi, text, notes, news) {
      const days = {};
      const weekdays = tradingDays(mi.y, mi.m);
      let next = 0;
      String(text || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
        if (/^([-–—]+|off)$/i.test(line)) { next++; return; }
        const c = line.split(/[,|]/).map(v => v.trim()).filter(v => v !== '');
        let d, vals;
        if (c.length >= 4) { d = Math.round(FMT.num(c[0])); vals = c.slice(1); next = weekdays.indexOf(d) + 1 || next; }
        else { d = weekdays[next++]; vals = c; }
        const trades = Math.max(0, Math.round(FMT.num(vals[1], 1)));
        if (!d || d > mi.days || !trades) return;
        days[d] = { pnl: FMT.num(vals[0]), trades, wins: clamp(Math.round(FMT.num(vals[2], 0)), 0, trades) };
      });
      list(notes).forEach(v => { const d = Math.round(FMT.num(v)); if (d) (days[d] ||= { trades: 0, pnl: 0, wins: 0 }).note = true; });
      list(news).forEach(v => { const d = Math.round(FMT.num(v)); if (d) { const o = (days[d] ||= { trades: 0, pnl: 0, wins: 0 }); o.news = (o.news || 0) + 1; } });
      return days;
    }

    function monthStats(days) {
      let pnl = 0, trades = 0, wins = 0;
      Object.values(days).forEach(d => { if (d.trades) { pnl += d.pnl; trades += d.trades; wins += d.wins; } });
      return { pnl, trades, wr: trades ? Math.round(wins / trades * 100) : 0 };
    }

    function calcResult(ticker, contracts, a, b, c, mode = 'price') {
      const spec = TICK_SPECS[ticker] || TICK_SPECS.MNQ;
      const n = Math.max(0, FMT.num(contracts));
      let slTicks, tpTicks;
      if (mode === 'points') { slTicks = Math.abs(FMT.num(a)) / spec.tickSize; tpTicks = Math.abs(FMT.num(b)) / spec.tickSize; }
      else { slTicks = Math.abs(FMT.num(a) - FMT.num(b)) / spec.tickSize; tpTicks = Math.abs(FMT.num(c) - FMT.num(a)) / spec.tickSize; }
      const risk = slTicks * spec.tickValue * n;
      const profit = tpTicks * spec.tickValue * n;
      return { risk, profit, rr: risk > 0 ? profit / risk : 0, slTicks, tpTicks, contracts: n, spec, ticker: TICK_SPECS[ticker] ? ticker : 'MNQ' };
    }

    // Running total trade by trade, resampled to `count` trades and scaled to end at `total`.
    function equityPoints(count, total) {
      const n = clamp(Math.round(count) || EQUITY_SHAPE.length, 2, 400);
      const base = [0];
      EQUITY_SHAPE.forEach(v => base.push(base[base.length - 1] + v));
      const out = [0];
      for (let i = 1; i <= n; i++) {
        const pos = i / n * (base.length - 1);
        const lo = Math.floor(pos), hi = Math.min(base.length - 1, lo + 1);
        out.push(base[lo] + (base[hi] - base[lo]) * (pos - lo));
      }
      const end = out[out.length - 1];
      const k = end ? total / end : 0;
      return out.map(v => v * k);
    }

    function equityStats(values) {
      let peak = 0, maxDd = 0;
      values.forEach(v => { if (v > peak) peak = v; if (peak - v > maxDd) maxDd = peak - v; });
      const last = values[values.length - 1] || 0;
      return { peak, maxDd, fromPeak: last - peak };
    }

    const EXAMPLE_NOTE = 'Example data for illustration.';
    const NO_SUPPORT_HINT = ' Supporting text is hidden here so the product gets more room.';

    /* ============================================================
       5. TRADEPRINT UI 2.0 LIBRARY
       Markup mirrors dashboard.html (UI 2.0). Keep it truthful: only
       show things the product really does. All sizes are dashboard
       pixels scaled by --u through the CSS in section 7.
       ============================================================ */
    let chartSeq = 0;

    function niceStep(raw) {
      if (!(raw > 0)) return 1;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / mag;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    }

    const MENTOR_PERMISSIONS = [
      { key: 'canViewTrades', label: 'View Trades', hint: 'Your logged trades and their charts', on: true },
      { key: 'canViewJournals', label: 'View Journals', hint: 'Your calendar day notes', on: true },
      { key: 'canComment', label: 'Leave Feedback', hint: 'Comment on your trades and days', on: true },
      { key: 'canViewPnL', label: 'See PnL', hint: 'Dollar P&L on your trades', on: false },
      { key: 'canViewAccountNames', label: 'See Account Names', hint: 'Your broker account names', on: false }
    ];

    const TP = {
      wordmark() { return 'trade<span class="p">print</span>'; },

      btn(label, { icon = '', cls = '' } = {}) {
        return `<span class="t-btn ${cls}">${icon ? ico(icon) : ''}${esc(label)}</span>`;
      },

      panel(inner, { title = '', sub = '', right = '', cls = '', style = '' } = {}) {
        const head = title
          ? `<div class="t-panel-head"><div style="min-width:0"><div class="t-panel-title">${esc(title)}</div>${sub ? `<div class="t-panel-sub">${esc(sub)}</div>` : ''}</div>${right}</div>`
          : '';
        return `<div class="t-panel ${cls}"${style ? ` style="${style}"` : ''}>${head}${inner}</div>`;
      },

      stat(label, value, { tone = '', primary = false, foot = '' } = {}) {
        return `<div class="t-stat${primary ? ' primary' : ''}"><div class="t-stat-label">${esc(label)}</div><div class="t-stat-value ${tone}">${value}</div>${foot ? `<div class="t-stat-foot">${esc(foot)}</div>` : ''}</div>`;
      },

      stats(items, { cols = items.length, cls = '', style = '' } = {}) {
        return `<div class="t-stats ${cls}" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr));${style}">${items.join('')}</div>`;
      },

      // Equity chart, same drawing rules as the dashboard's drawLineChart().
      // values[0] is the 0 baseline; values[i] is the running total after point i.
      equity(values, { w = 560, h = 210, padL = 52, xLabels = [], dot = null } = {}) {
        if (!values || values.length < 2) values = [0, 0];
        const id = `tpeq${++chartSeq}`;
        const padR = 8, padT = 8, padB = xLabels.length ? 22 : 6;
        const pw = Math.max(10, w - padL - padR), ph = Math.max(10, h - padT - padB);
        let min = 0, max = 0;
        values.forEach(v => { if (v < min) min = v; if (v > max) max = v; });
        if (max === min) { max += 1; min -= 1; }
        const step = niceStep((max - min) / 4);
        const lo = Math.floor(min / step) * step;
        const hi = Math.ceil(max / step) * step;
        const n = values.length - 1;
        const x = i => padL + (i / n) * pw;
        const y = v => padT + ((hi - v) / (hi - lo)) * ph;
        const y0 = y(0);
        let grid = '', labels = '';
        for (let v = lo; v <= hi + step / 2; v += step) {
          const yy = Math.round(y(v)) + 0.5;
          if (Math.abs(v) > step / 1000) grid += `<line x1="${padL}" x2="${w - padR}" y1="${yy}" y2="${yy}"/>`;
          labels += `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" class="eq-axis">${esc(FMT.axis(Math.abs(v) < step / 1000 ? 0 : v))}</text>`;
        }
        let line = '';
        for (let i = 0; i <= n; i++) line += `${i ? 'L' : 'M'}${x(i).toFixed(2)} ${y(values[i]).toFixed(2)}`;
        const area = `${line}L${x(n).toFixed(2)} ${y0.toFixed(2)}L${x(0).toFixed(2)} ${y0.toFixed(2)}Z`;
        const xl = xLabels.map(l => `<text x="${x(l.i).toFixed(2)}" y="${h - 4}" text-anchor="${l.anchor || 'middle'}" class="eq-axis">${esc(l.text)}</text>`).join('');
        const dotHtml = dot !== null && dot >= 0 && dot <= n
          ? `<line x1="${x(dot).toFixed(2)}" x2="${x(dot).toFixed(2)}" y1="${padT}" y2="${padT + ph}" class="eq-cursor"/><circle cx="${x(dot).toFixed(2)}" cy="${y(values[dot]).toFixed(2)}" r="4" class="eq-dot"/>`
          : '';
        return `<div class="t-chart"><svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
          <defs><clipPath id="${id}p"><rect x="0" y="0" width="${w}" height="${Math.max(0, y0).toFixed(2)}"/></clipPath><clipPath id="${id}n"><rect x="0" y="${y0.toFixed(2)}" width="${w}" height="${Math.max(0, h - y0).toFixed(2)}"/></clipPath></defs>
          <g class="eq-grid">${grid}</g>${labels}
          <path d="${area}" class="eq-area-pos" clip-path="url(#${id}p)"/><path d="${area}" class="eq-area-neg" clip-path="url(#${id}n)"/>
          <line x1="${padL}" x2="${w - padR}" y1="${Math.round(y0) + 0.5}" y2="${Math.round(y0) + 0.5}" class="eq-zero"/>
          <path d="${line}" class="eq-line"/>${xl}${dotHtml}
        </svg></div>`;
      },

      // Dashboard hero: metric strip (Total PNL leads) + equity curve
      dashHero({ pnl, trades, wr, rr, count, from = SAMPLE.eqFrom, to = SAMPLE.eqTo, mobile = false, compact = false, stack = false, duo = false, chartW = 560, chartH = 210, minis = true, readout = true, cls = '' }) {
        const values = equityPoints(count || trades, pnl);
        const st = equityStats(values);
        const n = values.length - 1;
        const strip = duo
          ? `<div class="t-stats">${TP.stat('Total PNL', FMT.pnl(pnl), { tone: FMT.tone(pnl), primary: true })}${TP.stat('Win Rate', `${esc(wr)}%`)}</div>`
          : `<div class="t-stats">
          ${TP.stat('Total PNL', FMT.pnl(pnl), { tone: FMT.tone(pnl), primary: true })}
          ${TP.stat('Total Trades', esc(trades))}
          ${TP.stat('Win Rate', `${esc(wr)}%`)}
          ${TP.stat('Avg R:R', esc(rr))}
        </div>`;
        const miniHtml = minis ? `<div class="t-minis">
            <div class="t-mini"><span>Peak</span><b class="${FMT.tone(st.peak)}">${FMT.pnl(st.peak)}</b></div>
            <div class="t-mini"><span>Max drawdown</span><b class="${st.maxDd > 0.004 ? 'r' : ''}">${st.maxDd > 0.004 ? FMT.pnl(-st.maxDd) : '$0.00'}</b></div>
            <div class="t-mini"><span>From peak</span><b class="${Math.abs(st.fromPeak) < 0.005 ? '' : 'r'}">${Math.abs(st.fromPeak) < 0.005 ? 'At peak' : FMT.pnl(st.fromPeak)}</b></div>
          </div>` : '';
        return `<div class="t-hero${mobile ? ' mobile' : ''}${compact ? ' compact' : ''}${stack ? ' stack' : ''}${duo ? ' duo' : ''} ${cls}">
          ${strip}
          <div class="t-equity">
            <div class="t-equity-head">
              <div style="min-width:0"><div class="t-panel-title">Equity curve</div>${readout ? `<div class="t-equity-readout">${n} trade${n === 1 ? '' : 's'} from ${esc(from)} to ${esc(to)}</div>` : ''}</div>
              ${miniHtml}
            </div>
            ${TP.equity(values, { w: chartW, h: chartH, padL: mobile ? 46 : 52, xLabels: [{ i: 0, text: from, anchor: 'start' }, { i: n, text: to, anchor: 'end' }] })}
          </div>
        </div>`;
      },

      // PNL Trend panel (.dash-trend)
      pnlTrend({ label = 'Last month', values = [], select = 'Last month', startLabel = SAMPLE.barStart, endLabel = SAMPLE.barEnd, barsH = 190, cls = '' } = {}) {
        const total = Math.round(values.reduce((a, b) => a + b, 0) * 100) / 100;
        const maxAbs = Math.max(1, ...values.map(v => Math.abs(v)));
        const every = Math.max(1, Math.ceil(values.length / 6));
        const scale = (barsH - 32) / 2 - 1;
        const bars = values.map((v, i) => {
          const hgt = v === 0 ? 3 : Math.max(8, Math.round(Math.abs(v) / maxAbs * scale));
          const c = v > 0 ? 'g' : v < 0 ? 'r' : 'f';
          return `<div class="t-bar-wrap"><div class="t-bar ${c}" style="${v === 0 ? '' : `height:${U(hgt)}`}"></div>${i % every === 0 ? `<div class="t-bar-day">${esc(SAMPLE.barDate(Math.round(i * 29 / Math.max(1, values.length - 1))))}</div>` : ''}</div>`;
        }).join('');
        return TP.panel(`
          <div class="t-chart-sum"><div class="t-chart-date">${esc(label)}</div><div class="t-chart-pnl ${FMT.tone(total)}">${FMT.pnl(total)}</div></div>
          <div class="t-bars" style="--bars-h:${U(barsH)}">${bars}</div>
          <div class="t-bar-labels"><span>${esc(startLabel)}</span><span>${esc(endLabel)}</span></div>`,
          { title: 'PNL Trend', right: `<div class="t-select">${esc(select)}</div>`, cls });
      },

      focus(items) {
        return TP.panel(items.map(it => `<div class="t-focus-item"><div class="t-focus-label">${esc(it.label)}</div><div class="t-focus-value ${FMT.tone(it.pnl)}">${it.trades ? FMT.pnl(it.pnl) : '—'}</div><div class="t-focus-sub">${it.trades ? `${it.trades} trade${it.trades === 1 ? '' : 's'} · ${it.wr}% WR` : esc(it.empty || 'No trades')}</div></div>`).join(''), { title: 'Current Focus' });
      },

      ruleDiscipline(rate, trades, { cls = '' } = {}) {
        const followed = Math.round(rate / 100 * trades);
        return TP.panel(`
          <div class="t-rule-value">${Math.round(rate)}%</div>
          <div class="t-meter"><i style="width:${rate}%"></i></div>
          <div class="t-sub">${followed} of ${trades} trades followed rules</div>`, { title: 'Rule Discipline', cls });
      },

      listItem(title, sub, value, tone) {
        return `<div class="t-list-item"><div class="t-list-main"><div class="t-list-title">${title}</div><div class="t-list-sub">${esc(sub)}</div></div><div class="t-list-value ${tone}">${value}</div></div>`;
      },

      // Sidebar navigation, exactly as UI 2.0 lists it
      sidebar({ active = 'dashboard', collapsed = false, bottom = true, settings = true } = {}) {
        const main = [['dashboard', 'Dashboard'], ['tradeprint', 'Tradeprint'], ['strategies', 'Strategies'], ['calendar', 'Calendar'], ['trades', 'Trades'], ['notes', 'Notes'], ['calculator', 'Calculator'], ['mentorship', 'Mentorship']];
        const item = (k, l, cls = '') => `<div class="t-nav-item ${cls}${k === active ? ' active' : ''}">${ico(k)}<span class="t-nav-label">${l}</span></div>`;
        return `<div class="t-side${collapsed ? ' collapsed' : ''}">
          <div class="t-side-head">${ico('menu')}<span class="t-logo">${TP.wordmark()}</span></div>
          <div class="t-nav">${main.map(([k, l]) => item(k, l)).join('')}</div>
          ${bottom ? `<div class="t-side-bottom">${item('prop', 'Prop Firm Center', 'feature')}${item('prints', 'Prints', 'feature')}${settings ? item('settings', 'Settings') : ''}</div>` : ''}
        </div>`;
      },

      window(side, main, { cls = '', style = '', mainStyle = '' } = {}) {
        return `<div class="t-window ${cls}"${style ? ` style="${style}"` : ''}>${side}<div class="t-window-main"${mainStyle ? ` style="${mainStyle}"` : ''}>${main}</div></div>`;
      },

      pageHead(title, sub, actions = '') {
        return `<div class="t-page-head"><div style="min-width:0"><h4>${esc(title)}</h4>${sub ? `<p>${esc(sub)}</p>` : ''}</div>${actions}</div>`;
      },

      mobileBar() { return `<div class="t-mobilebar"><span class="t-burger">${ico('menu')}</span><span class="t-logo">${TP.wordmark()}</span></div>`; },

      // Calendar header bar (.cal-header)
      calHead(mi, stats, { nav = true, statsOn = true } = {}) {
        return `<div class="t-calhead">
          <div class="t-calnav">${nav ? `<span class="t-calbtn">${ico('left')}</span>` : ''}<span class="t-calmonth">${esc(mi.label)}</span>${nav ? `<span class="t-calbtn">${ico('right')}</span><span class="t-today">Today</span>` : ''}</div>
          ${statsOn ? `<div class="t-calstats">
            <div class="t-calstat"><div class="t-calstat-label">Monthly PNL</div><div class="t-calstat-value ${FMT.tone(stats.pnl)}">${FMT.pnl(stats.pnl)}</div></div>
            <div class="t-calstat"><div class="t-calstat-label">Trades</div><div class="t-calstat-value">${stats.trades}</div></div>
            <div class="t-calstat"><div class="t-calstat-label">Win Rate</div><div class="t-calstat-value">${stats.wr}%</div></div>
          </div>` : ''}
        </div>`;
      },

      // Calendar board. days: { [day]: { pnl, trades, wins, note, news } }. Heat tint from the month's largest day.
      calendar(mi, days, { from = 0, weeks = 6, weekCol = true, weekdaysOnly = false, sel = 0, today = 0, wk = 0, row = 0, newsOnly = false } = {}) {
        const start = new Date(mi.y, mi.m, 1 - mi.first);
        const totalWeeks = Math.ceil((mi.first + mi.days) / 7);
        let maxAbs = 0;
        Object.values(days).forEach(d => { if (d.trades && Math.abs(d.pnl) > maxAbs) maxAbs = Math.abs(d.pnl); });
        const weekRows = [];
        for (let w = 0; w < totalWeeks; w++) {
          const rowCells = [];
          let wPnl = 0, wTrades = 0, wWins = 0;
          for (let i = 0; i < 7; i++) {
            const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + i);
            const inMonth = date.getMonth() === mi.m;
            const d = date.getDate();
            const data = inMonth ? days[d] : null;
            if (data && data.trades) { wPnl += data.pnl; wTrades += data.trades; wWins += data.wins; }
            if (weekdaysOnly && (i === 0 || i === 6)) continue;
            const has = data && data.trades;
            const heat = has && maxAbs ? (Math.abs(data.pnl) / maxAbs).toFixed(3) : 0;
            const cls = ['t-cell', inMonth ? '' : 'other', has && data.pnl > 0 ? 'pos' : '', has && data.pnl < 0 ? 'neg' : '', inMonth && d === today ? 'today' : '', inMonth && d === sel ? 'sel' : ''].filter(Boolean).join(' ');
            let inner = `<span class="t-cday-num">${d}</span>`;
            if (has) {
              const wr = Math.round(data.wins / data.trades * 100);
              inner += `<div class="t-cday-pnl ${FMT.tone(data.pnl)}">${FMT.pnlShort(data.pnl)}</div><div class="t-cday-meta">${data.trades} trade${data.trades === 1 ? '' : 's'}</div><div class="t-cday-meta">${wr}% WR</div>`;
            }
            if (data && data.note) inner += '<span class="t-cnote"></span>';
            if (data && data.news) inner += `<span class="t-cnews">${ico('news')}<span>${data.news}</span></span>`;
            rowCells.push(`<div class="${cls}" style="--heat:${heat}">${inner}</div>`);
          }
          if (weekCol) {
            rowCells.push(wTrades
              ? `<div class="t-week"><div class="t-week-pnl ${FMT.tone(wPnl)}">${FMT.pnlShort(wPnl)}</div><div class="t-week-meta"><span>${wTrades} trade${wTrades === 1 ? '' : 's'}</span><span>${Math.round(wWins / wTrades * 100)}% WR</span></div></div>`
              : '<div class="t-week empty"></div>');
          }
          weekRows.push(rowCells.join(''));
        }
        const heads = (weekdaysOnly ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'])
          .map(h => `<div>${h}</div>`).join('') + (weekCol ? '<div class="wk">Week</div>' : '');
        const style = [wk ? `--wk:${U(wk)}` : '', row ? `--row:${U(row)}` : ''].filter(Boolean).join(';');
        return `<div class="t-cal${weekCol ? '' : ' no-week'}${weekdaysOnly ? ' weekdays' : ''}" style="${style}">
          <div class="t-cal-heads">${heads}</div>
          <div class="t-cal-grid">${weekRows.slice(from, from + weeks).join('')}</div>
        </div>`;
      },

      // Day / week modal pieces
      modalHead(title, { news = '', share = true } = {}) {
        return `<div class="t-modal-head"><div class="t-modal-date">${esc(title)}</div><div class="t-modal-acts">${news}${share ? `<span class="t-iconbtn">${ico('share')}</span>` : ''}<span class="t-close">×</span></div></div>`;
      },

      dayStats(trades) {
        const pnl = trades.reduce((a, t) => a + t.pnl, 0);
        const wins = trades.filter(t => t.pnl > 0).length;
        const losses = trades.filter(t => t.pnl < 0).length;
        const wr = trades.length ? Math.round(wins / trades.length * 100) : 0;
        const stat = (l, v, c = '') => `<div class="t-mstat"><div class="t-mstat-label">${l}</div><div class="t-mstat-val ${c}">${v}</div></div>`;
        return `<div class="t-mstats" style="--n:5">${stat('Trades', trades.length)}${stat('PNL', FMT.pnl(pnl), FMT.tone(pnl))}${stat('Win Rate', `${wr}%`)}${stat('Wins', wins, 'g')}${stat('Losses', losses, 'r')}</div>`;
      },

      // .trade-feed-item. t = { strategy, asset, pnl, rr, time, note, broke, conf }
      feedItem(t, { actions = true, note = true, flag = false } = {}) {
        const result = FMT.result(t.pnl);
        const resColor = result === 'win' ? 'g' : result === 'loss' ? 'r' : 'm';
        const label = result.charAt(0).toUpperCase() + result.slice(1);
        const detail = [t.conf ? `${t.conf} confluences` : 'No confluences', t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).map(esc).join(' · ');
        return `<div class="t-feed-item ${result}">
          <div class="t-feed-left">
            <div class="t-feed-strat">${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — <span class="${resColor}">${label}</span></div>
            <div class="t-feed-detail">${detail}${t.broke ? ' · <span class="r">Rules broken</span>' : ''}${flag ? ' <span class="t-flag">⚠</span>' : ''}</div>
            ${note && t.note ? `<div class="t-feed-note">"${esc(t.note)}"</div>` : ''}
          </div>
          <div class="t-feed-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>
          ${actions ? `<div class="t-feed-acts"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div>` : ''}
        </div>`;
      },

      ruleBanner(items) {
        return `<div class="t-rbanner"><div class="t-rbanner-title"><span>⚠ ${items.length} rule violation${items.length === 1 ? '' : 's'}</span><span>View breakdown ›</span></div>${items.map(i => `<div class="t-rbanner-item">${esc(i)}</div>`).join('')}</div>`;
      },

      econStrip(events) {
        return `<div class="t-estrip">${ico('news')}<span><b>News</b><span class="sep">·</span>${events.length} event${events.length === 1 ? '' : 's'}</span>${events.length <= 3 ? `<span class="t-estrip-events">${events.map(e => `<em>${esc(e[0])}</em>${esc(e[1])}`).join('<span class="sep">·</span>')}</span>` : ''}<span class="chev">›</span></div>`;
      },

      noteTools({ saved = true } = {}) {
        return `<div class="t-ntools"><span class="t-tool"><b>B</b></span><span class="t-tool"><i>I</i></span><span class="t-tool"><u>U</u></span><span class="t-tool-div"></span><span class="t-tool">${ico('divider')}<small>Divider</small></span><span class="t-tool">${ico('image')}<small>Image</small></span>${saved ? '<span class="t-saved">Saved</span>' : ''}</div>`;
      },

      noteHtml(text) {
        return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
          if (l === '---') return '<hr>';
          const m = /^([^:]{2,24}):\s(.+)$/.exec(l);
          return m ? `<p><b>${esc(m[1])}:</b> ${esc(m[2])}</p>` : `<p>${esc(l)}</p>`;
        }).join('');
      },

      logBtn() { return `<div class="t-logbtn">${ico('plus')}Log a trade</div>`; },

      // Notes page "Insert Trade" card (.note-trade-card)
      noteTradeCard(t, date) {
        const result = FMT.result(t.pnl);
        const detail = [date, t.conf ? `${t.conf} confluences` : 'No confluences', t.rr ? FMT.rr(t.rr) : '', t.time || ''].filter(Boolean).join(' · ');
        return `<div class="t-ntc"><div class="t-ntc-title"><span>${esc(t.strategy)}${t.asset ? ` · ${esc(t.asset)}` : ''} — ${result === 'breakeven' ? 'be' : result}</span><b class="${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</b></div><div class="t-ntc-detail">${esc(detail)}</div></div>`;
      },

      // Trades page
      toolbar(count) {
        return `<div class="t-toolbar"><div class="t-filters">
          <div class="t-search">${ico('search')}Search trades...</div>
          <div class="t-fsel">All Strategies</div><div class="t-fsel">All Results</div><div class="t-fsel">All Trade Types</div>
          <div class="t-fsel">All Directions</div><div class="t-fsel">Newest First</div>
          <span class="t-btn sec">Clear</span>
          <span class="t-tmeta"><b>${count}</b> trades</span>
        </div></div>`;
      },

      // .trades-table. cols: subset of the app's columns, in the app's order
      tradesTable(trades, cols) {
        const dash = '<span style="color:var(--text3)">—</span>';
        const defs = {
          date: ['Date', 96, t => `<div class="t-tc muted date">${esc(t.date)}</div>`],
          strategy: ['Strategy', 135, t => `<div class="t-tc strong">${esc(t.strategy)}</div>`],
          account: ['Account', 105, t => `<div class="t-tc muted">${esc(t.account || 'Main')}</div>`],
          result: ['Result', 66, t => { const r = FMT.result(t.pnl); return `<div class="t-tc"><span class="t-badge ${r}">${r === 'breakeven' ? 'be' : r}</span></div>`; }],
          pnl: ['PNL', 92, t => `<div class="t-tc pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div>`],
          rr: ['R:R', 58, t => `<div class="t-tc muted">${t.rr ? esc(FMT.rr(t.rr)) : dash}</div>`],
          type: ['Type', 86, () => '<div class="t-tc muted">Futures</div>'],
          direction: ['Direction', 78, t => `<div class="t-tc muted">${esc(t.dir || 'Long')}</div>`],
          time: ['Time', 82, t => `<div class="t-tc muted">${t.time ? esc(t.time) : dash}</div>`],
          asset: ['Asset', 72, t => `<div class="t-tc muted">${esc(t.asset)}</div>`],
          confluences: ['Confluences', 112, t => `<div class="t-tc muted">${t.conf ? `${t.conf} confluences` : dash}</div>`],
          rules: ['Rules', 52, t => `<div class="t-tc center">${t.broke ? `<span class="t-ricon no">${ico('x')}</span>` : `<span class="t-ricon yes">${ico('check')}</span>`}</div>`],
          notes: ['Notes', 120, t => `<div class="t-tc muted">${t.note ? esc(t.note) : dash}</div>`],
          actions: ['', 100, () => `<div class="t-tc"><div class="t-feed-acts" style="justify-content:flex-end"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div></div>`]
        };
        const use = cols.map(c => defs[c]).filter(Boolean);
        const tpl = use.map(d => U(d[1])).join(' ');
        return `<div class="t-table" style="--cols:${tpl}">
          <div class="t-tr head">${use.map(d => `<div class="t-tc"${d[0] === 'Rules' ? ' style="text-align:center"' : ''}>${d[0]}</div>`).join('')}</div>
          ${trades.map(t => `<div class="t-tr">${use.map(d => d[2](t)).join('')}</div>`).join('')}
        </div>`;
      },

      mobileTradeCard(t) {
        const r = FMT.result(t.pnl);
        return `<div class="t-mcard">
          <div class="t-mcard-main">
            <div class="t-mcard-top"><div class="t-mcard-strat">${esc(t.strategy)}</div><div class="t-mcard-pnl ${FMT.tone(t.pnl)}">${FMT.pnl(t.pnl)}</div></div>
            <div class="t-mcard-sub">${esc([t.date, t.asset].filter(Boolean).join(' · '))}</div>
            <div class="t-chips"><span class="t-chip ${r}">${r === 'breakeven' ? 'be' : r}</span><span class="t-chip">Futures</span><span class="t-chip">${esc(t.dir || 'Long')}</span></div>
          </div>
          <div class="t-mcard-acts"><span>${ico('share')}</span><span>${ico('edit')}</span><span>${ico('trash')}</span></div>
        </div>`;
      },

      // Tradeprint page
      ring(score) {
        const r = 41.5, c = 2 * Math.PI * r, p = clamp(score, 0, 100) / 100;
        return `<div class="t-ring"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#12141c" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="#6366f1" stroke-width="9" stroke-dasharray="${(c * p).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 46 46)"/></svg><b>${Math.round(score)}%</b></div>`;
      },

      tpHero({ title, copy = '', score, sub = 'Strong trade detail.', cls = '', heroStyle = '' }) {
        return `<div class="t-tphero ${cls}"${heroStyle ? ` style="${heroStyle}"` : ''}>
          <div class="t-tpmain"><div class="t-kicker">Your Tradeprint</div><h4>${esc(title)}</h4>${copy ? `<p>${esc(copy)}</p>` : ''}</div>
          ${TP.scoreCard(score, sub)}
        </div>`;
      },

      scoreCard(score, sub = 'Strong trade detail.') {
        return `<div class="t-score">${TP.ring(score)}<div class="t-score-label">Clarity Score</div><div class="t-score-sub">${esc(sub)}</div></div>`;
      },

      rankItem(i, name, meta, pnl) {
        return `<div class="t-rank"><div class="t-rank-num">${i}</div><div style="min-width:0"><div class="t-rank-title">${esc(name)}</div><div class="t-rank-meta">${esc(meta)}</div></div><div class="t-rank-value ${FMT.tone(pnl)}">${FMT.pnl(pnl)}</div></div>`;
      },

      split(title, best, worst) {
        const side = (label, d) => `<div style="min-width:0"><div class="t-split-label">${label}</div><div class="t-simple-main ${FMT.tone(d.pnl)}">${esc(d.name)}</div><div class="t-simple-meta">${esc(d.meta)}</div></div>`;
        return TP.panel(`<div class="t-split">${side('Best', best)}${side('Worst', worst)}</div>`, { title });
      },

      // Calculator cards (.calc-card)
      calcCard({ kind = 'pnl', ticker, contracts, inputs, res, focusLast = true, foot = true, breakdown = true, cls = '' }) {
        const spec = TICK_SPECS[ticker] || TICK_SPECS.MNQ;
        const pointValue = spec.tickValue / spec.tickSize;
        const title = kind === 'pnl'
          ? ['dollar', 'Futures P&L Calculator', 'Risk and reward from your entry, stop and target prices']
          : ['points', 'Futures Points Calculator', 'Risk and reward from stop and target distances in points'];
        const field = (label, value, focus = false, sel = false) => `<div class="t-cfield"><span class="t-label">${esc(label)}</span><div class="t-input${sel ? ' sel' : ''}${focus ? ' focus' : ''}">${esc(value)}</div></div>`;
        const last = inputs.length - 1;
        const total = res.risk + res.profit;
        const riskShare = total > 0 ? (res.risk / total * 100).toFixed(2) : 50;
        let direction = '';
        if (kind === 'pnl') {
          const e = FMT.num(inputs[0][1]), s = FMT.num(inputs[1][1]), t = FMT.num(inputs[2][1]);
          if (t > e && s < e) direction = 'Long'; else if (t < e && s > e) direction = 'Short';
        }
        const fmtN = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
        const brk = [
          direction ? `<div class="t-cbrow ${direction === 'Long' ? 'long' : 'short'}"><span>Direction</span><b>${direction}</b></div>` : '',
          `<div class="t-cbrow"><span>Stop distance</span><b>${fmtN(res.slTicks * spec.tickSize)} pts · ${fmtN(res.slTicks)} ticks</b></div>`,
          `<div class="t-cbrow"><span>Target distance</span><b>${fmtN(res.tpTicks * spec.tickSize)} pts · ${fmtN(res.tpTicks)} ticks</b></div>`,
          res.contracts > 0 ? `<div class="t-cbrow"><span>Per contract</span><b>-$${(res.risk / res.contracts).toFixed(2)} / +$${(res.profit / res.contracts).toFixed(2)}</b></div>` : '',
          `<div class="t-cbrow"><span>Win rate to break even</span><b>${res.rr > 0 ? `${(100 / (1 + res.rr)).toFixed(1)}%` : '—'}</b></div>`
        ].join('');
        return `<div class="t-calc ${cls}">
          <div class="t-calc-title"><span class="t-icontile">${ico(title[0])}</span><span class="t-title-text">${title[1]}<small>${title[2]}</small></span></div>
          <div class="t-calc-body">
            <div class="t-cgrid c2">${field('Ticker', ticker, false, true)}${field('Contracts', contracts)}</div>
            <div class="t-cspec"><span class="tk">${esc(ticker)}</span><span>Tick <b>${spec.tickSize}</b> = <b>$${spec.tickValue.toFixed(2)}</b></span><span>1 point = <b>$${pointValue.toFixed(2)}</b> per contract</span></div>
            <div class="t-cgrid ${inputs.length === 3 ? 'c3' : 'c2'}">${inputs.map((f, i) => field(f[0], f[1], focusLast && i === last)).join('')}</div>
          </div>
          <div class="t-cout">
            <div class="t-cres">
              <div><div class="t-cres-label">Dollar Risk</div><div class="t-cres-value r">-$${res.risk.toFixed(2)}</div></div>
              <div><div class="t-cres-label">Dollar Profit</div><div class="t-cres-value g">+$${res.profit.toFixed(2)}</div></div>
              <div><div class="t-cres-label">R:R Ratio</div><div class="t-cres-value a">${res.rr.toFixed(2)}R</div></div>
            </div>
            <div class="t-rrbar" style="--risk:${riskShare}%"><i class="risk"></i><i class="reward"></i></div>
            ${breakdown ? `<div class="t-cbreak">${brk}<div class="t-chint">Break-even win rate is 1 / (1 + R:R), before fees and commissions.</div></div>` : ''}
          </div>

        </div>`;
      },

      calcResults(res, { cls = '' } = {}) {

          <div class="t-calc-title"><span class="t-icontile">${ico('dollar')}</span><span class="t-title-text">Results<small>${esc(res.ticker)} · ${res.contracts} contract${res.contracts === 1 ? '' : 's'}</small></span></div>
