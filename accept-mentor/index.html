<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Tradeprint"/>
  <meta name="theme-color" content="#0a0a0a"/>
  <title>Tradeprint · Mentor Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 40px; text-decoration: none; color: #fff; }
    .logo span { color: #6366f1; }
    .card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 40px; width: 100%; max-width: 440px; }
    h1 { font-size: 22px; line-height: 1.3; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.6; color: #aaa; margin-bottom: 16px; }
    p strong { color: #fff; font-weight: 600; }
    .label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .perm-list { list-style: none; margin: 0 0 20px; padding: 0; }
    .perm-list li { font-size: 14px; color: #ccc; padding: 6px 0 6px 24px; position: relative; }
    .perm-list li::before { content: ''; position: absolute; left: 4px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: #6366f1; }
    .btn { display: block; width: 100%; background-color: #6366f1; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; margin-top: 8px; text-align: center; text-decoration: none; font-family: inherit; }
    .btn:hover { background-color: #4f46e5; }
    .btn:disabled { background-color: #444; cursor: not-allowed; }
    .btn-outline { background: none; border: 1px solid #333; color: #fff; }
    .btn-outline:hover { background: none; border-color: #6366f1; }
    .btn-outline:disabled { background: none; color: #555; }
    .link-btn { display: block; width: 100%; background: none; border: none; color: #666; font-size: 13px; margin-top: 18px; cursor: pointer; font-family: inherit; text-align: center; transition: color 0.2s; }
    .link-btn:hover { color: #ef4444; }
    .link-btn:disabled { color: #444; cursor: not-allowed; }
    .note { font-size: 12px; color: #666; margin-top: 16px; margin-bottom: 0; }
    .message { font-size: 13px; margin-top: 16px; text-align: center; min-height: 20px; margin-bottom: 0; }
    .message.success { color: #6366f1; }
    .message.error { color: #ef4444; }
    .message:empty { display: none; }
    .spinner { width: 22px; height: 22px; border: 2px solid #333; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 8px auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .card { padding: 28px 22px; } }
  </style>
</head>
<body>

  <a href="/" class="logo">trade<span>print</span></a>

  <div class="card" id="inviteCard" aria-live="polite">
    <div class="spinner"></div>
    <p style="text-align:center;margin-bottom:0;">Checking your invite...</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://fpdedufotkmvjsvxdcmk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1Q8yInISuuD3HDWI7mVesQ_A-DSkCM7';

    // The invite link is kept in this browser (not in the address bar) so it
    // survives logging in, signing up, or a password reset on /app.
    const INVITE_STORAGE_KEY = 'tp_mentor_invite';
    const INVITE_MAX_AGE_MS = 8 * 24 * 60 * 60 * 1000;
    const TOKEN_PATTERN = /^[A-Za-z0-9_-]{32,128}$/;
    const LOGIN_URL = '/app?next=accept-mentor';
    const SIGNUP_URL = '/app?next=accept-mentor&tab=signup';
    const MENTOR_VIEW_URL = '/dashboard?mentor=accepted';

    const card = document.getElementById('inviteCard');

    let inviteToken = null;
    let session = null;      // { access_token, refresh_token, user }
    let preview = null;
    let busy = false;

    // ── Small helpers ──────────────────────────────────────────

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Same rule as the invite email: a username that could pass for a link
    // or an address isn't shown.
    function safeDisplayName(value) {
      const clean = String(value || '')
        .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u2069\ufeff]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      if (!clean || clean.length > 40 || /[.\/:@\\<>]/.test(clean)) return null;
      return clean;
    }

    function traderLabel(data) {
      const name = safeDisplayName(data?.trader_name);
      const email = data?.trader_email || '';
      if (name && email) return `${name} (${email})`;
      return name || email || 'A Tradeprint trader';
    }

    function traderShort(data) {
      return safeDisplayName(data?.trader_name) || data?.trader_email || 'the trader';
    }

    function readStoredInvite() {
      try {
        const data = JSON.parse(localStorage.getItem(INVITE_STORAGE_KEY) || 'null');
        if (data && TOKEN_PATTERN.test(String(data.token || '')) && Date.now() - Number(data.savedAt) < INVITE_MAX_AGE_MS) return data;
      } catch (err) {}
      return null;
    }

    function storeInvite(token) {
      try { localStorage.setItem(INVITE_STORAGE_KEY, JSON.stringify({ token, savedAt: Date.now() })); } catch (err) {}
    }

    function clearStoredInvite() {
      try { localStorage.removeItem(INVITE_STORAGE_KEY); } catch (err) {}
    }

    function tokenExpiryMs(accessToken) {
      try {
        const payload = JSON.parse(atob(String(accessToken).split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return payload.exp ? payload.exp * 1000 : 0;
      } catch (err) {
        return 0;
      }
    }

    // Same keys the login page and dashboard use.
    function persistSession(next) {
      if (!next?.access_token) return;
      localStorage.setItem('tp_token', next.access_token);
      if (next.refresh_token) localStorage.setItem('tp_refresh_token', next.refresh_token);
      if (next.user) localStorage.setItem('tp_user', JSON.stringify(next.user));
      localStorage.setItem('tp_session', JSON.stringify(next));
    }

    async function fetchUser(accessToken) {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${accessToken}` },
        cache: 'no-store'
      });
      if (!res.ok) return { user: null, status: res.status };
      return { user: await res.json().catch(() => null), status: res.status };
    }

    async function refreshSession(refreshToken) {
      if (!refreshToken) return null;
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: refreshToken })
      });
      if (!res.ok) return null;
      const data = await res.json().catch(() => null);
      if (!data?.access_token) return null;
      persistSession(data);
      return data;
    }

    async function rpc(fnName, args, withSession) {
      const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
      if (withSession && session?.access_token) headers['Authorization'] = `Bearer ${session.access_token}`;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST',
        cache: 'no-store',
        headers,
        body: JSON.stringify(args)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || typeof data !== 'object') throw new Error(`${fnName} failed (${res.status})`);
      return data;
    }

    // ── Startup: session and invite link ───────────────────────

    // Back from the signup confirmation email: the session arrives in the hash.
    async function captureSessionFromHash() {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const accessToken = hash.get('access_token');
      const authError = hash.get('error_description') || hash.get('error');
      if (!accessToken && !authError) return null;

      window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
      if (!accessToken) return { error: authError };

      const { user } = await fetchUser(accessToken);
      if (!user?.id) return { error: 'session' };

      const expiresIn = Number(hash.get('expires_in')) || 3600;
      persistSession({
        access_token: accessToken,
        refresh_token: hash.get('refresh_token') || null,
        token_type: 'bearer',
        expires_in: expiresIn,
        expires_at: Math.floor(Date.now() / 1000) + expiresIn,
        user
      });
      return { ok: true };
    }

    // Takes the token out of the address bar and keeps it in this browser.
    function captureInviteToken() {
      let url;
      try { url = new URL(window.location.href); } catch (err) { return readStoredInvite()?.token || null; }

      const fromUrl = url.searchParams.get('token');
      if (fromUrl === null) return readStoredInvite()?.token || null;

      url.searchParams.delete('token');
      window.history.replaceState(null, document.title, url.pathname + url.search + url.hash);

      if (!TOKEN_PATTERN.test(fromUrl)) return 'invalid';
      storeInvite(fromUrl);
      return fromUrl;
    }

    // Uses whichever stored login lasts longest, refreshes it if needed,
    // and confirms it with Supabase. Returns null when logged out.
    async function loadSession() {
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem('tp_session') || 'null'); } catch (err) {}

      const candidates = [
        { access: stored?.access_token, refresh: stored?.refresh_token },
        { access: localStorage.getItem('tp_token'), refresh: localStorage.getItem('tp_refresh_token') }
      ].filter(c => c.access);

      if (!candidates.length) return null;
      candidates.sort((a, b) => tokenExpiryMs(b.access) - tokenExpiryMs(a.access));

      let { access, refresh } = candidates[0];
      refresh = refresh || localStorage.getItem('tp_refresh_token');

      if (tokenExpiryMs(access) - Date.now() < 120000) {
        const refreshed = await refreshSession(refresh);
        if (!refreshed) return null;
        return { access_token: refreshed.access_token, refresh_token: refreshed.refresh_token, user: refreshed.user };
      }

      const { user, status } = await fetchUser(access);
      if (user?.id) return { access_token: access, refresh_token: refresh, user };

      if (status === 401 || status === 403) {
        const refreshed = await refreshSession(refresh);
        if (refreshed) return { access_token: refreshed.access_token, refresh_token: refreshed.refresh_token, user: refreshed.user };
      }
      return null;
    }

    // ── Rendering ──────────────────────────────────────────────

    function permissionItems(perms) {
      const p = perms || {};
      const items = [];
      if (p.canViewTrades) items.push(p.canViewPnL ? 'See their trades, including P&L' : 'See their trades (P&L hidden)');
      if (p.canViewJournals) items.push('Read their trading journal');
      if (p.canComment) items.push('Leave feedback on their trades and journal');
      return items;
    }

    function permissionListHtml(perms) {
      const items = permissionItems(perms);
      if (!items.length) return '';
      return `
        <div class="label">As their mentor you'll be able to:</div>
        <ul class="perm-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
      `;
    }

    function renderMessage(title, text, { buttonLabel = 'Go to Tradeprint', buttonHref = '/dashboard' } = {}) {
      card.innerHTML = `
        <h1>${escapeHtml(title)}</h1>
        <p>${escapeHtml(text)}</p>
        <a class="btn" href="${escapeHtml(buttonHref)}">${escapeHtml(buttonLabel)}</a>
      `;
    }

    function renderFinalState(state, data) {
      const who = traderShort(data);
      clearStoredInvite();

      switch (state) {
        case 'expired':
          return renderMessage('This invite has expired', `Invites expire after 7 days. Ask ${who} to resend it from their Mentorship page.`);
        case 'unavailable':
          return renderMessage("This invite can't be accepted right now", `Ask ${who} to check their Mentorship settings, then open the link again.`);
        case 'cancelled':
          return renderMessage('This invite was cancelled', `${who} cancelled it. If that's a mistake, ask them to send a new one.`);
        case 'declined':
          return renderMessage('You declined this invite', `If you change your mind, ask ${who} to send a new one.`);
        case 'ended':
          return renderMessage('This mentorship has ended', `${who} removed mentor access. They can invite you again anytime.`);
        case 'accepted':
          if (data?.is_mentor || data?.already_mentor) {
            return renderMessage(`You're already ${who}'s mentor`, 'Open Mentor View to see their trades and review requests.', { buttonLabel: 'Open Mentor View', buttonHref: MENTOR_VIEW_URL });
          }
          return renderMessage('This invite was already used', 'It was accepted from another account. If that was you, log in with that account.');
        default:
          return renderMessage("This invite link doesn't work", 'It may have been replaced by a newer invite, or only part of the link was copied. Ask the trader to resend it from their Mentorship page.');
      }
    }

    function renderPending() {
      const who = traderLabel(preview);
      const short = traderShort(preview);
      const masked = preview.invited_email_masked || 'the invited email';
      const header = `
        <h1>You're invited to be a mentor</h1>
        <p><strong>${escapeHtml(who)}</strong> wants you to review their trading on Tradeprint.</p>
        ${permissionListHtml(preview.permissions)}
      `;
      const declineButton = `<button class="link-btn" id="declineBtn" type="button" onclick="declineInvite()">Decline invite</button>`;

      if (!session) {
        card.innerHTML = `
          ${header}
          <p>Log in or create a free account with the email this invite was sent to (<strong>${escapeHtml(masked)}</strong>). You don't need a paid plan to mentor.</p>
          <a class="btn" href="${LOGIN_URL}">Log in to accept</a>
          <a class="btn btn-outline" href="${SIGNUP_URL}">Create a free account</a>
          ${declineButton}
          <div class="message" id="inviteMsg"></div>
        `;
        return;
      }

      const viewerEmail = session.user?.email || 'another account';

      if (preview.is_trader) {
        clearStoredInvite();
        return renderMessage('This is your own invite', `It was sent to ${masked}. Your mentor accepts it from their own Tradeprint account.`);
      }

      if (preview.already_mentor) {
        return renderFinalState('accepted', preview);
      }

      if (!preview.email_matches) {
        card.innerHTML = `
          ${header}
          <p>This invite was sent to <strong>${escapeHtml(masked)}</strong>, but you're logged in as <strong>${escapeHtml(viewerEmail)}</strong>. Log in with the invited email to accept it.</p>
          <button class="btn" type="button" onclick="switchAccount()">Log in with a different account</button>
          ${declineButton}
          <div class="message" id="inviteMsg"></div>
        `;
        return;
      }

      card.innerHTML = `
        ${header}
        <p>You're logged in as <strong>${escapeHtml(viewerEmail)}</strong>. Accepting lets ${escapeHtml(short)} share their trading with you. They can change what you see or remove access anytime.</p>
        <button class="btn" id="acceptBtn" type="button" onclick="acceptInvite()">Accept invitation</button>
        ${declineButton}
        <div class="message" id="inviteMsg"></div>
      `;
    }

    function setMessage(text, tone) {
      const msg = document.getElementById('inviteMsg');
      if (!msg) return;
      msg.textContent = text;
      msg.className = `message${tone ? ` ${tone}` : ''}`;
    }

    function setBusy(value) {
      busy = value;
      ['acceptBtn', 'declineBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = value;
      });
    }

    // ── Actions ────────────────────────────────────────────────

    async function acceptInvite() {
      if (busy || !inviteToken || !session) return;
      setBusy(true);
      const btn = document.getElementById('acceptBtn');
      if (btn) btn.textContent = 'Accepting...';
      setMessage('', '');

      let result = null;
      try {
        result = await rpc('mentor_invite_accept', { p_token: inviteToken }, true);
      } catch (err) {
        console.warn('Accept invite failed:', err);
      }

      // Only the server's "ok" counts. Anything else leaves the invite as it was.
      if (result?.ok === true) {
        clearStoredInvite();
        const who = traderShort(result);
        card.innerHTML = `
          <h1>You're now ${escapeHtml(who)}'s mentor</h1>
          <p>Opening Mentor View...</p>
          <a class="btn" href="${MENTOR_VIEW_URL}">Open Mentor View</a>
        `;
        setTimeout(() => { window.location.href = MENTOR_VIEW_URL; }, 1200);
        return;
      }

      setBusy(false);
      if (btn) btn.textContent = 'Accept invitation';

      switch (result?.error) {
        case 'email_mismatch':
          return setMessage(`This invite was sent to ${result.invited_email_masked || 'a different email'}. Log in with that email to accept.`, 'error');
        case 'email_not_confirmed':
          return setMessage('Confirm your email address first, then open the invite link again.', 'error');
        case 'not_authenticated':
          return setMessage('Your session expired. Log in again to accept.', 'error');
        case 'already_mentor':
          return renderFinalState('accepted', { ...preview, already_mentor: true });
        case 'expired':
        case 'unavailable':
        case 'invalid':
          return renderFinalState(result.error, preview);
        case 'not_pending':
          return renderFinalState({ active: 'accepted', declined: 'declined', cancelled: 'cancelled', revoked: 'ended' }[result.status] || 'invalid', preview);
        case 'self_invite':
          return setMessage("You can't accept your own invite.", 'error');
        default:
          return setMessage("Couldn't accept the invite. Check your connection and try again.", 'error');
      }
    }

    async function declineInvite() {
      if (busy || !inviteToken) return;
      const who = traderShort(preview);
      if (!confirm(`Decline this invite? ${who} will see that you declined.`)) return;

      setBusy(true);
      setMessage('', '');

      let result = null;
      try {
        result = await rpc('mentor_invite_decline', { p_token: inviteToken }, true);
      } catch (err) {
        console.warn('Decline invite failed:', err);
      }

      if (result?.ok === true) {
        clearStoredInvite();
        return renderMessage('Invite declined', `${who} will see that you declined. Nothing was shared with you.`);
      }

      setBusy(false);
      if (result?.error === 'not_pending') {
        return renderFinalState({ active: 'accepted', declined: 'declined', cancelled: 'cancelled', revoked: 'ended' }[result.status] || 'invalid', preview);
      }
      if (result?.error === 'invalid') return renderFinalState('invalid', preview);
      setMessage("Couldn't decline the invite. Check your connection and try again.", 'error');
    }

    // Logs out here (the invite stays saved) and goes to the login page.
    function switchAccount() {
      const oldToken = session?.access_token;
      if (oldToken) {
        fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, {
          method: 'POST',
          keepalive: true,
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${oldToken}` }
        }).catch(() => {});
      }
      ['tp_token', 'tp_refresh_token', 'tp_session', 'tp_user'].forEach(key => localStorage.removeItem(key));
      window.location.href = LOGIN_URL;
    }

    // ── Boot ───────────────────────────────────────────────────

    async function boot() {
      const hashResult = await captureSessionFromHash().catch(() => ({ error: 'session' }));
      inviteToken = captureInviteToken();

      if (!inviteToken) {
        return renderMessage('No invite found', 'Open the invite link from your email again.');
      }
      if (inviteToken === 'invalid') {
        inviteToken = null;
        return renderFinalState('invalid', null);
      }

      session = await loadSession().catch(() => null);

      try {
        preview = await rpc('mentor_invite_preview', { p_token: inviteToken }, !!session);
      } catch (err) {
        console.warn('Invite preview failed:', err);
        card.innerHTML = `
          <h1>Couldn't load your invite</h1>
          <p>Check your connection and try again.</p>
          <button class="btn" type="button" onclick="window.location.reload()">Try again</button>
        `;
        return;
      }

      if (preview.state === 'pending') {
        renderPending();
        if (hashResult?.error && !session) {
          setMessage('That confirmation link expired or was already used. Log in to continue.', 'error');
        }
        return;
      }

      renderFinalState(preview.state, preview);
    }

    boot();
  </script>
</body>
</html>
